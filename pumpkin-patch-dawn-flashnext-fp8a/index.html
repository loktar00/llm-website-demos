<script type="module">

// ============================================================================
//  THE PATCH AT DAWN - a self-running photoreal three.js scene
//  Part 1: constants, GLSL chunks, utilities
// ============================================================================
import * as THREE from 'three';
window.THREE=THREE;

// ---------------------------------------------------------------- deterministic rng
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
const RND = mulberry32(20241031);
const rr = (a=0,b=1)=>a+(b-a)*RND();
const pick = arr=>arr[Math.floor(RND()*arr.length)];
function gauss(){let u=0,v=0;while(u===0)u=RND();while(v===0)v=RND();return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v);}

// ------------------------------------------------------- tiny CPU value-noise (js)
function hash2(x,y){let h=Math.sin(x*127.1+y*311.7)*43758.5453;return h-Math.floor(h);}
function vnoise2(x,y){
  const xi=Math.floor(x),yi=Math.floor(y),xf=x-xi,yf=y-yi;
  const u=xf*xf*(3-2*xf),v=yf*yf*(3-2*yf);
  const a=hash2(xi,yi),b=hash2(xi+1,yi),c=hash2(xi,yi+1),d=hash2(xi+1,yi+1);
  return a*(1-u)*(1-v)+b*u*(1-v)+c*(1-u)*v+d*u*v;
}
function fbm2(x,y,oct=4){let s=0,a=0.5,f=1;for(let i=0;i<oct;i++){s+=a*vnoise2(x*f,y*f);f*=2.03;a*=0.5;}return s;}

const clamp=(v,a,b)=>v<a?a:(v>b?b:v);
const lerp=(a,b,t)=>a+(b-a)*t;
const smoothstep=(e0,e1,x)=>{const t=clamp((x-e0)/(e1-e0),0,1);return t*t*(3-2*t);};
const smootherstep=(e0,e1,x)=>{const t=clamp((x-e0)/(e1-e0),0,1);return t*t*t*(t*(t*6-15)+10);};

// camera path (must match KEYS in 80_main.js); big flat foliage must not sit on it
const CAM_KEYS=[[-6.95,0.275,0.15],[-2.95,0.58,7.4],[1.4,1.66,-4.4],[3.0,1.20,6.0],[6.2,1.24,10.4]];
function camClearance(x,z){
  let best=1e9;
  for(let i=0;i<CAM_KEYS.length;i++){
    const a=CAM_KEYS[i], b=CAM_KEYS[(i+1)%CAM_KEYS.length];
    if(a[1]>0.9&&b[1]>0.9) continue;
    const ax=a[0],az=a[2],bx=b[0],bz=b[2];
    const dx=bx-ax,dz=bz-az,L2=dx*dx+dz*dz;
    let t=L2>1e-6?((x-ax)*dx+(z-az)*dz)/L2:0; t=t<0?0:(t>1?1:t);
    const px=ax+dx*t-x, pz=az+dz*t-z;
    const d=Math.sqrt(px*px+pz*pz);
    if(d<best) best=d;
  }
  return best;
}
const fenceX=(z)=>9.15+0.55*Math.sin(z*0.043+0.7)+0.18*Math.sin(z*0.11);
// ---------------------------------------------------------------- shared GLSL
const GLSL_NOISE = `
float h31(vec3 p){p=fract(p*0.1031);p+=dot(p,p.yzx+33.33);return fract((p.x+p.y)*p.z);}
float vn3(vec3 p){vec3 i=floor(p),f=fract(p);f=f*f*(3.0-2.0*f);
  float a=mix(mix(mix(h31(i),h31(i+vec3(1,0,0)),f.x),mix(h31(i+vec3(0,1,0)),h31(i+vec3(1,1,0)),f.x),f.y),
              mix(mix(h31(i+vec3(0,0,1)),h31(i+vec3(1,0,1)),f.x),mix(h31(i+vec3(0,1,1)),h31(i+vec3(1,1,1)),f.x),f.y),f.z);
  return a;}
float fbm3(vec3 p,int oct){float s=0.0,a=0.5;for(int i=0;i<6;i++){if(i>=oct)break;s+=a*vn3(p);p=p*2.07+vec3(11.3,7.7,3.1);a*=0.5;}return s;}
float fbm2x(vec2 p,int oct){return fbm3(vec3(p,3.7),oct);}
float hash12(vec2 p){vec3 p3=fract(vec3(p.xyx)*0.1031);p3+=dot(p3,p3.yzx+33.33);return fract((p3.x+p3.y)*p3.z);}
`;
const GLSL_FOG = `
vec3 applyFog(vec3 col,float dist){float f=1.0-exp(-uFogDensity*uFogDensity*dist*dist);return mix(col,uFogColor,clamp(f,0.0,1.0));}
`;
const GLSL_SPARKLE = `
float sparkleAmt(vec3 wp,vec3 N,vec3 V,vec3 L,float mask,float amt,float seedOff){
  if(amt<=0.001) return 0.0;
  vec3 H=normalize(L+V);
  float a=0.0;
  for(int k=0;k<3;k++){
    vec3 cell=floor(wp*240.0);
    vec3 rk=vec3(h31(cell+vec3(1.7,9.2,4.3)*float(k)+seedOff),
                 h31(cell+vec3(5.1,2.3,8.8)*float(k)+seedOff+7.1),
                 h31(cell+vec3(3.3,6.9,1.1)*float(k)+seedOff+13.7));
    vec3 Nn=normalize(N+(rk-0.5)*1.30);
    float s=pow(max(dot(Nn,H),0.0),150.0);
    float live=0.55+0.45*sin(uTime*0.6+(rk.x*20.0+rk.y*31.0)+float(k)*2.1);
    a+=s*live;
  }
  return a*mask*amt;
}
`;
// ---------------------------------------------------------------- standard-material frost injection
// Adds: world pos / object normal varyings, hoarfrost coating, melt-to-wet, sparkle emissive,
// optional gentle wind sway and backlit translucency.
function frostStandard(baseMat, opts){
  const o = Object.assign({frostGain:1.0, sparkleAmt:1.0, topFrost:1.0, windA:0, windF:0.7, windH:1, trans:0}, opts||{});
  const U = {
    uTime:{value:0}, uFrostAmt:{value:0.8}, uMeltAmt:{value:0.0},
    uFrostCol:{value:new THREE.Color(0.80,0.87,0.95)}, uSunDir:{value:new THREE.Vector3(0,0.06,1)},
    uFrostGain:{value:o.frostGain}, uSparkle:{value:o.sparkleAmt}, uTopFrost:{value:o.topFrost}, uCover:{value:(o.cover===undefined?1.0:o.cover)},
    uWindA:{value:o.windA}, uWindF:{value:o.windF}, uSunGlow:{value:1.0}
  };
  U.uTrans_ = {value:o.trans};
  baseMat.onBeforeCompile = (shader)=>{
    Object.assign(shader.uniforms, U);
    shader.vertexShader = shader.vertexShader
      .replace('#include <common>', `#include <common>
varying vec3 vWPos; varying vec3 vONrm;
uniform float uTime,uWindA,uWindF;`)
      .replace('#include <begin_vertex>', `#include <begin_vertex>
if(uWindA>0.0001){
  vec3 wph=transformed;
  #ifdef USE_INSTANCING
    wph=(instanceMatrix*vec4(0.0,0.0,0.0,1.0)).xyz+transformed;
  #else
    wph=(modelMatrix*vec4(transformed,1.0)).xyz;
  #endif
  float sw=sin(uTime*uWindF+wph.x*0.9+wph.z*0.55)+0.45*sin(uTime*uWindF*1.9+wph.x*2.1);
  float lev=smoothstep(0.03,${(o.windH).toFixed(3)},position.y);
  transformed.x+=sw*uWindA*lev;
  transformed.z+=sw*uWindA*0.55*lev;
}
vWPos=(modelMatrix*vec4(transformed,1.0)).xyz;
vONrm=normalize(mat3(modelMatrix)*objectNormal);`);
    shader.fragmentShader = shader.fragmentShader
      .replace('#include <common>', `#include <common>
varying vec3 vWPos; varying vec3 vONrm;
uniform float uTime,uFrostAmt,uMeltAmt,uFrostGain,uSparkle,uTopFrost,uTrans_,uSunGlow,uCover;
uniform vec3 uFrostCol,uSunDir;
float gFrostM; float gWetM;
${GLSL_NOISE}
${GLSL_SPARKLE}
void computeFrost(){
  float upm=smoothstep(0.02,0.72,vONrm.y);
  float nz=fbm3(vWPos*8.5,4);
  float fine=fbm3(vWPos*33.0,2);
  float coat=0.20+0.66*uFrostAmt*uFrostGain*mix(upm,1.0,uTopFrost)+0.52*nz+0.22*fine;
  float covBig=smoothstep(mix(0.62,0.05,uCover),mix(0.86,0.32,uCover),fbm3(vWPos*0.55+13.7,3));
  float frost=smoothstep(0.56,0.88,coat)*covBig;
  gFrostM=frost;
  gWetM=clamp(uMeltAmt,0.0,1.0)*(0.25+0.8*smoothstep(0.38,0.64,fbm3(vWPos*26.0,3)))*smoothstep(-0.25,0.6,vONrm.y);
}`)
      .replace('#include <color_fragment>', `#include <color_fragment>
computeFrost();
diffuseColor.rgb=mix(diffuseColor.rgb,uFrostCol,clamp(gFrostM*0.78,0.0,0.86));
diffuseColor.rgb=mix(diffuseColor.rgb,diffuseColor.rgb*0.60,clamp(gWetM,0.0,1.0));`)
      .replace('#include <roughnessmap_fragment>', `#include <roughnessmap_fragment>
roughnessFactor=mix(roughnessFactor,0.16,clamp(gWetM,0.0,1.0));
roughnessFactor=mix(roughnessFactor,0.92,clamp(gFrostM,0.0,1.0)*0.7);`)
      .replace('#include <emissivemap_fragment>', `#include <emissivemap_fragment>
{
  float warm=clamp(dot(normalize(vONrm),normalize(uSunDir)),0.0,1.0);
  float eF=gFrostM*(0.045+0.55*warm);
  eF+=sparkleAmt(vWPos,normalize(vONrm),normalize(cameraPosition-vWPos),normalize(uSunDir),gFrostM,uSparkle*(0.35+0.9*warm),0.0);
  vec3 V=normalize(cameraPosition-vWPos);
  float bl=pow(clamp(dot(V,-normalize(uSunDir)),0.0,1.0),2.2);
  float eT=bl*uTrans_*uSunGlow*(1.0-gFrostM*0.35);
  totalEmissiveRadiance+=uFrostCol*eF*0.92+diffuseColor.rgb*2.35*eT;
}`);
  };
  baseMat.customProgramCacheKey = ()=>'frost'+JSON.stringify(o);
  return {mat:baseMat, U};
}
// registry so every frost-driven material can be animated from one place
const FROST_UNIS = [];
function regFrost(f){ FROST_UNIS.push(f.U); return f; }

// ---------------------------------------------------------------- geometry helpers
// concatenate non-indexed geometries that share an attribute layout
function mergeGeos(list){
  const attrs = {};
  let count = 0;
  for(const g of list){
    const ng = g.index ? g.toNonIndexed() : g;
    for(const k in ng.attributes){ if(!attrs[k]) attrs[k]={itemSize:ng.attributes[k].itemSize,arrays:[]}; attrs[k].arrays.push(ng.attributes[k]); }
    count += ng.attributes.position.count;
  }
  const out = new THREE.BufferGeometry();
  for(const k in attrs){
    const isz = attrs[k].itemSize, arr = new Float32Array(count*isz);
    let off=0;
    for(const a of attrs[k].arrays){ arr.set(a.array, off); off += a.array.length; }
    let nan=0;
    for(let i=0;i<arr.length;i++){ if(!isFinite(arr[i])){ arr[i]=0; nan++; } }
    if(nan) NaNDEBUG.push({attr:k,nan,verts:count});
    out.setAttribute(k, new THREE.BufferAttribute(arr, isz));
  }
  return out;
}
const NaNDEBUG=[];
// tapered tube along a curve (three's TubeGeometry uses arc-length param, so match it)
function makeTube(curve, tub, radial, radiusFn){
  const g = new THREE.TubeGeometry(curve, tub, 1, radial, false);
  const pos = g.attributes.position, p = new THREE.Vector3(), t = new THREE.Vector3();
  let bad=0;
  for(let i=0;i<=tub;i++){
    curve.getPointAt(i/tub, p);
    if(!isFinite(p.x)||!isFinite(p.y)||!isFinite(p.z)){ p.copy(curve.getPoint(i/tub)); }
    const r = radiusFn(i/tub);
    for(let j=0;j<=radial;j++){
      const k=i*(radial+1)+j;
      t.fromBufferAttribute(pos,k).sub(p).multiplyScalar(r).add(p);
      if(!isFinite(t.x)||!isFinite(t.y)||!isFinite(t.z)){ t.copy(p); bad++; }
      pos.setXYZ(k,t.x,t.y,t.z);
    }
  }
  if(bad) NaNDEBUG.push({where:'makeTube',bad,tub,radial});
  g.computeVertexNormals();
  return g;
}

// ============================================================================
//  Part 2: renderer, atmosphere model, sky, sun, terrain, tree line
// ============================================================================
const LOOP = 136.0;                // seconds for the full light / mist / thaw cycle
const canvas = document.createElement('canvas');
document.body.appendChild(canvas);
const renderer = new THREE.WebGLRenderer({canvas, antialias:false, powerPreference:'high-performance', stencil:false});
renderer.setSize(innerWidth, innerHeight);
let RES_SCALE = 1.0;
function applyRes(){ renderer.setPixelRatio(Math.min(devicePixelRatio||1,1.35)*RES_SCALE); }
applyRes();
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.NoToneMapping;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.autoClear = true;

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(new THREE.Color(0.18,0.17,0.20), 0.0225);

const camera = new THREE.PerspectiveCamera(46, innerWidth/innerHeight, 0.08, 400);
camera.position.set(-4,0.5,0);

// ---------------------------------------------------------------- atmosphere state
const SUN_AZ = 19.5*Math.PI/180;                     // just right of +z
const ENV = {
  phase:0, env01:0,
  sunDir:new THREE.Vector3(0.33,0.05,0.94),
  sunCol:new THREE.Color(1.0,0.36,0.11),
  fogCol:new THREE.Color(0.18,0.17,0.20),
  mist:1.0, melt:0.0, frost:0.9,
  zenith:new THREE.Color(0.045,0.058,0.135),
  mid:new THREE.Color(0.15,0.17,0.29),
  horizon:new THREE.Color(0.34,0.22,0.19),
  warm:new THREE.Color(1.0,0.46,0.16),
  sunDisc:new THREE.Color(1.0,0.66,0.34),
  haze:new THREE.Color(0.30,0.24,0.24)
};
function updateEnv(t){
  ENV.phase = (t/LOOP)%1;
  const e = 0.5-0.5*Math.cos(ENV.phase*Math.PI*2);     // 0..1..0, smooth loop
  ENV.env01 = e;
  const elev = (1.35 + 6.4*e)*Math.PI/180;
  ENV.sunDir.set(Math.cos(elev)*Math.sin(SUN_AZ), Math.sin(elev), Math.cos(elev)*Math.cos(SUN_AZ)).normalize();
  ENV.sunCol.setRGB(1.0, lerp(0.315,0.60,e), lerp(0.085,0.30,e));
  ENV.sunIntensity = lerp(3.55,6.2,e);
  ENV.fogCol.setRGB(lerp(0.055,0.115,e), lerp(0.052,0.095,e), lerp(0.075,0.098,e));
  ENV.haze.setRGB(lerp(0.200,0.400,e), lerp(0.180,0.300,e), lerp(0.200,0.260,e));
  ENV.zenith.setRGB(lerp(0.052,0.085,e), lerp(0.068,0.105,e), lerp(0.155,0.205,e));
  ENV.mid.setRGB(lerp(0.150,0.235,e), lerp(0.170,0.245,e), lerp(0.300,0.335,e));
  ENV.horizon.setRGB(lerp(0.300,0.560,e), lerp(0.205,0.360,e), lerp(0.195,0.250,e));
  ENV.warm.setRGB(lerp(0.9,1.0,e), lerp(0.33,0.55,e), lerp(0.08,0.20,e));
  ENV.sunDisc.setRGB(1.0, lerp(0.50,0.74,e), lerp(0.20,0.42,e));
  ENV.mist = lerp(1.0,0.40,e);
  ENV.melt = Math.pow(e,1.25)*0.95;
  ENV.frost = 0.92;
  scene.fog.color.copy(ENV.fogCol);
  scene.fog.density = lerp(0.0166,0.0116,e);
}
updateEnv(0);

// ---------------------------------------------------------------- lights
const sun = new THREE.DirectionalLight(0xffffff, 3.0);
sun.castShadow = true;
sun.shadow.mapSize.set(2048,2048);
sun.shadow.camera.near = 2; sun.shadow.camera.far = 240;
sun.shadow.camera.left=-17; sun.shadow.camera.right=17; sun.shadow.camera.top=17; sun.shadow.camera.bottom=-17;
sun.shadow.bias = -0.00035; sun.shadow.normalBias = 0.035;
sun.target.position.set(0,0,0);
scene.add(sun, sun.target);
const hemi = new THREE.HemisphereLight(0x93a6d8, 0x1d1710, 1.05);
scene.add(hemi);
const bounce = new THREE.DirectionalLight(0x4a5f86, 0.52);   // cool fill from sky opposite
scene.add(bounce);

// soft env reflections (procedural equirect, painted in code)
function paintEnvTexture(){
  const w=256,h=128, cv=document.createElement('canvas'); cv.width=w; cv.height=h;
  const ctx=cv.getContext('2d'), img=ctx.createImageData(w,h), d=img.data;
  for(let y=0;y<h;y++){
    const phi=(y+0.5)/h*Math.PI, dirY=Math.cos(phi), sy=Math.sin(phi);
    for(let x=0;x<w;x++){
      const th=(x+0.5)/w*Math.PI*2, dx=sy*Math.cos(th), dz=sy*Math.sin(th);
      const yy=dirY;
      let r,g,b;
      const k1=smoothstep(-0.02,0.22,yy), k2=smoothstep(0.14,0.72,yy);
      r=lerp(lerp(ENV.horizon.r,ENV.mid.r,k1),ENV.zenith.r,k2);
      g=lerp(lerp(ENV.horizon.g,ENV.mid.g,k1),ENV.zenith.g,k2);
      b=lerp(lerp(ENV.horizon.b,ENV.mid.b,k1),ENV.zenith.b,k2);
      const mu=clamp(dx*ENV.sunDir.x+yy*ENV.sunDir.y+dz*ENV.sunDir.z,0,1);
      const glow=Math.pow(mu,7)*0.9+Math.pow(mu,2)*0.16;
      r+=ENV.warm.r*glow; g+=ENV.warm.g*glow; b+=ENV.warm.b*glow;
      const disc=Math.pow(mu,900)*6.0;
      r+=disc; g+=disc*0.62; b+=disc*0.30;
      const i=(y*w+x)*4;
      d[i]=clamp(r,0,1)*255; d[i+1]=clamp(g,0,1)*255; d[i+2]=clamp(b,0,1)*255; d[i+3]=255;
    }
  }
  ctx.putImageData(img,0,0);
  const tex=new THREE.CanvasTexture(cv);
  tex.mapping=THREE.EquirectangularReflectionMapping;
  tex.colorSpace=THREE.SRGBColorSpace;
  return tex;
}
{
  const pmrem = new THREE.PMREMGenerator(renderer);
  pmrem.compileEquirectangularShader();
  const envTex = paintEnvTexture();
  const envRT = pmrem.fromEquirectangular(envTex);
  scene.environment = envRT.texture;
  envTex.dispose(); pmrem.dispose();
}
for (const m of scene.children){/* noop */}

// ---------------------------------------------------------------- sky dome
const skyUniforms = {
  uTime:{value:0}, uEnv01:{value:0},
  uZenith:{value:ENV.zenith.clone()}, uMid:{value:ENV.mid.clone()},
  uHorizon:{value:ENV.horizon.clone()}, uWarm:{value:ENV.warm.clone()},
  uHaze:{value:ENV.haze.clone()}, uFogColor:{value:ENV.fogCol.clone()},
  uSunDir:{value:ENV.sunDir.clone()}, uMist:{value:1}
};
const skyMat = new THREE.ShaderMaterial({
  side:THREE.BackSide, depthWrite:false, depthTest:false, fog:false,
  uniforms:skyUniforms,
  vertexShader:`varying vec3 vDir; void main(){ vDir=position; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);}`,
  fragmentShader:`
  varying vec3 vDir;
  uniform float uTime,uEnv01,uMist;
  uniform vec3 uZenith,uMid,uHorizon,uWarm,uHaze,uFogColor,uSunDir;
  ${GLSL_NOISE}
  void main(){
    vec3 dir=normalize(vDir);
    float y=dir.y;
    vec3 S=normalize(uSunDir);
    float mu=clamp(dot(dir,S),0.0,1.0);
    vec3 col=mix(uHorizon,uMid,smoothstep(-0.04,0.30,y));
    col=mix(col,uZenith,smoothstep(0.16,0.95,y));
    // broad dawn glow: wide lobe along the horizon, tighter inner halo
    float lowband=exp(-max(y,0.0)*2.6);
    col+=uWarm*(pow(mu,2.0)*0.30+pow(mu,6.0)*0.40+pow(mu,16.0)*0.55)*lowband*(0.80+0.55*uEnv01);
    col+=uWarm*pow(mu,90.0)*1.15;
    // large-scale air variation so the upper sky is never a flat fill
    float air=fbm3(dir*1.35+vec3(uTime*0.0016,0.0,uTime*0.0011),4);
    col*=0.94+0.14*air;
    // scattered high cloud, drifting, lit from the sun side
    float band=clamp((y-0.02)/0.55,0.0,1.0);
    float q=fbm3(dir*2.35+vec3(uTime*0.0045,uTime*0.0012,uTime*0.0028),5);
    float q2=fbm3(dir*6.8+vec3(-uTime*0.006,0.0,uTime*0.0040),3);
    float cover=smoothstep(0.50,0.76,q*0.80+q2*0.30)*smoothstep(0.010,0.17,y)*(0.40+0.52*band);
    vec3 cloudDark=mix(vec3(0.115,0.118,0.170),vec3(0.235,0.215,0.245),uEnv01);
    vec3 cloudLit=mix(vec3(0.72,0.40,0.27),vec3(1.0,0.76,0.50),uEnv01);

function terrainH(x,z){
  const rowMask=smoothstep(20.0,14.5,Math.abs(x));
  const furrow=0.085*Math.cos((x-1.3)/ROW_P*Math.PI*2.0);
  const big=(fbm2(x*0.035+11.0,z*0.035-4.0,4)-0.5)*0.85;
  const med=(fbm2(x*0.14-3.0,z*0.14+7.0,3)-0.5)*0.22;
  const rim=smoothstep(17.0,30.0,Math.abs(x))*0.9+smoothstep(55.0,95.0,z)*1.3;
  return furrow*rowMask + (big+med)*(0.35+0.65*(1-rowMask)) + rim*0.6 + 0.05*Math.sin(z*0.09)*rowMask;
}

// ---------------------------------------------------------------- pumpkin body
// profile-driven lathe with geometric ribs, optional lumps / warts
function pumpkinGeometry(cfg){
  const {nu=44,nv=18,ribs=14,ribDepth=0.055,lumps=0,seed=0,scaleY=1.0,
         ctrl=[[0.015,-0.5],[0.40,-0.48],[0.74,-0.34],[0.95,-0.10],[1.00,0.08],[0.88,0.30],[0.52,0.45],[0.20,0.50],[0.05,0.505]]}=cfg;
  const sp=new THREE.SplineCurve(ctrl.map(p=>new THREE.Vector2(p[0],p[1])));
  const prof=sp.getPoints(nv).map(p=>({r:Math.max(p.x,0.004),y:p.y}));
  prof[nv].r=Math.max(prof[nv].r,0.010);
  const pos=new Float32Array((nu+1)*(nv+1)*3);
  const uv=new Float32Array((nu+1)*(nv+1)*2);
  const idx=[];
  const V=(i,j)=>j*(nu+1)+i;
  for(let j=0;j<=nv;j++){
    const pr=prof[j];
    for(let i=0;i<=nu;i++){
      const u=i/nu, th=u*Math.PI*2;
      let rib=1-ribDepth*(0.5-0.5*Math.cos(ribs*th));
      rib*=1+0.16*ribDepth*Math.sin((ribs*0.5+1.0)*th+seed);
      let rr2=1+lumps*(fbm2(Math.cos(th)*2.2+seed,Math.sin(th)*2.2+j*1.7+seed,3)-0.5)*1.4;
      if(lumps>0.4){
        const wr=fbm2(th*5.0+seed*3.1,j*7.0,2);
        rr2+= (wr>0.62? (wr-0.62)*1.6 : 0.0);
      }
      const r=pr.r*rib*rr2;
      const k=V(i,j)*3;
      pos[k]=Math.cos(th)*r; pos[k+1]=pr.y*scaleY; pos[k+2]=Math.sin(th)*r;
      uv[V(i,j)*2]=u; uv[V(i,j)*2+1]=j/nv;
    }
  }
  for(let j=0;j<nv;j++)for(let i=0;i<nu;i++){
    const a=V(i,j),b=V(i+1,j),c=V(i,j+1),d=V(i+1,j+1);
    idx.push(a,c,b, b,c,d);          // reversed lathe winding so normals face outward
  }
  const g=new THREE.BufferGeometry();
  g.setAttribute('position',new THREE.BufferAttribute(pos,3));
  g.setAttribute('uv',new THREE.BufferAttribute(uv,2));
  g.setIndex(idx);
  g.computeVertexNormals();
  return g;
}
// ---------------------------------------------------------------- pumpkin stem
function stemGeometry(seed=0, curlAmt=1.0, baseY=0.42){
  const pts=[], n=6;
  const a0=seed*2.4;
  let p=new THREE.Vector3(0,baseY,0);
  pts.push(p.clone());
  let dir=new THREE.Vector3(Math.cos(a0)*0.30,1.0,Math.sin(a0)*0.30).normalize();
  const axis=new THREE.Vector3(Math.cos(a0+1.6),0,Math.sin(a0+1.6));
  for(let i=1;i<=n;i++){
    const t=i/n;
    dir.applyAxisAngle(axis, 0.30*curlAmt*t*1.6).normalize();
    dir.y=lerp(dir.y,1.0,0.10);
    p=p.clone().addScaledVector(dir, 0.075+0.028*Math.sin(i));
    pts.push(p.clone());
  }
  const curve=new THREE.CatmullRomCurve3(pts);
  const g=makeTube(curve,16,7,(t)=>lerp(0.055,0.015,Math.pow(t,0.7))*(1-0.18*Math.sin(t*9+seed)));
  const col=new Float32Array(g.attributes.position.count*3);
  const c1=new THREE.Color(0.21,0.22,0.12), c2=new THREE.Color(0.10,0.11,0.06);
  for(let i=0;i<g.attributes.position.count;i++){
    const t=(Math.floor(i/8))/16;
    const c=c1.clone().lerp(c2,clamp(t*1.2,0,1)).multiplyScalar(0.82+0.36*hash2(i*1.7,i*0.3));
    col[i*3]=c.r;col[i*3+1]=c.g;col[i*3+2]=c.b;
  }
  g.setAttribute('color',new THREE.BufferAttribute(col,3));
  return g;
}
// ---------------------------------------------------------------- leaf
// broad lobed leaf; aT = distance from centre (edge frost), bT = vein proximity
function leafGeometry(cfg){
  const {segs=26,rings=7,lobes=5,size=1.0,curl=0.45,droop=0.35,wave=1.0,seed=0,
         brown=0.4,base=new THREE.Color(0.10,0.13,0.055)}=cfg;
  const pos=[],uvs=[],idx=[],aT=[],bT=[],col=[];
  const push=(x,y,z,u,v,at,bt,c)=>{pos.push(x,y,z);uvs.push(u,v);aT.push(at);bT.push(bt);col.push(c.r,c.g,c.b);};
  const rad=(th)=>{
    const l=Math.abs(Math.cos(th*lobes/2));
    const tip=1.0+0.22*Math.pow(Math.max(Math.cos(th),0.0),2.0);
    return (0.60+0.40*Math.pow(Math.max(l,0),0.55))*tip;
  };
  const cBase=base.clone(), cEdge=new THREE.Color().copy(base).lerp(new THREE.Color(0.30,0.23,0.10),brown);
  cEdge.lerp(new THREE.Color(0.55,0.52,0.44),0.10);
  const cVein=new THREE.Color().copy(base).lerp(new THREE.Color(0.34,0.36,0.20),0.6);
  push(0,0,0,0.5,0.5,0.0,1.0,cVein.clone());
  for(let j=1;j<=rings;j++){
    const v=j/rings;
    for(let i=0;i<=segs;i++){
      const u=i/segs, th=u*Math.PI*2;
      const r=v*rad(th);
      let x=Math.cos(th)*r, y=Math.sin(th)*r;
      const rr_=r/1.0;
      const z = curl*Math.pow(rr_,2.1)*Math.cos(lobes*0.5*th*0.8+seed+u*3.0)*0.9
              + wave*0.06*Math.sin(rr_*7.0+seed)*rr_
              - droop*Math.pow(rr_,2.0)*0.55
              + curl*0.5*Math.pow(rr_,3.0);
      const edge=1-smoothstep(0.62,1.0,v);
      const c=cBase.clone().lerp(cEdge,clamp(1-edge,0,1));
      const dv=Math.abs(u*lobes-Math.round(u*lobes));
      c.lerp(cVein,(1-smoothstep(0.0,0.14,dv))*0.55*edge);
      c.multiplyScalar(0.82+0.34*hash2(i*2.3+j*1.7,j*1.1+seed));
      push(x*0.72,z*0.55,y, u,v, clamp((v-0.30)/0.7,0,1), 1-smoothstep(0.0,0.16,dv), c);
    }
  }
  for(let j=1;j<rings;j++){
    const ringOff=1+(j-1)*(segs+1), cur=1+j*(segs+1);
    for(let i=0;i<segs;i++){
      const a=ringOff+i, b=ringOff+i+1, c2=cur+i, d=cur+i+1;
      idx.push(a,b,c2, b,d,c2);
    }
  }
  const g=new THREE.BufferGeometry();
  g.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));
  g.setAttribute('uv',new THREE.Float32BufferAttribute(uvs,2));
  g.setAttribute('aT',new THREE.Float32BufferAttribute(aT,1));
  g.setAttribute('bT',new THREE.Float32BufferAttribute(bT,1));
  g.setAttribute('color',new THREE.Float32BufferAttribute(col,3));
  g.setIndex(idx);
  g.computeVertexNormals();
  // petiole
  const petiole=makeTube(new THREE.CatmullRomCurve3([
      new THREE.Vector3(0,0.02,-0.10),new THREE.Vector3(0.01,0.01,0.03),new THREE.Vector3(0,0,0.12)]),6,5,(t)=>lerp(0.010,0.004,t));
  const pg=mergeGeos([g,petiole]);
  return pg;
}
// leaf material needs its own frost rules: frost concentrates on edges + veins
function leafMaterial(){
  const mat=new THREE.MeshStandardMaterial({vertexColors:true,roughness:0.72,metalness:0.0,
    side:THREE.DoubleSide,envMapIntensity:0.8});
  const f=frostStandard(mat,{frostGain:0.36,sparkleAmt:2.4,topFrost:0.24,windA:0.012,windF:0.9,windH:0.5,trans:0.22});
  const prev=f.mat.onBeforeCompile;
  f.mat.onBeforeCompile=(sh)=>{
    prev(sh);
    sh.vertexShader=sh.vertexShader
      .replace('#include <common>','#include <common>\nattribute float aT; attribute float bT; varying float vAT; varying float vBT;')
      .replace('#include <begin_vertex>','#include <begin_vertex>\nvAT=aT;vBT=bT;');
    sh.fragmentShader=sh.fragmentShader
      .replace('#include <common>','#include <common>\nvarying float vAT; varying float vBT;')
      .replace('gFrostM=frost;','float edgeVein=max(vAT*vAT,mix(0.10,0.85,vBT)*vAT);\n gFrostM=frost*clamp(0.05+1.55*edgeVein,0.0,1.0);');
  };
  f.mat.customProgramCacheKey=()=>'leafmat';
  regFrost(f);
  return f;
}
// ---------------------------------------------------------------- vine
function vineGeometry(points,radius){
  const curve=new THREE.CatmullRomCurve3(points);
  const g=makeTube(curve,Math.min(220,points.length*9),6,(t)=>lerp(radius,radius*0.28,Math.pow(t,0.85))*(0.85+0.3*Math.sin(t*40)));
  const col=new Float32Array(g.attributes.position.count*3);
  const cA=new THREE.Color(0.14,0.16,0.06), cB=new THREE.Color(0.26,0.26,0.12);
  for(let i=0;i<g.attributes.position.count;i++){
    const c=cA.clone().lerp(cB,hash2(i*0.7,3.1));
    col[i*3]=c.r;col[i*3+1]=c.g;col[i*3+2]=c.b;
  }
  g.setAttribute('color',new THREE.BufferAttribute(col,3));
  return g;
}
function tendrilGeometry(origin,dir,seed){
  const pts=[],n=22;
  const right=new THREE.Vector3(dir.z,-dir.x,0.3).normalize();
  const up=new THREE.Vector3().crossVectors(dir,right).normalize();
  for(let i=0;i<n;i++){
    const t=i/(n-1);
    const ang=t*(6.5+seed*3)*(1-t*0.25);
    const r=0.028+0.055*t;
    const p=origin.clone().addScaledVector(dir,t*0.30)
      .addScaledVector(right,Math.cos(ang)*r*(0.4+t))
      .addScaledVector(up,Math.sin(ang)*r*(0.4+t)*0.7+0.02*t);
    pts.push(p);
  }
  return makeTube(new THREE.CatmullRomCurve3(pts),40,4,(t)=>lerp(0.008,0.0022,t));
}
// ---------------------------------------------------------------- grass clump
function grassClumpGeometry(blades=7,h=0.3){
  const geos=[];
  for(let b=0;b<blades;b++){
    const a=(b/blades)*Math.PI*2+rr(-0.4,0.4);
    const bh=h*rr(0.55,1.25), bw=rr(0.0045,0.010), bend=rr(0.05,0.22);
    const dirx=Math.cos(a), dirz=Math.sin(a);
    const P=[];
    for(let s=0;s<=3;s++){
      const t=s/3;
      const y=bh*t, off=bend*t*t;
      const w=bw*(1-t*0.85)*(t<0.02?0.4:1);
      const px=dirx*off, pz=dirz*off;
      const nx=-dirz*w, nz=dirx*w;
      P.push([px-nx,y,pz-nz, px+nx,y,pz+nz]);
    }
    const g=new THREE.BufferGeometry();
    const vp=[],vc=[];
    for(let s=0;s<3;s++){
      const [ax,ay,az,bx,by,bz]=P[s], [cx,cy,cz,dx,dy,dz]=P[s+1];
      const t0=s/3,t1=(s+1)/3;
      const col0=[0.050+0.022*t0,0.056+0.026*t0,0.027+0.014*t0];
      const col1=[0.098+0.044*t1,0.084+0.036*t1,0.043+0.017*t1];
      vp.push(ax,ay,az,bx,by,bz,cx,cy,cz, bx,by,bz,dx,dy,dz,cx,cy,cz);
      vc.push(...col0,...col0,...col1, ...col0,...col1,...col1);
    }
    g.setAttribute('position',new THREE.Float32BufferAttribute(vp,3));
    g.setAttribute('color',new THREE.Float32BufferAttribute(vc,3));
    g.computeVertexNormals();
    geos.push(g);
  }
  return mergeGeos(geos);
}
// ---------------------------------------------------------------- frost spider web texture
function webTexture(){
  const S=256, cv=document.createElement('canvas'); cv.width=cv.height=S;
  const g=cv.getContext('2d');
  g.clearRect(0,0,S,S);
  g.translate(S/2,S/2);
  const spokes=17, R=S/2-4;
  g.strokeStyle='rgba(235,245,255,0.95)'; g.lineWidth=1.0;
  const jitter=[];
  for(let i=0;i<spokes;i++){jitter.push(rr(0.82,1.0));}
  for(let i=0;i<spokes;i++){
    const a=i/spokes*Math.PI*2;
    g.globalAlpha=rr(0.45,0.9);
    g.beginPath(); g.moveTo(Math.cos(a)*8,Math.sin(a)*8); g.lineTo(Math.cos(a)*R*jitter[i],Math.sin(a)*R*jitter[i]); g.stroke();
  }
  g.lineWidth=0.9;
  for(let ring=1;ring<=11;ring++){
    const rr_=Math.pow(ring/11,1.12)*R*0.98;
    g.globalAlpha=rr(0.30,0.68)*(0.5+0.5*ring/11);
    g.beginPath();
    for(let i=0;i<=spokes;i++){
      const a=i/spokes*Math.PI*2;
      const sag=1-0.10*Math.sin((i/spokes)*Math.PI*2*spokes*0+0)*0;
      const rad=rr_*(i===spokes?jitter[0]:jitter[i%spokes])*(1-0.06*Math.cos(a*spokes));
      const x=Math.cos(a)*rad, y=Math.sin(a)*rad;
      if(i===0)g.moveTo(x,y); else g.lineTo(x,y);
    }
    g.stroke();
  }
  // dew droplets
  g.globalAlpha=1;
  for(let i=0;i<160;i++){
    const a=rr(0,Math.PI*2), r=Math.pow(RND(),0.6)*R*0.98;
    const s=rr(0.7,2.1);
    g.fillStyle=`rgba(255,255,255,${rr(0.25,0.85).toFixed(2)})`;
    g.beginPath(); g.arc(Math.cos(a)*r,Math.sin(a)*r,s,0,7); g.fill();
  }
  const tex=new THREE.CanvasTexture(cv);
  tex.colorSpace=THREE.SRGBColorSpace;
  return tex;
}

    g.lineWidth=rr(0.6,2.4);

function taperedBox(wb,wt,hb,ht,depthB,depthT,twist=0){
  const pos=[],uv=[],idx=[];
  const rings=[-0.5,0.5];
  const corners=[[-1,-1],[1,-1],[1,1],[-1,1]];
  const verts=[];
  for(let r=0;r<2;r++){
    const t=rings[r], s=t+0.5;
    const w=lerp(wb,wt,s), d=lerp(depthB,depthT,s), y=lerp(-hb/2,hb/2,r);
    const tw=twist*s;
    const ring=[];
    for(const [cx,cz] of corners){
      const x=cx*w/2, z=cz*d/2;
      const xr=x*Math.cos(tw)-z*Math.sin(tw), zr=x*Math.sin(tw)+z*Math.cos(tw);
      ring.push([xr,y,zr]);
    }
    verts.push(ring);
  }
  const pushV=(v,u,uu)=>{pos.push(v[0],v[1],v[2]);uv.push(u,uu);return pos.length/3-1;};
  for(let i=0;i<4;i++){
    const a=verts[0][i],b=verts[0][(i+1)%4],c=verts[1][(i+1)%4],d=verts[1][i];
    const i0=pushV(a,i/4,0),i1=pushV(b,(i+1)/4,0),i2=pushV(c,(i+1)/4,1),i3=pushV(d,i/4,1);
    idx.push(i0,i1,i2, i0,i2,i3);
  }
  { const a=pushV(verts[0][0],0.5,0.5),b=pushV(verts[0][1],0.6,0.5),c=pushV(verts[0][2],0.6,0.7),d=pushV(verts[0][3],0.4,0.7);
    idx.push(a,b,c,a,c,d); }
  { const a=pushV(verts[1][0],0.5,0.5),b=pushV(verts[1][2],0.6,0.7),c=pushV(verts[1][1],0.6,0.5),d=pushV(verts[1][3],0.4,0.7);
    idx.push(a,b,c,a,c,d); }
  const g=new THREE.BufferGeometry();
  g.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));
  g.setAttribute('uv',new THREE.Float32BufferAttribute(uv,2));
  g.setIndex(idx); g.computeVertexNormals();
  return g;
}

    if(c.actT<=0){ c.act=RND()<0.65?'peck':'look'; c.actDur=rr(1.2,3.2); c.actT=c.actDur; }
    c.peckPhase=(c.peckPhase||0)+dt*(c.act==='peck'?5.2:0);
    if(u>=1){
      const s=nearestFreeSlot(c.g.position,true);
      const pts=[c.g.position.clone().add(new THREE.Vector3(0,0.30,0)),
                 c.g.position.clone().add(new THREE.Vector3(-0.5,1.0,-1.0)),
                 ...perchPath(c,s)];
      setFlight(c,pts,3.4,()=>{ finishLanding(c,s); });
    }
  } else if(c.state==='perch'){
    const slot=c.slot;
    if(slot>=0){
      const base=FENCE.perches[slot].pos;
      tmpV.copy(base).add(new THREE.Vector3(0,PERCH_LIFT,0));
      if(c.hopT>0){
        c.hopT-=dt;
        const hh=1-clamp(c.hopT/c.hopDur,0,1);
        tmpV.lerpVectors(c.hopFrom,c.hopTo,hh);
        tmpV.y+=Math.sin(Math.PI*hh)*0.055;
        c.g.position.copy(tmpV);
        c.g.rotation.order='YXZ';
        c.g.rotation.x=Math.sin(Math.PI*hh)*0.14;
        if(c.hopT<=0){ if(c.hopSlot>=0){slotOwner[c.hopSlot]=c.idx;c.slot=c.hopSlot;} }
      } else {
        c.g.position.lerp(tmpV,1-Math.exp(-14*dt));
        c.g.rotation.x=dampTo(c.g.rotation.x,0,10,dt);
      }
    }
    c.actT-=dt;
    if(c.actT<=0){
      const r=RND();
      if(r<0.30){c.act='look';c.actDur=rr(0.8,2.4);}
      else if(r<0.52){c.act='preen';c.actDur=rr(1.6,3.4);}
      else if(r<0.70){c.act='caw';c.actDur=rr(0.7,1.2);c.cawT=0.45;emitCrow('caw',c.g.position,1.0);}
      else if(r<0.86&&c.slot>=0){
        c.act='hop';c.actDur=0.42;
        const s=nearestFreeSlot(c.g.position,false);
        if(s>=0&&s!==c.slot){
          c.hopFrom=c.g.position.clone();
          c.hopTo=FENCE.perches[s].pos.clone().add(new THREE.Vector3(0,PERCH_LIFT,0));
          c.hopT=c.hopDur=0.42; c.hopSlot=s;
          emitCrow('flutter',c.g.position,0.35);
        }
      } else {c.act='ruffle';c.actDur=rr(0.6,1.4);}
      c.actT=c.actDur;
      if(c.act==='look'){c.tYaw=rr(-1.0,1.0);c.tPitch=rr(-0.35,0.4);}
    }
    if(c.act==='preen'){ c.tYaw=0.85*(c.seed>50?-1:1); c.tPitch=-1.05; }
    if(c.act==='caw'){ c.tPitch=0.55; c.tYaw*=0.4; }
    if(RND()<dt*0.7&&c.act==='look'){ c.tYaw=rr(-1.0,1.0); c.tPitch=rr(-0.35,0.4); }
    if(c.hopT<=0){
      c.headYaw=dampTo(c.headYaw,clamp(c.tYaw,-1.2,1.2),c.act==='look'?9:4.5,dt);
      c.headPitch=dampTo(c.headPitch,clamp(c.tPitch,-1.0,0.7),c.act==='look'?9:4.5,dt);
    }
    c.fold=dampTo(c.fold,1,8,dt);
    c.tuck=dampTo(c.tuck,0,6,dt);
    c.bodyRoll=dampTo(c.bodyRoll, c.act==='preen'?0.10*Math.sign(c.tYaw||1):0, 3,dt);
    c.g.rotation.order='YXZ';
    if(c.hopT<=0) c.g.rotation.z=dampTo(c.g.rotation.z,c.bodyRoll,4,dt);
    c.g.rotation.x=dampTo(c.g.rotation.x,c.act==='preen'?-0.10:0,5,dt);
  }
  c.cawT=Math.max(0,c.cawT-dt);
  c.beakOpen=dampTo(c.beakOpen, c.cawT>0? (0.35+0.25*Math.sin(time*26)): (c.act==='preen'?0.16:0), 12,dt);
  // -------- wing / tail / head pose
  const flapping=(c.state==='fly'&&c.glide<0.55)?1:0;
  c.flapPhase+=dt*(c.flapRate*(1-c.glide*0.9))*(flapping?1:0.55);
  const landingBoost=(c.state==='fly')?smoothstep(0.70,0.95,clamp(c.t/c.dur,0,1))*1.3:0;
  const amp=(0.62+0.5*landingBoost)*(1-c.fold);
  const fl=Math.sin(c.flapPhase*2*Math.PI*0.5);
  const foldF=c.fold;
  const extZ=amp*fl*0.85, extY=-0.10+0.20*Math.cos(c.flapPhase*2*Math.PI*0.5)*(1-foldF);
  const wyR=lerp(extY, 0.62, foldF), wzR=lerp(extZ+0.10, -1.30, foldF), wxR=lerp(0.10,-0.10,foldF);
  c.wingRP.rotation.set(wxR,wyR,wzR);
  c.wingLP.rotation.set(-wxR,-wyR,-wzR);
  const tailFan=(c.state==='fly')?lerp(0.30,0.0,foldF):0;
  c.tailP.rotation.set(c.state==='perch'?-0.30:(c.state==='ground'?-0.16:0.05+0.1*Math.sin(time*2+c.seed)),0,tailFan);
  c.tailP.rotation.z=tailFan*Math.sin(time*1.7+c.seed);
  c.headP.rotation.set(c.headP.rotation.x + (c.headPitch-c.headP.rotation.x)*0.0,0,0);
  c.headP.rotation.x=dampTo(c.headP.rotation.x,c.headPitch*(c.state==='perch'?1:0.35),8,dt);
  c.headP.rotation.y=dampTo(c.headP.rotation.y,c.headYaw*(c.state==='perch'?1:0.25),8,dt);
  c.beakP.rotation.x=lerp(0.05,0.62,clamp(c.beakOpen,0,1));
  const tuck=c.tuck;
  c.legR.rotation.x=lerp(0,0.95,tuck); c.legL.rotation.x=lerp(0,0.95,tuck);
  c.body.position.y=lerp(0,-0.012,tuck);
}

const DEPTH_GLSL=`
uniform sampler2D uDepth; uniform float uNear,uFar; uniform vec2 uRes;
float viewZFromColor(vec2 uv){
  vec4 d=texture2D(uDepth,uv);
  float zz=dot(d,vec4(1.0/255.0,1.0/255.0,1.0/255.0,1.0/255.0/255.0));
  zz=clamp(zz,0.0,1.0);
  return (uNear*uFar)/((uFar-uNear)*zz-uFar);
}
float viewZFromPos(vec4 mv){return -mv.z;}
`;
const SCATTER_GLSL=`
uniform vec3 uSunDir,uSunCol,uSkyCol,uWarmth;
uniform float uSunInt,uEnv01;
vec3 scatter(float mu,float dens,out float alpha,float ext){
  float g=0.62;
  float ph=(1.0-g*g)/(4.0*3.14159265*pow(max(1.0+g*g-2.0*g*mu,0.02),1.5));
  ph*=2.6;
  vec3 inSc=uSunCol*uSunInt*ph*1.35;
  inSc+=uWarmth*uSunInt*0.22*pow(max(mu,0.0),4.0)*uEnv01;
  vec3 amb=mix(uSkyCol,vec3(0.42,0.44,0.50),0.25)*1.05;
  amb+=uSunCol*uSunInt*0.045;
  vec3 col=(inSc+amb)*dens;
  alpha=clamp(dens*ext,0.0,1.0);
  return col;
}
`;
// ---------------------------------------------------------------- fog sheets
function fogSheet(yTop,dens,scale,seedOff,renderOrder){
  const g=new THREE.PlaneGeometry(240,240,150,150);
  g.rotateX(-Math.PI/2);
  const mat=new THREE.ShaderMaterial({
    transparent:true, depthWrite:false, side:THREE.DoubleSide, blending:THREE.NormalBlending,
    uniforms:Object.assign({},MIST_COMMON,{
      uYTop:{value:yTop},uDens:{value:dens},uScale:{value:scale},uSeed:{value:seedOff},uThick:{value:2.6}
    }),
    vertexShader:`
    varying vec3 vW; varying vec4 vMv; varying vec2 vXY; varying float vDisp;
    uniform float uTime,uScale,uSeed;
    ${GLSL_NOISE}
    void main(){
      vec3 p=position;
      float n=fbm3(vec3(p.xz*uScale*0.06,uTime*0.020+uSeed),4);
      float n2=fbm3(vec3(p.xz*uScale*0.24+5.0,uTime*0.045+uSeed),3);
      float disp=(n*0.75+n2*0.35-0.45)*1.35;
      p.y+=disp;
      vDisp=n;
      vec4 wp=modelMatrix*vec4(p,1.0);
      vW=wp.xyz; vXY=wp.xz;
      vMv=viewMatrix*wp;
      gl_Position=projectionMatrix*vMv;
    }`,
    fragmentShader:`
    precision highp float;
    varying vec3 vW; varying vec4 vMv; varying vec2 vXY; varying float vDisp;
    uniform float uTime,uDens,uScale,uSeed,uYTop,uThick,uMistAmt,uFogDensity;
    uniform vec3 uFogColor;
    ${GLSL_NOISE}
    ${DEPTH_GLSL}
    ${SCATTER_GLSL}
    void main(){
      vec2 q=vXY;
      float n=fbm3(vec3(q*uScale*0.075,uTime*0.016+uSeed),5);
      float n2=fbm3(vec3(q*uScale*0.30+13.0,uTime*0.040+uSeed*1.7),4);
      float rowMask=0.62+0.38*(0.5-0.5*cos((vXY.x-1.3)/2.6*6.28318));
      float body=smoothstep(0.30,0.72,n*0.7+n2*0.42);
      float heightFade=1.0-smoothstep(uYTop-0.75,uYTop+0.55,vW.y+vDisp*0.4);
      float farFade=1.0-smoothstep(58.0,125.0,length(vXY-cameraPosition.xz));
      float nearFade=smoothstep(0.9,7.5,length(vW-cameraPosition));
      float edge=1.0-smoothstep(74.0,116.0,length(vXY));
      float dv=viewZFromColor(gl_FragCoord.xy/uRes);
      float soft=clamp((dv-vMv.z)/max(0.35,-vMv.z*0.10),0.0,1.0);
      soft=soft*soft*(3.0-2.0*soft);
      float dens=max(0.0,uDens*uMistAmt)*body*heightFade*rowMask*farFade*nearFade*edge*soft;
      if(dens<0.0015) discard;
      vec3 V=normalize(cameraPosition-vW);
      float mu=dot(V,normalize(uSunDir));
      float a;
      vec3 col=scatter(mu,dens,a,uThick);
      col=mix(col,uFogColor*1.05,clamp(dens*0.42,0.0,0.7)*0.75);
      float gold=smoothstep(0.86,0.995,mu)*dens*2.2;
      col+=vec3(1.0,0.72,0.42)*gold;
      gl_FragColor=vec4(col,a);
      #include <colorspace_fragment>
    }`
  });
  const mesh=new THREE.Mesh(g,mat);
  mesh.position.set(0,yTop,10);
  mesh.renderOrder=renderOrder;
  mesh.frustumCulled=false;
  mesh.layers.set(LAYER_MIST);
  mistLayer.add(mesh);
  return mat;
}

  varying vec2 vUv; varying vec3 vW; varying vec4 vMv; varying float vSeed;
  uniform float uTime;
  void main(){
    vUv=uv; vSeed=iSeed;
    vec3 c=iPos+vec3(iDrift.x*sin(uTime*0.06+iSeed*6.28),0.0,iDrift.y*cos(uTime*0.05+iSeed*5.11));

    gl_FragColor=vec4(col,a);
    #include <colorspace_fragment>
  }`
});

const vapourMat=new THREE.ShaderMaterial({
  transparent:true, depthWrite:false, blending:THREE.AdditiveBlending, side:THREE.DoubleSide,

  grassUniforms.uSkyCol.value.setRGB(ENV.mid.r*2.0+0.02,ENV.mid.g*2.0+0.03,ENV.mid.b*2.2+0.05);
  grassUniforms.uFogColor.value.copy(ENV.fogCol);
  grassUniforms.uFogDensity.value=scene.fog.density;
  grassUniforms.uFrostAmt.value=frostAmt;
  grassUniforms.uMeltAmt.value=ENV.melt;
  grassUniforms.uSunInt.value=ENV.sunIntensity;
  grassUniforms.uGust.value=0.8+0.35*Math.sin(time*0.13)+0.15*Math.sin(time*0.37);
  // mist family
  MIST_COMMON.uTime.value=wt;
  MIST_COMMON.uSunDir.value.copy(ENV.sunDir);
  MIST_COMMON.uSunCol.value.copy(ENV.sunCol);
  MIST_COMMON.uSunInt.value=ENV.sunIntensity*0.40;
  MIST_COMMON.uSkyCol.value.setRGB(ENV.mid.r*2.2+0.05,ENV.mid.g*2.2+0.06,ENV.mid.b*2.5+0.08);
  MIST_COMMON.uFogColor.value.copy(ENV.fogCol);
  MIST_COMMON.uFogDensity.value=scene.fog.density;
  MIST_COMMON.uMistAmt.value=ENV.mist;
  MIST_COMMON.uEnv01.value=e;
  MIST_COMMON.uWarmth.value.copy(ENV.warm);
  shaftMat.uniforms.uBeamAmt.value=0.90+1.15*e;
  vapourMat.uniforms.uMelt.value=ENV.melt;
  for(const m of [puffMat,shaftMat,vapourMat]){ m.uniforms.uNear.value=camera.near; m.uniforms.uFar.value=camera.far; }
  // webs, puddles, crows
  const wm=window.__webMat;
  wm.uniforms.uTime.value=wt; wm.uniforms.uSunDir.value.copy(ENV.sunDir);
  wm.uniforms.uSunInt.value=ENV.sunIntensity; wm.uniforms.uFogColor.value.copy(ENV.fogCol);
  wm.uniforms.uFogDensity.value=scene.fog.density;
  wm.uniforms.uAmt.value=1.0-0.45*ENV.melt;
  const pm=window.__puddleMat;
  pm.uniforms.uTime.value=wt; pm.uniforms.uSunDir.value.copy(ENV.sunDir);
  pm.uniforms.uSunCol.value.copy(ENV.sunCol); pm.uniforms.uSunInt.value=ENV.sunIntensity;
  pm.uniforms.uZenith.value.copy(ENV.zenith); pm.uniforms.uMid.value.copy(ENV.mid);
  pm.uniforms.uHorizon.value.copy(ENV.horizon); pm.uniforms.uWarm.value.copy(ENV.warm);
  pm.uniforms.uFogColor.value.copy(ENV.fogCol); pm.uniforms.uFogDensity.value=scene.fog.density;
  pm.uniforms.uIce.value=lerp(0.92,0.30,ENV.melt);
  pm.uniforms.uMelt.value=ENV.melt;
  crowUnis.uTime.value=wt; crowUnis.uSunDir.value.copy(ENV.sunDir);
  crowUnis.uSunInt.value=ENV.sunIntensity;
  const mm=window.__moteMat;
  mm.uniforms.uTime.value=wt; mm.uniforms.uSunDir.value.copy(ENV.sunDir);
  mm.uniforms.uSunCol.value.copy(ENV.sunCol); mm.uniforms.uSunInt.value=ENV.sunIntensity;
  // post
  compositeMat.uniforms.uFocus.value=camDir.focus;
  compositeMat.uniforms.uAperture.value=camDir.ap;
  compositeMat.uniforms.uTime.value=wt;
  compositeMat.uniforms.uFogColor.value.copy(ENV.fogCol);
  compositeMat.uniforms.uWarm.value.copy(ENV.warm);
  compositeMat.uniforms.uEnv01.value=e;
  compositeMat.uniforms.uExposure.value=lerp(1.08,0.98,e);
  compositeMat.uniforms.uBloom.value=lerp(0.58,0.46,e);
  for(const c of CROWS) updateCrow(c,dt,time);
  drainCrowEvents();
}
// ---------------------------------------------------------------- ambience (Web Audio)
const audio={ctx:null,ready:false,master:null,on:false};
function initAudio(){
  if(audio.ctx) return;
  const AC=window.AudioContext||window.webkitAudioContext;
  if(!AC) return;
  const ctx=new AC();
  audio.ctx=ctx;
  const master=ctx.createGain(); master.gain.value=0.0; master.connect(ctx.destination);
  audio.master=master;
  // cold breeze: brown noise through slowly wandering filters
  const len=ctx.sampleRate*5;
  const buf=ctx.createBuffer(1,len,ctx.sampleRate);
  const d=buf.getChannelData(0);
  let last=0;
  for(let i=0;i<len;i++){
    const w=Math.random()*2-1;
    last=(last+0.021*w)/1.021;
    d[i]=last*3.2;
  }
  const src=ctx.createBufferSource(); src.buffer=buf; src.loop=true;
  const lp=ctx.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=420; lp.Q.value=0.6;
  const bp=ctx.createBiquadFilter(); bp.type='bandpass'; bp.frequency.value=760; bp.Q.value=0.8;
  const gWind=ctx.createGain(); gWind.gain.value=0.32;
  const gWind2=ctx.createGain(); gWind2.gain.value=0.10;
  src.connect(lp); lp.connect(gWind); gWind.connect(master);
  src.connect(bp); bp.connect(gWind2); gWind2.connect(master);
  src.start();
  const lfo=ctx.createOscillator(); lfo.frequency.value=0.06;
  const lfoG=ctx.createGain(); lfoG.gain.value=260;
  lfo.connect(lfoG); lfoG.connect(lp.frequency); lfo.start();
  const lfo2=ctx.createOscillator(); lfo2.frequency.value=0.037;
  const lfo2G=ctx.createGain(); lfo2G.gain.value=380;
  lfo2.connect(lfo2G); lfo2G.connect(bp.frequency); lfo2.start();
  const lfo3=ctx.createOscillator(); lfo3.frequency.value=0.085;
  const lfo3G=ctx.createGain(); lfo3G.gain.value=0.12;
  lfo3.connect(lfo3G); lfo3G.connect(gWind.gain); lfo3.start();
  // simple ambience space
  const delay=ctx.createDelay(0.4); delay.delayTime.value=0.19;
  const fb=ctx.createGain(); fb.gain.value=0.34;
  const dlp=ctx.createBiquadFilter(); dlp.type='lowpass'; dlp.frequency.value=1600;
  delay.connect(dlp); dlp.connect(fb); fb.connect(delay);
  const wet=ctx.createGain(); wet.gain.value=0.30;
  delay.connect(wet); wet.connect(master);
  audio.space=delay;
  // low cold drone
  const drone=ctx.createOscillator(); drone.type='sine'; drone.frequency.value=58;
  const dg=ctx.createGain(); dg.gain.value=0.035;
  drone.connect(dg); dg.connect(master); drone.start();
  audio.ready=true;
  master.gain.linearRampToValueAtTime(0.5,ctx.currentTime+2.2);
  audio.on=true;
}
function panFor(pos){
  const v=pos.clone().project(camera);
  return clamp(v.x,-1,1)*0.85;
}
function distFor(pos){ return camera.position.distanceTo(pos); }
function caw(pos,near){
  if(!audio.ready) return;
  const ctx=audio.ctx, t0=ctx.currentTime+0.01;
  const dist=distFor(pos), pan=panFor(pos);
  const att=clamp(1.0/(1+Math.pow(dist/7,1.9)),0.03,1.0)*(near?1.0:0.75);
  const n=2+Math.floor(Math.random()*3);
  for(let i=0;i<n;i++){
    const st=t0+i*(0.14+Math.random()*0.07);
    const osc=ctx.createOscillator(); osc.type='sawtooth';
    const f0=760+Math.random()*320;
    osc.frequency.setValueAtTime(f0,st);
    osc.frequency.exponentialRampToValueAtTime(f0*0.45,st+0.12);
    const bp=ctx.createBiquadFilter(); bp.type='bandpass';
    bp.frequency.value=lerp(1500,700,clamp(dist/40,0,1)); bp.Q.value=1.5;
    const g=ctx.createGain();
    g.gain.setValueAtTime(0.0001,st);
    g.gain.exponentialRampToValueAtTime(0.16*att,st+0.018);
    g.gain.exponentialRampToValueAtTime(0.0001,st+0.15);
    const p=ctx.createStereoPanner(); p.pan.value=pan;
    osc.connect(bp); bp.connect(g); g.connect(p); p.connect(audio.master);
    if(dist>4) p.connect(audio.space);
    osc.start(st); osc.stop(st+0.22);
  }
}
function flutter(pos,strength){
  if(!audio.ready) return;
  const ctx=audio.ctx, t0=ctx.currentTime+0.01;
  const dist=distFor(pos), att=clamp(1.0/(1+Math.pow(dist/5,2.0)),0.02,1.0)*(strength||1);
  const len=Math.floor(ctx.sampleRate*0.4);
  const b=ctx.createBuffer(1,len,ctx.sampleRate);
  const d=b.getChannelData(0);
  for(let i=0;i<len;i++){
    const t=i/ctx.sampleRate;
    const wob=0.5+0.5*Math.sin(t*2*Math.PI*17);
    d[i]=(Math.random()*2-1)*wob*Math.exp(-t*9);
  }
  const s=ctx.createBufferSource(); s.buffer=b;
  const bp=ctx.createBiquadFilter(); bp.type='bandpass'; bp.frequency.value=1000; bp.Q.value=0.7;
  const g=ctx.createGain(); g.gain.value=0.32*att;
  const p=ctx.createStereoPanner(); p.pan.value=panFor(pos);
  s.connect(bp); bp.connect(g); g.connect(p); p.connect(audio.master);
  s.start(t0);
}
let nextAmbientCaw=3.5;
function drainCrowEvents(){
  for(const ev of CROW_EVENTS.caw){ caw(ev.pos,true); }
  for(const ev of CROW_EVENTS.flutter){ flutter(ev.pos,ev.s); }
  CROW_EVENTS.caw.length=0; CROW_EVENTS.flutter.length=0;
}
function ambientCrows(time,dt){
  if(!audio.ready) return;
  nextAmbientCaw-=dt;
  if(nextAmbientCaw<=0){
    nextAmbientCaw=rr(2.2,7.5);
    const ang=rr(-2.4,2.4), r=rr(24,60);
    const p=new THREE.Vector3(camera.position.x+Math.sin(ang)*r, rr(3,11), camera.position.z+Math.cos(ang)*r);
    caw(p,false);
  }
}
// ---------------------------------------------------------------- boot + loop
const hint=document.getElementById('hint');
function firstGesture(){
  initAudio();
  hint.classList.add('hide');
  window.removeEventListener('pointerdown',firstGesture);
  window.removeEventListener('keydown',firstGesture);
}
window.addEventListener('pointerdown',firstGesture);
window.addEventListener('keydown',firstGesture);
function onResize(){
  const w=innerWidth,h=innerHeight;
  renderer.setSize(w,h);
  applyRes();
  camera.aspect=w/Math.max(1,h);
  camera.updateProjectionMatrix();
  resizePost(w,h);
}
window.addEventListener('resize',onResize);
renderer.shadowMap.autoUpdate=false;
onResize();
updateCamera(0);
// warm up shaders before the first visible frame
renderer.compile(scene,camera);
let last=performance.now()/1000, fpsAcc=0, fpsN=0, fpsShown=0;
const cap=document.getElementById('cap');
let firstFrameDone=false;
let timeOffset=0;
window.__seek=(t)=>{ timeOffset = t - (performance.now()/1000-startT); };
window.__view=(i)=>{ window.__seek(i*CAM_SEG+0.35); };
window.__keys=KEYS.length;
window.__camAt=(i)=>KEYS[i].p.toArray();
function frame(){
  const now=performance.now()/1000;
  let dt=now-last; last=now;
  if(dt>0.06) dt=0.06;
  const clock=now-startT;
  const time=clock+timeOffset;
  updateCamera(time);
  renderer.shadowMap.needsUpdate=true;
  updateWorld(time,dt,clock);
  renderPost();
  ambientCrows(time,dt);
  fpsAcc+=dt;fpsN++;
  window.__t=time;
  if(fpsAcc>0.5){ fpsShown=fpsN/fpsAcc; fpsAcc=0;fpsN=0;
    if(location.hash==='#debug'){cap.style.display='block';cap.textContent=`${fpsShown.toFixed(0)} fps  puffs ${window.__puffs}  crows ${CROWS.length}  res ${(window.__res||[]).join('x')}`;}
    window.__fps=fpsShown;
    if(!firstFrameDone){firstFrameDone=true;window.__readyTime=performance.now();}
  }
  requestAnimationFrame(frame);
}
const startT=performance.now()/1000;
frame();
window.__sceneInfo=()=>({time:performance.now()/1000-startT,fps:window.__fps||0,env01:ENV.env01,mist:ENV.mist,melt:ENV.melt});
window.__scene=scene; window.__camera=camera; window.__env=ENV; window.__crows=CROWS; window.__nan=NaNDEBUG;
window.__nanScan=()=>{
  const bad=[];
  scene.traverse(o=>{
    if(!o.geometry) return;
    const p=o.geometry.attributes.position;
    if(!p) return;
    let n=0;
    for(let i=0;i<p.array.length;i++) if(!isFinite(p.array[i])) n++;
    if(n) bad.push({name:o.name||o.type,geo:o.geometry.type,n,total:p.array.length,tris:Math.floor(p.count/3)});
  });
  return bad;
};
window.__drawInfo=()=>({calls:renderer.info.render.calls,tris:renderer.info.render.triangles,mem:renderer.info.memory.geometries,progs:renderer.info.programs.length});

</script>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chalkboard Forest Fire Simulation</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #232c33;
  }
  #board {
    display: block;
    width: 100vw;
    height: 100vh;
  }
  #title {
    position: fixed;
    top: 14px;
    left: 50%;
    transform: translateX(-50%);
    color: #e8e6df;
    font-family: "Comic Sans MS", "Chalkboard SE", "Segoe Print", cursive;
    font-size: 22px;
    letter-spacing: 2px;
    opacity: 0.85;
    pointer-events: none;
    user-select: none;
    text-shadow: 0 0 4px rgba(232,230,223,0.35);
  }
</style>
</head>
<body>
<div id="title">FOREST FIRE &amp; REBIRTH — a chalkboard simulation</div>
<canvas id="board"></canvas>
<script>
(function () {
  "use strict";

  const canvas = document.getElementById("board");
  const ctx = canvas.getContext("2d");

  // Cell states
  const EMPTY = 0;      // burnt ground / gap
  const TREE = 1;       // mature tree
  const SPROUT = 2;     // regrowing sapling
  const BURN = 3;       // actively burning
  const EMBER = 4;      // smoldering ash, may re-ignite neighbors briefly

  // Simulation parameters
  const CELL = 10;              // pixel size of a cell
  const SPREAD_PROB = 0.28;     // chance a burning cell ignites a tree neighbor
  const BURN_STEPS = [6, 14];   // random burn duration range (ticks)
  const EMBER_STEPS = [4, 10];
  const SPROUT_TO_TREE = [60, 140]; // ticks for a sapling to mature
  const REGROW_PROB = 0.010;    // chance an empty cell sprouts each tick
  const TICK_MS = 45;           // simulation tick interval

  let cols = 0, rows = 0;
  let grid, burnT, sproutT;

  function init() {
    cols = Math.ceil(window.innerWidth / CELL);
    rows = Math.ceil(window.innerHeight / CELL);
    const n = cols * rows;
    grid = new Uint8Array(n);
    burnT = new Int32Array(n);
    sproutT = new Int32Array(n);
    for (let i = 0; i < n; i++) {
      // Start as a patchy forest
      grid[i] = Math.random() < 0.62 ? TREE : EMPTY;
    }
    // Seed a few initial fires so action starts immediately
    const seeds = 3;
    for (let s = 0; s < seeds; s++) {
      const i = (Math.floor(Math.random() * rows) * cols) +
                Math.floor(Math.random() * cols);
      grid[i] = BURN;
      burnT[i] = randInt(BURN_STEPS[0], BURN_STEPS[1]);
    }
  }

  function randInt(a, b) { return a + Math.floor(Math.random() * (b - a + 1)); }

  const NEIGH = [-cols - 1, -cols, -cols + 1, -1, 1, cols - 1, cols, cols + 1];

  function step() {
    // 1. Burning / ember progression
    for (let y = 0; y < rows; y++) {
      for (let x = 0; x < cols; x++) {
        const i = y * cols + x;
        const st = grid[i];
        if (st === BURN) {
          burnT[i]--;
          if (burnT[i] <= 0) {
            grid[i] = EMBER;
            burnT[i] = randInt(EMBER_STEPS[0], EMBER_STEPS[1]);
          }
        } else if (st === EMBER) {
          burnT[i]--;
          if (burnT[i] <= 0) grid[i] = EMPTY;
        }
      }
    }

    // 2. Spread fire & grow saplings
    for (let y = 0; y < rows; y++) {
      for (let x = 0; x < cols; x++) {
        const i = y * cols + x;
        const st = grid[i];
        if (st === BURN || st === EMBER) {
          // ignite neighbors (diagonals weaker)
          for (let k = 0; k < 8; k++) {
            const nx = x + (k % 3 - 1);
            const ny = y + ((k / 3) | 0 - 1);
            if (nx < 0 || ny < 0 || nx >= cols || ny >= rows) continue;
            const j = ny * cols + nx;
            if (grid[j] === TREE) {
              const diag = (k === 0 || k === 2 || k === 6 || k === 7);
              const p = (st === BURN ? SPREAD_PROB : 0.05) * (diag ? 0.5 : 1);
              if (Math.random() < p) {
                grid[j] = BURN;
                burnT[j] = randInt(BURN_STEPS[0], BURN_STEPS[1]);
              }
            }
          }
        } else if (st === SPROUT) {
          sproutT[i]--;
          if (sproutT[i] <= 0) grid[i] = TREE;
        } else if (st === EMPTY) {
          if (Math.random() < REGROW_PROB) {
            grid[i] = SPROUT;
            sproutT[i] = randInt(SPROUT_TO_TREE[0], SPROUT_TO_TREE[1]);
          }
        }
      }
    }

    // 3. Keep the scene alive: if fires are dying out, strike a fresh spark
    let burning = 0;
    for (let i = 0; i < grid.length; i++) if (grid[i] === BURN) burning++;
    if (burning < 4 && Math.random() < 0.02 + burning * -0.001) {
      const i = Math.floor(Math.random() * grid.length);
      if (grid[i] === TREE) {
        grid[i] = BURN;
        burnT[i] = randInt(BURN_STEPS[0], BURN_STEPS[1]);
      }
    }
  }

  // Chalk-style colors (high contrast on slate)
  const COLOR = {
    [EMPTY]:  null,
    [TREE]:   "#7fd6a0",  // chalky green
    [SPROUT]: "#c9f06e",  // bright yellow-green
    [BURN]:   "#ffb347",  // warm orange
    [EMBER]:  "#d96b4a"   // smoldering red-orange
  };

  function render(t) {
    // Slate background with subtle vignette
    ctx.fillStyle = "#2a333c";
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    const g = ctx.createRadialGradient(
      canvas.width / 2, canvas.height / 2, Math.min(canvas.width, canvas.height) * 0.2,
      canvas.width / 2, canvas.height / 2, Math.max(canvas.width, canvas.height) * 0.75
    );
    g.addColorStop(0, "rgba(255,255,255,0.03)");
    g.addColorStop(1, "rgba(0,0,0,0.28)");
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    // faint chalk grid
    ctx.strokeStyle = "rgba(230,230,225,0.045)";
    ctx.lineWidth = 1;
    ctx.beginPath();
    for (let x = 0; x <= cols; x++) {
      ctx.moveTo(x * CELL + 0.5, 0);
      ctx.lineTo(x * CELL + 0.5, rows * CELL);
    }
    for (let y = 0; y <= rows; y++) {
      ctx.moveTo(0, y * CELL + 0.5);
      ctx.lineTo(cols * CELL, y * CELL + 0.5);
    }
    ctx.stroke();

    const flicker = 0.85 + 0.15 * Math.sin(t * 0.02);

    for (let y = 0; y < rows; y++) {
      for (let x = 0; x < cols; x++) {
        const i = y * cols + x;
        const st = grid[i];
        if (st === EMPTY) continue;
        const px = x * CELL;
        const py = y * CELL;

        if (st === TREE) {
          // little chalk tree: triangle crown + trunk
          ctx.strokeStyle = "rgba(127,214,160,0.9)";
          ctx.fillStyle = "rgba(127,214,160,0.28)";
          ctx.lineWidth = 1.4;
          ctx.beginPath();
          ctx.moveTo(px + CELL * 0.5, py + 1.5);
          ctx.lineTo(px + CELL - 2, py + CELL - 3.5);
          ctx.lineTo(px + 2, py + CELL - 3.5);
          ctx.closePath();
          ctx.fill();
          ctx.stroke();
          ctx.beginPath();
          ctx.moveTo(px + CELL * 0.5, py + CELL - 3.5);
          ctx.lineTo(px + CELL * 0.5, py + CELL - 1);
          ctx.stroke();
        } else if (st === SPROUT) {
          const prog = 1 - Math.max(0, sproutT[i]) / SPROUT_TO_TREE[1];
          const h = 2 + prog * (CELL - 5);
          ctx.strokeStyle = "rgba(201,240,110,0.95)";
          ctx.lineWidth = 1.3;
          ctx.beginPath();
          ctx.moveTo(px + CELL * 0.5, py + CELL - 1);
          ctx.lineTo(px + CELL * 0.5, py + CELL - 1 - h);
          ctx.stroke();
          ctx.beginPath();
          ctx.arc(px + CELL * 0.5, py + CELL - 1 - h - 1.5, 2 + prog * 2.5, 0, Math.PI * 2);
          ctx.stroke();
        } else if (st === BURN) {
          // flickering chalk flame
          const f = 0.75 + 0.25 * Math.sin(t * 0.03 + i * 1.3);
          const a = 0.55 + 0.45 * f;
          ctx.fillStyle = "rgba(255,179,71," + (0.35 * f * flicker) + ")";
          ctx.fillRect(px, py, CELL, CELL);
          ctx.strokeStyle = "rgba(255,220,150," + a + ")";
          ctx.lineWidth = 2;
          ctx.beginPath();
          ctx.moveTo(px + CELL * 0.5, py + CELL - 2);
          ctx.quadraticCurveTo(px + CELL - 2, py + CELL * 0.5,
                               px + CELL * 0.5 + (f - 0.5) * 3, py + 1.5);
          ctx.quadraticCurveTo(px + 2, py + CELL * 0.5, px + CELL * 0.5, py + CELL - 2);
          ctx.stroke();
          ctx.strokeStyle = "rgba(255,255,255," + (0.6 * f) + ")";
          ctx.lineWidth = 1.2;
          ctx.beginPath();
          ctx.moveTo(px + CELL * 0.5, py + CELL - 3.5);
          ctx.quadraticCurveTo(px + CELL * 0.8, py + CELL * 0.5, px + CELL * 0.5, py + 4.5);
          ctx.stroke();
        } else if (st === EMBER) {
          const pulse = 0.5 + 0.5 * Math.sin(t * 0.05 + i);
          ctx.strokeStyle = "rgba(217,107,74," + (0.45 + 0.4 * pulse) + ")";
          ctx.lineWidth = 1.4;
          ctx.beginPath();
          ctx.arc(px + CELL * 0.5, py + CELL * 0.5, 2.5 + pulse * 1.5, 0, Math.PI * 2);
          ctx.stroke();
          // tiny smoke squiggle
          ctx.strokeStyle = "rgba(220,220,215," + (0.15 + 0.1 * pulse) + ")";
          ctx.lineWidth = 1;
          ctx.beginPath();
          ctx.moveTo(px + CELL * 0.5, py + 3);
          ctx.quadraticCurveTo(px + CELL * 0.3, py, px + CELL * 0.55, py - 2);
          ctx.stroke();
        }
      }
    }
  }

  function resize() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
  }
  window.addEventListener("resize", resize);

  resize();
  init();
  window.addEventListener("resize", function () {
    // preserve forest on resize: just re-init cleanly (simple, still self-running)
    resize();
    init();
  });

  let last = performance.now();
  let acc = 0;

  function loop(t) {
    acc += t - last;
    last = t;
    if (acc > 200) acc = 200;
    while (acc >= TICK_MS) {
      step();
      acc -= TICK_MS;
    }
    render(t);
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Cosmographic Orrery — a Clockwork Solar System</title>
<style>
  html,body{margin:0;padding:0;height:100%;background:#141008;overflow:hidden}
  canvas{display:block}
</style>
</head>
<body>
<canvas id="c"></canvas>
<noscript style="color:#caa"><div style="font-family:serif;text-align:center;padding-top:4em">
This engraving requires JavaScript to turn its wheels.</div></noscript>
<script>
(function(){
'use strict';
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
const bg = document.createElement('canvas');
const bctx = bg.getContext('2d');

const W = 1060;                 // world size (square)
const MCX = 530, MCY = 540;     // mechanism centre in world coords
const K = 0.9;                  // mechanism scale
const PI = Math.PI, TAU = PI*2;
const DEG = d => d*PI/180;

/* ------------------------------------------------------------------ *
 *  DETERMINISTIC JITTER  (the "hand" of the draughtsman)             *
 * ------------------------------------------------------------------ */
let boil = 0;                    // advances ~7×/s  →  boiling linework
function h1(n){ const s = Math.sin(n*127.1 + 311.7)*43758.5453; return s - Math.floor(s); }
function jit(seed, amp){ return (h1(seed + boil*1299707) - 0.5)*2*(amp===undefined?0.6:amp); }

function ink(g, a, w, col){
  g.strokeStyle = col || 'rgba(60,45,22,'+a+')';
  g.lineWidth = w;
}
function wline(g, x1,y1,x2,y2, seed, amp){
  const dx=x2-x1, dy=y2-y1, d=Math.hypot(dx,dy)||1;
  const n=Math.max(2, Math.ceil(d/9));
  const nx=-dy/d, ny=dx/d;
  g.beginPath();
  g.moveTo(x1+jit(seed,amp), y1+jit(seed+1,amp));
  for(let i=1;i<=n;i++){
    const t=i/n;
    g.lineTo(x1+dx*t + jit(seed+i*13,amp)*nx, y1+dy*t + jit(seed+i*17+5,amp)*ny);
  }
  g.stroke();
}
function wcirc(g, x,y,r, seed, amp){
  const n=Math.max(12, Math.round(r*0.5));
  g.beginPath();
  for(let i=0;i<=n;i++){
    const a=i/n*TAU, rr=r+jit(seed+i*7, amp===undefined?0.5:amp);
    const px=x+Math.cos(a)*rr, py=y+Math.sin(a)*rr;
    i?g.lineTo(px,py):g.moveTo(px,py);
  }
  g.stroke();
}
function rivet(g, x,y,r, seed){
  ink(g,0.85,0.9);
  wcirc(g,x,y,r,seed,0.25);
  g.fillStyle='rgba(60,45,22,0.85)';
  g.beginPath(); g.arc(x,y,r*0.35,0,TAU); g.fill();
}
/* radial hatching fan (shading) */
function crescentHatch(g,x,y,r,ang,n,seed,al,al2){
  n=n||6; al=al===undefined?0.5:al;
  ink(g,al,0.65);
  g.beginPath();
  for(let k=0;k<n;k++){
    const a=ang+(k/(n-1)-0.5)*1.9;
    const j1=(h1(seed+k*11+boil*13)-.5)*.9, j2=(h1(seed+k*17+boil*17)-.5)*.9;
    g.moveTo(x+Math.cos(a)*r*0.30+j1, y+Math.sin(a)*r*0.30+j2);
    g.lineTo(x+Math.cos(a)*r*0.96+j2, y+Math.sin(a)*r*0.96+j1);
  }
  g.stroke();
  if(al2){ ink(g,al2,0.5); g.beginPath();
    for(let k=0;k<n;k++){
      const a=ang+(k/(n-1)-0.5)*1.2;
      const j1=(h1(seed+k*29+boil*7)-.5)*.8, j2=(h1(seed+k*37+boil*5)-.5)*.8;
      g.moveTo(x+Math.cos(a)*r*0.5+j1, y+Math.sin(a)*r*0.5+j2);
      g.lineTo(x+Math.cos(a)*r*0.94+j2, y+Math.sin(a)*r*0.94+j1);
    }
    g.stroke();
  }
}

/* ------------------------------------------------------------------ *
 *  GEAR GEOMETRY  —  one true mechanism                               *
 *                                                                    *
 *   • six fixed engraved track-rings (internal teeth)                 *
 *   • planet wheels (r=18, mod 4) ROLL without slip on those rings   *
 *       → spin ωs = w·(Rin−18)/18  (visible fast spin)               *
 *   • arms turn at w_i; arm-shaft hubs (coaxial at centre) turn at    *
 *       the same w_i                                                  *
 *   • a chain of compound drive-wheels (big wheel meshes its hub,     *
 *       a coaxial pinion hands the motion to the next wheel through   *
 *       an odd-toothed idler) — ratios work out exactly:             *
 *           ωF_i = k / rf_i ,  chain ratio rf_i/rf_{i+1}  ✓          *
 *   • a small escapement pinion (with crank & pawl) drives the       *
 *     innermost compound wheel                                        *
 *   • moon pinions mesh in each planet wheel:                        *
 *           ωm = [ ωrel(18+rm) − 18·ωs ] / rm                        *
 * ------------------------------------------------------------------ */
const RP = 18, PG = TAU/9;             // planet-wheel pitch radius / tooth pitch
const ORBITS=[170,230,290,350,410,470];
const RH  =[40,41.7,43,45.3,56.7,68];  // hub radii (∝ √period, compressed Kepler)
const RF  =[26,22,18,14,10,8];         // big drive-wheel radii
const RID =[9,8.5,7,7,7];              // idler radii
const NAMES=['MERCVRY','VENVS','TERRA','MARS','IOVIS','SATVRNVS'];
const PSIZE=[4.5,6.5,7,5.5,12.5,10.5];
const PPERIOD=['88 DIES','225 DIES','365 DIES','687 DIES','4333 DIES','10759 DIES'];
const LBLANG=[DEG(330),DEG(210),DEG(15),DEG(280),DEG(350),DEG(160)];
const MOONS=[
  null, null,
  [{rm:10,teeth:5,size:3.2,rel:8, des:DEG(20)}],
  [{rm:8, teeth:4,size:2.4,rel:10,des:DEG(150)}],
  [{rm:8, teeth:4,size:2.8,rel:8, des:DEG(320)},
   {rm:8, teeth:4,size:2.8,rel:5, des:DEG(80)}],
  [{rm:8, teeth:4,size:3.0,rel:4, des:DEG(250)}]
];
const W6 = 0.045;   // Saturn's arm speed (units/s) — the rest follow from the train

const P=[];
for(let i=0;i<6;i++){
  const rh=RH[i], rf=RF[i];
  const Rin=ORBITS[i]+RP;
  P.push({
    i, name:NAMES[i], orbit:ORBITS[i], size:PSIZE[i],
    Rin, w: W6*68/rh,                       // arm speed  (w_i·r_hub_i = const)
    nh: Math.round(rh/2),                   // hub teeth (mod 4)
    nhf: rf/2,                              // drive-wheel teeth (mod 4)
    nph: rf/2,                              // pinion teeth (mod 2)
    D: rh+rf,                               // drive-wheel centre distance from C
    om: -W6*68/rf,                          // drive-wheel speed  (k/rf)
    os: W6*68/rh*(Rin-RP)/RP                // planet-wheel roll speed
  });
}
/* ---- place the drive chain around the bottom-left arc ---- */
const F=[0,1,2,3,4,5].map(i=>({x:0,y:0,ang:PI/2}));
F[0].ang=PI/2;
for(let i=0;i<5;i++){
  const ch=(RF[i]+RF[i+1])/2 + 2*RID[i];
  const d=2*Math.asin(Math.min(0.999,ch/(2*Math.sqrt(P[i].D*P[i+1].D))));
  F[i+1].ang=F[i].ang+d;
}
F.forEach((f,i)=>{ f.x=Math.cos(f.ang)*P[i].D; f.y=Math.sin(f.ang)*P[i].D; });
const I=[]; const ALPHA=[];
for(let i=0;i<5;i++){
  const dx=F[i+1].x-F[i].x, dy=F[i+1].y-F[i].y, d=Math.hypot(dx,dy);
  const a=Math.atan2(dy,dx); ALPHA.push(a);
  I.push({x:F[i].x+dx/d*(RF[i]/2+RID[i]), y:F[i].y+dy/d*(RF[i]/2+RID[i]),
          r:RID[i], teeth:[9,9,7,7,7][i]});
}
const MOTOR={x:Math.cos(PI/2)*P[0].D + Math.cos(PI/2)*(RF[0]/2+10),
             y:Math.sin(PI/2)*P[0].D + Math.sin(PI/2)*(RF[0]/2+10),
             r:10, teeth:10, om:-P[0].om*(RF[0]/2)/10};

/* ---- mesh phases (initial tooth/gap alignment) ---- */
for(let i=0;i<6;i++){
  const p=P[i], f=F[i], pF=TAU/p.nhf;
  const c1=f.ang+PI, c2=f.ang+PI+(TAU/p.nh)/2;
  const s=a=>{ a=((a%p.pr0+ (p.pr0=p.pr0||p.pr))*0+p.pr0); a=((a% (TAU/Math.round(p.Rin/2)))+ (TAU/Math.round(p.Rin/2)))% (TAU/Math.round(p.Rin/2)); return Math.min(a,(TAU/Math.round(p.rin2=0)||0)||0,1); };
  // simpler signed-distance helper:
  const pr=TAU/Math.round(p.Rin/2);
  const sd=a=>{ a=((a%pr)+pr)%pr; return Math.min(a,pr-a); };
  let arm0, hubTooth;
  if(sd(c1)<=sd(c2)){ arm0=c1; hubTooth=true; } else { arm0=c2; hubTooth=false; }
  p.arm0=arm0;
  p.hubRef=arm0 + (hubTooth?0:(TAU/p.nh)/2);
  f.toothRef=(hubTooth? f.ang+PI+pF/2 : f.ang+PI);
  p.pr=pr;
}
/* pinion & idler phases (contacts along the chain chords) */
for(let i=0;i<6;i++) F[i].pinRef = i<5 ? ALPHA[i] : (i>0 ? ALPHA[i-1]+PI : PI/2);
F[0].pinRef=ALPHA[0];
MOTOR.toothRef=PI/2 + TAU/MOTOR.teeth/2;
I.forEach((id,i)=>{ id.toothRef = ALPHA[i]+PI + TAU/(2*id.teeth); });
/* planet-wheel + moon phases */
for(let i=0;i<6;i++){
  const p=P[i];
  const ms=MOONS[i]||[];
  if(ms.length){
    const m=ms[0];
    const base=p.arm0+PI+PG/2;
    m.psi0=base + Math.round((m.des-base)/PG)*PG;
    p.pgRef=m.psi0 - Math.round(m.psi0/PG)*PG;   // planet tooth exactly at first moon
  } else {
    p.pgRef=p.arm0+PI+PG/2 - Math.round((p.arm0+PI+PG/2)/PG)*PG;
  }
  ms.forEach(m=>{
    m.dist=RP+m.rm;
    m.pm=TAU/m.teeth;
    m.om=(m.rel*p.w*(RP+m.rm) - RP*p.os)/m.rm;
    m.th0=m.psi0+PI+m.pm/2;
  });
}

/* ------------------------------------------------------------------ *
 *  COMETS                                                             *
 * ------------------------------------------------------------------ */
const COMETS=[
  {a:330,e:0.70,rot:DEG(105),T:78, ph:0.10,L:150},
  {a:375,e:0.78,rot:DEG(250),T:118,ph:0.62,L:95}
];
function cometXY(c,tt){
  let M=((tt/c.T + c.ph)%1+1)%1*TAU;
  let E=M;
  for(let k=0;k<7;k++) E-=(E-c.e*Math.sin(E)-M)/(1-c.e*Math.cos(E));
  const x=c.a*(Math.cos(E)-c.e), y=c.a*Math.sqrt(1-c.e*c.e)*Math.sin(E);
  return [x*Math.cos(c.rot)-y*Math.sin(c.rot), x*Math.sin(c.rot)+y*Math.cos(c.rot)];
}

/* ------------------------------------------------------------------ *
 *  STATIC LAYER  (paper, frame, engraved track-rings, labels)         *
 * ------------------------------------------------------------------ */
let dpr=1, sc=1, ox=0, oy=0;
function fit(){
  dpr=Math.min(2, window.devicePixelRatio||1);
  const w=innerWidth, h=innerHeight;
  cv.width=w*dpr; cv.height=h*dpr;
  cv.style.width=w+'px'; cv.style.height=h+'px';
  bg.width=cv.width; bg.height=cv.height;
  sc=Math.min(w,h)/W; ox=(w-W*sc)/2; oy=(h-W*sc)/2;
  renderBG();
}
function T(g){ g.setTransform(dpr*sc,0,0,dpr*sc,dpr*ox,dpr*oy); }
function Tm(g){ T(g); g.translate(MCX,MCY); g.scale(K,K); }   // mechanism space

function renderBG(){
  const g=bctx; boil=0;
  T(g);
  /* paper */
  let gr=g.createRadialGradient(MCX,MCY,60,MCX,MCY,780);
  gr.addColorStop(0,'#ecdfbe'); gr.addColorStop(0.7,'#e0d0a9'); gr.addColorStop(1,'#c8b184');
  g.fillStyle=gr; g.fillRect(0,0,W,W);
  for(let i=0;i<9;i++){                       // soft mottling
    const x=h1(i*3+1)*W, y=h1(i*7+2)*W, r=120+h1(i*11+3)*220;
    gr=g.createRadialGradient(x,y,0,x,y,r);
    gr.addColorStop(0,'rgba(120,95,50,0.05)'); gr.addColorStop(1,'rgba(120,95,50,0)');
    g.fillStyle=gr; g.fillRect(x-r,y-r,r*2,r*2);
  }
  g.fillStyle='rgba(90,70,35,0.05)';
  for(let i=0;i<2400;i++){
    const x=h1(i*1.3)*W, y=h1(i*2.7+9)*W, s=0.4+h1(i*3.1)*1.3;
    g.fillRect(x,y,s,s);
  }
  g.fillStyle='rgba(255,248,225,0.06)';
  for(let i=0;i<1400;i++){
    const x=h1(i*4.7+40)*W, y=h1(i*5.9+41)*W;
    g.fillRect(x,y,0.8,0.8);
  }

  /* degree ring */
  g.save(); g.translate(MCX,MCY);
  for(let d=0; d<360; d+=3){
    const a=DEG(d), big=d%90===0, mid=d%15===0;
    const l=big?13:mid?8:5, r1=big?452:456, r2=452+l;
    ink(g, big?0.55:mid?0.4:0.28, 0.8);
    g.beginPath();
    g.moveTo(Math.cos(a)*r1,Math.sin(a)*r1);
    g.lineTo(Math.cos(a)*r2,Math.sin(a)*r2);
    g.stroke();
  }
  g.restore();

  /* frame */
  ink(g,0.9,2);
  wline(g,16,16,W-16,16,11,0.8); wline(g,W-16,16,W-16,W-16,12,0.8);
  wline(g,W-16,W-16,16,W-16,13,0.8); wline(g,16,W-16,16,16,14,0.8);
  ink(g,0.75,1.1);
  wline(g,26,26,W-26,26,21,0.7); wline(g,W-26,26,W-26,W-26,22,0.7);
  wline(g,W-26,W-26,26,W-26,23,0.7); wline(g,26,W-26,26,26,24,0.7);
  /* hatched band between the borders */
  ink(g,0.22,0.7); g.beginPath();
  for(let x=30;x<W-30;x+=9){ g.moveTo(x,17.5); g.lineTo(x+5,24.5); }
  for(let x=30;x<W-30;x+=9){ g.moveTo(x,W-17.5); g.lineTo(x+5,W-24.5); }
  for(let y=30;y<W-30;y+=9){ g.moveTo(17.5,y); g.lineTo(24.5,y+5); }
  for(let y=30;y<W-30;y+=9){ g.moveTo(W-17.5,y); g.lineTo(W-24.5,y+5); }
  g.stroke();
  /* corner ornaments + rivets */
  [[36,36,1,1],[W-36,36,-1,1],[36,W-36,1,-1],[W-36,W-36,-1,-1]].forEach(c=>{
    ink(g,0.7,1);
    wline(g,c[0],c[1],c[0]+18*c[2],c[1]+18*c[3],c[0],0.5);
    wline(g,c[0]+8, c[1]+c[3]*4, c[0]+c[2]*4, c[1]+8, c[1],0.5);
    wline(g,c[0]+14,c[1]+c[3]*6, c[0]+c[2]*6, c[1]+14, c[2],0.5);
    rivet(g,c[0],c[1],3,c[0]+c[1]);
  });

  /* ---- engraved fixed track-rings (mechanism space) ---- */
  Tm(g);
  for(let i=0;i<6;i++){
    const p=P[i], Rin=p.Rin, nr=Math.round(Rin/2), pr=TAU/nr;
    ink(g,0.85,1.2);  wcirc(g,0,0,Rin, 300+i*7, 0.6);
    ink(g,0.8, 1.0);  wcirc(g,0,0,Rin+13, 320+i*7, 0.6);
    ink(g,0.3, 0.6);  wcirc(g,0,0,Rin+6, 340+i*7, 0.5);
    /* internal teeth */
    ink(g,0.85,1.0);
    g.beginPath();
    for(let k=0;k<nr;k++){
      const a=k*pr, ca=Math.cos(a), sa=Math.sin(a);
      const j=(h1(400+i*57+k*3)-0.5)*0.9;
      g.moveTo(ca*(Rin+1.5)+sa*j, sa*(Rin+1.5)-ca*j);
      g.lineTo(ca*(Rin-3.4)+sa*j, sa*(Rin-3.4)-ca*j);
    }
    g.stroke();
    /* hatch ticks on outer lip */
    ink(g,0.25,0.6);
    g.beginPath();
    for(let k=0;k<nr;k+=2){
      const a=k*pr+pr/2, ca=Math.cos(a), sa=Math.sin(a);
      g.moveTo(ca*(Rin+13), sa*(Rin+13));
      g.lineTo(ca*(Rin+8.5), sa*(Rin+8.5));
    }
    g.stroke();
    /* faint dotted orbit path */
    g.save(); g.setLineDash([1,5]); ink(g,0.35,0.7);
    wcirc(g,0,0,p.orbit, 360+i*7, 0.35);
    g.restore();
  }
  /* comet orbit paths */
  g.save(); g.setLineDash([3,6]);
  COMETS.forEach((c,ci)=>{
    ink(g,0.3,0.7);
    g.beginPath();
    for(let k=0;k<=72;k++){
      const E=k/72*TAU;
      const x=c.a*(Math.cos(E)-c.e), y=c.a*Math.sqrt(1-c.e*c.e)*Math.sin(E);
      const px=x*Math.cos(c.rot)-y*Math.sin(c.rot), py=x*Math.sin(c.rot)+y*Math.cos(c.rot);
      k?g.lineTo(px,py):g.moveTo(px,py);
    }
    g.stroke();
    const [ax,ay]=cometXY(c, (1-c.ph)/2);      // aphelion label
    g.setLineDash([]);
    g.fillStyle='rgba(60,45,22,0.4)';
    g.font='italic 11px Georgia, serif';
    g.textAlign='center';
    g.fillText(ci? 'COMES MINOR' : 'COMES HALLEYANA', ax*1.06, ay*1.06);
  });
  g.restore();
  /* decorative coiled mainspring */
  g.save(); g.translate(-34,104);
  ink(g,0.4,0.7);
  g.beginPath();
  for(let a=0;a<5*PI;a+=0.15){
    const r=1.5+a*1.35;
    const px=Math.cos(a)*r, py=Math.sin(a)*r;
    a?g.lineTo(px,py):g.moveTo(px,py);
  }
  g.stroke(); rivet(g,0,0,2.2,99);
  g.restore();
  /* planet labels */
  g.textAlign='center';
  for(let i=0;i<6;i++){
    const p=P[i], a=LBLANG[i], r=p.orbit+20;
    const lx=Math.cos(a)*r, ly=Math.sin(a)*r;
    ink(g,0.5,0.7);
    wline(g,Math.cos(a)*p.orbit,Math.sin(a)*p.orbit,lx-Math.cos(a)*8,ly-Math.sin(a)*8,500+i,0.4);
    g.fillStyle='rgba(60,45,22,0.16)'; g.beginPath(); g.arc(Math.cos(a)*p.orbit,Math.sin(a)*p.orbit,1.6,0,TAU); g.fill();
    g.fillStyle='rgba(60,45,22,0.85)';
    g.font='13px Georgia, serif';
    try{ g.letterSpacing='2px'; }catch(e){}
    g.fillText(p.name,lx,ly);
    g.font='italic 10px Georgia, serif';
    g.fillStyle='rgba(60,45,22,0.5)';
    g.fillText(PPERIOD[i],lx,ly+12);
    try{ g.letterSpacing='0px'; }catch(e){}
  }
  /* title plate */
  const px=300, pw=460, py=28, ph=58;
  g.fillStyle='rgba(240,229,198,0.75)';
  g.fillRect(px,py,pw,ph);
  ink(g,0.85,1.4);
  wline(g,px,py,px+pw,py,71,0.6); wline(g,px+pw,py,px+pw,py+ph,72,0.6);
  wline(g,px+pw,py+ph,px,py+ph,73,0.6); wline(g,px,py+ph,px,py,74,0.6);
  ink(g,0.5,0.8);
  wline(g,px+5,py+5,px+pw-5,py+5,81,0.5); wline(g,px+pw-5,py+5,px+pw-5,py+ph-5,82,0.5);
  wline(g,px+pw-5,py+ph-5,px+5,py+ph-5,83,0.5); wline(g,px+5,py+ph-5,px+5,py+5,84,0.5);
  rivet(g,px+9,py+9,2.4,85); rivet(g,px+pw-9,py+9,2.4,86);
  rivet(g,px+pw-9,py+ph-9,2.4,87); rivet(g,px+9,py+ph-9,2.4,88);
  g.fillStyle='rgba(60,45,22,0.9)'; g.textAlign='center';
  g.font='19px Georgia, serif';
  try{ g.letterSpacing='5px'; }catch(e){}
  g.fillText('THE COSMOGRAPHIC ORRERY',W/2,py+26);
  g.font='italic 10px Georgia, serif';
  try{ g.letterSpacing='2px'; }catch(e){}
  g.fillStyle='rgba(60,45,22,0.6)';
  g.fillText('ORBIS SOLIS ET PLANETARVM  ·  MECHANISMVS CÆLESTIS  ·  MDCCXXVII',W/2,py+44);
  try{ g.letterSpacing='0px'; }catch(e){}
  /* corner captions */
  g.font='italic 12px Georgia, serif'; g.fillStyle='rgba(60,45,22,0.55)';
  g.textAlign='left';  g.fillText('Fig. I — De Motu Cælesti Machinæ',44,1016);
  g.textAlign='right'; g.fillText('Six wheels, five idlers, one spring',1016,1016);

  /* vignette */
  boil=0;
  gr=g.createRadialGradient(MCX,MCY,300,MCX,MCY,760);
  gr.addColorStop(0,'rgba(90,66,30,0)'); gr.addColorStop(1,'rgba(70,50,22,0.30)');
  g.fillStyle=gr; g.fillRect(0,0,W,W);
}

/* ------------------------------------------------------------------ *
 *  DYNAMIC PARTS                                                      *
 * ------------------------------------------------------------------ */
const FILL='rgba(241,231,202,0.82)';
function drawGear(g,x,y,r,mod,teeth,ref,seed,spokes){
  const pp=TAU/teeth, root=r-mod*0.5, tip=r+mod*0.8;
  g.fillStyle=FILL;
  g.beginPath(); g.arc(x,y,root,0,TAU); g.fill();
  ink(g,0.9,Math.max(0.8,mod*0.42));
  g.beginPath();
  for(let k=0;k<teeth;k++){
    const a=ref+k*pp, ca=Math.cos(a), sa=Math.sin(a);
    const j=(h1(seed+k*31+boil*127)-.5)*0.9;
    g.moveTo(x+ca*root+sa*j, y+sa*root-ca*j);
    g.lineTo(x+ca*tip +sa*j, y+sa*tip -ca*j);
  }
  g.stroke();
  ink(g,0.9,1.1); wcirc(g,x,y,root,seed,0.5);
  if(r>=13){
    ink(g,0.75,0.9);
    const ns=r>18?5:4;
    for(let k=0;k<ns;k++){
      const a=ref+k*TAU/ns+TAU/(ns*2);
      wline(g,x+Math.cos(a)*r*0.22,y+Math.sin(a)*r*0.22,
            x+Math.cos(a)*(root-1.5),y+Math.sin(a)*(root-1.5),seed+100+k*7,0.4);
    }
    ink(g,0.85,0.9); wcirc(g,x,y,r*0.22,seed+200,0.3);
    rivet(g,x,y,Math.max(1.5,r*0.11),seed+2);
  } else rivet(g,x,y,1.5,seed+2);
  if(spokes!==false && r>=10) crescentHatch(g,x,y,root*0.8,2.5,4,seed+300,0.3);
}
function drawArm(g,x1,y1,x2,y2,seed){
  const dx=x2-x1, dy=y2-y1, d=Math.hypot(dx,dy)||1, nx=-dy/d, ny=dx/d;
  ink(g,0.85,1.1);
  wline(g,x1+nx*1.7,y1+ny*1.7,x2+nx*1.7,y2+ny*1.7,seed,0.4);
  wline(g,x1-nx*1.7,y1-ny*1.7,x2-nx*1.7,y2-ny*1.7,seed+3,0.4);
  ink(g,0.3,0.6);
  wline(g,x1,y1,x2,y2,seed+6,0.4);
}

let t=0, last=performance.now(), lastB=0;
function frame(now){
  const dt=Math.min(0.05,(now-last)/1000); last=now;
  t+=dt*3.0;
  if(now-lastB>135){ boil++; lastB=now; }

  ctx.setTransform(1,0,0,1,0,0);
  ctx.drawImage(bg,0,0);
  const g=ctx; Tm(g);

  /* planet positions */
  const pos=P.map(p=>{
    const a=p.arm0+p.w*t;
    return {a, x:Math.cos(a)*p.orbit, y:Math.sin(a)*p.orbit};
  });

  /* 1 — arms */
  pos.forEach((q,i)=>{
    drawArm(g,Math.cos(q.a)*18,Math.sin(q.a)*18,q.x,q.y,600+i*13);
    ink(g,0.6,0.8);
    wcirc(g,Math.cos(q.a+PI)*24,Math.sin(q.a+PI)*24,3.4,640+i,0.3);
  });

  /* 2 — coaxial hub stack (outermost first) */
  [5,4,3,2,1,0].forEach(i=>{
    const p=P[i], a=p.hubRef+p.w*t;
    drawGear(g,0,0,RH[i],4,p.nh,a,700+i*31,true);
  });

  /* 3 — drive chain: compound wheels + idlers + escapement */
  for(let i=5;i>=0;i--){
    const p=P[i], f=F[i];
    drawGear(g,f.x,f.y,RF[i],4,p.nhf,f.toothRef+f.om*t,800+i*37,true);
    drawGear(g,f.x,f.y,RF[i]/2,2,p.nph,f.pinRef+f.om*t,830+i*37,true);
  }
  I.forEach((id,i)=>{
    drawGear(g,id.x,id.y,id.r,2,id.teeth,id.toothRef-id.om*t,900+i*31,true);
  });
  const ma=MOTOR.toothRef+MOTOR.om*t;
  drawGear(g,MOTOR.x,MOTOR.y,MOTOR.r,2,MOTOR.teeth,ma,960,true);
  /* crank pin */
  const cpx=MOTOR.x+Math.cos(ma)*6.5, cpy=MOTOR.y+Math.sin(ma)*6.5;
  ink(g,0.8,1); wline(g,MOTOR.x,MOTOR.y,cpx,cpy,990,0.3);
  g.fillStyle='rgba(60,45,22,0.8)'; g.beginPath(); g.arc(cpx,cpy,2,0,TAU); g.fill();
  /* escapement pawl */
  const piv={x:MOTOR.x+13,y:MOTOR.y-9}, sw=PI*1.05+Math.sin(t*MOTOR.om*1.6)*0.35;
  ink(g,0.75,1);
  wline(g,piv.x,piv.y,piv.x+Math.cos(sw)*11,piv.y+Math.sin(sw)*11,1010,0.4);
  g.fillStyle='rgba(60,45,22,0.8)';
  g.beginPath(); g.arc(piv.x+Math.cos(sw)*11,piv.y+Math.sin(sw)*11,1.8,0,TAU); g.fill();
  rivet(g,piv.x,piv.y,1.8,1011);

  /* 4 — planet wheels (rolling on the fixed rings) + bodies + moons */
  P.forEach((p,i)=>{
    const q=pos[i];
    drawGear(g,q.x,q.y,RP,4,9,p.pgRef+p.os*t,1100+i*41,true);
    const bodyR=p.size;
    g.fillStyle=FILL;
    g.beginPath(); g.arc(q.x,q.y,bodyR,0,TAU); g.fill();
    ink(g,0.95,1.3); wcirc(g,q.x,q.y,bodyR,1150+i*7,0.35);
    crescentHatch(g,q.x,q.y,bodyR,q.a,7,1160+i*11,0.55,0.3);  // night side
    ink(g,0.5,0.7);                                            // daylight glint
    g.beginPath();
    g.arc(q.x,q.y,bodyR*0.75,q.a+PI-0.7,q.a+PI+0.4); g.stroke();
    if(i===5){                                                 // Saturn's ring
      g.save(); g.translate(q.x,q.y); g.rotate(q.a+0.6);
      ink(g,0.75,0.9);
      g.beginPath(); g.ellipse(0,0,bodyR*1.9,bodyR*0.62,0,0,TAU); g.stroke();
      ink(g,0.35,0.6);
      g.beginPath(); g.ellipse(0,0,bodyR*1.55,bodyR*0.5,0,0,TAU); g.stroke();
      g.restore();
    }
    (MOONS[i]||[]).forEach((m,mi)=>{
      const psi=m.psi0+m.rel*p.w*t;
      const mx=q.x+Math.cos(psi)*m.dist, my=q.y+Math.sin(psi)*m.dist;
      ink(g,0.55,0.8);
      wline(g,q.x,q.y,mx,my,1200+i*9+mi*5,0.35);
      drawGear(g,mx,my,m.rm,4,m.teeth,m.th0+m.om*t,1250+i*11+mi*5,true);
      g.fillStyle=FILL;
      g.beginPath(); g.arc(mx,my,m.size,0,TAU); g.fill();
      ink(g,0.9,0.9); wcirc(g,mx,my,m.size,1300+i+mi,0.25);
      crescentHatch(g,mx,my,m.size,Math.atan2(my,mx),3,1310+i+mi,0.5);
    });
  });

  /* 5 — the sun, crowned on the hub stack */
  const sa=0.03*t;
  g.fillStyle=FILL;
  g.beginPath(); g.arc(0,0,44,0,TAU); g.fill();
  ink(g,0.8,1.1); wcirc(g,0,0,44,2000,0.5);
  for(let k=0;k<6;k++){ const a=sa+k*TAU/6; rivet(g,Math.cos(a)*40,Math.sin(a)*40,1.8,2010+k); }
  ink(g,0.85,1.1);
  for(let k=0;k<14;k++){
    const a=sa*0.6+k*TAU/14, L=(k%2?42:47);
    wline(g,Math.cos(a)*33,Math.sin(a)*33,Math.cos(a)*L,Math.sin(a)*L,2050+k*3,0.4);
  }
  g.fillStyle='rgba(246,236,205,0.95)';
  g.beginPath(); g.arc(0,0,31,0,TAU); g.fill();
  ink(g,0.95,1.4); wcirc(g,0,0,31,2100,0.4);
  crescentHatch(g,0,0,30,2.5,11,2110,0.5,0.35);
  ink(g,0.7,0.9); wcirc(g,0,0,12,2120,0.3);
  g.fillStyle='rgba(60,45,22,0.85)'; g.beginPath(); g.arc(0,0,2.6,0,TAU); g.fill();

  /* 6 — comets */
  COMETS.forEach((c,ci)=>{
    const [x,y]=cometXY(c,t);
    const [x2,y2]=cometXY(c,t-0.05);
    const vx=x-x2, vy=y-y2, vr=Math.hypot(vx,vy)||1;
    const r=Math.hypot(x,y)||1, dx=x/r, dy=y/r, px=-dy, py=dx;
    const L=Math.max(8,Math.min(230,c.L*Math.pow(100/r,1.5)));
    /* ion tail */
    for(let k=0;k<10;k++){
      const off=(k-4.5)*0.05;
      const bx=x+dx*7+px*off*26, by=y+dy*7+py*off*26;
      const ex=x+dx*(L*(0.8+0.035*k))+px*(off*70), ey=y+dy*(L*(0.8+0.035*k))+py*(off*70);
      ink(g,0.26*(1-k/13),0.8);
      g.beginPath(); g.moveTo(bx,by);
      g.quadraticCurveTo((bx+ex)/2+px*off*18,(by+ey)/2+py*off*18,ex,ey);
      g.stroke();
    }
    /* dust tail, curved along the path */
    const pts=[[x,y]];
    for(let s=0.5;s<4.4;s+=0.62){ const [qx,qy]=cometXY(c,t-s); pts.push([qx,qy]); }
    for(let k=0;k<pts.length-1;k++){
      ink(g,0.3*(1-k/pts.length),0.9);
      g.beginPath(); g.moveTo(pts[k][0],pts[k][1]); g.lineTo(pts[k+1][0],pts[k+1][1]); g.stroke();
      if(k%2===0){
        ink(g,0.22*(1-k/pts.length),0.6);
        g.beginPath();
        g.moveTo(pts[k][0]+px*3,pts[k][1]+py*3);
        g.lineTo(pts[k][0]-px*3,pts[k][1]-py*3);
        g.stroke();
      }
    }
    /* head */
    const grd=g.createRadialGradient(x,y,0,x,y,13);
    grd.addColorStop(0,'rgba(250,240,208,0.35)'); grd.addColorStop(1,'rgba(250,240,208,0)');
    g.fillStyle=grd; g.beginPath(); g.arc(x,y,13,0,TAU); g.fill();
    for(let k=0;k<6;k++){
      const a=sa*2+k*TAU/6;
      ink(g,0.5,0.7);
      g.beginPath();
      g.moveTo(x+Math.cos(a)*3,y+Math.sin(a)*3);
      g.lineTo(x+Math.cos(a)*8,y+Math.sin(a)*8);
      g.stroke();
    }
    g.fillStyle='rgba(252,244,218,0.95)';
    g.beginPath(); g.arc(x,y,2.6,0,TAU); g.fill();
  });

  requestAnimationFrame(frame);
}

fit();
addEventListener('resize', fit);
requestAnimationFrame(now=>{ last=now; frame(now); });
})();
</script>

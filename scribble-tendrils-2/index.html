<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Ink Bloom</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #fff; }
  canvas { display: block; width: 100vw; height: 100vh; background: #fff; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  'use strict';

  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');

  var W, H, CX, CY, FOCAL;

  function resize() {
    W = canvas.width = window.innerWidth;
    H = canvas.height = window.innerHeight;
    CX = W / 2;
    CY = H / 2;
    FOCAL = Math.max(W, H) * 0.9;
  }
  window.addEventListener('resize', resize);
  resize();

  function rand(a, b) {
    if (b === undefined) { b = a; a = 0; }
    return a + Math.random() * (b - a);
  }

  function norm(v) {
    var l = Math.sqrt(v.x * v.x + v.y * v.y + v.z * v.z) || 1;
    return { x: v.x / l, y: v.y / l, z: v.z / l };
  }

  function randomDir() {
    var theta = rand(Math.PI * 2);
    var phi = Math.acos(rand(-1, 1));
    return {
      x: Math.sin(phi) * Math.cos(theta),
      y: Math.sin(phi) * Math.sin(theta),
      z: Math.cos(phi)
    };
  }

  // Layered-sine "pseudo-noise" stream — cheap, smooth, organic
  function makeNoiseStream() {
    var p = [rand(1000), rand(1000), rand(1000)];
    var q = [rand(1000), rand(1000), rand(1000)];
    return function (t) {
      return {
        x: Math.sin(t * 0.17 + p[0]) * 0.6 + Math.sin(t * 0.043 + q[0]) * 0.4,
        y: Math.sin(t * 0.13 + p[1]) * 0.6 + Math.sin(t * 0.057 + q[1]) * 0.4,
        z: Math.sin(t * 0.11 + p[2]) * 0.6 + Math.sin(t * 0.047 + q[2]) * 0.4
      };
    };
  }

  function rot3(p, ax, ay) {
    var cosX = Math.cos(ax), sinX = Math.sin(ax);
    var y1 = p.y * cosX - p.z * sinX;
    var z1 = p.z * cosX + p.y * sinX;
    var cosY = Math.cos(ay), sinY = Math.sin(ay);
    var x1 = p.x * cosY - z1 * sinY;
    var z2 = z1 * cosY + p.x * sinY;
    return { x: x1, y: y1, z: z2 };
  }

  /* ---------------- Tendril ---------------- */

  function Tendril(origin, heading, opts) {
    this.points = [{ x: origin.x, y: origin.y, z: origin.z }];
    this.heading = norm(heading);
    this.noise = makeNoiseStream();
    this.t = rand(1000);
    this.maxLen = opts.maxLen;
    this.stepLen = opts.stepLen;
    this.turn = opts.turn;
    this.baseW = opts.baseW;
    this.outward = opts.outward;
    this.center = opts.center;
    this.branches = 0;
    this.maxBranches = opts.maxBranches;
    this.done = false;
    this.rotZ = 0; // depth (assigned at draw time for sorting)
  }

  Tendril.prototype.grow = function () {
    if (this.points.length >= this.maxLen) { this.done = true; return; }
    this.t += 1;
    var n = this.noise(this.t);
    var last = this.points[this.points.length - 1];

    var h = {
      x: this.heading.x + n.x * this.turn,
      y: this.heading.y + n.y * this.turn,
      z: this.heading.z + n.z * this.turn
    };
    // gentle bias so tendrils reach away from the core
    h.x += (last.x - this.center.x) * this.outward;
    h.y += (last.y - this.center.y) * this.outward;
    h.z += (last.z - this.center.z) * this.outward;

    this.heading = norm(h);
    this.points.push({
      x: last.x + this.heading.x * this.stepLen,
      y: last.y + this.heading.y * this.stepLen,
      z: last.z + this.heading.z * this.stepLen
    });
  };

  Tendril.prototype.shrink = function () {
    if (this.points.length > 1) {
      this.points.pop();
      this.done = false;
      return true;
    }
    return false;
  };

  /* ---------------- Organism ---------------- */

  function Organism() {
    this.reset();
  }

  Organism.prototype.reset = function () {
    this.center = { x: rand(-170, 170), y: rand(-130, 130), z: rand(-150, 150) };
    this.phase = 'grow';
    this.phaseT = 0;
    this.holdDur = rand(140, 320);
    this.seed = rand(1000);
    this.breathSpeed = rand(0.008, 0.02);
    this.tendrils = [];

    var count = 4 + Math.floor(rand(5));
    for (var i = 0; i < count; i++) {
      this.tendrils.push(new Tendril(
        this.center,
        randomDir(),
        {
          maxLen: 45 + rand(55),
          stepLen: rand(4, 7),
          turn: rand(0.22, 0.5),
          baseW: rand(1.8, 3.4),
          outward: rand(0.0012, 0.004),
          center: this.center,
          maxBranches: Math.random() < 0.75 ? 2 : 0
        }
      ));
    }
  };

  Organism.prototype.update = function () {
    if (this.phase === 'grow') {
      for (var i = 0; i < this.tendrils.length; i++) {
        var t = this.tendrils[i];
        t.grow();

        // chance to sprout a side branch
        if (!t.done && t.points.length > t.maxLen * 0.35 &&
            t.branches < t.maxBranches && Math.random() < 0.012) {
          t.branches++;
          var tip = t.points[t.points.length - 1];
          this.tendrils.push(new Tendril(
            tip,
            {
              x: t.heading.x + rand(-0.7, 0.7),
              y: t.heading.y + rand(-0.7, 0.7),
              z: t.heading.z + rand(-0.7, 0.7)
            },
            {
              maxLen: Math.max(12, t.points.length * rand(0.4, 0.7)),
              stepLen: t.stepLen * 0.85,
              turn: t.turn * 1.2,
              baseW: t.baseW * 0.5,
              outward: t.outward * 1.3,
              center: this.center,
              maxBranches: 0
            }
          ));
        }
      }
      var allDone = this.tendrils.every(function (t) { return t.done; });
      if (allDone) { this.phase = 'hold'; this.phaseT = 0; }

    } else if (this.phase === 'hold') {
      this.phaseT++;
      if (this.phaseT > this.holdDur) { this.phase = 'shrink'; }

    } else { // shrink — reabsorb from the tips
      var any = false;
      for (var s = 0; s < this.tendrils.length; s++) {
        if (this.tendrils[s].points.length > 1) {
          this.tendrils[s].shrink();
          any = true;
        }
      }
      if (!any) this.reset();
    }
  };

  /* ---------------- Rendering ---------------- */

  function project(r) {
    var s = FOCAL / (FOCAL + r.z);
    return { x: CX + r.x * s, y: CY + r.y * s, s: s };
  }

  function drawTendril(t, ax, ay, breath) {
    var pts = t.points;
    if (pts.length < 2) return;

    var P = new Array(pts.length);
    for (var i = 0; i < pts.length; i++) {
      // breathing: whole organism gently swells/contracts
      var px = pts[i].x * breath;
      var py = pts[i].y * breath;
      var pz = pts[i].z * breath;
      P[i] = project(rot3({ x: px, y: py, z: pz }, ax, ay));
      if (i === pts.length - 1) t.rotZ = P[i].s; // near = big s = draw last
    }

    // soft "ink bleed" pass — one faint wide stroke under everything
    ctx.strokeStyle = 'rgba(0,0,0,0.045)';
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    ctx.lineWidth = t.baseW * 2.6 * P[0].s;
    ctx.beginPath();
    ctx.moveTo(P[0].x, P[0].y);
    for (var b = 1; b < P.length; b++) ctx.lineTo(P[b].x, P[b].y);
    ctx.stroke();

    // main pass — tapered, depth-faded ink segments
    ctx.lineCap = 'round';
    var lastW = 1;
    for (var j = 0; j < P.length - 1; j++) {
      var f = j / (P.length - 1);
      var w = (Math.pow(1 - f, 1.7) * t.baseW + 0.3) * P[j].s * 2.2;
      lastW = w;
      var depth = Math.min(1, Math.max(0.25, P[j].s));
      ctx.strokeStyle = 'rgba(0,0,0,' + (0.35 + 0.65 * depth).toFixed(3) + ')';
      ctx.lineWidth = w;
      ctx.beginPath();
      ctx.moveTo(P[j].x, P[j].y);
      ctx.lineTo(P[j + 1].x, P[j + 1].y);
      ctx.stroke();
    }

    // living droplet at the tip
    var tip = P[P.length - 1];
    ctx.fillStyle = 'rgba(0,0,0,0.85)';
    ctx.beginPath();
    ctx.arc(tip.x, tip.y, lastW * 0.85, 0, Math.PI * 2);
    ctx.fill();
  }

  /* ---------------- Scene ---------------- */

  var organisms = [];

  function buildScene() {
    var num = Math.max(4, Math.min(8, Math.round(W * H / 180000)));
    organisms = [];
    for (var i = 0; i < num; i++) organisms.push(new Organism());
  }
  buildScene();

  window.addEventListener('resize', function () { buildScene(); });

  function frame(time) {
    ctx.clearRect(0, 0, W, H);

    var ax = time * 0.00021 + Math.sin(time * 0.00007) * 0.25;
    var ay = time * 0.00034 + Math.cos(time * 0.00005) * 0.3;

    for (var i = 0; i < organisms.length; i++) organisms[i].update();

    // draw core dots (behind far tendrils they'd read as seeds)
    for (var c = 0; c < organisms.length; c++) {
      var o = organisms[c];
      var br = 1 + 0.03 * Math.sin(time * o.breathSpeed + o.seed);
      var p = project(rot3({ x: o.center.x * br, y: o.center.y * br, z: o.center.z * br }, ax, ay));
      ctx.fillStyle = 'rgba(0,0,0,0.9)';
      ctx.beginPath();
      ctx.arc(p.x, p.y, 3 * p.s, 0, Math.PI * 2);
      ctx.fill();
    }

    // collect + depth-sort all tendrils across all organisms
    var all = [];
    for (var a = 0; a < organisms.length; a++) {
      for (var b = 0; b < organisms[a].tendrils.length; b++) {
        all.push({ t: organisms[a].tendrils[b], br: 1 + 0.03 * Math.sin(time * organisms[a].breathSpeed + organisms[a].seed) });
      }
    }
    // initial sort by stored z from previous frame is good enough,
    // then refine by projecting tips once for a stable order
    all.sort(function (m, n) { return m.t.rotZ - n.t.rotZ; });

    for (var d = 0; d < all.length; d++) {
      drawTendril(all[d].t, ax, ay, all[d].br);
    }

    requestAnimationFrame(frame);
  }

  requestAnimationFrame(frame);
})();
</script>
</body>
</html>

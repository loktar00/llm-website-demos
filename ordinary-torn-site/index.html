<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ordinary &mdash; Nothing to see here.</title>
<link rel="icon" href="data:,">
<meta name="description" content="Ordinary is the operations platform for companies that would rather nothing happened.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link data-font rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700;800&family=Instrument+Serif:ital@0;1&display=swap">
<style id="sitecss">
/* ORDINARY - the site itself. Scoped to .o so the same sheet styles the drawn copy (inside the canvas)
   and the invisible interaction copy (in normal flow). Hover / focus come from .hov / .foc classes that
   script mirrors onto both copies, because the drawn copy never receives pointer events. */
.o{--bg:#f3f0e8;--bg2:#ebe7dc;--card:#fbfaf6;--ink:#15171a;--ink2:#3b4047;--mute:#6c7178;--line:#dcd7cb;--line2:#e7e3d9;
  --acc:#ff5b2e;--acc2:#e24716;--grn:#1f3b30;--grn2:#2c5243;--ok:#3f8f5f;--sand:#d9cfb8;
  --sans:"Inter Tight","Inter","Segoe UI",system-ui,-apple-system,Helvetica,Arial,sans-serif;
  --serif:"Instrument Serif",Georgia,"Times New Roman",serif;
  --w:1240px;
  font:400 17px/1.6 var(--sans);color:var(--ink);background:var(--bg);-webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;font-feature-settings:"ss01","cv11";letter-spacing:-.005em}
.o *,.o *::before,.o *::after{box-sizing:border-box}
.o a{color:inherit;text-decoration:none}
.o button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
.o h1,.o h2,.o h3,.o h4,.o p,.o ul,.o ol,.o figure,.o blockquote{margin:0;padding:0}
.o ul,.o ol{list-style:none}
.o em{font-family:var(--serif);font-style:italic;font-weight:400;letter-spacing:-.01em}
.o .wrap{max-width:var(--w);margin:0 auto;padding:0 40px}
.o .eyebrow{display:inline-flex;align-items:center;gap:10px;font:600 12.5px/1 var(--sans);letter-spacing:.14em;text-transform:uppercase;color:var(--mute)}
.o .eyebrow::before{content:"";width:18px;height:1.5px;background:currentColor;opacity:.6}
.o .h2{font:600 clamp(38px,3.9vw,58px)/1.02 var(--sans);letter-spacing:-.035em;margin:18px 0 0}
.o .h2 em{font-size:1.08em}
.o .sub{color:var(--ink2);font-size:18.5px;max-width:34em;margin-top:18px}
.o section{position:relative}
.o .rv{opacity:0;transform:translateY(26px);transition:opacity .9s cubic-bezier(.2,.7,.2,1),transform .9s cubic-bezier(.2,.7,.2,1)}
.o .rv.in{opacity:1;transform:none}
.o .rv.d1{transition-delay:.08s}.o .rv.d2{transition-delay:.16s}.o .rv.d3{transition-delay:.24s}.o .rv.d4{transition-delay:.32s}.o .rv.d5{transition-delay:.40s}

/* buttons */
.o .btn{display:inline-flex;align-items:center;gap:10px;height:52px;padding:0 24px;border-radius:999px;font:600 16px/1 var(--sans);letter-spacing:-.005em;
  background:var(--ink);color:#f7f4ec;transition:transform .25s cubic-bezier(.2,.7,.2,1),background .25s,box-shadow .25s}
.o .btn .ar{display:inline-block;transition:transform .25s cubic-bezier(.2,.7,.2,1)}
.o .btn.hov{transform:translateY(-2px);box-shadow:0 10px 24px -10px rgba(21,23,26,.55)}
.o .btn.hov .ar{transform:translateX(4px)}
.o .btn.acc{background:var(--acc);color:#fff}
.o .btn.acc.hov{background:var(--acc2);box-shadow:0 12px 26px -12px rgba(226,71,22,.7)}
.o .btn.ghost{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--line)}
.o .btn.ghost.hov{box-shadow:inset 0 0 0 1.5px var(--ink);background:rgba(21,23,26,.03)}
.o .btn.sm{height:40px;padding:0 18px;font-size:14.5px}
.o .lnk{font-weight:600;display:inline-flex;align-items:center;gap:8px;border-bottom:1.5px solid transparent;transition:border-color .25s,color .25s}
.o .lnk .ar{transition:transform .25s}
.o .lnk.hov{border-bottom-color:currentColor}
.o .lnk.hov .ar{transform:translateX(4px)}
.o .foc{outline:2.5px solid var(--acc);outline-offset:3px}

/* nav */
.o.nav{position:absolute;left:0;right:0;top:0;height:76px;z-index:5;background:transparent;transition:background .35s,box-shadow .35s,height .35s}
.o.nav.scrolled{background:rgba(243,240,232,.94);box-shadow:0 1px 0 var(--line);height:64px}
.o.nav .wrap{height:100%;display:flex;align-items:center;justify-content:space-between;max-width:1360px}
.o .logo{display:flex;align-items:center;gap:11px;font:700 17px/1 var(--sans);letter-spacing:.16em}
.o .mark{width:24px;height:24px;border-radius:50%;background:var(--ink);position:relative;flex:none}
.o .mark::after{content:"";position:absolute;left:6px;top:6px;width:12px;height:12px;border-radius:50%;background:var(--bg)}
.o .menu{display:flex;gap:34px;font-size:15.5px;font-weight:500;color:var(--ink2)}
.o .menu a{position:relative;padding:6px 0;transition:color .2s}
.o .menu a::after{content:"";position:absolute;left:0;right:0;bottom:0;height:1.5px;background:var(--ink);transform:scaleX(0);transform-origin:left;transition:transform .3s cubic-bezier(.2,.7,.2,1)}
.o .menu a.hov{color:var(--ink)}
.o .menu a.hov::after{transform:scaleX(1)}
.o .navr{display:flex;align-items:center;gap:22px;font-size:15.5px;font-weight:500}
.o .navr .si{color:var(--ink2)}
.o .navr .si.hov{color:var(--ink)}

/* hero */
.o .hero{padding:150px 0 70px;min-height:100vh;display:flex;align-items:center}
.o .hero .wrap{display:grid;grid-template-columns:1.08fr .92fr;gap:64px;align-items:center;max-width:1360px}
.o .pill{display:inline-flex;align-items:center;gap:10px;height:36px;padding:0 16px 0 6px;border-radius:999px;background:var(--card);box-shadow:inset 0 0 0 1px var(--line);font-size:14px;color:var(--ink2);transition:box-shadow .25s}
.o .pill b{height:24px;display:inline-flex;align-items:center;padding:0 10px;border-radius:999px;background:var(--ink);color:#f7f4ec;font-size:12px;font-weight:600;letter-spacing:.02em}
.o .pill.hov{box-shadow:inset 0 0 0 1px var(--ink2)}
.o h1{font:600 clamp(64px,6.7vw,112px)/.94 var(--sans);letter-spacing:-.05em;margin:28px 0 0}
.o h1 em{font-size:1.1em;letter-spacing:-.02em;color:var(--acc)}
.o .lede{font-size:20.5px;line-height:1.55;color:var(--ink2);max-width:30em;margin-top:30px}
.o .ctas{display:flex;gap:14px;margin-top:40px;align-items:center}
.o .trust{display:flex;gap:26px;margin-top:34px;font-size:14.5px;color:var(--mute)}
.o .trust span{display:inline-flex;align-items:center;gap:8px}
.o .trust span::before{content:"";width:15px;height:15px;border-radius:50%;background:radial-gradient(circle at 50% 50%,var(--ok) 0 3px,rgba(63,143,95,.18) 3.5px)}

/* product visual */
.o .vis{position:relative;height:560px}
.o .dash{position:absolute;right:0;top:20px;width:94%;border-radius:18px;background:var(--card);box-shadow:0 0 0 1px var(--line),0 40px 80px -40px rgba(40,34,20,.35),0 18px 40px -24px rgba(40,34,20,.25);overflow:hidden}
.o .dash-top{height:42px;display:flex;align-items:center;gap:16px;padding:0 16px;border-bottom:1px solid var(--line2);background:#f6f4ee}
.o .dots{display:flex;gap:7px}.o .dots i{width:10px;height:10px;border-radius:50%;background:#dcd6c8}
.o .url{font:500 12.5px/1 var(--sans);color:var(--mute);background:#fff;border-radius:7px;padding:7px 14px;box-shadow:inset 0 0 0 1px var(--line2)}
.o .dash-b{padding:24px 26px 26px}
.o .dh{display:flex;justify-content:space-between;align-items:flex-start}
.o .dh small{display:block;font-size:12.5px;color:var(--mute);letter-spacing:.02em}
.o .dh strong{display:flex;align-items:center;gap:10px;font-size:23px;letter-spacing:-.025em;margin-top:5px}
.o .live{width:10px;height:10px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 0 rgba(63,143,95,.5);animation:o-pulse 2.4s infinite}
@keyframes o-pulse{0%{box-shadow:0 0 0 0 rgba(63,143,95,.45)}70%{box-shadow:0 0 0 10px rgba(63,143,95,0)}100%{box-shadow:0 0 0 0 rgba(63,143,95,0)}}
.o .chip{font-size:12.5px;font-weight:500;color:var(--ink2);padding:6px 11px;border-radius:8px;box-shadow:inset 0 0 0 1px var(--line)}
.o .chart{position:relative;margin-top:22px;height:150px;border-radius:12px;background:linear-gradient(180deg,#f9f8f3,#f4f2ea)}
.o .chart svg{position:absolute;inset:0;width:100%;height:100%}
.o .chart .note{position:absolute;left:18px;top:14px;font-size:12px;color:var(--mute)}
.o .chart .tag{position:absolute;right:16px;top:52px;font-size:12px;font-weight:600;background:var(--ink);color:#f7f4ec;padding:5px 9px;border-radius:7px}
.o .kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:16px}
.o .kpis div{border-radius:12px;padding:14px 16px;box-shadow:inset 0 0 0 1px var(--line2)}
.o .kpis small{font-size:12px;color:var(--mute)}
.o .kpis b{display:block;font-size:26px;letter-spacing:-.03em;margin-top:2px}
.o .days{display:grid;grid-template-columns:repeat(30,1fr);gap:4px;margin-top:18px}
.o .days i{height:20px;border-radius:3px;background:#a9c7b2}
.o .days i:nth-child(7n+3){background:#b3cdb9}
.o .daysl{display:flex;justify-content:space-between;font-size:11.5px;color:var(--mute);margin-top:8px}
.o .toast{position:absolute;left:-6%;bottom:36px;width:300px;border-radius:14px;background:#fff;padding:15px 18px;display:flex;gap:13px;align-items:flex-start;
  box-shadow:0 0 0 1px var(--line),0 30px 50px -28px rgba(40,34,20,.45);animation:o-float 6s ease-in-out infinite}
.o .toast .ck{flex:none;width:30px;height:30px;border-radius:9px;background:var(--grn);position:relative}
.o .toast .ck::after{content:"";position:absolute;left:10px;top:7px;width:7px;height:12px;border:solid #e9f1ea;border-width:0 2.2px 2.2px 0;transform:rotate(45deg)}
.o .toast b{display:block;font-size:14.5px;letter-spacing:-.01em}
.o .toast span{font-size:13px;color:var(--mute)}
@keyframes o-float{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}

/* logos */
.o .logos{padding:10px 0 110px}
.o .logos p{text-align:center;font-size:14.5px;color:var(--mute)}
.o .lrow{display:flex;justify-content:space-between;align-items:center;margin-top:30px;color:#77736a;opacity:.9}
.o .lrow span{font-size:24px;letter-spacing:-.02em;transition:color .3s}
.o .lrow span.hov{color:var(--ink)}
.o .l1{font:700 21px var(--sans)!important;letter-spacing:.24em!important}
.o .l2{font:italic 400 29px var(--serif)!important}
.o .l3{font:800 24px var(--sans)!important;letter-spacing:-.06em!important}
.o .l4{font:500 20px ui-monospace,Consolas,monospace!important;letter-spacing:.02em!important}
.o .l5{font:600 23px var(--sans)!important}
.o .l5::first-letter{color:var(--acc)}
.o .l6{font:400 27px var(--serif)!important;letter-spacing:.04em!important}

/* services */
.o .svc{padding:120px 0;background:var(--card);border-top:1px solid var(--line2);border-bottom:1px solid var(--line2)}
.o .sh{display:grid;grid-template-columns:1fr 1fr;gap:60px;align-items:end}
.o .sh .sub{margin:0 0 6px auto}
.o .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;margin-top:70px;background:var(--line2);border-radius:20px;overflow:hidden;box-shadow:0 0 0 1px var(--line2)}
.o .cell{background:var(--card);padding:38px 36px 40px;min-height:290px;display:flex;flex-direction:column;transition:background .35s}
.o .cell.hov{background:#fff}
.o .cell h3{font-size:22px;letter-spacing:-.025em;font-weight:600;margin-top:30px}
.o .cell p{color:var(--ink2);margin-top:10px;font-size:16.5px}
.o .cell .lnk{margin-top:auto;padding-top:24px;font-size:15px;align-self:flex-start}
.o .ico{width:48px;height:48px;border-radius:13px;background:var(--bg);box-shadow:inset 0 0 0 1px var(--line);position:relative;transition:transform .4s cubic-bezier(.2,.7,.2,1),background .35s}
.o .cell.hov .ico{transform:rotate(-8deg) scale(1.06);background:var(--ink)}
.o .ico::before,.o .ico::after{content:"";position:absolute;transition:border-color .35s,background .35s}
.o .i1::before{left:14px;top:14px;width:20px;height:20px;border-radius:50%;border:2px solid var(--ink)}
.o .i2::before{left:13px;top:23px;width:22px;height:2px;background:var(--ink)}
.o .i2::after{left:13px;top:15px;width:22px;height:18px;border:2px solid var(--ink);border-width:2px 0}
.o .i3::before{left:15px;top:13px;width:18px;height:22px;border:2px solid var(--ink);border-radius:9px 9px 4px 4px}
.o .i4::before{left:14px;top:14px;width:20px;height:20px;border:2px solid var(--ink);border-radius:4px}
.o .i4::after{left:21px;top:21px;width:6px;height:6px;border-radius:50%;background:var(--acc)}
.o .i5::before{left:13px;top:13px;width:22px;height:22px;border:2px dashed var(--ink);border-radius:50%}
.o .i6::before{left:13px;top:30px;width:22px;height:2px;background:var(--ink)}
.o .i6::after{left:13px;top:16px;width:8px;height:8px;background:var(--acc);border-radius:2px}
.o .cell.hov .ico::before,.o .cell.hov .ico::after{border-color:#f3f0e8}
.o .cell.hov .i2::before,.o .cell.hov .i6::before{background:#f3f0e8}

/* case study */
.o .case{padding:140px 0}
.o .cs{display:grid;grid-template-columns:1.05fr 1fr;gap:80px;align-items:center;margin-top:60px}
.o .cover{position:relative;height:520px;border-radius:24px;background:var(--grn);color:#e8efe9;overflow:hidden;padding:44px}
.o .cover::before{content:"";position:absolute;inset:0;background:radial-gradient(120% 80% at 90% 0%,rgba(255,255,255,.08),transparent 60%)}
.o .cover .k{position:relative;font-size:13px;letter-spacing:.14em;text-transform:uppercase;opacity:.7}
.o .cover .big{position:relative;font:400 150px/.9 var(--serif);font-style:italic;letter-spacing:-.03em;margin-top:34px}
.o .cover .big small{display:block;font:500 20px/1.3 var(--sans);font-style:normal;letter-spacing:-.01em;opacity:.8;margin-top:14px}
.o .cover svg{position:absolute;left:0;right:0;bottom:0;width:100%;height:150px}
.o .cover .cl{position:absolute;left:44px;bottom:28px;font-size:12.5px;opacity:.6}
.o .cs h3{font:600 38px/1.08 var(--sans);letter-spacing:-.035em}
.o .cs .body{color:var(--ink2);font-size:18px;margin-top:22px}
.o .res{display:grid;grid-template-columns:repeat(3,1fr);gap:0;margin-top:36px;border-top:1px solid var(--line)}
.o .res div{padding:20px 20px 0 0}
.o .res b{display:block;font:600 32px/1 var(--sans);letter-spacing:-.04em}
.o .res span{display:block;font-size:14px;color:var(--mute);margin-top:8px;line-height:1.4}
.o .cs blockquote{margin-top:36px;padding-left:22px;border-left:2px solid var(--acc);font:400 24px/1.35 var(--serif);font-style:italic;color:var(--ink)}
.o .cs cite{display:block;font:500 14.5px var(--sans);font-style:normal;color:var(--mute);margin-top:12px}
.o .cs .lnk{margin-top:34px}

/* numbers */
.o .nums{background:var(--ink);color:#efece4;padding:130px 0}
.o .nums .eyebrow{color:#9a9890}
.o .nums .h2{color:#f7f4ec;max-width:13em}
.o .ngrid{display:grid;grid-template-columns:repeat(4,1fr);margin-top:80px;border-top:1px solid #33363b}
.o .ngrid div{padding:34px 30px 0 0;border-right:1px solid #33363b;margin-right:30px}
.o .ngrid div:last-child{border-right:0}
.o .ngrid b{display:block;font:400 84px/1 var(--serif);font-style:italic;letter-spacing:-.03em;color:#fff}
.o .ngrid b sup{font-size:.42em;vertical-align:.95em;margin-left:4px;font-style:normal;color:var(--acc)}
.o .ngrid span{display:block;margin-top:16px;color:#a5a39b;font-size:16px;max-width:15em}

/* testimonials */
.o .tst{padding:140px 0 120px}
.o .tgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:24px;margin-top:64px}
.o .tc{background:var(--card);border-radius:20px;padding:34px 32px 30px;box-shadow:0 0 0 1px var(--line2);display:flex;flex-direction:column;transition:transform .4s cubic-bezier(.2,.7,.2,1),box-shadow .4s}
.o .tc.hov{transform:translateY(-6px);box-shadow:0 0 0 1px var(--line),0 26px 50px -30px rgba(40,34,20,.4)}
.o .stars{letter-spacing:4px;color:var(--acc);font-size:15px}
.o .tc p{font-size:19px;line-height:1.5;letter-spacing:-.012em;margin-top:18px;color:var(--ink)}
.o .who{display:flex;align-items:center;gap:13px;margin-top:auto;padding-top:28px}
.o .av{width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;font:600 15px var(--sans);color:#fff}
.o .who b{display:block;font-size:15.5px}
.o .who span{font-size:14px;color:var(--mute)}

/* pricing */
.o .price{padding:130px 0;background:var(--bg2);border-top:1px solid var(--line2);border-bottom:1px solid var(--line2)}
.o .ph{text-align:center}
.o .ph .sub{margin:18px auto 0}
.o .toggle{display:inline-flex;margin-top:34px;padding:5px;border-radius:999px;background:var(--bg);box-shadow:inset 0 0 0 1px var(--line);position:relative}
.o .toggle button{position:relative;z-index:1;height:40px;padding:0 20px;border-radius:999px;font-size:15px;font-weight:600;color:var(--mute);transition:color .3s}
.o .toggle button.on{color:#f7f4ec}
.o .toggle button small{font-size:12px;color:var(--acc);margin-left:6px}
.o .toggle button.on small{color:#ffb299}
.o .toggle .knob{position:absolute;top:5px;left:5px;height:40px;border-radius:999px;background:var(--ink);transition:transform .45s cubic-bezier(.2,.8,.2,1),width .45s cubic-bezier(.2,.8,.2,1)}
.o .pgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:24px;margin-top:56px;align-items:stretch}
.o .plan{background:var(--card);border-radius:22px;padding:38px 36px;box-shadow:0 0 0 1px var(--line);display:flex;flex-direction:column}
.o .plan h3{font-size:20px;font-weight:600;letter-spacing:-.02em}
.o .plan .pd{color:var(--mute);font-size:15.5px;margin-top:6px}
.o .amt{display:flex;align-items:baseline;gap:6px;margin-top:28px}
.o .amt b{font:600 60px/1 var(--sans);letter-spacing:-.05em}
.o .amt span{color:var(--mute);font-size:15px}
.o .plan ul{margin-top:28px;border-top:1px solid var(--line2);padding-top:22px;display:grid;gap:13px;font-size:15.5px;color:var(--ink2)}
.o .plan li{display:flex;gap:11px;align-items:flex-start}
.o .plan li::before{content:"";flex:none;width:18px;height:18px;margin-top:3px;border-radius:50%;background:rgba(63,143,95,.14);box-shadow:inset 0 0 0 5.5px transparent;
  background-image:radial-gradient(circle,var(--ok) 0 2.6px,transparent 3px)}
.o .plan .btn{margin-top:34px;justify-content:center}
.o .plan.pop{background:var(--ink);color:#f3f0e8;box-shadow:0 30px 60px -30px rgba(21,23,26,.6);position:relative}
.o .plan.pop .pd,.o .plan.pop .amt span{color:#a5a39b}
.o .plan.pop ul{border-color:#33363b;color:#d6d3cb}
.o .plan.pop .btn{background:var(--acc);color:#fff}
.o .plan.pop .btn.hov{background:var(--acc2)}
.o .plan .badge{position:absolute;top:22px;right:24px;font-size:12px;font-weight:600;padding:6px 11px;border-radius:999px;background:#2a2d31;color:#f3f0e8}
.o .fine{text-align:center;color:var(--mute);font-size:14.5px;margin-top:30px}

/* faq */
.o .faq{padding:140px 0}
.o .fq{display:grid;grid-template-columns:.8fr 1.2fr;gap:80px}
.o .fq .sub{margin-top:22px}
.o .fq .help{margin-top:32px;padding:24px 26px;border-radius:16px;background:var(--card);box-shadow:0 0 0 1px var(--line2);font-size:15.5px;color:var(--ink2)}
.o .fq .help b{display:block;color:var(--ink);font-size:16.5px;margin-bottom:4px}
.o .qa{border-top:1px solid var(--line)}
.o .q{border-bottom:1px solid var(--line)}
.o .q button{width:100%;display:flex;justify-content:space-between;align-items:center;gap:30px;padding:28px 0;text-align:left;font-size:20px;font-weight:600;letter-spacing:-.02em;transition:color .25s}
.o .q button.hov{color:var(--acc2)}

/* newsletter */
.o .news{padding:0 0 140px}

.o .nbox::after{content:"";position:absolute;right:-120px;top:-160px;width:460px;height:460px;border-radius:50%;box-shadow:inset 0 0 0 70px rgba(255,255,255,.07)}
.o .nbox .eyebrow{color:rgba(255,255,255,.75)}
.o .nbox h2{font:600 50px/1.02 var(--sans);letter-spacing:-.04em;margin-top:16px}
.o .nbox p{font-size:18px;opacity:.88;margin-top:16px;max-width:26em}
.o .nform{position:relative;z-index:1}
.o .nrow{display:flex;gap:10px;padding:7px;border-radius:999px;background:#fff;box-shadow:0 20px 40px -24px rgba(90,20,0,.6)}
.o .nrow input{flex:1;min-width:0;border:0;outline:0;background:transparent;font:500 17px var(--sans);color:var(--ink);padding:0 20px;border-radius:999px}
.o .nrow input::placeholder{color:#9b978d}
.o .nrow input.foc{outline:0}
.o .nrow:has(input.foc){box-shadow:0 0 0 3px rgba(255,255,255,.55),0 20px 40px -24px rgba(90,20,0,.6)}
.o .nform small{display:block;margin-top:14px;font-size:14px;opacity:.85;padding-left:20px}
.o .thanks{display:none;font:400 30px/1.2 var(--serif);font-style:italic}
.o .nform.done .nrow,.o .nform.done small{display:none}
.o .nform.done .thanks{display:block}
.o .nrow{position:relative}
.o .caret{display:none;position:absolute;top:50%;left:27px;width:1.6px;height:21px;margin-top:-10.5px;background:var(--ink);animation:o-blink 1.06s steps(1) infinite}
.o .nrow.typing .caret{display:block}
@keyframes o-blink{50%{opacity:0}}

/* footer */
.o .foot{background:var(--bg);border-top:1px solid var(--line);padding:90px 0 40px}
.o .fg{display:grid;grid-template-columns:1.4fr repeat(4,1fr);gap:40px}
.o .fg .tag{margin-top:18px;color:var(--mute);font-size:15.5px;max-width:18em}
.o .status{display:inline-flex;align-items:center;gap:9px;margin-top:26px;font-size:14px;font-weight:500;padding:8px 14px;border-radius:999px;box-shadow:inset 0 0 0 1px var(--line)}
.o .status i{width:8px;height:8px;border-radius:50%;background:var(--ok)}
.o .fg h4{font-size:14px;font-weight:600;letter-spacing:.02em}
.o .fg ul{margin-top:16px;display:grid;gap:11px;font-size:15px;color:var(--ink2)}
.o .fg ul a{transition:color .2s}
.o .fg ul a.hov{color:var(--acc2)}
.o .fbar{display:flex;justify-content:space-between;margin-top:80px;padding-top:26px;border-top:1px solid var(--line);font-size:14px;color:var(--mute)}
.o .fbar span:last-child{display:flex;gap:24px}
.o .wordmark{font:700 min(17.5vw,300px)/.8 var(--sans);letter-spacing:-.07em;color:var(--bg2);text-align:center;margin-top:60px;user-select:none;white-space:nowrap;overflow:hidden}

      <span class="eyebrow rv">Case study</span>
      <h2 class="h2 rv d1" style="max-width:15em">How Plainfield Insurance learned to love <em>the quiet.</em></h2>

        <div class="cover rv">
          <div class="k">Plainfield Insurance &middot; since 2019</div>
          <div class="big">1,284<small>consecutive days without a single interesting incident</small></div>
          <svg viewBox="0 0 600 150" preserveAspectRatio="none" aria-hidden="true"><path d="M0 92 L600 92" stroke="#9fc7ae" stroke-width="2" fill="none" stroke-dasharray="2 7" stroke-linecap="round"/><path d="M0 92 L600 92 L600 150 L0 150Z" fill="rgba(159,199,174,.08)"/></svg>
          <div class="cl">Incident volume, 2019 to today</div>

          <h3 class="rv">Forty offices, nine legacy systems, and one very simple goal: make Monday feel like every other day.</h3>

    for (const [ang, r] of a) out.push(new THREE.Vector2(Math.cos(ang) * r, Math.sin(ang) * r));

// glyph atlas for the conveyor cargo: letters and little page parts being manufactured

  { const [x, y] = cell(); g.fillStyle = '#fff'; g.beginPath(); g.roundRect(x + 10, y + 40, S - 20, 48, 24); g.fill(); }

  { const [x, y] = cell(); g.strokeStyle = '#fff'; g.lineWidth = 8; g.beginPath(); g.roundRect(x + 14, y + 20, S - 28, S - 40, 12); g.stroke();
    g.fillStyle = '#fff'; g.fillRect(x + 28, y + 38, 50, 10); g.fillRect(x + 28, y + 60, 72, 16); }
  { const [x, y] = cell(); g.fillStyle = '#fff'; for (let k = 0; k < 5; k++) { const h = 20 + ((k * 37) % 60); g.fillRect(x + 18 + k * 20, y + 100 - h, 14, h); } }
  { const [x, y] = cell(); g.fillStyle = '#fff'; g.beginPath(); g.roundRect(x + 20, y + 44, 88, 40, 20); g.fill(); g.fillStyle = '#000'; g.beginPath(); g.arc(x + 88, y + 64, 14, 0, TAU); g.fill(); }
  { const [x, y] = cell(); g.fillStyle = '#fff'; g.beginPath(); g.arc(x + S / 2, y + S / 2, 30, 0, TAU); g.fill(); }

}

// ---------------------------------------------------------------- the world
export function createWorld(canvas, opts = {}) {

  const envBuilders = [];

  const tmpM = new THREE.Matrix4(), tmpQ = new THREE.Quaternion(), tmpS = new THREE.Vector3();

  // ============================================================== MACHINE
  const M = new THREE.Scene();
  const FOGC = new THREE.Color().setRGB(0.10, 0.05, 0.065);

  const FOGD = 0.0085;

  const FOG_U = { uFogD: { value: FOGD }, uFogC: { value: new THREE.Vector3(FOGC.r, FOGC.g, FOGC.b) } };

  // colourful studio environment for enamel and metal reflections
  {
    const pm = new THREE.PMREMGenerator(renderer);
    const es = new THREE.Scene();
    const room = new THREE.Mesh(new THREE.SphereGeometry(30, 24, 16), new THREE.ShaderMaterial({
      side: THREE.BackSide,
      vertexShader: 'varying vec3 vP; void main(){ vP = normalize(position); gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.); }',
      fragmentShader: `varying vec3 vP; void main(){ float y = vP.y; vec3 c = mix(vec3(0.03, 0.015, 0.01), vec3(0.015, 0.015, 0.04), smoothstep(-0.3, 0.8, y));
        c += vec3(0.25, 0.12, 0.04) * exp(-abs(y + 0.05) * 9.);
        gl_FragColor = vec4(c, 1.); }`,
    }));
    es.add(room);
    const panel = (col, x, y, z, sx, sy) => {
      const m = new THREE.Mesh(new THREE.PlaneGeometry(sx, sy), new THREE.MeshBasicMaterial({ color: new THREE.Color().setRGB(...col), side: THREE.DoubleSide }));
      m.position.set(x, y, z); m.lookAt(0, 0, 0); es.add(m);
    };
    panel([4.5, 3.4, 2.4], -8, 14, 12, 10, 6);  // warm key softbox, front-top-left
    panel([2.6, 2.0, 1.5], -3, 5, 20, 7, 4);    // soft fill straight behind the camera
    panel([1.2, 1.6, 2.4], 9, -3, 17, 10, 1.2); // cool strip, low right
    panel([2.8, 1.6, 0.8], 6, 12, 16, 1.2, 8);  // warm strip, high right
    panel([3.0, 0.25, 1.8], -18, 2, -4, 3, 14); // magenta
    panel([0.2, 2.0, 2.8], 18, 4, -2, 3, 12);   // cyan
    panel([1.8, 0.7, 0.1], 4, -12, 8, 14, 4);   // saffron floor bounce
    panel([0.9, 0.3, 2.6], 2, 8, -18, 12, 4);   // violet back
    panel([0.2, 2.0, 0.7], 12, 16, 10, 4, 2);   // emerald accent
    for (let i = 0; i < 14; i++) { const a = i * 2.4, e = 0.9 * Math.sin(i * 1.7); panel([12, 11, 10], Math.cos(a) * 20 * Math.cos(e), 20 * Math.sin(e), Math.sin(a) * 20 * Math.cos(e), 0.6, 0.6); }
    pm.dispose();
    // PMREM maps are rendered on the GPU, so they are rebuilt after a context loss
    let rt = null;
    const build = (fresh) => { const g = new THREE.PMREMGenerator(renderer); const n = g.fromScene(es, 0.02); g.dispose(); if (rt && !fresh) rt.dispose(); rt = n; M.environment = rt.texture; };
    build(); envBuilders.push(build);
    disposables.push({ dispose() { if (rt) rt.dispose(); es.traverse((o) => { if (o.geometry) o.geometry.dispose(); if (o.material) o.material.dispose(); }); } });
  }

  M.add(new THREE.HemisphereLight(new THREE.Color().setRGB(0.45, 0.4, 0.75), new THREE.Color().setRGB(0.25, 0.12, 0.05), 0.18));
  const keyLight = new THREE.DirectionalLight(new THREE.Color().setRGB(1.0, 0.8, 0.58), 1.7);

  const topL = new THREE.DirectionalLight(new THREE.Color().setRGB(1.0, 0.72, 0.42), 1.1); topL.position.set(0.2, 1, -0.3); M.add(topL);
  const arcLights = [];
  for (let i = 0; i < 2; i++) { const l = new THREE.PointLight(new THREE.Color().setRGB(0.6, 0.78, 1.0), 0, 40, 2); M.add(l); arcLights.push(l); }
  const accentLights = [
    [[1.0, 0.25, 0.7], [-5.5, 15, 38.5], 26],
    [[1.0, 0.55, 0.15], [0.5, 9, 31.5], 60],
  ].map(([c, p, i]) => { const l = new THREE.PointLight(new THREE.Color().setRGB(...c), i, 28, 2); l.position.set(...p); l.userData.base = i; M.add(l); return l; });

  // ---------------------------------------------------------------- layout
  // The camera starts at C0 looking down -z. Layer A (the working wall) sits ~6.5 units in front of it,
  // layer A2 (circuit boards, valves) just behind, layer B (big machinery) further back, then the hall.
  const C0 = V3(0, 11, 44);
  const ZA = 37.2, ZA2 = 34.6, ZB = 25.5;
  const layerA = new THREE.Group(); M.add(layerA);
  const A_L = new THREE.Group(), A_R = new THREE.Group(); layerA.add(A_L, A_R);
  const B_L = new THREE.Group(), B_R = new THREE.Group(); M.add(B_L, B_R);

  const sideB = (x) => (x < 0 ? B_L : B_R);

  const pathPts = [
    [0, 11, 42.5], [0, 10.6, 30], [0, 9.9, 14], [0, 9.7, -14], [-3.2, 8.8, -52], [3.4, 8.2, -92], [-1.5, 9.6, -135],

  }
  const MX = (x, y, z, rx = 0, ry = 0, rz = 0, sx = 1, sy = sx, sz = sx) => new THREE.Matrix4().compose(V3(x, y, z), new THREE.Quaternion().setFromEuler(new THREE.Euler(rx, ry, rz)), V3(sx, sy, sz));

  // ---------------------------------------------------------------- shared materials
  const matMetal = track(makeMat(U, 1, { color: 0xffffff, metalness: 1, roughness: 0.3, envMapIntensity: 1.1 }, { defines: { INST_ATTR: '' } }));
  const matEnamel = track(makeMat(U, 2, { color: 0xffffff, metalness: 0, roughness: 0.3, envMapIntensity: 1.0, clearcoat: 1, clearcoatRoughness: 0.08 }, { physical: true, defines: { INST_ATTR: '' } }));
  const matIron = track(makeMat(U, 1, { color: 0xffffff, metalness: 1, roughness: 0.4, envMapIntensity: 0.9 }, { p: [2, 0.6, 0.1, 1], rim: 0.35 }));
  const matBrass = track(makeMat(U, 1, { color: 0xffffff, metalness: 1, roughness: 0.3, envMapIntensity: 1.1 }, { p: [0, 0.1, 0.4, 1] }));
  const matGold = track(makeMat(U, 1, { color: 0xffffff, metalness: 1, roughness: 0.25, envMapIntensity: 1.2 }, { p: [3, 0.1, 0.3, 1] }));
  const matCopper = track(makeMat(U, 1, { color: 0xffffff, metalness: 1, roughness: 0.3, envMapIntensity: 1.1 }, { p: [1, 0.1, 0.4, 1] }));
  const matSteel = track(makeMat(U, 1, { color: 0xffffff, metalness: 1, roughness: 0.18, envMapIntensity: 1.2 }, { p: [2, 0.5, 0.2, 1] }));

    box: track(new THREE.BoxGeometry(1, 1, 1)),
    cyl: track(new THREE.CylinderGeometry(1, 1, 1, 20, 1)),
    cyl8: track(new THREE.CylinderGeometry(1, 1, 1, 10, 1)),

    };

    const add = (u, v, N, layer, phi0, k) => {

  const NS_SMALL = [10, 12, 14, 16, 20, 24];
  const NS_MID = [12, 16, 20, 24, 28, 32, 40];
  const NS_BIG = [20, 28, 32, 40, 48, 60, 72];
  const FRONT = { u: V3(1, 0, 0), v: V3(0, 1, 0), n: V3(0, 0, 1) };

  // ---- the hero assembly behind the rip (layer A local coords; the layer is shifted so it sits at the focus)
  const HERO = V3(0.4, 11.2, ZA);
  const heroAvoid = (u, v, R) => Math.hypot(u - HERO.x, v - HERO.y) < R + 2.2;
  // windows in the wall where the other machinery shows: valve shelves, fluid columns, circuit boards, belts
  const A_VALVES = [[-14.5, 3.2, 7], [5.5, 17.8, 6], [-8, 18.8, 4], [9.5, 4.2, 5]];
  const A_TUBES = [[-16.8, 6, 3.4, 0.36], [-3.4, 1.4, 4.2, 0.3], [12.3, 8.5, 5.4, 0.42], [16.9, 1.2, 4.4, 0.34], [-10.6, 13.8, 3.2, 0.3], [3.9, 14.6, 3.6, 0.28]];
  const A_BOARDS = [[-4, 16.2, 5, 4], [16.3, 14, 4.6, 4.2], [-17, 12.5, 4, 5], [3.3, 4, 3.6, 4.4], [-7.5, 9.5, 3, 2.6]];
  const A_BELTS = [[-20, -1.2, 7.4], [1.2, 20, 15.2]];

  for (const [x, y, w, h] of A_BOARDS) keep.push([x - w * 0.36, x + w * 0.36, y - h * 0.36, y + h * 0.36]);
  for (const [x0, x1, y] of A_BELTS) keep.push([x0, x1, y - 0.45, y + 1.0]);
  const keepAvoid = (u, v, R) => keep.some((k) => u + R * 0.85 > k[0] && u - R * 0.85 < k[1] && v + R * 0.85 > k[2] && v - R * 0.85 < k[3]);
  {
    const circles = [];
    const hp = (x) => (x < HERO.x ? A_L : A_R);
    addTrain({ origin: V3(0, 0, ZA + 0.05), ...FRONT, m: 0.068, count: 5, Ns: [16, 24, 12, 20], firstN: 36, start: [HERO.x - 0.3, HERO.y - 0.2], dir: -0.5, spread: 1.6, bounds: [-40, 40, -40, 40], circles, pal: 1, w: 0.42, parent: hp, compound: 0.45, style: 0 });
    addTrain({ origin: V3(0, 0, ZA + 0.55), ...FRONT, m: 0.05, count: 3, Ns: [10, 14], firstN: 30, start: [HERO.x + 1.35, HERO.y + 0.75], dir: 0.9, spread: 1.4, bounds: [-40, 40, -40, 40], circles: [], pal: 0, mode: 'tick', f: 1.25, step: TAU / 30, parent: hp, burst: 1, style: 0 });
    addTrain({ origin: V3(0, 0, ZA - 0.5), ...FRONT, m: 0.09, count: 3, Ns: [28, 20], firstN: 40, start: [HERO.x + 0.9, HERO.y - 1.6], dir: 0.2, spread: 1.4, bounds: [-40, 40, -40, 40], circles: [], pal: 6, parent: hp, style: 1 });
  }
  // ---- layer A: the dense working wall, three depth sub-layers of meshing trains
  {
    const rA = mulberry32(2024);
    for (let sub = 0; sub < 3; sub++) {
      const circles = [];
      const z = ZA - 1.1 + sub * 0.75;
      const tries = [260, 200, 140][sub];
      for (let t = 0; t < tries; t++) {
        const big = rA() < 0.12;
        const tick = sub === 2 && rA() < 0.18;

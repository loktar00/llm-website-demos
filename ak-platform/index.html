<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AK Platform</title>
<meta name="description" content="A museum-style 3D showcase of the AK-47, AKM, RPK and PSL and the cartridges they fire.">
<style>
  :root { --ink: #2b2b2b; --soft: #6b6b6b; --faint: #8a8a8a; --bg1: #b9b9b9; --chip: rgba(255,255,255,.38); --chip-on: rgba(255,255,255,.85); }
  html, body { margin: 0; height: 100%; background: var(--bg1); color: var(--ink);
    font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; }
  body { overflow-x: hidden; touch-action: pan-y; -webkit-user-select: none; user-select: none; }
  body.grabbing { cursor: grabbing; } #scroll { cursor: grab; }
  a { color: inherit; }
  canvas#c { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; }
  #scroll { position: relative; height: 100vh; }
  .hud { position: fixed; pointer-events: none; }
  #title { top: 26px; left: 32px; transition: opacity .8s ease; }
  #title h1 { margin: 0; font-weight: 300; font-size: 30px; letter-spacing: 0.32em; }
  #title p { margin: 6px 0 0; font-size: 12px; letter-spacing: 0.24em; text-transform: uppercase; color: var(--soft); }
  #nav { position: fixed; top: 24px; right: 26px; display: flex; gap: 8px; align-items: center; z-index: 5; }
  #nav a, #nav button { font: 11px/1 "Helvetica Neue", Helvetica, Arial, sans-serif; letter-spacing: .22em; text-transform: uppercase;
    color: #3a3a3a; text-decoration: none; padding: 8px 12px; border-radius: 16px; border: 1px solid #a3a3a3; background: var(--chip); cursor: pointer; }
  #nav a:hover, #nav button:hover { background: var(--chip-on); }
  #nav .seg { display: inline-flex; border: 1px solid #a3a3a3; border-radius: 16px; overflow: hidden; }
  #nav .seg button { border: 0; border-radius: 0; }
  #nav .seg button.on { background: #3a3a3a; color: #eee; }
  #cap { left: 0; right: 0; bottom: 7vh; text-align: center; transition: opacity .45s ease; }
  #cap .n { font-size: 11px; letter-spacing: 0.4em; color: var(--soft); }
  #cap .h { font-size: 22px; font-weight: 300; letter-spacing: 0.18em; text-transform: uppercase; margin: 6px 0 4px; }
  #cap .d { font-size: 13px; color: var(--soft); max-width: 560px; margin: 0 auto; padding: 0 16px; line-height: 1.5; }
  #hint { left: 0; right: 0; bottom: 2.2vh; text-align: center; font-size: 10px; letter-spacing: .35em; color: var(--soft); transition: opacity .4s; }
  #bar { right: 26px; top: 50%; transform: translateY(-50%); display: flex; flex-direction: column; gap: 10px; }
  #bar i { display: block; width: 6px; height: 6px; border-radius: 50%; background: #9a9a9a; transition: background .3s, transform .3s; }
  #bar i.on { background: #3a3a3a; transform: scale(1.35); }
  #load { top: 50%; left: 0; right: 0; text-align: center; font-size: 11px; letter-spacing: .35em; color: var(--soft); transition: opacity .6s; }
  #credit { right: 26px; bottom: 18px; font-size: 10px; letter-spacing: .12em; color: var(--faint); }
  #view { position: fixed; left: 26px; bottom: 18px; display: flex; flex-direction: column; gap: 6px; align-items: flex-start; z-index: 5; }
  #view .btns { display: flex; gap: 6px; }
  #view button { width: 28px; height: 28px; border-radius: 50%; border: 1px solid #a3a3a3; background: var(--chip);
    color: #4a4a4a; font: 15px/1 "Helvetica Neue", Helvetica, Arial, sans-serif; cursor: pointer; padding: 0;
    display: inline-flex; align-items: center; justify-content: center; }
  #view button:hover { background: var(--chip-on); }
  #view button svg { width: 14px; height: 14px; }
  #view .tip { font-size: 10px; letter-spacing: .12em; color: var(--faint); }
  #labels { position: fixed; inset: 0; width: 100vw; height: 100vh; pointer-events: none; overflow: visible; }
  #labels line, #labels polyline { stroke: #4d4d4d; stroke-width: 0.8; fill: none; }
  #labels circle { fill: #3d3d3d; }
  #labels text { font: 300 11px "Helvetica Neue", Helvetica, Arial, sans-serif; letter-spacing: .16em; fill: #333; text-transform: uppercase; }
  #labels text.sub { font-size: 9px; letter-spacing: .1em; fill: #6a6a6a; text-transform: none; }
  #labels text.big { font-size: 13px; fill: #222; }
  /* landing carousel + cartridge rifle cards */
  #carousel { position: fixed; left: 0; right: 0; bottom: 9vh; display: none; flex-direction: column; align-items: center; gap: 14px; z-index: 4; }
  #carousel .name { font-size: 26px; font-weight: 300; letter-spacing: .3em; text-transform: uppercase; text-align: center; }
  #carousel .cal { font-size: 11px; letter-spacing: .3em; color: var(--soft); text-transform: uppercase; text-align: center; margin-top: 6px; }
  #carousel .row { display: flex; align-items: center; gap: 14px; }
  #carousel .arrow { width: 34px; height: 34px; border-radius: 50%; border: 1px solid #a3a3a3; background: var(--chip); cursor: pointer; font-size: 16px; color: #444; }
  #carousel .arrow:hover { background: var(--chip-on); }
  #carousel .go { font-size: 11px; letter-spacing: .25em; text-transform: uppercase; text-decoration: none; padding: 10px 18px; border-radius: 18px;
    background: #3a3a3a; color: #eee; }
  #carousel .go.off { background: #8f8f8f; pointer-events: none; }
  #carousel .dots { display: flex; gap: 8px; }
  #carousel .dots i { width: 7px; height: 7px; border-radius: 50%; background: #9a9a9a; cursor: pointer; }
  #carousel .dots i.on { background: #3a3a3a; }
  #cards { position: fixed; left: 0; right: 0; bottom: 6vh; display: none; justify-content: center; gap: 10px; flex-wrap: wrap; padding: 0 16px; z-index: 4; }
  #cards a { text-decoration: none; padding: 10px 16px; border-radius: 18px; border: 1px solid #a3a3a3; background: var(--chip);
    font-size: 11px; letter-spacing: .22em; text-transform: uppercase; color: #333; }
  #cards a:hover, #cards a.on { background: var(--chip-on); }
  #nav a.home { background: #3a3a3a; color: #eee; border-color: #3a3a3a; }
  #nav .seg a { padding: 9px 16px; font-size: 12px; }
  #nav .chips { border-color: #b98e4a; }
  #nav .chips a { color: #5a4220; }
  #nav .chips a.on, #nav .seg a.on { background: #3a3a3a; color: #eee; }
  #modelSm { position: fixed; right: 26px; bottom: 40px; display: inline-flex; border: 1px solid #b0b0b0; border-radius: 12px; overflow: hidden; z-index: 5; opacity: .75; }
  #modelSm button { font: 9px/1 "Helvetica Neue", Helvetica, Arial, sans-serif; letter-spacing: .14em; text-transform: uppercase; color: #555; padding: 5px 8px; border: 0; background: rgba(255,255,255,.35); cursor: pointer; }
  #modelSm button.on { background: #6a6a6a; color: #eee; }
  @media (max-width: 640px) { #modelSm { right: 12px; bottom: 12px; } #hint { display: none; } }
  #nav .seg a { border: 0; border-radius: 0; }
  #nav .seg a.on { background: #3a3a3a; color: #eee; }
  body.rifletab #cards { bottom: 3vh; } body.rifletab #carousel { bottom: 14vh; }
  #cards a.big { display: flex; flex-direction: column; gap: 4px; padding: 12px 20px; border-radius: 14px; min-width: 130px; text-align: center; }
  #cards a.big b { font-weight: 400; font-size: 15px; letter-spacing: .25em; }
  #cards a.big span { font-size: 9px; letter-spacing: .16em; color: var(--soft); }
  @media (max-width: 640px) { #cards a.big { min-width: 0; padding: 8px 10px; } #cards a.big b { font-size: 12px; } #nav { flex-wrap: wrap; right: 16px; } }
  @media (max-width: 640px) {
    #view { left: 16px; bottom: 14px; } #view .tip { display: none; }
    #title { top: 18px; left: 16px; } #title h1 { font-size: 20px; } #title p { font-size: 10px; }
    #nav { top: 60px; left: 16px; right: auto; } #nav a, #nav button { padding: 7px 9px; font-size: 10px; letter-spacing: .14em; }
    #cap .h { font-size: 17px; } #cap .d { font-size: 12px; } #credit, #bar { display: none; }
    #labels text { font-size: 9px; letter-spacing: .1em; } #labels text.sub { display: none; }
    #carousel .name { font-size: 20px; }
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="scroll"></div>
<svg id="labels"></svg>
<div class="hud" id="title"><h1 id="t1">AK PLATFORM</h1><p id="t2">Rifles &middot; cartridges</p></div>
<nav id="nav"></nav>
<div class="hud" id="load">LOADING <span id="lp">0</span>%</div>
<div class="hud" id="cap"><div class="n" id="cn"></div><div class="h" id="ch"></div><div class="d" id="cd"></div></div>
<div class="hud" id="hint">SCROLL &darr;</div>
<div class="hud" id="bar"></div>
<div id="carousel">
  <div><div class="name" id="cname"></div><div class="cal" id="ccal"></div></div>
  <div class="row"><button class="arrow" id="cprev" aria-label="Previous">&#8249;</button><a class="go" id="cgo" href="#">Explore</a><button class="arrow" id="cnext" aria-label="Next">&#8250;</button></div>
  <div class="dots" id="cdots"></div>
</div>
<div id="cards"></div>
<div id="view"><div class="btns">
  <button id="zin" aria-label="Zoom in">+</button><button id="zout" aria-label="Zoom out">&minus;</button>
  <button id="zreset" aria-label="Reset view">&#8634;</button>
  <button id="snd" aria-label="Sound on" title="Sound"><svg viewBox="0 0 16 16"><path d="M2 6h3l4-3v10L5 10H2z" fill="#4a4a4a"/><path id="sndx" d="M11 5.5l4 5M15 5.5l-4 5" stroke="#4a4a4a" stroke-width="1.3"/><path id="sndw" d="M11 5a4 4 0 0 1 0 6M12.6 3.4a6.2 6.2 0 0 1 0 9.2" stroke="#4a4a4a" stroke-width="1.2" fill="none" style="display:none"/></svg></button>
</div><div class="tip">Drag to rotate &middot; pinch or +/&minus; to zoom</div></div>
<div class="hud" id="credit">Krea2 &middot; Qwen Image 2.1 &rarr; TRELLIS.2 &middot; cartridges built in code</div>

<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script>
<script type="module">
// quantdiv serves the code, models and sounds from a shared asset folder; a standalone copy keeps them beside the page
const q = new URLSearchParams(location.search).get('assets');
const A = q ?? (/\/quantdiv\//.test(location.pathname) && !/\/assets\//.test(location.pathname) ? '../assets/ak-platform/' : './');
window.__ASSET = A;
import(A + 'js/app.js').catch(e => { document.getElementById('load').textContent = 'COULD NOT LOAD'; console.error(e); });
</script>
</body>
</html>

<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>SKIRMISH // Zero-Player Battle Royale</title>
<style>
  html,body{margin:0;padding:0;height:100%;background:#04090f;overflow:hidden}
  canvas{display:block;width:100vw;height:100vh}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
'use strict';
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
let cw=0,ch=0,vig=null;
function resize(){
  cw=cv.width=innerWidth;ch=cv.height=innerHeight;
  vig=document.createElement('canvas');vig.width=cw;vig.height=ch;
  const g=vig.getContext('2d');
  const gr=g.createRadialGradient(cw/2,ch/2,Math.min(cw,ch)*0.42,cw/2,ch/2,Math.max(cw,ch)*0.75);
  gr.addColorStop(0,'rgba(0,0,0,0)');gr.addColorStop(1,'rgba(0,0,0,0.5)');
  g.fillStyle=gr;g.fillRect(0,0,cw,ch);
}
addEventListener('resize',resize);

const TAU=Math.PI*2,VW=2600,GW=VW/4;
const R=(a,b)=>a+Math.random()*(b-a);
const RI=(a,b)=>(R(a,b+1))|0;
const pick=a=>a[(Math.random()*a.length)|0];
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const lerp=(a,b,t)=>a+(b-a)*t;
function circ(x,y,r){ctx.beginPath();ctx.arc(x,y,r,0,TAU);ctx.fill();}
function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}

/* ---------- noise ---------- */
let gArr=new Float32Array(4096);
function n2(x,y){
  const xi=Math.floor(x),yi=Math.floor(y),xf=x-xi,yf=y-yi;
  const u=xf*xf*(3-2*xf),v=yf*yf*(3-2*yf);
  const g=(i,j)=>gArr[((i&63)+((j&63)<<6))];
  return (g(xi,yi)*(1-u)+g(xi+1,yi)*u)*(1-v)+(g(xi,yi+1)*(1-u)+g(xi+1,yi+1)*u)*v;
}
function fbm(x,y){return (n2(x,y)+0.5*n2(x*2+13,y*2+7)+0.25*n2(x*4+31,y*4+19))/1.75;}

/* ---------- world ---------- */
let mask=null,tcv=null,trees=[],rects=[],loot=[],bldgs=[];
function landVal(x,y){
  const i=(x/4)|0,j=(y/4)|0;
  if(i<0||j<0||i>=GW||j>=GW)return -1;
  return mask[j*GW+i];
}
const isLand=(x,y)=>landVal(x,y)>0.10;

function addTree(t,x,y){
  const s=R(11,17);
  t.fillStyle='rgba(0,0,0,0.28)';t.beginPath();t.ellipse(x+3,y+4,s*0.9,s*0.7,0,0,TAU);t.fill();
  t.fillStyle=`hsl(${RI(95,135)},45%,${RI(20,27)}%)`;t.beginPath();t.arc(x,y,s,0,TAU);t.fill();
  t.fillStyle=`hsl(${RI(95,135)},48%,${RI(28,38)}%)`;t.beginPath();t.arc(x-s*0.18,y-s*0.18,s*0.62,0,TAU);t.fill();
  trees.push({x,y,r:10});
}
function genWorld(){
  for(let i=0;i<4096;i++)gArr[i]=Math.random();
  mask=new Float32Array(GW*GW);
  const c=VW/2;
  for(let j=0;j<GW;j++)for(let i=0;i<GW;i++){
    const x=i*4+2,y=j*4+2;
    const d=Math.hypot(x-c,y-c)/(VW*0.47);
    mask[j*GW+i]=1-d*d*1.15+(fbm(x*0.004,y*0.004)-0.5)*0.9;
  }
  tcv=document.createElement('canvas');tcv.width=VW;tcv.height=VW;
  const t=tcv.getContext('2d');
  t.fillStyle='#071e2c';t.fillRect(0,0,VW,VW);
  for(let j=0;j<GW;j++)for(let i=0;i<GW;i++){
    const m=mask[j*GW+i];let col;
    if(m<=0.02)col='#082635';
    else if(m<=0.10)col='#0e3c52';
    else if(m<=0.16)col='#c2a96f';
    else{
      const v=fbm(i*0.03,j*0.03);
      const g1=54+v*26|0;
      col=`rgb(${34+v*18|0},${g1},${30+v*10|0})`;
    }
    t.fillStyle=col;t.fillRect(i*4,j*4,4,4);
  }
  for(let k=0;k<7000;k++){
    const i=(Math.random()*GW)|0,j=(Math.random()*GW)|0;
    if(mask[j*GW+i]<0.16)continue;
    t.fillStyle=Math.random()<0.5?'rgba(0,0,0,0.12)':'rgba(255,255,200,0.05)';
    t.fillRect(i*4,j*4,3,3);
  }
  rects=[];trees=[];bldgs=[];
  for(let i=0;i<30;i++){
    const x=R(220,VW-220),y=R(220,VW-220);
    if(landVal(x,y)<0.28)continue;
    const w=R(55,120),h=R(55,120),th=9;
    bldgs.push({x,y,w,h});
    t.fillStyle='#565c52';t.fillRect(x-th/2,y-th/2,w+th,h+th);
    t.fillStyle='rgba(0,0,0,0.15)';
    for(let m=0;m<12;m++)t.fillRect(x+R(0,w-8),y+R(0,h-8),R(4,14),R(4,14));
    const sides=[0,1,2,3].sort(()=>Math.random()-0.5).slice(0,RI(3,4));
    t.fillStyle='#31362e';
    for(const s of sides){
      let rx,ry,rw,rh;
      if(s===0){rx=x;ry=y-th;rw=w;rh=th;}
      else if(s===1){rx=x;ry=y+h;rw=w;rh=th;}
      else if(s===2){rx=x-th;ry=y;rw=th;rh=h;}
      else{rx=x+w;ry=y;rw=th;rh=h;}
      rects.push({x:rx,y:ry,w:rw,h:rh});
      t.fillRect(rx,ry,rw,rh);
      t.fillStyle='rgba(255,255,255,0.10)';
      if(s<2)t.fillRect(rx,ry,rw,2);else t.fillRect(rx,ry,2,rh);
      t.fillStyle='#31362e';
    }
  }
  const free=(x,y)=>{for(const b of bldgs)if(x>b.x-40&&x<b.x+b.w+40&&y>b.y-40&&y<b.y+b.h+40)return false;return true;};
  for(let i=0;i<300;i++){
    const x=R(50,VW-50),y=R(50,VW-50);
    if(landVal(x,y)<0.22||!free(x,y))continue;
    addTree(t,x,y);
  }
  for(let i=0;i<24;i++){
    const cx0=R(120,VW-120),cy0=R(120,VW-120);
    if(landVal(cx0,cy0)<0.25)continue;
    const n=RI(4,8);
    for(let k=0;k<n;k++){
      const x=cx0+R(-50,50),y=cy0+R(-50,50);
      if(landVal(x,y)<0.2||!free(x,y))continue;
      addTree(t,x,y);
    }
  }
  loot=[];
  for(let i=0;i<240;i++){
    for(let tr=0;tr<30;tr++){
      const x=R(80,VW-80),y=R(80,VW-80);
      if(landVal(x,y)<0.18||!isLand(x,y))continue;
      const rt=Math.random();
      const tier=rt<0.08?3:rt<0.26?2:rt<0.52?1:0;
      const type=Math.random()<0.62?0:(Math.random()<0.65?1:2);
      loot.push({x,y,t:type,tier,ph:R(0,TAU),a:R(0,TAU)});
      break;
    }
  }
}

/* ---------- combat data ---------- */
const WEAPONS=[
  {n:'Pistol',dmg:8,rof:3.5,rng:270,spread:.13,spd:750},
  {n:'SMG',dmg:9,rof:6,rng:330,spread:.09,spd:850},
  {n:'Rifle',dmg:13,rof:7,rng:400,spread:.055,spd:950},
  {n:'Sniper',dmg:26,rof:2.1,rng:560,spread:.015,spd:1250}
];
const WCOL=['#c8d2dc','#8fe3a0','#ffb14e','#ff6363'];
const PERS=[
  {n:'AGGRESSIVE',aggr:1.0,pref:360,per:470,roam:1.0,wt:0.30},
  {n:'SNEAKY',aggr:0.45,pref:150,per:300,roam:0.9,wt:0.20},
  {n:'CAMPER',aggr:0.65,pref:300,per:350,roam:0.15,wt:0.20},
  {n:'NOMAD',aggr:0.6,pref:230,per:370,roam:1.0,wt:0.30}
];
function pickPers(){
  let r=Math.random(),acc=0;
  for(const p of PERS){acc+=p.wt;if(r<acc)return p;}
  return PERS[0];
}
const NA=['Silent','Crimson','Iron','Lunar','Vex','Nova','Rogue','Static','Frost','Blaze','Turbo','Grim','Echo','Wild','Hex','Rune','Onyx','Pulse','Gilded','Vapor','Neon','Sable','Wraith','Kilo','Drift','Hollow','Jagged','Kryptic','Lazar','Magma','Zephyr','Quill','Raven','Talon','Umbra','Volt','Wisp','Yara','Bolt','Cipher'];
const NB=['Wolf','Reaper','Strike','Fang','Byte','Hawk','Viper','Ghost','Blade','Rook','Specter','Warden','Fox','Owl','Sabre','Nyx','Drake','Comet','Shade','Unit'];

/* ---------- match state ---------- */
let bots=[],bullets=[],parts=[],rings=[],events=[],killFeed=[];
let aliveCount=0,winner=null,winnerT=0,matchNo=0,time=0,matchT=0,focusBot=null;
const zone={cx:VW/2,cy:VW/2,r:1400,tx:VW/2,ty:VW/2,toR:1400,state:'wait',t:0,dur:14,phase:0,dps:2,
  fromR:0,fromCx:0,fromCy:0};
const PHASES=[
  {wait:14,shrink:22,r:950,dps:2},
  {wait:11,shrink:18,r:520,dps:4},
  {wait:9,shrink:16,r:280,dps:7},
  {wait:7,shrink:13,r:140,dps:10},
  {wait:5,shrink:11,r:60,dps:14},
  {wait:4,shrink:9,r:12,dps:20}
];
const cam={x:VW/2,y:VW/2,s:0.4,tx:VW/2,ty:VW/2,ts:0.4,ov:0,shake:0};

function startPhase(i){
  const ph=PHASES[i];
  zone.state='wait';zone.t=0;zone.dur=ph.wait;zone.dps=ph.dps;
  zone.toR=ph.r;
  const a=R(0,TAU),dd=R(0,(zone.r-ph.r)*0.6);
  zone.tx=clamp(zone.cx+Math.cos(a)*dd,200,VW-200);
  zone.ty=clamp(zone.cy+Math.sin(a)*dd,200,VW-200);
  cam.ov=Math.max(cam.ov,2.2);
}
function zoneUpdate(dt){
  zone.t+=dt;
  const ph=PHASES[Math.min(zone.phase,PHASES.length-1)];
  if(zone.state==='wait'&&zone.t>=zone.dur){
    zone.state='shrink';zone.t=0;zone.dur=ph.shrink;
    zone.fromR=zone.r;zone.fromCx=zone.cx;zone.fromCy=zone.cy;
    cam.ov=Math.max(cam.ov,4);
  }else if(zone.state==='shrink'){
    const k=Math.min(1,zone.t/zone.dur),e=k*k*(3-2*k);
    zone.r=lerp(zone.fromR,zone.toR,e);
    zone.cx=lerp(zone.fromCx,zone.tx,e);
    zone.cy=lerp(zone.fromCy,zone.ty,e);
    if(k>=1){
      zone.phase++;
      if(zone.phase<PHASES.length)startPhase(zone.phase);
      else{zone.state='done';zone.dps=PHASES[PHASES.length-1].dps;}
    }
  }
  if(!winner&&zone.state!=='idle'){
    for(const b of bots){
      if(!b.alive)continue;
      if(Math.hypot(b.x-zone.cx,b.y-zone.cy)>zone.r+4){
        b.hp-=zone.dps*dt;
        if(b.hp<=0)killBot(b,null);
      }
    }
  }
}

/* ---------- bots ---------- */
function spawnBots(){
  bots=[];aliveCount=0;
  const used=new Set();
  for(let i=0;i<60;i++){
    let nm;do{nm=pick(NA)+' '+pick(NB);}while(used.has(nm));used.add(nm);
    let x=VW/2,y=VW/2;
    for(let tr=0;tr<60;tr++){x=R(150,VW-150);y=R(150,VW-150);if(landVal(x,y)>0.25)break;}
    bots.push({
      x,y,vx:0,vy:0,hp:100,shield:0,at:0,wt:0,weapon:WEAPONS[0],
      name:nm,hue:(i*60)%360,p:pickPers(),kills:0,alive:true,
      aim:R(0,TAU),e:null,enemyT:0,scanT:R(0,0.3),muzzleT:0,flashT:0,fireCd:0,
      fleeT:0,healT:0,strafeD:1,strafeT:R(0.5,2),mt:null,mtT:-99,lootT:0,kc:0
    });
    aliveCount++;
  }
}
function losRects(x0,y0,x1,y1){
  const dx=x1-x0,dy=y1-y0;
  for(const r of rects){
    let t0=0,t1=1;
    const p=[-dx,dx,-dy,dy],q=[x0-r.x,r.x+r.w-x0,y0-r.y,r.y+r.h-y0];
    let ok=true;
    for(let i=0;i<4;i++){
      if(p[i]===0){if(q[i]<0){ok=false;break;}}
      else{
        const tt=q[i]/p[i];
        if(p[i]<0){if(tt>t1){ok=false;break;}if(tt>t0)t0=tt;}
        else{if(tt<t0){ok=false;break;}if(tt<t1)t1=tt;}
      }
    }
    if(ok)return false;
  }
  return true;
}
function scan(b,A){
  const cands=[];
  for(const e of A){
    if(e===b)continue;
    const d=Math.hypot(e.x-b.x,e.y-b.y);
    if(d<b.p.per)cands.push([d,e]);
  }
  if(!cands.length){b.e=null;return;}
  cands.sort((a,c)=>a[0]-c[0]);
  for(let i=0;i<Math.min(3,cands.length);i++){
    const e=cands[i][1];
    if(losRects(b.x,b.y,e.x,e.y)){b.e=e;b.enemyT=1.7;return;}
  }
}
function pickRoam(b){
  for(let tr=0;tr<8;tr++){
    const a=R(0,TAU),d=R(140,420);
    const x=b.x+Math.cos(a)*d,y=b.y+Math.sin(a)*d;
    const inZ=Math.hypot(x-zone.cx,y-zone.cy)<zone.r*0.85;
    if(isLand(x,y)&&inZ){b.mt={x,y};b.mtT=matchT;return;}
  }
  b.mt={x:zone.cx+R(-zone.r*0.5,zone.r*0.5),y:zone.cy+R(-zone.r*0.5,zone.r*0.5)};b.mtT=matchT;
}
function botUpdate(b,dt,A){
  b.muzzleT-=dt;b.flashT-=dt;b.fireCd-=dt;b.enemyT-=dt;b.strafeT-=dt;b.scanT-=dt;b.lootT-=dt;
  const P=b.p;
  if(b.scanT<=0){b.scanT=R(0.2,0.35);scan(b,A);}
  let e=b.e;
  if(e&&(!e.alive||b.enemyT<=0))e=null;
  let sx=0,sy=0,spd=115;
  const inZ=Math.hypot(b.x-zone.cx,b.y-zone.cy)<zone.r-10;
  if(b.healT>0){
    b.hp=Math.min(100,b.hp+14*dt);b.healT-=dt;
  }else if(b.fleeT>0){
    b.fleeT-=dt;
    let ax,ay;
    if(e){ax=b.x-e.x;ay=b.y-e.y;}
    else{ax=b.x-zone.cx;ay=b.y-zone.cy;}
    const l=Math.hypot(ax,ay)||1;
    ax/=l;ay/=l;
    sx=ax;sy=ay;spd=160;
    if(!inZ){sx=(zone.cx-b.x)*0.01;sy=(zone.cy-b.y)*0.01;}
    b.aim=Math.atan2(sy,sx);
  }else if(e&&Math.hypot(e.x-b.x,e.y-b.y)<600){
    const d=Math.hypot(e.x-b.x,e.y-b.y);
    const conf=P.aggr*0.55+(b.hp-e.hp)*0.006+(b.wt-e.wt)*0.2+(d<P.pref*0.5?0.15:0);
    if(conf>0.3&&b.hp>24){
      // engaged: position + strafe
      const dx=(e.x-b.x)/d,dy=(e.y-b.y)/d;
      let ax=0,ay=0;
      if(d>P.pref)ax+=dx,ay+=dy;
      else if(d<P.pref*0.5)ax-=dx,ay-=dy;
      if(b.strafeT<=0){b.strafeD*=-1;b.strafeT=R(0.8,2.4);}
      ax+=-dy*b.strafeD*0.75;ay+=dx*b.strafeD*0.75;
      const al=Math.hypot(ax,ay);
      if(al>0.01){sx=ax/al;sy=ay/al;}
      spd=110;
      b.aim=Math.atan2(e.y-b.y,e.x-b.x);
      if(b.fireCd<=0&&d<b.weapon.rng&&losRects(b.x,b.y,e.x,e.y)){
        const w=b.weapon,a=Math.atan2(e.y-b.y,e.x-b.x)+R(-1,1)*w.spread;
        bullets.push({x:b.x+Math.cos(a)*14,y:b.y+Math.sin(a)*14,
          vx:Math.cos(a)*w.spd,vy:Math.sin(a)*w.spd,dmg:w.dmg,own:b,
          col:WCOL[b.wt],life:w.rng/w.spd+0.2});
        b.fireCd=1/w.rof;b.muzzleT=0.07;b.kc=0;
      }
    }else{
      if(b.hp<30) b.fleeT=2.2;
      const ax=b.x-e.x,ay=b.y-e.y,l=Math.hypot(ax,ay)||1;
      sx=ax/l;sy=ay/l;spd=130;
      b.aim=Math.atan2(sy,sx);
    }
  }else if(!inZ){
    const ax=zone.cx-b.x,ay=zone.cy-b.y,l=Math.hypot(ax,ay)||1;
    sx=ax/l;sy=ay/l;spd=155;
    b.aim=Math.atan2(sy,sx);
  }else{
    if(b.hp<72&&Math.random()<dt*0.35)b.healT=R(2.5,4);
    if(b.healT<=0){
      let li=-1,ld=1e9;
      if(b.lootT<=0){
        b.lootT=0.12;
        for(let i=0;i<loot.length;i++){
          const it=loot[i];
          const dd=(it.x-b.x)**2+(it.y-b.y)**2;
          if(dd<ld){ld=dd;li=i;}
        }
      }
      if(li>=0&&ld<130*130&&(P.roam>0.3||ld<55*55)){
        const it=loot[li];
        const ax=it.x-b.x,ay=it.y-b.y,l=Math.hypot(ax,ay)||1;
        sx=ax/l;sy=ay/l;spd=120;
        b.aim=Math.atan2(sy,sx);
        if(l<22){
          if(it.t===0){if(it.tier>b.wt){b.wt=it.tier;b.weapon=WEAPONS[it.tier];}}
          else if(it.t===1){b.hp=Math.min(100,b.hp+40);
            for(let k=0;k<6;k++)parts.push({x:b.x,y:b.y-8,vx:R(-30,30),vy:R(-60,-10),life:0.5,max:0.5,s:2,col:'#7dff9a'});}
          else if(it.tier>b.at){b.at=it.tier;b.shield=it.tier*40;}
          loot.splice(li,1);
        }
      }else{
        const hold=(P.roam<0.3&&Math.random()<0.6);
        if(hold){sx=0;sy=0;}
        else{
          if(!b.mt||Math.hypot(b.mt.x-b.x,b.mt.y-b.y)<14||matchT-b.mtT>7)pickRoam(b);
          const ax=b.mt.x-b.x,ay=b.mt.y-b.y,l=Math.hypot(ax,ay)||1;
          sx=ax/l;sy=ay/l;
          b.aim=Math.atan2(sy,sx);
        }
      }
    }
  }
  if(landVal(b.x,b.y)<0.10)spd*=0.55;
  b.vx=sx*spd;b.vy=sy*spd;
  b.x+=b.vx*dt;b.y+=b.vy*dt;
  // collisions
  for(const r of rects){
    const nx=clamp(b.x,r.x,r.x+r.w),ny=clamp(b.y,r.y,r.y+r.h);
    let dx=b.x-nx,dy=b.y-ny;const d2=dx*dx+dy*dy;
    if(d2<100){
      const l=Math.sqrt(d2)||0.01;
      b.x+=dx/l*(10-l);b.y+=dy/l*(10-l);
    }
  }
  for(const tr of trees){
    const dx=b.x-tr.x,dy=b.y-tr.y,rr2=tr.r*0.55+9;
    const d2=dx*dx+dy*dy;
    if(d2<rr2*rr2){
      const l=Math.sqrt(d2)||0.01;
      b.x=tr.x+dx/l*rr2;b.y=tr.y+dy/l*rr2;
    }
  }
  b.x=clamp(b.x,10,VW-10);b.y=clamp(b.y,10,VW-10);
}
function fire(b){/* handled inline */}
function killBot(v,killer){
  if(!v.alive)return;
  v.alive=false;aliveCount--;
  for(let i=0;i<22;i++){
    const a=R(0,TAU),s=R(40,220);
    parts.push({x:v.x,y:v.y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:R(0.3,0.8),max:0.8,s:R(1.5,3.5),
      col:Math.random()<0.3?'#ffffff':`hsl(${v.hue},70%,${RI(45,65)}%)`});
  }
  rings.push({x:v.x,y:v.y,r:6,life:0.5,max:0.5,col:`hsl(${v.hue},80%,60%)`});
  if(killer)killer.kills++;
  killFeed.unshift({
    k:killer?killer.name:'THE STORM',
    c:killer?`hsl(${killer.hue},80%,62%)`:'#b48cff',
    v:v.name,wn:killer?killer.weapon.n:'STORM',t:matchT
  });
  if(killFeed.length>6)killFeed.pop();
  events.push({x:(v.x+(killer?killer.x:v.x))/2,y:(v.y+(killer?killer.y:v.y))/2,t:1.4});
  cam.shake=0.35;
  if(aliveCount===1){
    for(const b of bots)if(b.alive){winner=b;break;}
    winnerT=0;
  }
}

/* ---------- camera ---------- */
function camUpdate(dt){
  const A=bots.filter(b=>b.alive);
  for(let i=events.length-1;i>=0;i--){events[i].t-=dt;if(events[i].t<=0)events.splice(i,1);}
  if(winner){
    cam.tx=winner.x;cam.ty=winner.y;cam.ts=1.15;
  }else if(A.length===2){
    const a=A[0],b=A[1];
    cam.tx=(a.x+b.x)/2;cam.ty=(a.y+b.y)/2;
    const d=Math.hypot(a.x-b.x,a.y-b.y);
    cam.ts=clamp(Math.min(cw,ch)/(d*1.35+420),0.45,1.1);
  }else if(cam.ov>0){
    cam.ov-=dt;
    cam.tx=zone.cx;cam.ty=zone.cy;
    cam.ts=clamp(Math.min(cw,ch)/(zone.r*2.7+300),0.28,0.8);
  }else{
    let fx=null,fs=0.75;
    for(const ev of events){
      if(ev.t>0){cam.tx=ev.x;cam.ty=ev.y;cam.ts=1.0;fx=1;break;}
    }
    if(!fx){
      let bd=1e9,found=false;
      for(const b of A){
        if(b.e&&b.e.alive&&b.enemyT>0){
          const mx=(b.x+b.e.x)/2,my=(b.y+b.e.y)/2;
          const d=Math.hypot(mx-cam.x,my-cam.y);
          if(d<bd){bd=d;cam.tx=mx;cam.ty=my;cam.ts=0.95;found=true;}
        }
      }
      if(!found){
        if(!focusBot||!focusBot.alive)focusBot=pick(A);
        cam.tx=focusBot.x;cam.ty=focusBot.y;
        cam.ts=(focusBot.enemyT>0)?0.9:0.68;
      }
    }
  }
  const k=1-Math.exp(-dt*4),ks=1-Math.exp(-dt*1.8);
  cam.x=lerp(cam.x,cam.tx,k);cam.y=lerp(cam.y,cam.ty,k);cam.s=lerp(cam.s,cam.ts,ks);
  cam.shake=Math.max(0,cam.shake-dt);
}

/* ---------- update ---------- */
function update(dt){
  time+=dt;matchT+=dt;
  zoneUpdate(dt);
  const A=bots.filter(b=>b.alive);
  if(winner){
    winnerT+=dt;
    if(winnerT>6)resetMatch();
  }else if(aliveCount>1){
    for(const b of A)botUpdate(b,dt,A);
    // separation
    for(let i=0;i<A.length;i++)for(let j=i+1;j<A.length;j++){
      const a=A[i],c=A[j];
      const dx=c.x-a.x,dy=c.y-a.y;const d2=dx*dx+dy*dy;
      if(d2<256&&d2>0.01){
        const l=Math.sqrt(d2),push=(16-l)/l*0.5;
        a.x-=dx*push;a.y-=dy*push;c.x+=dx*push;c.y+=dy*push;
      }
    }
  }
  // bullets
  for(let i=bullets.length-1;i>=0;i--){
    const bl=bullets[i];
    bl.x+=bl.vx*dt;bl.y+=bl.vy*dt;bl.life-=dt;
    let dead=bl.life<=0||bl.x<0||bl.y<0||bl.x>VW||bl.y>VW;
    if(!dead)for(const r of rects){
      if(bl.x>r.x&&bl.x<r.x+r.w&&bl.y>r.y&&bl.y<r.y+r.h){
        dead=true;
        for(let k=0;k<5;k++)parts.push({x:bl.x,y:bl.y,vx:R(-80,80),vy:R(-80,80),life:0.25,max:0.25,s:1.6,col:'#ffd27a'});
        break;
      }
    }
    if(!dead)for(const e of A){
      if(e===bl.own)continue;
      const dx=e.x-bl.x,dy=e.y-bl.y;
      if(dx*dx+dy*dy<121){
        dead=true;
        let d=bl.dmg;
        if(e.shield>0){
          const s=Math.min(e.shield,d);e.shield-=s;d-=s;
          for(let k=0;k<4;k++)parts.push({x:bl.x,y:bl.y,vx:R(-100,100),vy:R(-100,100),life:0.2,max:0.2,s:1.5,col:'#6fc3ff'});
        }
        if(d>0)e.hp-=d;
        e.flashT=0.12;
        for(let k=0;k<6;k++)parts.push({x:bl.x,y:bl.y,vx:R(-120,120),vy:R(-120,120),life:0.25,max:0.25,s:1.8,col:bl.col});
        if(e.hp<=0)killBot(e,bl.own);
        break;
      }
    }
    if(dead)bullets.splice(i,1);
  }
  for(let i=parts.length-1;i>=0;i--){
    const p=parts[i];
    p.x+=p.vx*dt;p.y+=p.vy*dt;p.vx*=0.9;p.vy*=0.9;p.life-=dt;
    if(p.life<=0)parts.splice(i,1);
  }
  for(let i=rings.length-1;i>=0;i--){
    const r=rings[i];r.r+=260*dt;r.life-=dt;
    if(r.life<=0)rings.splice(i,1);
  }
  camUpdate(dt);
}

/* ---------- render ---------- */
function drawZone(){
  const s=cam.s;
  const zx=(zone.cx-cam.x)*s+cw/2,zy=(zone.cy-cam.y)*s+ch/2,zr=zone.r*s;
  ctx.save();
  ctx.beginPath();ctx.rect(0,0,cw,ch);ctx.arc(zx,zy,zr,0,TAU,true);
  ctx.fillStyle='rgba(70,25,140,0.30)';ctx.fill();
  const p=0.5+0.5*Math.sin(time*3.2);
  ctx.beginPath();ctx.arc(zx,zy,zr,0,TAU);
  ctx.lineWidth=26+16*p;ctx.strokeStyle=`rgba(140,70,255,${0.10+0.06*p})`;ctx.stroke();
  ctx.lineWidth=3.5;ctx.strokeStyle='rgba(205,160,255,0.95)';
  ctx.shadowColor='#9a5cff';ctx.shadowBlur=16;ctx.stroke();
  ctx.shadowBlur=0;
  if(zone.toR!=null&&zone.r-zone.toR>10){
    const nx=(zone.tx-cam.x)*s+cw/2,ny=(zone.ty-cam.y)*s+ch/2;
    ctx.setLineDash([10,10]);ctx.lineWidth=2;ctx.strokeStyle='rgba(255,255,255,0.45)';
    ctx.beginPath();ctx.arc(nx,ny,zone.toR*s,0,TAU);ctx.stroke();
    ctx.setLineDash([]);
  }
  ctx.restore();
}
function drawLoot(){
  for(const it of loot){
    const pu=1+0.18*Math.sin(time*3+it.ph);
    let col=it.t===0?WCOL[it.tier]:(it.t===1?'#ff5b5b':'#58b6ff');
    ctx.globalAlpha=0.14;ctx.fillStyle=col;circ(it.x,it.y,10*pu);
    ctx.globalAlpha=1;
    if(it.t===0){
      ctx.save();ctx.translate(it.x,it.y);ctx.rotate(it.a);
      ctx.fillStyle='#20242a';ctx.fillRect(-7,-2.5,14,5);
      ctx.fillStyle=col;ctx.fillRect(4,-1.5,4,3);
      ctx.restore();
    }else if(it.t===1){
      ctx.fillStyle='#f2f5f7';rr(it.x-6,it.y-6,12,12,3);ctx.fill();
      ctx.fillStyle='#e5484d';ctx.fillRect(it.x-1.5,it.y-4,3,8);ctx.fillRect(it.x-4,it.y-1.5,8,3);
    }else{
      ctx.fillStyle=col;circ(it.x,it.y,6);
      ctx.fillStyle='#0d2036';circ(it.x,it.y,3.5);
    }
  }
}
function drawBots(A){
  for(const b of A){
    ctx.save();
    ctx.translate(b.x,b.y);
    ctx.fillStyle='rgba(0,0,0,0.3)';
    ctx.beginPath();ctx.ellipse(2,3,9,7,0,0,TAU);ctx.fill();
    ctx.rotate(b.aim);
    ctx.fillStyle='#20242a';ctx.fillRect(4,-2,13,4);
    ctx.fillStyle=WCOL[b.wt];ctx.fillRect(15,-1.5,3.5,3);
    ctx.fillStyle=`hsl(${b.hue},58%,40%)`;circ(0,0,8.5);
    ctx.fillStyle=`hsl(${b.hue},55%,32%)`;
    circ(-2.5,5,3.6);circ(-2.5,-5,3.6);
    ctx.fillStyle=`hsl(${b.hue},70%,62%)`;circ(2.5,0,4.2);
    if(b.muzzleT>0){
      ctx.fillStyle='rgba(255,235,160,0.95)';circ(20,0,5);
      ctx.fillStyle='rgba(255,255,255,0.9)';circ(23,0,2.4);
    }
    ctx.restore();
    if(b.shield>0){
      ctx.strokeStyle=`rgba(95,175,255,${0.35+0.12*Math.sin(time*4+b.hue)})`;
      ctx.lineWidth=2;ctx.beginPath();ctx.arc(b.x,b.y,13,0,TAU);ctx.stroke();
    }
    if(b.flashT>0){
      ctx.fillStyle=`rgba(255,255,255,${b.flashT*5})`;circ(b.x,b.y,9);
    }
    if(b.healT>0){
      ctx.fillStyle='#7dff9a';
      ctx.fillRect(b.x-1.5,b.y-20,3,10);ctx.fillRect(b.x-5,b.y-16,10,3);
    }
  }
}
function drawBullets(){
  ctx.lineCap='round';
  for(const bl of bullets){
    const l=Math.hypot(bl.vx,bl.vy)||1,nx=bl.vx/l,ny=bl.vy/l,len=42;
    ctx.strokeStyle=bl.col;ctx.globalAlpha=0.35;ctx.lineWidth=3.5;
    ctx.beginPath();ctx.moveTo(bl.x-nx*len,bl.y-ny*len);ctx.lineTo(bl.x,bl.y);ctx.stroke();
    ctx.globalAlpha=1;ctx.strokeStyle='#ffffff';ctx.lineWidth=1.4;
    ctx.beginPath();ctx.moveTo(bl.x-nx*len,bl.y-ny*len);ctx.lineTo(bl.x,bl.y);ctx.stroke();
  }
}
function drawParticles(){
  for(const p of parts){
    ctx.globalAlpha=clamp(p.life/p.max,0,1);
    ctx.fillStyle=p.col;circ(p.x,p.y,p.s);
  }
  ctx.globalAlpha=1;
  for(const r of rings){
    ctx.globalAlpha=clamp(r.life/r.max,0,1)*0.8;
    ctx.strokeStyle=r.col;ctx.lineWidth=3;
    ctx.beginPath();ctx.arc(r.x,r.y,r.r,0,TAU);ctx.stroke();
  }
  ctx.globalAlpha=1;
}
function drawBars(A){
  const s=cam.s,fs=13;
  ctx.textAlign='center';
  for(const b of A){
    const sxp=(b.x-cam.x)*s+cw/2,syp=(b.y-cam.y)*s+ch/2;
    if(sxp<-50||syp<-50||sxp>cw+50||syp>ch+50)continue;
    const w=30,x=sxp-w/2,y=syp-22*s-8;
    ctx.fillStyle='rgba(0,0,0,0.6)';ctx.fillRect(x-1,y-1,w+2,5);
    const pct=clamp(b.hp/100,0,1);
    ctx.fillStyle=pct>0.5?'#5fe07a':(pct>0.25?'#ffc14e':'#ff5350');
    ctx.fillRect(x,y,w*pct,3);
    if(b.shield>0){
      const sp=clamp(b.shield/(b.at*40),0,1);
      ctx.fillStyle='rgba(110,180,255,0.9)';ctx.fillRect(x,y-3,w*sp,2);
    }
    if(s>0.85){
      ctx.font='600 11px "Segoe UI",system-ui,sans-serif';
      ctx.fillStyle='rgba(255,255,255,0.85)';
      ctx.fillText(b.name,sxp,y-8);
    }
  }
  ctx.textAlign='left';
}
function panel(x,y,w,h){
  ctx.fillStyle='rgba(8,14,24,0.72)';rr(x,y,w,h,8);ctx.fill();
  ctx.strokeStyle='rgba(120,160,255,0.18)';ctx.lineWidth=1;rr(x,y,w,h,8);ctx.stroke();
}
function drawHUD(){
  const F='"Segoe UI",system-ui,sans-serif';
  // survivors
  panel(18,18,168,72);
  ctx.font='700 10px '+F;ctx.fillStyle='rgba(140,170,220,0.8)';
  ctx.fillText('F I G H T E R S   A L I V E',32,40);
  ctx.font='800 34px '+F;ctx.fillStyle='#ffffff';
  ctx.fillText(String(aliveCount),32,74);
  ctx.font='600 14px '+F;ctx.fillStyle='rgba(150,170,200,0.7)';
  const nw=ctx.measureText(String(aliveCount)).width;
  ctx.fillText('/ 60',32+nw+6,70);
  // zone timer
  const ztw=ctx.measureText('ZONE').width;
  let ztxt,zcol;
  if(zone.state==='wait'){ztxt='SHRINKS IN  '+Math.ceil(zone.dur-zone.t)+'s';zcol='#d7e3ff';}
  else if(zone.state==='shrink'){ztxt='Z O N E   C L O S I N G';zcol=`rgba(255,90,90,${0.6+0.4*Math.sin(time*6)})`;}
  else{ztxt='F I N A L   Z O N E';zcol='#ff8a8a';}
  ctx.font='700 15px '+F;
  const zw=ctx.measureText(ztxt).width;
  panel(cw/2-zw/2-22,18,zw+44,36);
  ctx.fillStyle=zcol;ctx.fillText(ztxt,cw/2-zw/2-22+22,42);
  // kill feed
  ctx.font='600 14px '+F;
  let n=0;
  for(let i=killFeed.length-1;i>=0;i--){
    const e=killFeed[i],age=matchT-e.t;
    if(age>6)continue;
    const a=age>5?1-(age-5):1;
    const kf='700 14px '+F,wf='800 10px '+F,vf='500 14px '+F;
    ctx.font=kf;const w1=ctx.measureText(e.k).width;
    ctx.font=wf;const w2=ctx.measureText(e.wn).width;
    ctx.font=vf;const w3=ctx.measureText(e.v).width;
    const tot=w1+w2+w3+34,y=78+n*30;
    if(n>=5)break;
    ctx.globalAlpha=a;
    panel(cw-tot-28,y-6,tot,24);
    let x=cw-tot-28+12;
    ctx.font=kf;ctx.fillStyle=e.c;ctx.fillText(e.k,x,y+9);x+=w1+10;
    ctx.font=wf;ctx.fillStyle='rgba(160,190,255,0.8)';ctx.fillText(e.wn,x,y+8);x+=w2+10;
    ctx.font=vf;ctx.fillStyle='rgba(230,235,245,0.9)';ctx.fillText(e.v,x,y+9);
    ctx.globalAlpha=1;
    n++;
  }
  // live / match
  ctx.font='700 12px '+F;
  const lp=0.5+0.5*Math.sin(time*4);
  ctx.fillStyle=`rgba(255,60,60,${0.5+0.5*lp})`;circ(30,ch-28,4);
  ctx.fillStyle='rgba(230,235,245,0.85)';ctx.fillText('LIVE  //  MATCH #'+matchNo,42,ch-23);
  // intro
  if(matchT<3&&!winner){
    ctx.globalAlpha=clamp(3-matchT,0,1);
    ctx.textAlign='center';
    ctx.font='800 42px '+F;ctx.fillStyle='#ffffff';
    ctx.fillText('MATCH #'+matchNo,cw/2,ch-90);
    ctx.font='700 14px '+F;ctx.fillStyle='rgba(150,180,255,0.9)';
    ctx.fillText('60 FIGHTERS  ·  ZONE ACTIVE  ·  GOOD LUCK',cw/2,ch-64);
    ctx.globalAlpha=1;ctx.textAlign='left';
  }
}
function drawWinner(){
  const t=winnerT;
  const dim=clamp(t*1.5,0,1)*0.4;
  ctx.fillStyle=`rgba(2,5,12,${dim})`;ctx.fillRect(0,0,cw,ch);
  const F='"Segoe UI",system-ui,sans-serif';
  const sc=1+(t<0.5?(0.5-t)*0.5:0);
  ctx.save();
  ctx.translate(cw/2,ch/2);ctx.scale(sc,sc);
  ctx.textAlign='center';
  ctx.globalAlpha=clamp(t*2,0,1);
  ctx.font='800 16px '+F;ctx.fillStyle='#ffd257';
  ctx.fillText('· ·  V I C T O R Y   R O Y A L E  · ·',0,-52);
  ctx.font='900 64px '+F;
  ctx.shadowColor=`hsl(${winner.hue},80%,60%)`;ctx.shadowBlur=30;
  ctx.fillStyle=`hsl(${winner.hue},75%,65%)`;
  ctx.fillText(winner.name,0,14);
  ctx.shadowBlur=0;
  ctx.font='700 20px '+F;ctx.fillStyle='rgba(230,238,255,0.95)';
  ctx.fillText(winner.kills+' ELIMINATIONS',0,52);
  ctx.font='600 12px '+F;ctx.fillStyle='rgba(160,180,220,0.7)';
  ctx.fillText('RESTARTING WITH A FRESH ISLAND...',0,86);
  ctx.globalAlpha=1;
  ctx.restore();
  ctx.textAlign='left';
}
function render(){
  ctx.fillStyle='#04090f';ctx.fillRect(0,0,cw,ch);
  const shx=cam.shake>0?R(-1,1)*cam.shake*10:0,shy=cam.shake>0?R(-1,1)*cam.shake*10:0;
  ctx.save();
  ctx.translate(cw/2+shx,ch/2+shy);ctx.scale(cam.s,cam.s);ctx.translate(-cam.x,-cam.y);
  ctx.drawImage(tcv,0,0);
  drawLoot();
  drawBullets();
  const A=bots.filter(b=>b.alive);
  drawBots(A);
  drawParticles();
  ctx.restore();
  drawZone();
  drawBars(A);
  drawHUD();
  if(winner)drawWinner();
  if(vig)ctx.drawImage(vig,0,0);
}

/* ---------- lifecycle ---------- */
function resetMatch(){
  matchNo++;
  genWorld();
  spawnBots();
  bullets=[];parts=[];rings=[];events=[];killFeed=[];
  winner=null;winnerT=0;matchT=0;focusBot=null;
  zone.cx=VW/2;zone.cy=VW/2;zone.r=1400;zone.phase=0;
  startPhase(0);
  cam.x=VW/2;cam.y=VW/2;cam.s=0.4;cam.tx=VW/2;cam.ty=VW/2;cam.ts=0.4;cam.ov=4;cam.shake=0;
}
let last=performance.now();
function frame(now){
  const dt=clamp((now-last)/1000,0,0.05);last=now;
  update(dt);
  render();
  requestAnimationFrame(frame);
}
resize();
resetMatch();
requestAnimationFrame(frame);
</script>
</body>

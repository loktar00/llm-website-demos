<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AK-47 Field Strip</title>
<style>
  :root { --ink: #2b2b2b; --soft: #6b6b6b; --bg0: #e4e4e4; --bg1: #b9b9b9; }
  html, body { margin: 0; height: 100%; background: var(--bg1); color: var(--ink);
    font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; }
  body { overflow-x: hidden; touch-action: pan-y; -webkit-user-select: none; user-select: none; }
  body.grabbing { cursor: grabbing; } #scroll { cursor: grab; }
  canvas#c { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; }
  #scroll { position: relative; height: 900vh; }
  .hud { position: fixed; pointer-events: none; }
  #title { top: 28px; left: 32px; transition: opacity 1.2s ease; }
  #title h1 { margin: 0; font-weight: 300; font-size: 30px; letter-spacing: 0.32em; }
  #title p { margin: 6px 0 0; font-size: 12px; letter-spacing: 0.24em; text-transform: uppercase; color: var(--soft); }
  #cap { left: 0; right: 0; bottom: 7vh; text-align: center; transition: opacity .45s ease; }
  #cap .n { font-size: 11px; letter-spacing: 0.4em; color: var(--soft); }
  #cap .h { font-size: 22px; font-weight: 300; letter-spacing: 0.18em; text-transform: uppercase; margin: 6px 0 4px; }
  #cap .d { font-size: 13px; color: var(--soft); max-width: 520px; margin: 0 auto; padding: 0 16px; line-height: 1.5; }
  #hint { left: 0; right: 0; bottom: 2.2vh; text-align: center; font-size: 10px; letter-spacing: .35em; color: var(--soft); transition: opacity .4s; }
  #bar { right: 26px; top: 50%; transform: translateY(-50%); display: flex; flex-direction: column; gap: 10px; }
  #bar i { display: block; width: 6px; height: 6px; border-radius: 50%; background: #9a9a9a; transition: background .3s, transform .3s; }
  #bar i.on { background: #3a3a3a; transform: scale(1.35); }
  #load { top: 50%; left: 0; right: 0; text-align: center; font-size: 11px; letter-spacing: .35em; color: var(--soft); transition: opacity .6s; }
  #credit { right: 26px; bottom: 18px; font-size: 10px; letter-spacing: .12em; color: #8a8a8a; }
  #modelSeg { position: fixed; top: 24px; right: 26px; display: inline-flex; border: 1px solid #a3a3a3; border-radius: 16px; overflow: hidden; z-index: 5; }
  #modelSeg button { font: 11px/1 "Helvetica Neue", Helvetica, Arial, sans-serif; letter-spacing: .2em; text-transform: uppercase; color: #3a3a3a;
    padding: 8px 12px; border: 0; background: rgba(255,255,255,.38); cursor: pointer; }
  #modelSeg button.on { background: #3a3a3a; color: #eee; }
  @media (max-width: 640px) { #modelSeg { top: 64px; left: 16px; right: auto; } #modelSeg button { font-size: 10px; padding: 7px 9px; letter-spacing: .12em; } }
  #view { position: fixed; left: 26px; bottom: 18px; display: flex; flex-direction: column; gap: 6px; align-items: flex-start; }
  #view .btns { display: flex; gap: 6px; }
  #view button { width: 28px; height: 28px; border-radius: 50%; border: 1px solid #a3a3a3; background: rgba(255,255,255,.35);
    color: #4a4a4a; font: 15px/1 "Helvetica Neue", Helvetica, Arial, sans-serif; cursor: pointer; padding: 0;
    display: inline-flex; align-items: center; justify-content: center; }
  #view button:hover { background: rgba(255,255,255,.7); }
  #view button svg { width: 14px; height: 14px; }
  #view .tip { font-size: 10px; letter-spacing: .12em; color: #8a8a8a; }
  #callouts { position: fixed; inset: 0; width: 100vw; height: 100vh; pointer-events: none; overflow: visible; }
  #callouts line, #callouts polyline { stroke: #4d4d4d; stroke-width: 0.8; fill: none; }
  #callouts circle { fill: #3d3d3d; }
  #callouts text { font: 300 11px "Helvetica Neue", Helvetica, Arial, sans-serif; letter-spacing: .16em; fill: #333; text-transform: uppercase; }
  #callouts text.sub { font-size: 9px; letter-spacing: .1em; fill: #777; text-transform: none; }
  @media (max-width: 640px) {
    #view { left: 16px; bottom: 14px; } #view .tip { display: none; }
    #title { top: 18px; left: 16px; } #title h1 { font-size: 22px; }
    #cap .h { font-size: 18px; } #credit, #bar { display: none; }
    #callouts text { font-size: 9px; letter-spacing: .1em; } #callouts text.sub { display: none; }
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="scroll"></div>
<svg id="callouts"></svg>
<div class="hud" id="title"><h1>AK&#8209;47</h1><p>Field strip &middot; 7.62&times;39&nbsp;mm</p></div>
<div class="hud" id="load">LOADING MODELS <span id="lp">0</span>%</div>
<div class="hud" id="cap"><div class="n" id="cn"></div><div class="h" id="ch"></div><div class="d" id="cd"></div></div>

<div class="hud" id="bar"></div>
<div id="view"><div class="btns">
  <button id="zin" aria-label="Zoom in">+</button><button id="zout" aria-label="Zoom out">&minus;</button>
  <button id="zreset" aria-label="Reset view">&#8634;</button>
  <button id="snd" aria-label="Sound on" title="Sound"><svg viewBox="0 0 16 16"><path d="M2 6h3l4-3v10L5 10H2z" fill="#4a4a4a"/><path id="sndx" d="M11 5.5l4 5M15 5.5l-4 5" stroke="#4a4a4a" stroke-width="1.3"/><path id="sndw" d="M11 5a4 4 0 0 1 0 6M12.6 3.4a6.2 6.2 0 0 1 0 9.2" stroke="#4a4a4a" stroke-width="1.2" fill="none" style="display:none"/></svg></button>
</div><div class="tip">Drag to rotate &middot; pinch or +/&minus; to zoom</div></div>
<div class="hud" id="credit">Krea2 &middot; Qwen Image 2.1 &rarr; TRELLIS.2</div>
<div id="modelSeg"><button data-m="trellis">TRELLIS</button><button data-m="code">Code-modeled</button></div>

<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { GTAOPass } from 'three/addons/postprocessing/GTAOPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { HorizontalBlurShader } from 'three/addons/shaders/HorizontalBlurShader.js';
import { VerticalBlurShader } from 'three/addons/shaders/VerticalBlurShader.js';

const Q = new URLSearchParams(location.search);
// quantdiv serves the models from a shared asset folder; a standalone copy keeps them beside the page
const ASSET = Q.get('assets') || (location.pathname.includes('/quantdiv/') ? '../assets/ak47-field-strip/' : './');
// TRELLIS models or the code-modeled rifle (geometry + ComfyUI textures shared with the AK platform site)
const MODEL = ['trellis', 'code'].includes(Q.get('model')) ? Q.get('model') : 'code';
const CODE = MODEL === 'code' && !Q.has('hero');
const PLATFORM = location.pathname.includes('/quantdiv/') ? '../assets/ak-platform/' : '../ak-platform/';
for (const b of document.querySelectorAll('#modelSeg button')) {
  b.classList.toggle('on', b.dataset.m === MODEL);
  b.addEventListener('click', () => { if (b.dataset.m === MODEL) return; const q = new URLSearchParams(location.search); q.set('model', b.dataset.m); location.search = q.toString(); });
}

/* ---------- Layout ----------
   Placement is authored in the pixel space of the field-stripped body image
   (1440x736, butt at px 43, muzzle at px 1323, bore line at py 287) because the
   body mesh maps linearly onto it. 1280 px = 0.87 m overall length. */
const K = 0.87 / 1280, PX0 = 683, PY0 = 287;
const wx = px => (px - PX0) * K, wy = py => (PY0 - py) * K;

/* rot: euler degrees applied to the raw TRELLIS mesh so that +X = muzzle, +Y = up,
   +Z = rifle's right side (toward camera). box: target extents in body-image px.
   depth: target Z thickness in metres. z: Z offset. mat: material tuning. */
const PARTS = {
  body:     { file: 'body.glb',     rot: [0, 0, 0],      box: [43, 1323, 208, 503], depth: null,  mat: { metal: 0.85, rough: 0.8, tint: [0.86, 0.9, 1.0] } },
  magazine: { file: 'magazine.glb', rot: [-90, 0, 180],  box: [576, 786, 300, 604], depth: 0.032, mat: { metal: 0.7, rough: 0.85, tint: [0.9, 0.92, 1.0] } },
  cover:    { code: true },                                      // built in code below, fitted to the receiver
  spring:   { file: 'spring.glb',   rot: [0, 0, 0],      box: [404, 690, 244, 274], depth: 0.02,  mat: { metal: 1.0, rough: 0.55, tint: [1, 1, 1] } },
  gastube:  { file: 'gastube.glb',  rot: [0, 90, 0],     box: [834, 1160, 224, 280], depth: 0.04, mat: { metal: 0.85, rough: 0.8, tint: [0.86, 0.9, 1.0] } },
  carrier:  { file: 'carrier.glb',  rot: [0, 180, 0],    box: [559, 1101, 244, 284], depth: 0.03,  mat: { metal: 1.0, rough: 0.65, tint: [0.9, 0.92, 1.0] } },
  bolt:     { file: 'bolt.glb',     rot: [0, -90, 0],    box: [731, 823, 258, 282], depth: 0.024, mat: { metal: 1.0, rough: 0.6, tint: [1, 1, 1] } },
};
const LABELS = {
  body: ['Receiver group', 'barrel, stock, lower handguard'], cover: ['Dust cover', 'receiver cover'],
  spring: ['Recoil spring', 'spring and guide rod'], gastube: ['Gas tube', 'with upper handguard'],
  carrier: ['Bolt carrier', 'with gas piston'], bolt: ['Bolt', 'rotating, two lugs'], magazine: ['Magazine', '30 rounds'],
};
if (Q.has('hero')) {            // approach A for comparison: the one-shot complete rifle in place of the parts
  for (const k of Object.keys(PARTS)) delete PARTS[k];
  PARTS.body = { file: 'hero.glb', rot: [0, 0, 0], box: [43, 1323, 208, 640], depth: null, mat: PARTS_BODY_MAT() };
}
function PARTS_BODY_MAT() { return { metal: 0.85, rough: 0.8, tint: [0.86, 0.9, 1.0] }; }

/* Stage timeline over scroll progress p in [0,1]. Each stage drives one part. */
const STAGES = [
  { part: null,       n: '00', h: 'Firing cycle',  d: 'Gas bleeds into the tube and drives the bolt carrier back; the recoil spring returns it.' },
  { part: 'magazine', n: '01', h: 'Magazine',      d: 'Press the catch and drop it out of the magazine well.' },
  { part: 'cover',    n: '02', h: 'Dust cover',    d: 'Press the recoil spring guide and lift the receiver cover away.' },
  { part: 'spring',   n: '03', h: 'Recoil spring', d: 'The spring and its guide rod slide forward and out of the receiver.' },
  { part: 'carrier',  n: '04', h: 'Bolt carrier',  d: 'Draw the carrier fully back and lift it; the gas piston slides out of the gas tube with it.' },
  { part: 'bolt',     n: '05', h: 'Bolt',          d: 'Bolt separated from carrier/piston: rotate it and slide it out of the carrier.' },
  { part: 'gastube',  n: '06', h: 'Gas tube',      d: 'Last, turn the lock lever up and lift the gas tube off with the upper handguard.' },
  { part: null,       n: '07', h: 'Field stripped', d: 'Seven assemblies, each modelled from a single generated image.' },
];
if (CODE) STAGES[STAGES.length - 1].d = 'Seven assemblies, every one modeled in code.';
const S0 = 0.07, S1 = 0.93;                              // disassembly spans [S0, S1]
const stageSpan = (S1 - S0) / 6;
const stageU = (p, i) => THREE.MathUtils.clamp((p - (S0 + (i - 1) * stageSpan)) / (stageSpan * 0.82), 0, 1);

/* Motion paths: waypoints as offsets from the assembled pose, [t, [dx,dy,dz], [rx,ry,rz] deg]. */
const PATHS = {
  magazine: [[0, [0, 0, 0], [0, 0, 0]], [0.45, [0, -0.13, 0], [0, 0, 0]], [1, [-0.36, -0.22, 0.0], [0, 0, 0]]],
  cover:    [[0, [0, 0, 0], [0, 0, 0]], [0.3, [-0.006, 0.03, 0], [0, 0, 4]], [0.6, [-0.03, 0.12, 0.0], [0, 0, 0]], [1, [-0.03, 0.17, 0], [0, 0, 0]]],
  spring:   [[0, [0, 0, 0], [0, 0, 0]], [0.2, [0.01, 0, 0], [0, 0, 0]], [0.45, [0.01, 0.07, 0], [0, 0, 8]], [1, [-0.03, 0.27, 0], [0, 0, 0]]],
  gastube:  [[0, [0, 0, 0], [0, 0, 0]], [0.3, [0, 0.02, 0], [0, 0, -5]], [0.6, [0.02, 0.1, 0], [0, 0, 0]], [1, [0.06, 0.17, 0], [0, 0, 0]]],
  // back to the end of the receiver, rear lifted, then straight back until the piston clears the gas tube
  carrier:  [[0, [0, 0, 0], [0, 0, 0]], [0.28, [-0.105, 0, 0], [0, 0, 0]], [0.42, [-0.115, 0.012, 0], [0, 0, -4]], [0.68, [-0.27, 0.03, 0], [0, 0, -6]], [0.78, [-0.3, 0.07, 0.03], [0, 0, -2]], [0.88, [-0.17, -0.09, 0.14], [0, 0, 0]], [1, [-0.08, -0.36, 0.0], [0, 0, 0]]],
  bolt:     [[0, [0, 0, 0], [0, 0, 0]], [0.22, [0, 0, 0], [35, 0, 0]], [0.45, [0.02, -0.05, 0.01], [35, 0, 0]], [1, [0.42, -0.012, 0], [0, 0, 0]]],
};

/* ---------- Renderer, scene ---------- */
const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: false, powerPreference: 'high-performance' });
let pixelRatio = Math.min(devicePixelRatio, 2);
renderer.setPixelRatio(pixelRatio);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;
renderer.debug.checkShaderErrors = false;   // production: skip program info logs (ANGLE prints harmless X4000 notes for GTAO)

const scene = new THREE.Scene();
scene.background = (() => {                                     // studio sweep, drawn into the frame so the post chain sees it
  const c = document.createElement('canvas'); c.width = 512; c.height = 512; const g = c.getContext('2d');
  const r = g.createRadialGradient(256, 215, 0, 256, 256, 380);
  r.addColorStop(0, '#d9d9d9'); r.addColorStop(0.5, '#c4c4c4'); r.addColorStop(1, '#9d9d9d');
  g.fillStyle = r; g.fillRect(0, 0, 512, 512);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return t;
})();
scene.backgroundIntensity = 1.0;

/* Procedural lightbox for reflections: a dim room with hard-edged softboxes and strip
   lights, so steel picks up crisp studio highlights instead of a vague grey. */
function lightbox() {
  const s = new THREE.Scene();
  const room = new THREE.Mesh(new THREE.BoxGeometry(12, 8, 12), new THREE.MeshBasicMaterial({ color: 0x404244, side: THREE.BackSide }));
  room.position.y = 2.5; s.add(room);
  const floor = new THREE.Mesh(new THREE.PlaneGeometry(12, 12), new THREE.MeshBasicMaterial({ color: 0x6a6a6a }));
  floor.rotation.x = -Math.PI / 2; floor.position.y = -1.4; s.add(floor);
  const panel = (w, h, x, y, z, ry, rx, k, col = 0xffffff) => {
    const m = new THREE.Mesh(new THREE.PlaneGeometry(w, h), new THREE.MeshBasicMaterial({ color: new THREE.Color(col).multiplyScalar(k), side: THREE.DoubleSide }));
    m.position.set(x, y, z); m.rotation.set(rx, ry, 0); s.add(m);
  };
  panel(4.5, 1.6, -1.5, 5.5, 1.5, 0, Math.PI / 2, 14, 0xfff2e2);   // overhead key softbox
  panel(0.35, 5, 5.8, 2.2, 0.5, -Math.PI / 2, 0, 18);               // right strip
  panel(0.35, 5, -5.8, 2.2, -1.0, Math.PI / 2, 0, 9, 0xe2ecff);     // left strip, cool
  panel(6, 0.25, 0, 3.8, -5.8, 0, 0, 12);                           // rim strip behind
  panel(3, 2.2, 0.5, 1.2, 5.8, Math.PI, 0, 4);                      // front fill card
  return s;
}
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(lightbox(), 0.015).texture;
scene.environmentIntensity = 0.75;

const camera = new THREE.PerspectiveCamera(30, 1, 0.02, 30);

const key = new THREE.DirectionalLight(0xfff1e0, 2.2); key.position.set(-0.8, 2.2, 1.6); scene.add(key);
const fill = new THREE.DirectionalLight(0xdfe8ff, 0.7); fill.position.set(2, 0.4, 1.2); scene.add(fill);
const rim = new THREE.DirectionalLight(0xffffff, 1.4); rim.position.set(0.4, 1.2, -2.2); scene.add(rim);
const sweep = new THREE.SpotLight(0xffffff, 0, 6, 0.35, 0.8, 1); sweep.position.set(0, 1.5, 2.2); scene.add(sweep); scene.add(sweep.target);
scene.add(new THREE.HemisphereLight(0xffffff, 0x8a8a8a, 0.25));

/* ---------- Contact shadow (depth from below, blurred, laid on the invisible floor) ---------- */
let FLOOR_Y = -0.3;            // tracks just below whatever is on screen (eased), so the contact shadow stays in frame
const SH = { w: 2.6, h: 1.4, camH: 1.0, darkness: 1.4, blur: 2.6 };
const shadowGroup = new THREE.Group(); shadowGroup.position.y = FLOOR_Y; scene.add(shadowGroup);
const shRT = new THREE.WebGLRenderTarget(512, 276); shRT.texture.generateMipmaps = false;
const shRTb = new THREE.WebGLRenderTarget(512, 276); shRTb.texture.generateMipmaps = false;
const shPlane = new THREE.Mesh(new THREE.PlaneGeometry(SH.w, SH.h).rotateX(Math.PI / 2),
  new THREE.MeshBasicMaterial({ map: shRT.texture, opacity: 0.75, transparent: true, depthWrite: false }));
shPlane.renderOrder = 1; shPlane.scale.y = -1; shPlane.userData.noAO = true; shadowGroup.add(shPlane);
const shBlurPlane = new THREE.Mesh(new THREE.PlaneGeometry(SH.w, SH.h).rotateX(Math.PI / 2)); shBlurPlane.visible = false; shBlurPlane.layers.set(1); shadowGroup.add(shBlurPlane);
const shCam = new THREE.OrthographicCamera(-SH.w / 2, SH.w / 2, SH.h / 2, -SH.h / 2, 0, SH.camH);
shCam.rotation.x = Math.PI / 2; shCam.layers.set(1); shadowGroup.add(shCam);
const shDepth = new THREE.MeshDepthMaterial();
shDepth.userData.darkness = { value: SH.darkness };
shDepth.onBeforeCompile = sh => {
  sh.uniforms.darkness = shDepth.userData.darkness;
  sh.fragmentShader = 'uniform float darkness;\n' + sh.fragmentShader.replace(
    'gl_FragColor = vec4( vec3( 1.0 - fragCoordZ ), opacity );', 'gl_FragColor = vec4( vec3( 0.0 ), ( 1.0 - fragCoordZ ) * darkness );');
};
shDepth.depthTest = false; shDepth.depthWrite = false;
const hBlur = new THREE.ShaderMaterial(HorizontalBlurShader); hBlur.depthTest = false;
const vBlur = new THREE.ShaderMaterial(VerticalBlurShader); vBlur.depthTest = false;
function blurShadow(amount) {
  shBlurPlane.visible = true;
  shBlurPlane.material = hBlur; hBlur.uniforms.tDiffuse.value = shRT.texture; hBlur.uniforms.h.value = amount / 256;
  renderer.setRenderTarget(shRTb); renderer.render(shBlurPlane, shCam);
  shBlurPlane.material = vBlur; vBlur.uniforms.tDiffuse.value = shRTb.texture; vBlur.uniforms.v.value = amount / 256;
  renderer.setRenderTarget(shRT); renderer.render(shBlurPlane, shCam);
  shBlurPlane.visible = false;
}
let shFrame = 0;
function renderContactShadow(center) {
  if (shFrame++ % 2) return;                                     // every other frame is plenty for a soft shadow
  shadowGroup.position.x = center.x;
  const bg = scene.background; scene.background = null;
  scene.overrideMaterial = shDepth;
  const cc = renderer.getClearAlpha(); renderer.setClearAlpha(0);
  renderer.setRenderTarget(shRT); renderer.clear(); renderer.render(scene, shCam);
  scene.overrideMaterial = null;
  blurShadow(SH.blur); blurShadow(SH.blur * 0.4);
  renderer.setRenderTarget(null); renderer.setClearAlpha(cc); scene.background = bg;
}

/* rig: idle sway + recoil live here; parts live inside it */
const rig = new THREE.Group(); scene.add(rig);
const recoil = new THREE.Group(); rig.add(recoil);

/* ---------- Materials ----------
   Keep TRELLIS's albedo and metal/rough maps, then re-grade them: a mask from the albedo
   (wood is clearly redder than it is green or blue) splits each texel into blued steel
   (tinted, more metallic, tighter roughness) or varnished wood (dielectric, clear coat). */
function grade(mat, P) {
  const m = new THREE.MeshPhysicalMaterial({ metalness: 1, roughness: 1, clearcoat: 1, clearcoatRoughness: 0.14 });
  for (const k of ['map', 'metalnessMap', 'roughnessMap', 'normalMap']) if (mat[k]) m[k] = mat[k];
  const u = { uTint: { value: new THREE.Vector3(...P.tint) }, uMetal: { value: P.metal }, uRough: { value: P.rough } };
  m.onBeforeCompile = sh => {
    Object.assign(sh.uniforms, u);
    sh.fragmentShader = 'uniform vec3 uTint; uniform float uMetal; uniform float uRough;\n' + sh.fragmentShader
      .replace('#include <color_fragment>', `#include <color_fragment>
        float woodM = smoothstep(0.05, 0.16, diffuseColor.r - max(diffuseColor.g, diffuseColor.b));
        diffuseColor.rgb = mix(diffuseColor.rgb * uTint, diffuseColor.rgb * vec3(1.0, 0.93, 0.88), woodM);`)
      .replace('#include <roughnessmap_fragment>', `#include <roughnessmap_fragment>
        roughnessFactor = mix(clamp(roughnessFactor * uRough, 0.18, 0.75), 0.5, woodM);`)
      .replace('#include <metalnessmap_fragment>', `#include <metalnessmap_fragment>
        metalnessFactor = mix(clamp(metalnessFactor * 0.5 + uMetal * 0.5, 0.0, 1.0), 0.0, woodM);`)
      .replace('#include <lights_physical_fragment>', `#include <lights_physical_fragment>
        #ifdef USE_CLEARCOAT
          material.clearcoat *= woodM * 0.8;
        #endif`);
  };
  m.customProgramCacheKey = () => 'ak-grade';
  return m;
}

/* ---------- Load + fit parts ---------- */
const loader = new GLTFLoader();
const progress = {};
function load(name) {
  const P = PARTS[name];
  return new Promise((res, rej) => loader.load(ASSET + P.file, g => res(g), e => {
    if (e.lengthComputable) { progress[name] = e.loaded / e.total; updLoad(); }
  }, rej));
}
function updLoad() {
  const ks = Object.keys(PARTS).filter(k => !PARTS[k].code);
  const v = ks.length ? ks.reduce((a, k) => a + (progress[k] || 0), 0) / ks.length : 1;
  document.getElementById('lp').textContent = Math.round(v * 100);
}

const nodes = {};        // name -> { pivot, base, half }
function fit(name, gltf) {
  const P = PARTS[name];
  const model = gltf.scene;

/* The dust cover is the one part built in code (TRELLIS never produced a usable thin stamped

   internals up to y 31.9 mm, rear of the receiver at x -212 mm, rear-sight block from x +18 mm).
   It is a 0.8 mm shell 0.35 mm outside the walls, lower edges resting on the lip, a flattened
   arch clearing the internals, stamped ribs, and the real cover's right-side cut-out over the
   ejection port so the charging handle and carrier run free through the whole stroke (checked

const COVER = { zc: -2.45, hwi: 21.2, t: 0.8, ys: 19.0, ci: 38.7, n: 2, xr: -208, xf: 17, yb: 16.3,
  rearRound: 27, rearMin: 0.42, ribs: [0.16, 0.3, 0.44, 0.58, 0.72, 0.86], plateY: 17.8 };
// Profile measured against the Krea2 hero photo (0.612 mm/px): cover 234 mm long from 4 mm ahead of the
// receiver's rear to the rear-sight block's rear face; a U arch standing ~23.6 mm above its lower edge;
// the crown rounds down over the last 27 mm onto the rear tab.
// charging handle in battery: front of the ejection port, just behind the rear-sight block
const HANDLE = { x: 0.008, y: wy(258), z: 0.012, stroke: 0.115, knobR: 0.0075, stemR: 0.0035 };
if (CODE) {   // the code model's receiver: walls at z +-16 mm, rails at y 12 mm, cover from the receiver's rear to the rear sight block
  Object.assign(COVER, { zc: 0, hwi: 16.4, t: 0.8, ys: 19.8, ci: 35.8, n: 2, xr: -199.5, xf: 41.5, yb: 12, rearRound: 27, rearMin: 0.42, plateY: 17.8 });
  Object.assign(HANDLE, { x: 0.033, y: 0.008, z: 0 });
}
COVER.cutX0 = (HANDLE.x - HANDLE.stroke - HANDLE.knobR) * 1000 - 4;     // cut-out spans the handle's swept travel + clearance
COVER.cutY = (HANDLE.y + HANDLE.stemR) * 1000 + 3;
function steelTexture() {
  const W = 512, H = 128, c = document.createElement('canvas'); c.width = W; c.height = H; const g = c.getContext('2d');
  g.fillStyle = '#5d6168'; g.fillRect(0, 0, W, H);

    const x = Math.random() * W, y = Math.random() * H, r = 2 + Math.random() * 10;

    g.beginPath(); g.arc(x, y, r, 0, 6.283); g.fill();

    const y = Math.random() * H; g.strokeStyle = 'rgba(150,155,160,' + (0.03 + Math.random() * 0.05) + ')';
    g.lineWidth = 0.6; g.beginPath(); g.moveTo(Math.random() * W, y); g.lineTo(Math.random() * W, y + (Math.random() - 0.5) * 2); g.stroke();

// mid-surface cross-section at one station, [z, y] mm: left lower edge -> arch -> right lower edge
function coverSection(xmm, N) {
  const C = COVER, hm = C.hwi + C.t / 2;
  const archY = u => C.ys + (C.ci + C.t / 2 - C.ys) * Math.pow(1 - Math.pow(Math.min(1, Math.abs(u) / hm), C.n), 1 / C.n);
  const rt = THREE.MathUtils.clamp((xmm - C.xr) / C.rearRound, 0, 1);
  const f = C.rearMin + (1 - C.rearMin) * Math.sqrt(1 - (1 - rt) * (1 - rt));       // quarter-ellipse round-down at the rear
  // the right lower edge rises over the cut-out, with a short rounded ramp at its rear end
  const ybR = C.yb + (C.cutY - C.yb) * THREE.MathUtils.smoothstep(xmm, C.cutX0 - 2, C.cutX0 + 2);
  const raw = [];
  for (let i = 0; i <= 8; i++) raw.push([-hm, C.yb + (C.ys - C.yb) * i / 8]);
  for (let i = 1; i < 60; i++) { const a = Math.PI * (1 - i / 60), u = hm * Math.cos(a); raw.push([u, archY(u)]); }   // angle-spaced: even arc sampling

  for (const p of raw) p[1] = C.yb + (p[1] - C.yb) * f;
  let e = raw.length - 1;                                          // trim the right side below ybR
  while (e > 0 && raw[e][0] > 0 && raw[e][1] < ybR) e--;

}
function buildDustCover() {
  const P = PARTS.cover; if (!P || !P.code) return;

    for (let j = 0; j <= N; j++) {

      let nz = b[1] - a[1], ny = -(b[0] - a[0]); const l = Math.hypot(nz, ny) || 1; nz /= l; ny /= l;
      if (nz * (z - C.zc) + ny * (y - C.yb - 2) < 0) { nz = -nz; ny = -ny; }       // outward
      const d = 1.3 * rib * THREE.MathUtils.smoothstep(y, C.yb + 3, C.ys + 4);      // ribs embossed, following the arch
      pos.push(xmm / 1000, (y + ny * d) / 1000, (z + nz * d) / 1000); uv.push(s, j / N);

    side: THREE.DoubleSide, clearcoat: 0.15, clearcoatRoughness: 0.45 });

  rear.forEach(p => sh.lineTo(p[0] / 1000, p[1] / 1000)); sh.lineTo(rear[rear.length - 1][0] / 1000, C.plateY / 1000); sh.closePath();

  const hm = C.hwi + C.t / 2;

    m.rotation.z = Math.PI / 2; m.position.set((x0 + x1) / 2000, (C.yb + 0.5) / 1000, z / 1000); group.add(m); };
  lip(C.xr, C.xf, C.zc - hm); lip(C.xr, C.cutX0 - 2, C.zc + hm);

  group.position.copy(ctr).negate();

  nodes.cover = { pivot, base: ctr.clone(), half: new THREE.Vector3(L / 2, (C.ci + C.t - C.yb) / 2000, (hm + C.t / 2) / 1000) };

/* TRELLIS baked a second, static charging handle into the receiver mesh (it is in the source
   image). The working one rides on the carrier, so the baked copy is cut out of the body. */
function trimBakedHandle() {
  const n = nodes.body; if (!n || Q.has('hero') || CODE) return;
  recoil.updateMatrixWorld(true);

  n.pivot.traverse(o => {

    M4.multiplyMatrices(inv, o.matrixWorld);
    const g = o.geometry, P = g.attributes.position, src = g.index.array, keep = [];

/* casings: brass, procedural lathe profile, real tumble/bounce/settle on the floor */
const brass = new THREE.MeshPhysicalMaterial({ color: 0xc8963e, metalness: 1, roughness: 0.28 });
const CASE_R = 0.0056;
const caseGeo = (() => {
  const pts = [[0, 0], [0.0055, 0], [0.0056, 0.001], [0.0050, 0.0016], [0.0056, 0.0022], [0.0054, 0.0300], [0.0044, 0.0330], [0.0040, 0.0385], [0, 0.0385]]
    .map(([r, y]) => new THREE.Vector2(r, y));
  const g = new THREE.LatheGeometry(pts, 18); g.translate(0, -0.019, 0); g.rotateZ(Math.PI / 2); return g;   // axis along X
})();
const casings = [];
for (let i = 0; i < 16; i++) {
  const m = new THREE.Mesh(caseGeo, brass); m.visible = false; m.layers.enable(1); scene.add(m);
  casings.push({ m, life: 0, v: new THREE.Vector3(), w: new THREE.Vector3(), rest: false, bounces: 0 });
}
let caseIx = 0;
function eject(at) {
  const c = casings[caseIx++ % casings.length];
  c.m.position.copy(at); c.m.quaternion.copy(rig.quaternion); c.m.visible = true; c.m.scale.setScalar(1);
  c.life = 0; c.rest = false; c.bounces = 0;
  // AK brass goes right and a little forward; kept short so it lands on the floor in frame
  c.v.set(0.34 + Math.random() * 0.08, 1.15 + Math.random() * 0.15, 0.13 + Math.random() * 0.06).applyQuaternion(rig.quaternion); c.w.set(6 + Math.random() * 6, 20 + Math.random() * 8, 8 + Math.random() * 4);
}
const qTmp = new THREE.Quaternion(), qRest = new THREE.Quaternion(), axTmp = new THREE.Vector3();

  c.life += dt;
  if (c.life > 7) { c.m.scale.multiplyScalar(Math.exp(-dt * 6)); if (c.m.scale.x < 0.05) c.m.visible = false; }
  if (c.rest) return;
  c.v.y -= 9.8 * dt;

  qTmp.setFromEuler(new THREE.Euler(c.w.x * dt, c.w.y * dt, c.w.z * dt)); c.m.quaternion.multiply(qTmp);
  const floorY = FLOOR_Y + CASE_R;

    const impact = -c.v.y;
    if (impact > 0) {
      c.v.y = impact * 0.36; c.v.x *= 0.62; c.v.z *= 0.62; c.w.multiplyScalar(0.55); c.bounces++;
      if (c.bounces <= 2 && impact > 0.2) audio.ping(c.bounces === 1 ? 1 : 0.35);   // one tink on contact, a faint one on the bounce
    }

   sfx-shot: AK-47 single shot, Beeld en Geluid via Wikimedia Commons, CC BY-SA 3.0 (trimmed).
   sfx-bolt: "Equipment Clicks III" by LFA (a real rifle bolt), OpenGameArt, CC0 (trimmed).
   sfx-brass0-2: synthesized for this page (a click plus a few fast-decaying 6-11 kHz partials, 36-50 ms), CC0.
   A small synth stands in for any file that fails to load. */
const audio = (() => {
  let ctx = null, master = null, on = false, noiseBuf = null, pings = 0;

    comp.threshold.value = -10; comp.knee.value = 8; comp.ratio.value = 4; comp.attack.value = 0.002; comp.release.value = 0.2;
    master = ctx.createGain(); master.gain.value = 0.8; master.connect(comp); comp.connect(ctx.destination);
    noiseBuf = ctx.createBuffer(1, ctx.sampleRate * 0.5, ctx.sampleRate);
    const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    for (const n of ['shot', 'bolt', 'brass0', 'brass1', 'brass2'])

    bolt() { if (!on) return; if (buf.bolt) play(buf.bolt, 0.28 + Math.random() * 0.08, 1.1 + Math.random() * 0.12); },

/* ---------- Firing: full auto, short trigger-controlled bursts ----------
   ~600 rounds/min, so each round's carrier stroke is ~0.1 s: snapped back, slammed home.
   4-6 rounds, then a pause. (The AK has semi and full auto only; the burst is trigger control.) */
const RPM_DT = 0.1, PAUSE = 2.0;

  outRot.set(...[0, 1, 2].map(k => THREE.MathUtils.degToRad(a[2][k] + (b[2][k] - a[2][k]) * t)));

/* ---------- Post-processing ---------- */
const composer = new EffectComposer(renderer);

const gtao = new GTAOPass(scene, camera, 2, 2);
gtao.updateGtaoMaterial({ radius: 0.06, distanceExponent: 1.5, thickness: 0.02, scale: 1.25, samples: 12, distanceFallOff: 1, screenSpaceRadius: false });

gtao.blendIntensity = 0.9;

  const ov = gtao.overrideVisibility.bind(gtao), rv = gtao.restoreVisibility.bind(gtao);
  let bgStash = null;
  gtao.overrideVisibility = function () { ov(); bgStash = scene.background; scene.background = null; scene.traverse(o => { if (o.userData.noAO) o.visible = false; }); };

composer.addPass(bloom);
const FinishShader = {

    tDiffuse: { value: null }, uRes: { value: new THREE.Vector2(1, 1) }, uTime: { value: 0 },
    uHeat: { value: 0 }, uHeatPos: { value: new THREE.Vector2(0.5, 0.5) }, uHeatScale: { value: 0.1 },
    uFocus: { value: new THREE.Vector2(0.5, 0.5) }, uFocusR: { value: 0.2 }, uBlur: { value: 0 }, uVig: { value: 0.32 }, uAspect: { value: 1 },

  fragmentShader: `

    uniform float uHeat; uniform vec2 uHeatPos; uniform float uHeatScale;
    uniform vec2 uFocus; uniform float uFocusR; uniform float uBlur; uniform float uVig; uniform float uAspect;
    varying vec2 vUv;
    float n2(vec2 p){ return sin(p.x) * sin(p.y); }

/* ---------- Callouts: manual-diagram leaders in the exploded layout ---------- */

// anchor on the part (fraction of its half extents) and which way the label goes

const pTmp = new THREE.Vector3();

  const W = innerWidth, H = innerHeight, small = W < 640, len = small ? 22 : 46;
  for (const k in callouts) {
    const n = nodes[k], c = callouts[k], spec = CALL[k];
    pTmp.set(spec.a[0] * n.half.x, spec.a[1] * n.half.y, n.half.z).applyMatrix4(n.pivot.matrixWorld).project(camera);
    const x = (pTmp.x * 0.5 + 0.5) * W, y = (-pTmp.y * 0.5 + 0.5) * H;
    const ex = x + spec.dir[0] * len * 0.55, ey = y + spec.dir[1] * len * 0.55;

/* ---------- User view: orbit + zoom layered on the scripted camera ----------
   Drag orbits, the page wheel still scrubs the strip; zoom is pinch, ctrl/cmd+wheel
   (trackpad pinch arrives as that) or the buttons. The offset eases home after 6 s idle. */
const user = { yaw: 0, pitch: 0, zoom: 1, tYaw: 0, tPitch: 0, tZoom: 1, last: -1e9, dragging: false };
const ZMIN = 0.35, ZMAX = 2.2;

function updateUser(dt) {
  const idle = now() - user.last > 6 && !user.dragging;
  if (idle) {
    const k = Math.exp(-dt * 1.4);
    user.tYaw *= k; user.tPitch *= k; user.tZoom = 1 + (user.tZoom - 1) * k;
  }
  const a = 1 - Math.exp(-dt * 9);
  user.yaw += (user.tYaw - user.yaw) * a; user.pitch += (user.tPitch - user.pitch) * a; user.zoom += (user.tZoom - user.zoom) * a;
  swayGain += ((user.dragging ? 0 : 1) - swayGain) * (1 - Math.exp(-dt * 4));

const onUI = e => e.target.closest && e.target.closest('#view');
addEventListener('pointerdown', e => {

  skipIntro();
  pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (pointers.size === 1) { dragStart = { x: e.clientX, y: e.clientY, decided: e.pointerType === 'mouse' }; if (dragStart.decided) beginDrag(); }
  if (pointers.size === 2) { const [a, b] = [...pointers.values()]; pinch0 = Math.hypot(a.x - b.x, a.y - b.y); zoom0 = user.tZoom; beginDrag(); }
});
function beginDrag() { user.dragging = true; document.body.classList.add('grabbing'); touchUser(); }
function endDrag() { user.dragging = false; document.body.classList.remove('grabbing'); touchUser(); }

    const [a, b] = [...pointers.values()]; const d = Math.hypot(a.x - b.x, a.y - b.y);
    if (pinch0 > 0) { user.tZoom = THREE.MathUtils.clamp(zoom0 * pinch0 / d, ZMIN, ZMAX); touchUser(); }

addEventListener('wheel', e => {
  skipIntro();
  if (!(e.ctrlKey || e.metaKey)) return;                        // plain wheel scrolls the strip
  e.preventDefault(); zoomBy(Math.exp(e.deltaY * 0.0015));
}, { passive: false });
for (const ev of ['gesturestart', 'gesturechange']) addEventListener(ev, e => e.preventDefault());
addEventListener('keydown', () => skipIntro());
document.getElementById('zin').addEventListener('click', () => zoomBy(0.8));
document.getElementById('zout').addEventListener('click', () => zoomBy(1.25));
document.getElementById('zreset').addEventListener('click', () => { user.tYaw = user.tPitch = 0; user.tZoom = 1; user.last = -1e9; });
window.__user = user;

/* ---------- Intro: slow 360 reveal with a light sweep, skippable ---------- */
const INTRO = 7.0;
let introT = (Q.has('p') || Q.has('freeze') || Q.has('nointro')) ? INTRO : 0, introSkip = false;
function skipIntro() { if (introT < INTRO) introSkip = true; }

/* ---------- Main ---------- */
let scrollP = 0, smoothP = 0;
function readScroll() {
  const max = document.documentElement.scrollHeight - innerHeight;
  scrollP = max > 0 ? THREE.MathUtils.clamp(scrollY / max, 0, 1) : 0;
  if (scrollY > 4) skipIntro();
}
addEventListener('scroll', readScroll, { passive: true });

function resize() {
  const w = innerWidth, h = innerHeight;
  renderer.setPixelRatio(pixelRatio); renderer.setSize(w, h, false);
  composer.setPixelRatio(pixelRatio); composer.setSize(w, h);
  bloom.resolution.set(w / 2, h / 2);
  finish.uniforms.uRes.value.set(w * pixelRatio, h * pixelRatio); finish.uniforms.uAspect.value = w / h;
  camera.aspect = w / h; camera.updateProjectionMatrix();
}
addEventListener('resize', resize); resize();

const tmpP = new THREE.Vector3(), tmpR = new THREE.Euler(), box = new THREE.Box3(), corner = new THREE.Vector3();
const camTarget = new THREE.Vector3(), camLook = new THREE.Vector3(0, -0.02, 0), scr = new THREE.Vector3();

const clock = new THREE.Clock();
const fixedP = Q.has('p') ? parseFloat(Q.get('p')) : null;     // ?p=0.5 pins scroll (inspection)
let titleShown = true;

// ?capture: frames are stepped by script at a fixed 60 Hz (used to cut the preview loop)
const CAPTURE = Q.has('capture');
let capT = 0, capP = null;
function frame() {
  const dt = CAPTURE ? 1 / 60 : Math.min(clock.getDelta(), 0.05);

  if (ready) {
    if (capP != null) smoothP = capP;
    else smoothP += ((fixedP ?? scrollP) - smoothP) * (fixedP != null ? 1 : 1 - Math.exp(-dt * 7));
    const p = smoothP;
    const strip = THREE.MathUtils.smoothstep(p, 0.0, S0);

    // intro turntable
    let introYaw = 0;
    if (introT < INTRO) {
      introT = introSkip ? Math.min(INTRO, introT + dt * 3.5) : introT + dt;
      const k = THREE.MathUtils.smootherstep(introT, 0, INTRO);
      introYaw = (1 - k) * Math.PI * 2;
      sweepAmt = Math.sin(Math.min(1, introT / INTRO) * Math.PI);
      const a = -1.2 + 2.4 * (introT / INTRO);
      sweep.position.set(Math.sin(a) * 2.2, 1.3, Math.cos(a) * 2.2);
    } else sweepAmt = Math.max(0, sweepAmt - dt);

    let si = 0; if (p >= S0 - 0.01) si = Math.min(6, 1 + Math.floor((p - S0) / stageSpan)); if (p > S1 - 0.005) si = 7;
    setStage(introDone ? si : -1);
    if (!introDone) cap.style.opacity = 0;

    const sway = (1 - 0.75 * strip) * swayGain;
    rig.rotation.y = Math.sin(t * 0.32) * 0.2 * sway * (introDone ? 1 : 0) + introYaw;
    rig.rotation.x = 0.03 + Math.sin(t * 0.21) * 0.025 * sway;
    rig.position.y = Math.sin(t * 0.8) * 0.006;
    if (window.__still) { rig.rotation.set(0, 0, 0); rig.position.y = 0; }

    // firing, only at the top of the page once the intro is done
    const firing = p < S0 * 0.45 && introDone && !Q.has('nofire');
    if (Q.has('freeze') && firing) { shotSim = simT - parseFloat(Q.get('freeze')); nextShot = simT + 99; ejected = true; }
    else if (firing && !document.hidden) {
      if (simT - nextShot > 0.3) nextShot = simT;                  // came back from a hidden tab
      if (simT >= nextShot) {
        if (burstLeft <= 0) { burstLeft = 4 + Math.floor(Math.random() * 3); burstIx = 0; }
        shotSim = simT; ejected = false; burstIx++; burstLeft--;
        recoilBuild = Math.min(1.6, recoilBuild + 0.32); heatLevel = Math.min(1, heatLevel + 0.22);
        flashStar.material.rotation = Math.random() * 6.283;
        puff(MUZZLE.clone().applyMatrix4(recoil.matrixWorld), 4);

    port = ts >= 0 && ts < 0.015 ? 1 : 0;

      const u = stageU(p, STAGES.findIndex(s => s.part === name));

      for (let k = 0; k < 8; k++) {
        corner.set(k & 1 ? n.half.x : -n.half.x, k & 2 ? n.half.y : -n.half.y, k & 4 ? n.half.z : -n.half.z);
        corner.applyEuler(n.pivot.rotation).add(n.pivot.position).applyMatrix4(recoil.matrixWorld);
        box.expandByPoint(corner);
      }
    }
    const size = box.getSize(v3), ctr = box.getCenter(new THREE.Vector3());
    const vfov = THREE.MathUtils.degToRad(camera.fov);
    const hfov = 2 * Math.atan(Math.tan(vfov / 2) * camera.aspect);
    const margin = innerWidth < 700 ? 1.18 : 1.36;
    const need = Math.max((size.y * margin) / 2 / Math.tan(vfov / 2), (size.x * margin) / 2 / Math.tan(hfov / 2)) + size.z;
    camDist += (need - camDist) * (1 - Math.exp(-dt * 3));
    ctr.y -= size.y * 0.035; camLook.lerp(ctr, 1 - Math.exp(-dt * 3));
    updateUser(dt);
    const elev = THREE.MathUtils.clamp(THREE.MathUtils.lerp(0.1, 0.2, strip) + user.pitch, -0.06, 1.3);
    const azim = THREE.MathUtils.lerp(0.32, 0.12, strip) + user.yaw;
    camTarget.set(Math.sin(azim) * Math.cos(elev), Math.sin(elev), Math.cos(azim) * Math.cos(elev)).multiplyScalar(camDist * user.zoom).add(camLook);
    camera.position.copy(camTarget); if (window.__cam) camera.position.set(...window.__cam); if (window.__still) camLook.set(0, -0.05, 0); if (window.__look) camLook.set(...window.__look);
    camera.lookAt(camLook);
    // shot shake, decays in sim time
    if (ts >= 0 && ts < 0.4) {
      const a = (0.0016 + 0.0012 * recoilBuild) * Math.exp(-ts * 20);
      camera.position.add(v3.set(Math.sin(t * 91) * a, Math.sin(t * 77 + 1) * a, 0).applyQuaternion(camera.quaternion));
    }

    // post: heat shimmer at the muzzle, focus on the part being removed, callouts at the end
    scr.copy(MUZZLE).applyMatrix4(recoil.matrixWorld).project(camera);
    finish.uniforms.uHeatPos.value.set(scr.x * 0.5 + 0.5, scr.y * 0.5 + 0.5);
    finish.uniforms.uHeatScale.value = 0.06 / user.zoom;
    finish.uniforms.uHeat.value = !Q.has('noheat') ? (Q.has('freeze') ? 0.8 : heatLevel) : 0;
    finish.uniforms.uTime.value = simT;
    let blur = 0;
    if (si >= 1 && si <= 6 && quality.level < 2) {
      const part = STAGES[si].part, n = nodes[part];
      const u = stageU(p, si);
      if (n) {
        scr.set(0, 0, 0).applyMatrix4(n.pivot.matrixWorld).project(camera);
        finish.uniforms.uFocus.value.set(scr.x * 0.5 + 0.5, scr.y * 0.5 + 0.5);
        finish.uniforms.uFocusR.value = 0.16;
        blur = Math.sin(Math.min(1, u) * Math.PI) * 0.9 * (user.dragging ? 0 : 1);
      }
    }
    finish.uniforms.uBlur.value += (blur - finish.uniforms.uBlur.value) * (1 - Math.exp(-dt * 6));
    updateCallouts(THREE.MathUtils.smoothstep(p, S1 - 0.03, S1 + 0.03));

    document.getElementById('hint').style.opacity = p < 0.02 && introDone ? 1 : 0;
    FLOOR_Y += (box.min.y - 0.07 - FLOOR_Y) * (1 - Math.exp(-dt * 2));
    shadowGroup.position.y = FLOOR_Y;
    renderContactShadow(ctr);
  }
  setFlash(flash, port);

  for (const q of smoke) if (q.s.visible) {
    q.life += sdt; const k = q.life / q.max;
    if (k >= 1) { q.s.visible = false; continue; }
    q.v.multiplyScalar(Math.exp(-sdt * 1.6)); q.v.y += q.g * sdt;
    q.s.position.addScaledVector(q.v, sdt);
    q.s.scale.setScalar(0.03 + k * 0.16);
    q.s.material.opacity = Math.sin(Math.min(1, k * 4) * Math.PI / 2) * (1 - k) * 0.7;
  }
  for (const c of casings) if (c.m.visible) { const n = 3; for (let i = 0; i < n; i++) stepCasing(c, sdt / n); }

  composer.render(dt);
  window.__frames = (window.__frames || 0) + 1;
}
if (CAPTURE) window.__advance = (n, p) => { for (let i = 0; i < n; i++) { if (p) capP = p(capT); frame(); } };
else renderer.setAnimationLoop(frame);

(CODE ? import(PLATFORM + 'js/akcode.js').then(m => {
  window.__ASSET = PLATFORM;                                    // textures live with the AK platform site
  const ctx = { recoil, nodes }; m.buildCodeAK47(ctx); window.__coverMat = ctx.coverMat;
  document.getElementById('credit').textContent = 'Code-modeled in three.js · textures generated on ComfyUI (Krea2)';
  return [];
}) : Promise.all(Object.keys(PARTS).filter(n => !PARTS[n].code).map(n => load(n).then(g => [n, g])))).then(list => {
  list.forEach(([n, g]) => fit(n, g));
  trimBakedHandle();
  addCleaningRod();
  buildDustCover();
  addChargingHandle();
  buildCallouts();
  if (Q.has('hide')) Q.get('hide').split(',').forEach(n => nodes[n] && (nodes[n].pivot.visible = false));
  if (Q.has('cam')) window.__cam = Q.get('cam').split(',').map(Number);
  ready = true; readScroll(); clock.getDelta();
  document.getElementById('load').style.opacity = 0;
  window.__ready = true;
}).catch(e => { document.getElementById('load').textContent = 'COULD NOT LOAD MODELS'; console.error(e); });
</script>
</body>
</html>

/* tapered feather plane growing toward -Z */
function featherGeo(len, w){
  const rows = 5, cols = 3, pos = [], uv = [], idx = [];
  for (let j=0;j<=rows;j++){
    const s = j/rows;
    const hw = w*0.5*Math.pow(1 - Math.pow(s, 1.9), 0.65) + 0.0015;
    const z = -s*len;
    for (let i=0;i<=cols;i++){
      const t = i/cols - 0.5;
      pos.push(t*2*hw, Math.sin(s*Math.PI)*0.004 - Math.abs(t)*hw*0.25, z);
      uv.push(i/cols, s);
    }
  }
  for (let j=0;j<rows;j++) for (let i=0;i<cols;i++){
    const a = j*(cols+1)+i;
    idx.push(a, a+cols+1, a+1, a+1, a+cols+1, a+cols+2);
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos,3));
  g.setAttribute('uv', new THREE.Float32BufferAttribute(uv,2));
  g.setIndex(idx);
  g.computeVertexNormals();
  return g;
}
/* wing panel: span along ±X, chord along Z */
function wingPanelGeo(len, rootC, tipC, side, camber){
  const NS = 8, NT = 5, pos = [], uv = [], idx = [];
  for (let j=0;j<=NS;j++){
    const s = j/NS;
    const c = lerp(rootC, tipC, Math.pow(s, 0.85));
    for (let i=0;i<=NT;i++){
      const t = i/NT;
      let z = -c*0.45 + t*c;
      if (t > 0.72) z -= smooth((t-0.72)/0.28)*0.016*Math.abs(Math.sin(s*16.0));
      const x = side*s*len;
      const y = camber*Math.sin(Math.PI*s)*0.5 + (1-t)*camber*0.55
              + Math.sin(s*10)*0.002;
      pos.push(x, y, z);
      uv.push(s, t);
    }
  }
  for (let j=0;j<NS;j++) for (let i=0;i<NT;i++){
    const a = j*(NT+1)+i;
    if (side > 0) idx.push(a, a+NT+1, a+1, a+1, a+NT+1, a+NT+2);
    else idx.push(a, a+1, a+NT+1, a+1, a+NT+2, a+NT+1);
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos,3));
  g.setAttribute('uv', new THREE.Float32BufferAttribute(uv,2));
  g.setIndex(idx);
  g.computeVertexNormals();
  return g;
}
function deformedBody(){
  const g = new THREE.SphereGeometry(1, 22, 16);
  const p = g.attributes.position;
  for (let i=0;i<p.count;i++){
    let x = p.getX(i), y = p.getY(i), z = p.getZ(i);
    const s = (z+1)*0.5;                       // 0 rear .. 1 front
    const f = 0.42 + 0.58*Math.pow(s, 0.7);    // taper to the tail
    let nx = x*0.094*f;
    let ny = y*0.098*(0.55 + 0.45*f);
    let nz = z*0.152;
    if (y < 0) ny *= 0.92;                     // flatter belly
    if (z < -0.55) ny += 0.012*(-0.55 - z)*2;  // rump lifts into the tail
    p.setXYZ(i, nx, ny + 0.004*Math.max(0,z)*0, nz);
  }
  g.computeVertexNormals();
  return g;
}
function crowLeg(side){
  const acc = new GeoAcc({});
  const m = new THREE.Matrix4(), q = new THREE.Quaternion(), e = new THREE.Euler();
  const thigh = new THREE.SphereGeometry(1, 8, 6);
  thigh.scale(0.020, 0.030, 0.026);
  thigh.translate(side*0.032, -0.058, 0.012);
  acc.push(thigh, null);
  const tarsus = new THREE.CylinderGeometry(0.0052, 0.0046, 0.062, 6);
  tarsus.translate(side*0.032, -0.098, 0.006);
  acc.push(tarsus, null);
  /* toes: three forward, one back */
  for (let i=0;i<3;i++){
    const a = (i-1)*0.46;
    const toe = new THREE.CylinderGeometry(0.0036, 0.0030, 0.040, 5);
    toe.translate(0, -0.020, 0);
    e.set(1.15, a, 0, 'YXZ'); q.setFromEuler(e);
    m.compose(v3(side*0.032, -0.126, 0.010), q, v3(1,1,1));
    acc.push(toe, m);
    const claw = new THREE.ConeGeometry(0.0026, 0.012, 5);
    claw.translate(0, -0.044, 0.004);
    acc.push(claw, m);
  }
  const back = new THREE.CylinderGeometry(0.0034, 0.0028, 0.030, 5);
  back.translate(0, -0.015, 0);
  e.set(-0.9, Math.PI, 0, 'YXZ'); q.setFromEuler(e);
  m.compose(v3(side*0.032, -0.124, 0.004), q, v3(1,1,1));
  acc.push(back, m);
  return acc.build();
}
function buildCrowModel(){
  const root = new THREE.Group();
  const body = new THREE.Group();
  root.add(body);

  const mk = (g, mat) => { const mesh = new THREE.Mesh(g, mat); mesh.castShadow = true; return mesh; };

  const bodyMesh = mk(deformedBody(), matCrow);
  body.add(bodyMesh);

  /* head */
  const head = new THREE.Group();
  head.position.set(0, 0.048, 0.118);
  body.add(head);
  const headG = new THREE.SphereGeometry(1, 18, 14);
  headG.scale(0.049, 0.050, 0.056);
  headG.translate(0, 0.012, 0.030);
  head.add(mk(headG, matCrow));
  /* upper mandible, slightly decurved */
  const bu = new THREE.ConeGeometry(0.0165, 0.078, 10);
  bu.rotateX(Math.PI/2);
  {
    const p = bu.attributes.position;
    for (let i=0;i<p.count;i++){
      const z = p.getZ(i);
      if (z > 0) p.setY(i, p.getY(i) - Math.pow(z/0.078, 2)*0.011);
    }
  }
  bu.translate(0, -0.004, 0.055);
  head.add(mk(bu, matBeak));
  /* lower mandible hinged at the jaw */
  const jaw = new THREE.Group();
  jaw.position.set(0, -0.014, 0.048);
  head.add(jaw);
  const bl = new THREE.ConeGeometry(0.0132, 0.064, 8);
  bl.rotateX(Math.PI/2);
  bl.translate(0, 0, 0.032);
  jaw.add(mk(bl, matBeak));
  /* eyes + catchlights */
  for (const s of [-1,1]){
    const eye = new THREE.SphereGeometry(0.0105, 10, 8);
    eye.translate(s*0.030, 0.014, 0.040);
    head.add(mk(eye, matEye));
    const gl = new THREE.SphereGeometry(0.0032, 6, 5);
    gl.translate(s*0.035, 0.019, 0.045);
    const gm = new THREE.Mesh(gl, matGlint);
    head.add(gm);
  }

  /* tail fan */
  const tail = new THREE.Group();
  tail.position.set(0, 0.012, -0.145);
  body.add(tail);
  const tailFeathers = [];
  for (let i=0;i<6;i++){
    const a = (i - 2.5)/2.5*0.34;
    const fg = featherGeo(0.165 - Math.abs(i-2.5)*0.008, 0.050);
    const holder = new THREE.Group();
    holder.rotation.y = a;
    holder.add(mk(fg, matCrow));
    tail.add(holder);
    tailFeathers.push(holder);
  }

  /* wings */
  const wings = [];
  for (const side of [1,-1]){
    const armG = new THREE.Group();
    armG.position.set(side*0.052, 0.030, 0.012);
    body.add(armG);
    const armMesh = mk(wingPanelGeo(0.170, 0.125, 0.080, side, 0.020), matCrow);
    armG.add(armMesh);
    const handG = new THREE.Group();
    handG.position.set(side*0.170, 0, 0);
    armG.add(handG);
    const handMesh = mk(wingPanelGeo(0.185, 0.080, 0.052, side, 0.016), matCrow);
    handG.add(handMesh);
    /* primaries beyond the wrist */
    for (let i=0;i<5;i++){
      const fg = featherGeo(0.10 + i*0.017, 0.030);
      const holder = new THREE.Group();
      holder.position.set(side*(0.02 + i*0.030), 0, -0.012 - i*0.006);
      holder.rotation.y = side*(-0.28 - i*0.13);
      holder.rotation.z = side*(-0.06 - i*0.05);
      holder.add(mk(fg, matCrow));
      handG.add(holder);
    }
    wings.push({ side, armG, handG });
  }

  /* legs */
  const legs = [];
  for (const side of [1,-1]){
    const lg = new THREE.Group();
    lg.position.set(side*0.030, -0.040, 0.010);
    body.add(lg);
    const legMesh = mk(crowLeg(side), matBeak);
    legMesh.position.set(-side*0.030, 0.040, -0.010);   // geo built in body space
    lg.add(legMesh);
    legs.push(lg);
  }

  return { root, body, head, jaw, tail, tailFeathers, wings, legs };
}

function farAnchor(i){

function flyInCurve(F, seat, i){
  const j = (s) => (i-2.5)*s;

    F.clone(),
    v3(F.x + rr(-5,3), F.y - rr(0.4,1.2), F.z + rr(11,17)),
    v3(-52 + j(3.0) + rr(-4,4), 8.8 + rr(-0.7,0.7), -94 + rr(-7,7)),
    v3(-45 + j(3.5) + rr(-4,4), 6.6 + rr(-0.6,0.6), -68 + rr(-6,6)),
    v3(-35 + j(3.5) + rr(-4,4), 4.5 + rr(-0.5,0.5), -44 + rr(-5,5)),
    v3(-28 + j(2.5) + rr(-3,3), 3.1, -25 + rr(-4,4)),
    v3(seat.x + rr(1.9,2.8), seat.y + 1.35, seat.z + sgn*rr(2.6,4.2)),
    v3(seat.x + 0.75, seat.y + 0.60, seat.z + sgn*0.9),
    v3(seat.x, seat.y + 0.13, seat.z)
  ];
  return new THREE.CatmullRomCurve3(pts, false, 'centripetal', 0.5);
}
function flyOutCurve(seat, F, i){
  const j = (s) => (i-2.5)*s;
  const sgn = seat.z < -12 ? -1 : 1;
  const pts = [

function genSitActions(t0, t1){

function findBeat(c, T){
  for (const b of c.beats) if (T >= b.t0 && T < b.t1) return { b, te: T };
  const te = T + 72;
  for (const b of c.beats) if (te >= b.t0 && te < b.t1) return { b, te };
  return { b: c.beats[c.beats.length-1], te: T + 72 };

function updateCrow(c, T, dt){
  const { b, te } = findBeat(c, T);
  const u = clamp((te - b.t0)/(b.t1 - b.t0), 0, 1);
  const M = c.model;

  /* ---- position + heading ---- */
  let pos = c.pos, yaw = 0, pitch = 0, roll = 0, bank = 0;
  let fold = 1, legExt = 1, tailFan = 0.08, flare = 0, leap = 0;

  if (b.kind === 'fly' || b.kind === 'hop'){
    const ep = easeSeg(u, b.s0, b.s1);
    const p = b.curve.getPointAt(clamp(ep, 0, 1));
    const tan = b.curve.getTangentAt(clamp(ep, 0.001, 0.999));
    pos.copy(p);
    yaw = Math.atan2(tan.x, tan.z);
    pitch = -Math.asin(clamp(tan.y, -1, 1));
    /* bank into the turn */
    const yawRate = (yaw - (c.lastYaw === undefined ? yaw : c.lastYaw));
    let dy = yawRate;
    while (dy > Math.PI) dy -= TAU;
    while (dy < -Math.PI) dy += TAU;
    bank = clamp(-dy*10, -0.55, 0.55)*(b.kind === 'hop' ? 0.5 : 1);
    c.lastYaw = yaw;
    /* landing flare / take-off leap */
    if (b.arrive) flare = smooth((u - 0.86)/0.14);
    if (b.depart) leap = 1 - smooth(u/0.16);
    if (b.kind === 'hop') { flare = smooth((u-0.75)/0.25)*(1 - smooth((0.12-u)/0.12)); legExt = 1; }
    fold = 0;
    if (b.depart) fold = 1 - smooth(u/0.07);
    if (b.kind === 'hop') fold = u > 0.5 ? smooth((u-0.55)/0.35) : 0;
    legExt = (b.kind === 'hop') ? 1 :
      (b.arrive ? smooth((u-0.68)/0.32) : 1 - smooth(u/0.12));
    tailFan = 0.30 + 0.55*flare + Math.abs(bank)*0.5 + (b.kind === 'hop' ? 0.45 : 0);
    pitch += flare*0.42 - leap*0.30;
    /* wing beat */
    const freq = b.kind === 'hop' ? 8.6 : (6.4 + flare*3.0 - leap*0.6);
    c.phase += clamp(freq*dt, 0, 0.5);
    /* flap amplitude: deep near landing/take-off, shallow in cruise */
    c.flapAmp = 0.62 + flare*0.85 + leap*0.5;
  } else if (b.kind === 'sit'){
    const s = b.seat;
    pos.set(s.x, s.y + 0.13, s.z);
    /* hop shuffle offset */
    for (const act of c.actions){
      if (act.k === 'hop' && te >= act.t && te < act.t + act.dur){
        const pr = (te - act.t)/act.dur;
        pos.z += act.p.d * Math.sin(Math.PI*smooth(pr));
        break;
      }
    }
    yaw = c.yawPerch; pitch = -0.04; roll = 0;
    const sinceStart = te - b.t0;
    fold = smooth(clamp(Math.min(sinceStart, 1.1)/1.1, 0, 1));
    legExt = 1; tailFan = 0.05;
    c.phase += 0.0*dt;
  } else if (b.kind === 'ground'){
    pos.copy(b.pos);
    yaw = Math.atan2(-1, -0.25); pitch = 0.02; roll = 0;
    fold = 1; legExt = 1; tailFan = 0.06;
  }

  /* fold easing across the frame (wings closing/opening smoothly) */
  if (c.fold === undefined) c.fold = fold;
  c.fold += (fold - c.fold)*clamp(dt*7, 0, 1);
  if (c.legE === undefined) c.legE = legExt;
  c.legE += (legExt - c.legE)*clamp(dt*6, 0, 1);
  if (c.justLanded === undefined) c.justLanded = 0;
  const landedNow = (b.kind === 'sit' && (c.prevKind === 'fly' || c.prevKind === 'hop'));
  if (landedNow && c.prevKey !== b.t0){ c.justLanded = 1; c.prevKey = b.t0;
    if (typeof audioFlutter === 'function') audioFlutter(0.5); }
  if (c.justLanded > 0) c.justLanded = Math.max(0, c.justLanded - dt);
  const departedNow = (b.kind === 'fly' && b.depart && c.prevKind !== 'fly');
  if (departedNow && c.prevKey !== b.t0){ c.prevKey = b.t0;
    if (typeof audioFlutter === 'function') audioFlutter(0.85); }
  if (c.justLanded > 0) c.fold = 1 - smooth(c.justLanded/0.95);
  c.prevKind = b.kind;

  /* ---- discrete actions: head turns, preening, caws, pecks ---- */
  let headYaw = 0, headPitch = 0, beakOpen = 0, bodyDip = 0, ruffle = 0;
  let active = null;
  for (const act of c.actions){
    if (te >= act.t && te < act.t + act.dur){ active = act; }
  }
  if (active){
    const pr = clamp((te - active.t)/active.dur, 0, 1);
    switch (active.k){
      case 'saccade': case 'turn':
        headYaw = active.p.yaw*smooth(Math.min(pr*3, 1))*(1 - smooth(Math.max(0, (pr-0.75)/0.25)));
        headPitch = active.p.pitch*smooth(Math.min(pr*3, 1));
        break;
      case 'lookDown': headPitch = -0.55*smooth(Math.min(pr*4,1))*(1 - smooth(Math.max(0,(pr-0.7)/0.3))); break;
      case 'preen':
        headPitch = -0.85*smooth(Math.min(pr*5,1))*(1 - smooth(Math.max(0,(pr-0.72)/0.28)));
        headYaw = 0.7*Math.sin(pr*Math.PI*3)*smooth(Math.min(pr*5,1));
        break;
      case 'caw':
        headPitch = -0.30*smooth(Math.min(pr*8,1));
        beakOpen = Math.sin(Math.PI*clamp((pr-0.15)/0.7,0,1))*0.55;
        break;
      case 'peck': {
        let d;
        if (pr < 0.30) d = smooth(pr/0.30);
        else if (pr < 0.52) d = 1;
        else d = 1 - smooth((pr-0.52)/0.48);
        headPitch = -0.95*d;
        bodyDip = 0.10*d;
        beakOpen = (pr > 0.24 && pr < 0.48) ? 0.35 : 0;
        break;
      }
      case 'hop': bodyDip = -0.06*Math.sin(pr*Math.PI); break;
      case 'shuffle': ruffle = Math.sin(pr*Math.PI); break;
    }
    if (active.k === 'caw' && !c.cawArmed && pr > 0.12){
      c.cawArmed = true;
      if (typeof audioCaw === 'function') audioCaw(1.0);
    }
    if (active.k !== 'caw') c.cawArmed = false;
  } else c.cawArmed = false;

  /* ---- write transforms ---- */
  M.root.position.copy(pos);
  c.tmpE.set(pitch + bodyDip*(b.kind === 'ground' ? 0.6 : 0), yaw, roll + bank*0.35, 'YXZ');
  c.tmpQ.setFromEuler(c.tmpE);
  /* smooth any attitude discontinuities (turns, seam) */
  if (!c.initQ){ c.quat.copy(c.tmpQ); c.initQ = true; }
  c.quat.slerp(c.tmpQ, clamp(dt*9, 0, 1));
  M.root.quaternion.copy(c.quat);

  M.head.rotation.set(headPitch, headYaw, 0, 'YXZ');
  M.jaw.rotation.x = beakOpen;

  /* wings */
  const ph = c.phase;
  const foldA = c.fold;
  for (const w of M.wings){
    const side = w.side;
    /* flap: asymmetric stroke, tip lags the arm */
    const a1 = Math.sin(ph)*0.62 + Math.sin(ph*2 + 0.9)*0.24;
    const a2 = Math.sin(ph - 0.55)*0.62 + Math.sin(ph*2 + 0.2)*0.24;
    const amp = (c.flapAmp === undefined ? 0.6 : c.flapAmp);
    const spread = lerp(-0.06, a1*amp, 1 - foldA);      // dihedral when open
    const spreadH = lerp(-0.02, a2*amp, 1 - foldA);
    /* folded pose: swept back and wrapped down along the body */
    const sweepF = 1.32, rollF = 0.55*1, dihF = -0.10;
    const sweep = lerp(sweepF, -0.10, 1 - foldA);
    const roll = lerp(rollF, 0.10, 1 - foldA);
    const dih = lerp(dihF, spread, 1 - foldA);
    w.armG.rotation.set(roll*0.5, side*sweep, side*(dih), 'YXZ');
    const handFold = lerp(0.95, 0.10 + Math.max(0, spreadH)*0.35, 1 - foldA);
    w.handG.rotation.set(0, side*handFold, side*spreadH*0.55*(1-foldA) - side*0.18*foldA, 'YXZ');
  }
  /* tail */
  const fan = tailFan + ruffle*0.5;
  M.tail.rotation.x = -0.10 - flare*0.55 - ruffle*0.2 + (b.kind==='ground'? 0.06:0);
  for (let i=0;i<M.tailFeathers.length;i++){
    const f = M.tailFeathers[i];
    f.rotation.y = (i - 2.5)/2.5*(0.34 + fan*0.55);
  }
  /* legs */
  for (const lg of M.legs){
    lg.rotation.x = lerp(1.35, -0.06, c.legE);
    lg.rotation.z = lerp(0.15, 0, c.legE);
  }
}

const QUAD_VS = `

      c += (texture2D(tSrc, vUv + uDir*1.384615).rgb + texture2D(tSrc, vUv - uDir*1.384615).rgb) * 0.3162162;

  vertexShader: QUAD_VS,
  fragmentShader: `
    uniform sampler2D tSrc; uniform sampler2D tDepth;

});
window.__matComposite = matComposite; window.__matRays = matRays;

const dpr = () => Math.min(window.devicePixelRatio || 1, 1.75);
function resize(){
  const w = window.innerWidth, h = window.innerHeight, r = dpr();
  renderer.setPixelRatio(r);
  renderer.setSize(w, h);
  camera.aspect = w/h;
  camera.updateProjectionMatrix();
  const W = Math.floor(w*r), H = Math.floor(h*r);
  for (const rt of [rtScene, rtSceneA, rtSceneB, rtRays, rtRaysA, rtRaysB]) if (rt) rt.dispose();
  rtScene  = makeRT(W, H, true);
  rtSceneA = makeRT(W >> 1, H >> 1, false);
  rtSceneB = makeRT(W >> 1, H >> 1, false);
  rtRays   = makeRT(W >> 2, H >> 2, false);
  rtRaysA  = makeRT(W >> 2, H >> 2, false);
  rtRaysB  = makeRT(W >> 2, H >> 2, false);
  matComposite.uniforms.uRes.value.set(W, H);
  matComposite.uniforms.uNear.value = camera.near;
  matComposite.uniforms.uFar.value = camera.far;
}
window.addEventListener('resize', resize);
resize();

/* ---------------- optional ambience (procedural Web Audio) ---------------- */
let AC = null, master = null, audioOn = false, reverb = null, cawTimer = 6;
function initAudio(){
  if (AC) return;
  const Ctx = window.AudioContext || window.webkitAudioContext;
  if (!Ctx) return;
  try { AC = new Ctx(); } catch(e){ return; }
  master = AC.createGain(); master.gain.value = 0.0001;
  master.connect(AC.destination);
  /* procedural impulse for distance */
  reverb = AC.createConvolver();
  const rl = Math.floor(AC.sampleRate*2.4);
  const rbuf = AC.createBuffer(2, rl, AC.sampleRate);
  for (let ch=0; ch<2; ch++){
    const dd = rbuf.getChannelData(ch);
    for (let i=0;i<rl;i++)
      dd[i] = (Math.random()*2-1)*Math.pow(1 - i/rl, 2.8)*(i < 800 ? i/800 : 1)*0.6;
  }
  reverb.buffer = rbuf;
  const rg = AC.createGain(); rg.gain.value = 0.4;
  reverb.connect(rg); rg.connect(master);
  /* cold breeze: looping noise through slow-breathing filters */
  const nlen = AC.sampleRate*4;
  const nbuf = AC.createBuffer(1, nlen, AC.sampleRate);
  const nd = nbuf.getChannelData(0);
  let lp = 0;
  for (let i=0;i<nlen;i++){
    const white = Math.random()*2-1;
    lp = lp*0.965 + white*0.035;
    nd[i] = white*0.45 + lp*3.0;
  }
  const src = AC.createBufferSource(); src.buffer = nbuf; src.loop = true;
  const lpf = AC.createBiquadFilter(); lpf.type = 'lowpass'; lpf.frequency.value = 340; lpf.Q.value = 0.6;
  const hpf = AC.createBiquadFilter(); hpf.type = 'highpass'; hpf.frequency.value = 55;
  const bg = AC.createGain(); bg.gain.value = 0.13;
  src.connect(hpf); hpf.connect(lpf); lpf.connect(bg); bg.connect(master);
  const lfo = AC.createOscillator(); lfo.frequency.value = 0.055;
  const lg = AC.createGain(); lg.gain.value = 150;
  lfo.connect(lg); lg.connect(lpf.frequency); lfo.start();
  const lfo2 = AC.createOscillator(); lfo2.frequency.value = 0.041;
  const lg2 = AC.createGain(); lg2.gain.value = 0.055;
  lfo2.connect(lg2); lg2.connect(bg.gain); lfo2.start();
  src.start();
  /* reusable flutter noise */
  const flen = Math.floor(AC.sampleRate*0.55);
  const fbuf = AC.createBuffer(1, flen, AC.sampleRate);
  const fd = fbuf.getChannelData(0);
  for (let i=0;i<flen;i++){
    const t = i/AC.sampleRate;
    const env = Math.max(0, Math.sin(t/0.55*Math.PI)) * (0.5 + 0.5*Math.sin(t*46));
    fd[i] = (Math.random()*2-1)*env*env;
  }
  AC.__flutterBuf = fbuf;
}
function audioCaw(vol){
  if (!audioOn || !AC) return;
  const t = AC.currentTime + 0.01;
  const dur = 0.36;
  const g = AC.createGain();
  const bp = AC.createBiquadFilter();
  bp.type = 'bandpass'; bp.frequency.value = 1180; bp.Q.value = 1.6;
  const osc = AC.createOscillator();
  osc.type = 'sawtooth';
  osc.frequency.setValueAtTime(760, t);
  osc.frequency.exponentialRampToValueAtTime(470, t + dur*0.75);
  osc.frequency.exponentialRampToValueAtTime(400, t + dur);
  const rasp = AC.createOscillator(); rasp.type = 'square'; rasp.frequency.value = 38;
  const rG = AC.createGain(); rG.gain.value = 0.42;
  rasp.connect(rG); rG.connect(g.gain);
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(0.42*vol, t + 0.018);
  g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  osc.connect(bp); bp.connect(g);
  const pan = AC.createStereoPanner ? AC.createStereoPanner() : null;
  const out = pan || AC.createGain();
  if (pan) pan.pan.value = rr(-0.6, 0.6);
  g.connect(out); out.connect(master); out.connect(reverb);
  osc.start(t); osc.stop(t + dur + 0.05);
  rasp.start(t); rasp.stop(t + dur + 0.05);
}
function audioFlutter(vol){
  if (!audioOn || !AC || !AC.__flutterBuf) return;
  const t = AC.currentTime + 0.01;
  const src = AC.createBufferSource();
  src.buffer = AC.__flutterBuf;
  const f = AC.createBiquadFilter(); f.type = 'bandpass';
  f.frequency.value = 900; f.Q.value = 0.8;
  const g = AC.createGain();
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(0.30*vol, t + 0.04);
  g.gain.exponentialRampToValueAtTime(0.001, t + 0.5);
  src.connect(f); f.connect(g); g.connect(master);
  src.start(t); src.stop(t + 0.6);
}
(function wireHint(){
  const hint = document.getElementById('hint');
  if (!hint) return;
  hint.addEventListener('click', (e) => {
    e.stopPropagation();
    initAudio();
    if (!AC) return;
    if (AC.state === 'suspended') AC.resume();
    audioOn = true;
    master.gain.cancelScheduledValues(AC.currentTime);
    master.gain.setTargetAtTime(0.85, AC.currentTime, 0.7);
    hint.style.opacity = '0';
    hint.style.pointerEvents = 'none';
    setTimeout(() => { hint.style.display = 'none'; }, 1400);
  }, { once: false });
})();
/* ============================================================
   CH7 — MAIN LOOP, PASSES, DEBUG HOOKS
   ============================================================ */
const sstep = (a, b, x) => { const t = clamp((x - a)/(b - a), 0, 1); return t*t*(3 - 2*t); };
let sceneTime = 0, lastNow = -1, paused = false;
let fps = 0, fpsAcc = 0, fpsN = 0, readyFlag = false;
let sceneCalls = 0, sceneTris = 0;
const sunClipV = new THREE.Vector3();

function frame(now){
  requestAnimationFrame(frame);
  if (lastNow < 0) lastNow = now;
  const dt = clamp((now - lastNow)/1000, 0, 0.05);
  lastNow = now;
  if (!paused) sceneTime = (sceneTime + dt) % LOOP;
  fpsAcc += dt; fpsN++;
  if (fpsAcc >= 0.5){ fps = Math.round(fpsN/Math.max(fpsAcc, 1e-4)); fpsAcc = 0; fpsN = 0; }
  const T = sceneTime;

  /* ---- evolve light / mist / frost through the loop ---- */
  updateEnv(T);
  updateCamera(T);
  camera.updateMatrixWorld();
  camera.matrixWorldInverse.copy(camera.matrixWorld).invert();
  U.sunView.value.copy(sunWorldV).transformDirection(camera.matrixWorldInverse);
  for (const ml of mistLayers) ml.position.y = ml.userData.baseY + U.lift.value*0.55;
  for (const c of crows) updateCrow(c, T, dt);
  if (audioOn){
    cawTimer -= dt;
    if (cawTimer <= 0){ audioCaw(rr(0.2, 0.38)); cawTimer = rr(7, 16); }
  }

  /* ---- pass 1: scene into HDR target ---- */
  renderer.setRenderTarget(rtScene);
  renderer.render(scene, camera);
  sceneCalls = renderer.info.render.calls;
  sceneTris = renderer.info.render.triangles;

  /* ---- pass 2: half-res defocus blur (separable) ---- */
  matBlur.uniforms.tSrc.value = rtScene.texture;
  matBlur.uniforms.uDir.value.set(1.7/rtSceneA.width, 0);
  fsPass(matBlur, rtSceneA);
  matBlur.uniforms.tSrc.value = rtSceneA.texture;
  matBlur.uniforms.uDir.value.set(0, 1.7/rtSceneA.height);
  fsPass(matBlur, rtSceneB);

  /* ---- pass 3: screen-space volumetric shafts from the sun ---- */
  sunClipV.copy(camera.position).addScaledVector(sunWorldV, 250).project(camera);
  const su = matRays.uniforms.uSunUV.value;
  su.set(sunClipV.x*0.5 + 0.5, sunClipV.y*0.5 + 0.5);
  const front = 1 - sstep(-0.30, 0.05, U.sunView.value.z);
  const inside = sstep(-0.30, 0.10, su.x)*(1 - sstep(0.90, 1.30, su.x))
               * sstep(-0.30, 0.10, su.y)*(1 - sstep(0.90, 1.30, su.y));
  matRays.uniforms.uStrength.value = 0.42*front*inside;
  matRays.uniforms.tSrc.value = rtScene.texture;
  matRays.uniforms.tDepth.value = rtScene.depthTexture;
  fsPass(matRays, rtRays);
  matBlur.uniforms.tSrc.value = rtRays.texture;
  matBlur.uniforms.uDir.value.set(1.6/rtRaysA.width, 0);
  fsPass(matBlur, rtRaysA);
  matBlur.uniforms.tSrc.value = rtRaysA.texture;
  matBlur.uniforms.uDir.value.set(0, 1.6/rtRaysA.height);
  fsPass(matBlur, rtRaysB);

  /* ---- pass 4: composite — DoF, shafts, ACES, vignette, grain ---- */
  const cu = matComposite.uniforms;
  cu.tScene.value = rtScene.texture;
  cu.tBlur.value = rtSceneB.texture;
  cu.tRays.value = rtRaysB.texture;
  cu.tDepth.value = rtScene.depthTexture;
  cu.uFocus.value = uFocus;
  cu.uNow.value = now/1000;
  renderer.setRenderTarget(null);
  fsPass(matComposite, null);
  runPixRequest();

  if (!readyFlag){
    readyFlag = true;
    window.__ready = true;
    const ld = document.getElementById('loading');
    if (ld){
      ld.style.transition = 'opacity 1.4s ease';
      ld.style.opacity = '0';
      ld.style.pointerEvents = 'none';
      setTimeout(() => { ld.style.display = 'none'; }, 1600);
    }
  }
}
window.__setTime = (s) => { sceneTime = ((s % LOOP) + LOOP) % LOOP; };
window.__pause = (v) => { paused = v !== false; };
window.__unpause = () => { paused = false; };
window.__info = () => ({
  time: +sceneTime.toFixed(2), fps, paused,
  calls: sceneCalls, tris: sceneTris, dpr: dpr()
});
/* pixel probe: analyze the composited frame after the render passes */
let pixReq = null;
window.__analyze = (cols, rows) => new Promise((resolve) => {
  pixReq = { cols: cols || 24, rows: rows || 14, resolve };
});
window.__probe = (pts) => new Promise((resolve) => {
  pixReq = { probe: pts, resolve };
});
function runPixRequest(){
  if (!pixReq) return;
  const req = pixReq;
  pixReq = null;
  const gl = renderer.getContext();
  const W = renderer.domElement.width, H = renderer.domElement.height;
  const buf = new Uint8Array(W*H*4);
  gl.readPixels(0, 0, W, H, gl.RGBA, gl.UNSIGNED_BYTE, buf);
  if (req.probe){
    const out = req.probe.map((p) => {
      const cx = Math.round(p[0]*W), cyT = Math.round(p[1]*H);
      let r = 0, g = 0, b = 0, c = 0;
      for (let dy=-4; dy<=4; dy++) for (let dx=-4; dx<=4; dx++){
        const x = cx + dx, y = H - 1 - (cyT + dy);
        if (x < 0 || y < 0 || x >= W || y >= H) continue;
        const i = (y*W + x)*4;
        r += buf[i]; g += buf[i+1]; b += buf[i+2]; c++;
      }
      return [Math.round(r/c), Math.round(g/c), Math.round(b/c), c];
    });
    req.resolve(out);
    return;
  }
  const { cols, rows, resolve } = req;
  /* gl rows are bottom-up: grid rows here are TOP-down (screen order) */
  const grid = [];
  let sumR = 0, sumG = 0, sumB = 0, n = 0;
  let lumMin = 255, lumMax = 0, lumSum = 0, lumSq = 0;
  let black = 0, blown = 0;
  for (let gy=0; gy<rows; gy++){
    const row = [];
    const y0 = Math.floor((rows-1-gy)*H/rows), y1 = Math.floor((rows-gy)*H/rows);
    for (let gx=0; gx<cols; gx++){
      const x0 = Math.floor(gx*W/cols), x1 = Math.floor((gx+1)*W/cols);
      let r = 0, g = 0, b = 0, c = 0;
      const stepX = Math.max(1, Math.floor((x1-x0)/6));
      const stepY = Math.max(1, Math.floor((y1-y0)/6));
      for (let y=y0; y<y1; y+=stepY) for (let x=x0; x<x1; x+=stepX){
        const i = (y*W + x)*4;
        r += buf[i]; g += buf[i+1]; b += buf[i+2]; c++;
      }
      row.push([Math.round(r/c), Math.round(g/c), Math.round(b/c)]);
    }
    grid.push(row);
  }
  for (let i=0;i<buf.length;i+=4){
    const l = buf[i]*0.2126 + buf[i+1]*0.7152 + buf[i+2]*0.0722;
    lumSum += l; lumSq += l*l; n++;
    if (l < lumMin) lumMin = l;
    if (l > lumMax) lumMax = l;
    if (l < 6) black++;
    if (l > 252) blown++;
  }
  const mean = lumSum/n;
  resolve({
    grid, cols, rows,
    mean: [Math.round(sumR/n), Math.round(sumG/n), Math.round(sumB/n)],
    lum: { min: Math.round(lumMin), max: Math.round(lumMax),
           avg: +mean.toFixed(1), std: +Math.sqrt(lumSq/n - mean*mean).toFixed(1) },
    fracBlack: +(black/n).toFixed(4), fracBlown: +(blown/n).toFixed(4),
    w: W, h: H
  });
}
requestAnimationFrame(frame);
</script>
</body>

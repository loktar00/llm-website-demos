<!DOCTYPE html>
<html lang="en">
<head>

<style>
  html,body{margin:0;padding:0;height:100%;background:#090c12;overflow:hidden;
    font-family:Georgia,'Times New Roman',serif;}

  #loading{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;
    color:#c9b9a2;background:#090c12;z-index:20;letter-spacing:.4em;font-size:13px;text-transform:uppercase;
    transition:opacity 1.4s ease;pointer-events:none;}
  #loading small{display:block;margin-top:14px;letter-spacing:.22em;font-size:10px;color:#6d665a;
    text-transform:none;font-style:italic}
  #hint{position:fixed;left:14px;bottom:12px;z-index:15;color:#dcd3c4;background:rgba(10,14,22,.42);
    border:1px solid rgba(220,211,196,.20);border-radius:3px;padding:5px 11px;font-size:11px;letter-spacing:.14em;
    text-transform:uppercase;cursor:pointer;backdrop-filter:blur(3px);user-select:none;transition:opacity .6s;
    opacity:.92}
  #hint:hover{background:rgba(28,34,46,.62)}

</style>

<body>
<div id="loading">The Patch at Dawn<small>a cold, misty late-October morning</small></div>
<div id="hint">&#9834; click for sound</div>
<script>
/* capture shader/driver diagnostics for self-review (harmless pass-through) */
window.__errs = [];
(function(){
  const ce = console.error.bind(console);
  console.error = function(){
    try { window.__errs.push(Array.prototype.slice.call(arguments).map(String).join(' ')); } catch(e){}
    ce.apply(null, arguments);
  };
})();
</script>
<script type="module">
/* ============================================================
   THE PATCH AT DAWN — a photorealistic real-time dawn scene
   everything procedural: geometry, textures, light, mist, birds
   ============================================================ */

/* ---------- three.js (library only; no images/models fetched) ---------- */
const CDN = [
  'https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.module.js',
  'https://unpkg.com/three@0.160.1/build/three.module.js',
  'https://esm.sh/three@0.160.1'
];
let THREE = null, loadErr = '';
for (const u of CDN){
  try { const m = await import(u); if (m && m.WebGLRenderer){ THREE = m; break; } }
  catch(e){ loadErr = loadErr || e.message; }
}
if (!THREE){
  const el = document.getElementById('loading');
  el.innerHTML = 'could not load three.js &mdash; ' + loadErr;
  throw new Error('three.js failed to load: ' + loadErr);
}

/* ---------- deterministic random ---------- */
function mulberry(seed){
  let a = seed >>> 0;
  return function(){
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
const rnd = mulberry(19741031);
const rr  = (a,b) => a + (b-a)*rnd();
const ri  = (a,b) => Math.floor(a + (b-a+1)*rnd());
const pick = arr => arr[Math.floor(rnd()*arr.length) % arr.length];
const clamp = (x,a,b) => x < a ? a : (x > b ? b : x);
const lerp  = (a,b,t) => a + (b-a)*t;
const smooth = t => { t = clamp(t,0,1); return t*t*(3-2*t); };
const smoother = t => { t = clamp(t,0,1); return t*t*t*(t*(t*6-15)+10); };
const fract = x => x - Math.floor(x);
const TAU = Math.PI*2;

/* ---------- value noise / fbm ---------- */
function hashN(x,y){ return fract(Math.sin(x*127.1 + y*311.7) * 43758.5453123); }
function vnoise(x,y){
  const xi = Math.floor(x), yi = Math.floor(y), xf = x-xi, yf = y-yi;
  const u = xf*xf*(3-2*xf), v = yf*yf*(3-2*yf);
  const a = hashN(xi,yi), b = hashN(xi+1,yi), c = hashN(xi,yi+1), d = hashN(xi+1,yi+1);
  return a + (b-a)*u + (c-a)*v + (a-b-c+d)*u*v;
}
function fbm(x,y,oct){
  oct = oct || 4;
  let s = 0, amp = 0.5, f = 1;
  for (let i=0;i<oct;i++){ s += amp*vnoise(x*f, y*f); f *= 2.03; amp *= 0.5; }
  return s;
}
/* eased segment parameter with independent start/end speeds */
function easeSeg(u, s0, s1){
  u = clamp(u,0,1);
  const a = 1 - (s0+s1)/2, c = (s0-s1)/2;
  return u - a*Math.sin(TAU*u)/TAU + c*(u - u*u);
}

/* ---------- canvas / texture helpers ---------- */
function mkCanvas(w,h){ const c = document.createElement('canvas'); c.width=w; c.height=h;
  c.getContext('2d', { willReadFrequently:true }); return c; }
function texFrom(canvas, opts){
  opts = opts || {};
  const t = new THREE.CanvasTexture(canvas);
  if (opts.srgb !== false) t.colorSpace = THREE.SRGBColorSpace;
  t.anisotropy = opts.aniso || 8;
  if (opts.repeat){ t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(opts.repeat[0], opts.repeat[1]); }
  else { t.wrapS = t.wrapT = THREE.RepeatWrapping; }
  t.needsUpdate = true;
  return t;
}
/* derive a tangent-space normal map from a greyscale height canvas */
function normalFromHeight(hc, strength){
  strength = strength === undefined ? 2.2 : strength;
  const w = hc.width, h = hc.height;
  const src = hc.getContext('2d').getImageData(0,0,w,h).data;
  const out = mkCanvas(w,h);
  const octx = out.getContext('2d');
  const img = octx.createImageData(w,h);
  const d = img.data;
  const H = (x,y) => {
    x = (x+w)%w; y = (y+h)%h;
    return src[(y*w+x)*4] / 255;
  };
  for (let y=0;y<h;y++){
    for (let x=0;x<w;x++){
      const dx = (H(x+1,y)-H(x-1,y)) * strength;
      const dy = (H(x,y+1)-H(x,y-1)) * strength;
      let nx = -dx, ny = -dy, nz = 1;
      const l = Math.hypot(nx,ny,nz);
      const i = (y*w+x)*4;
      d[i]   = Math.round((nx/l*0.5+0.5)*255);
      d[i+1] = Math.round((ny/l*0.5+0.5)*255);
      d[i+2] = Math.round((nz/l*0.5+0.5)*255);
      d[i+3] = 255;
    }
  }
  octx.putImageData(img,0,0);
  return out;
}
function grayCanvasFrom(canvas){
  const w = canvas.width, h = canvas.height;
  const g = mkCanvas(w,h), c = g.getContext('2d');
  c.drawImage(canvas,0,0);
  const img = c.getImageData(0,0,w,h), d = img.data;
  for (let i=0;i<d.length;i+=4){
    const v = Math.round(d[i]*0.35 + d[i+1]*0.5 + d[i+2]*0.15);
    d[i]=d[i+1]=d[i+2]=v;
  }
  c.putImageData(img,0,0);
  return g;
}

/* ---------- small color helpers ---------- */
function hexRGB(h){ return [((h>>16)&255)/255, ((h>>8)&255)/255, (h&255)/255]; }
function mixRGB(a,b,t){ return [lerp(a[0],b[0],t), lerp(a[1],b[1],t), lerp(a[2],b[2],t)]; }
function scaleRGB(a,s){ return [a[0]*s, a[1]*s, a[2]*s]; }

/* ============================================================
   PROCEDURAL CANVAS TEXTURES (nothing fetched, all drawn in code)
   ============================================================ */
const TEX = {};

/* ---- damp field soil: dark clods, stones, straw flecks, wet patches ---- */
function buildSoilTextures(){
  const W = 1024;
  const col = mkCanvas(W,W), c = col.getContext('2d');
  const hgt = mkCanvas(W,W), h = hgt.getContext('2d');
  // base tone
  c.fillStyle = '#3a3129'; c.fillRect(0,0,W,W);
  h.fillStyle = '#808080'; h.fillRect(0,0,W,W);

  // large-scale damp/dry mottling
  for (let i=0;i<900;i++){
    const x = rr(0,W), y = rr(0,W), r = rr(14,90);
    const wet = rnd() < 0.55;
    const g = c.createRadialGradient(x,y,0,x,y,r);
    const tone = wet ? [44,37,31] : [78,68,56];
    const a = rr(0.05,0.22);
    g.addColorStop(0, `rgba(${tone[0]},${tone[1]},${tone[2]},${a})`);
    g.addColorStop(1, `rgba(${tone[0]},${tone[1]},${tone[2]},0)`);
    c.fillStyle = g; c.beginPath(); c.arc(x,y,r,0,TAU); c.fill();
    const hg = h.createRadialGradient(x,y,0,x,y,r);
    hg.addColorStop(0, wet ? 'rgba(40,40,40,0.35)' : 'rgba(190,190,190,0.30)');
    hg.addColorStop(1, 'rgba(128,128,128,0)');
    h.fillStyle = hg; h.beginPath(); h.arc(x,y,r,0,TAU); h.fill();
  }
  // clods: small shaded lumps
  for (let i=0;i<2600;i++){
    const x = rr(0,W), y = rr(0,W), r = rr(2.5,9), q = rr(0,TAU);
    const lit = 0.5 + 0.5*Math.cos(q - 2.2);
    c.save(); c.translate(x,y); c.rotate(q);
    c.fillStyle = `rgba(${Math.round(58+42*lit)},${Math.round(50+36*lit)},${Math.round(42+30*lit)},${rr(.35,.8)})`;
    c.beginPath(); c.ellipse(0,0,r,r*rr(.55,.9),0,0,TAU); c.fill();
    c.fillStyle = `rgba(20,16,13,${rr(.15,.4)})`;
    c.beginPath(); c.ellipse(r*0.35, r*0.4, r*0.7, r*0.5, 0, 0, TAU); c.fill();
    h.save(); h.translate(x,y); h.rotate(q);
    const hg2 = h.createRadialGradient(-r*0.3,-r*0.3,0, 0,0,r);
    hg2.addColorStop(0,'rgba(235,235,235,0.75)'); hg2.addColorStop(1,'rgba(60,60,60,0.5)');
    h.fillStyle = hg2; h.beginPath(); h.ellipse(0,0,r,r*0.7,0,0,TAU); h.fill(); h.restore();
    c.restore();
  }
  // small stones
  for (let i=0;i<420;i++){
    const x = rr(0,W), y = rr(0,W), r = rr(1.6,4.5);
    const t = ri(120,168);
    c.fillStyle = `rgba(${t},${t-6},${t-16},${rr(.5,.9)})`;
    c.beginPath(); c.ellipse(x,y,r,r*rr(.6,1),rr(0,TAU),0,TAU); c.fill();
    h.fillStyle = `rgba(245,245,245,0.85)`;
    h.beginPath(); h.ellipse(x,y,r,r*0.85,0,0,TAU); h.fill();
  }
  // straw / root flecks
  for (let i=0;i<900;i++){
    const x = rr(0,W), y = rr(0,W), a = rr(0,TAU), len = rr(6,26);
    c.strokeStyle = `rgba(${ri(150,190)},${ri(130,165)},${ri(84,112)},${rr(.2,.55)})`;
    c.lineWidth = rr(0.6,1.6);
    c.beginPath(); c.moveTo(x,y);
    c.quadraticCurveTo(x+Math.cos(a)*len*0.5+rr(-4,4), y+Math.sin(a)*len*0.5+rr(-4,4),
                       x+Math.cos(a)*len, y+Math.sin(a)*len);
    c.stroke();
  }
  // fine grain
  const gi = c.getImageData(0,0,W,W), gd = gi.data;
  for (let i=0;i<gd.length;i+=4){
    const n = (rnd()-0.5)*26;
    gd[i]=clamp(gd[i]+n,0,255); gd[i+1]=clamp(gd[i+1]+n,0,255); gd[i+2]=clamp(gd[i+2]+n,0,255);
  }
  c.putImageData(gi,0,0);

  TEX.soilCol = texFrom(col, {repeat:[1,1]});
  TEX.soilNrm = texFrom(normalFromHeight(hgt, 2.6), {srgb:false, repeat:[1,1]});

  // roughness: wet (dark) = smooth, dry (light) = rough
  const g2 = grayCanvasFrom(col), r2 = g2.getContext('2d');
  const ri2 = r2.getImageData(0,0,W,W), rd = ri2.data;
  for (let i=0;i<rd.length;i+=4){
    // brighter soil grains -> rougher; dark -> wetter/slicker
    rd[i]=rd[i+1]=rd[i+2]=clamp(252 - rd[i]*0.62, 40, 255);
  }
  r2.putImageData(ri2,0,0);
  TEX.soilRgh = texFrom(g2, {srgb:false, repeat:[1,1]});
}

/* ---- weathered split-rail wood, grain along U ---- */
function buildWoodTextures(){
  const W = 512, H = 256;
  const col = mkCanvas(W,H), c = col.getContext('2d');
  const hgt = mkCanvas(W,H), h = hgt.getContext('2d');
  c.fillStyle = '#8d867a'; c.fillRect(0,0,W,H);
  h.fillStyle = '#7d7d7d'; h.fillRect(0,0,W,H);
  // long grain lines along X
  for (let i=0;i<340;i++){
    const y0 = rr(0,H), amp = rr(1,7), f = rr(0.004,0.014), ph = rr(0,TAU);
    const dark = rnd() < 0.6;
    c.strokeStyle = dark
      ? `rgba(${ri(74,104)},${ri(70,98)},${ri(62,88)},${rr(.14,.5)})`
      : `rgba(${ri(178,206)},${ri(172,198)},${ri(158,182)},${rr(.1,.3)})`;
    c.lineWidth = rr(0.6,2.6);
    c.beginPath();
    for (let x=0;x<=W;x+=8){
      const y = y0 + Math.sin(x*f+ph)*amp + fbm(x*0.02, y0*0.15, 3)*6;
      x===0 ? c.moveTo(x,y) : c.lineTo(x,y);
    }
    c.stroke();
    h.strokeStyle = dark ? 'rgba(50,50,50,0.30)' : 'rgba(215,215,215,0.26)';
    h.lineWidth = c.lineWidth;
    h.beginPath();
    for (let x=0;x<=W;x+=8){
      const y = y0 + Math.sin(x*f+ph)*amp + fbm(x*0.02, y0*0.15, 3)*6;
      x===0 ? h.moveTo(x,y) : h.lineTo(x,y);
    }
    h.stroke();
  }
  // splits / checks
  for (let i=0;i<26;i++){
    const y0 = rr(0,H), x0 = rr(0,W*0.7), len = rr(50,220);
    c.strokeStyle = `rgba(40,36,31,${rr(.3,.7)})`; c.lineWidth = rr(0.8,2.2);
    c.beginPath(); c.moveTo(x0,y0);
    for (let x=0;x<len;x+=6) c.lineTo(x0+x, y0 + fbm((x0+x)*0.05, i*3.7, 2)*8 - 4);
    c.stroke();
    h.strokeStyle = 'rgba(20,20,20,0.8)'; h.lineWidth = c.lineWidth;
    h.beginPath(); h.moveTo(x0,y0);
    for (let x=0;x<len;x+=6) h.lineTo(x0+x, y0 + fbm((x0+x)*0.05, i*3.7, 2)*8 - 4);
    h.stroke();
  }
  // knots
  for (let i=0;i<7;i++){
    const x = rr(20,W-20), y = rr(18,H-18), r = rr(7,16);
    for (let k=5;k>0;k--){
      c.strokeStyle = `rgba(${ri(56,80)},${ri(50,72)},${ri(44,64)},0.5)`;
      c.lineWidth = 1.4;
      c.beginPath(); c.ellipse(x,y,r*k/5,r*k/5*rr(.6,.9),rr(0,1),0,TAU); c.stroke();
      h.strokeStyle = 'rgba(60,60,60,0.45)'; h.lineWidth = 1.4;
      h.beginPath(); h.ellipse(x,y,r*k/5,r*k/5*0.8,0,0,TAU); h.stroke();
    }
    c.fillStyle = 'rgba(46,40,34,0.75)';
    c.beginPath(); c.ellipse(x,y,r*0.28,r*0.22,0,0,TAU); c.fill();
  }
  // green-grey algae / lichen blotches + silvering
  for (let i=0;i<140;i++){
    const x = rr(0,W), y = rr(0,H), r = rr(8,46);
    const g = c.createRadialGradient(x,y,0,x,y,r);
    const greenish = rnd() < 0.45;
    g.addColorStop(0, greenish ? `rgba(120,128,104,${rr(.08,.22)})` : `rgba(206,202,192,${rr(.06,.18)})`);
    g.addColorStop(1, 'rgba(140,140,130,0)');
    c.fillStyle = g; c.beginPath(); c.arc(x,y,r,0,TAU); c.fill();
  }
  const gi = c.getImageData(0,0,W,H), gd = gi.data;
  for (let i=0;i<gd.length;i+=4){
    const n = (rnd()-0.5)*18;
    gd[i]=clamp(gd[i]+n,0,255); gd[i+1]=clamp(gd[i+1]+n,0,255); gd[i+2]=clamp(gd[i+2]+n,0,255);
  }
  c.putImageData(gi,0,0);
  TEX.woodCol = texFrom(col);
  TEX.woodNrm = texFrom(normalFromHeight(hgt, 2.0), {srgb:false});
}

/* ---- vine leaf: veins, mottle, fuzz ---- */
function buildLeafTextures(){
  const S = 512;
  const col = mkCanvas(S,S), c = col.getContext('2d');
  const hgt = mkCanvas(S,S), h = hgt.getContext('2d');
  c.fillStyle = '#5d6a42'; c.fillRect(0,0,S,S);
  h.fillStyle = '#707070'; h.fillRect(0,0,S,S);
  // mottle
  for (let i=0;i<700;i++){
    const x = rr(0,S), y = rr(0,S), r = rr(6,54);
    const g = c.createRadialGradient(x,y,0,x,y,r);
    const dark = rnd()<0.5;
    g.addColorStop(0, dark ? `rgba(58,70,40,${rr(.06,.2)})` : `rgba(128,138,84,${rr(.05,.16)})`);
    g.addColorStop(1,'rgba(96,106,66,0)');
    c.fillStyle=g; c.beginPath(); c.arc(x,y,r,0,TAU); c.fill();
  }
  // vein network radiating from bottom-center (leaf base at v=0)
  const drawVeins = (ctx, colA, wMul, hgtCol) => {
    const branches = [[0.5,1.0,0.0],[0.5,1.0,-0.42],[0.5,1.0,0.42],[0.5,1.0,-0.85],[0.5,1.0,0.85]];
    for (const [bx,by,ang] of branches){
      ctx.strokeStyle = colA; ctx.lineWidth = 5*wMul;
      ctx.beginPath(); ctx.moveTo(S*0.5, S*1.0);
      const len = S*1.05;
      let px = S*0.5, py = S*1.0;
      for (let t=0.05;t<=1.001;t+=0.05){
        const a = -Math.PI/2 + ang*t;
        px = S*0.5 + Math.cos(a+Math.PI/2)*0 + Math.sin(ang*t)*S*0.42*t + (rnd()-0.5)*2;
        py = S*1.0 - t*len*0.98;
        ctx.lineTo(px,py);
        // secondary veins
        if (t>0.12 && rnd()<0.75){
          ctx.lineTo(px + Math.sin(ang*t)*0, py);
        }
      }
      ctx.stroke();
      if (hgtCol){ /* handled below */ }
    }
  };
  drawVeins(c, 'rgba(150,158,104,0.55)', 1, null);
  drawVeins(c, 'rgba(44,54,30,0.42)', 0.55, null);
  // secondary veins: herringbone
  for (let side=-1; side<=1; side+=2){
    for (let i=0;i<16;i++){
      const t = 0.08 + i/16*0.86;
      const x0 = S*0.5 + side*Math.sin(0.5*t)*S*0.36*t*0.4;
      const y0 = S*1.0 - t*S*0.95;
      c.strokeStyle = `rgba(146,154,102,${rr(.2,.42)})`; c.lineWidth = rr(1,2.2);
      c.beginPath(); c.moveTo(x0,y0);
      c.quadraticCurveTo(x0+side*26, y0-16, x0+side*rr(40,66), y0-rr(20,34));
      c.stroke();
      h.strokeStyle = 'rgba(225,225,225,0.55)'; h.lineWidth = 2.0;
      h.beginPath(); h.moveTo(x0,y0);
      h.quadraticCurveTo(x0+side*26, y0-16, x0+side*52, y0-27);
      h.stroke();
    }
  }
  // midrib raised
  h.strokeStyle = 'rgba(240,240,240,0.8)'; h.lineWidth = 6;
  h.beginPath(); h.moveTo(S*0.5,S*1.0); h.quadraticCurveTo(S*0.5,S*0.5,S*0.5,S*0.02); h.stroke();
  // fuzz / speckle
  const gi = c.getImageData(0,0,S,S), gd = gi.data;
  for (let i=0;i<gd.length;i+=4){
    const n = (rnd()-0.5)*22;
    gd[i]=clamp(gd[i]+n,0,255); gd[i+1]=clamp(gd[i+1]+n,0,255); gd[i+2]=clamp(gd[i+2]+n,0,255);
  }
  c.putImageData(gi,0,0);
  TEX.leafCol = texFrom(col);
  TEX.leafNrm = texFrom(normalFromHeight(hgt, 2.4), {srgb:false});
}

/* ---- pumpkin skin detail: pale base so vertex colour drives hue ---- */
function buildPumpkinTextures(){
  const S = 512;
  const col = mkCanvas(S,S), c = col.getContext('2d');
  const hgt = mkCanvas(S,S), h = hgt.getContext('2d');
  c.fillStyle = '#ded4c4'; c.fillRect(0,0,S,S);
  h.fillStyle = '#7f7f7f'; h.fillRect(0,0,S,S);
  // vertical streaking (skin striations)
  for (let i=0;i<420;i++){
    const x = rr(0,S), w = rr(1,4);
    c.strokeStyle = `rgba(${ri(176,220)},${ri(168,210)},${ri(150,192)},${rr(.1,.35)})`;
    c.lineWidth = w;
    c.beginPath(); c.moveTo(x,0);
    for (let y=0;y<=S;y+=32) c.lineTo(x + fbm(y*0.03, i*7.1, 2)*8 - 4, y);
    c.stroke();
  }
  // blemishes / scab spots
  for (let i=0;i<340;i++){
    const x = rr(0,S), y = rr(0,S), r = rr(1.2,6);
    c.fillStyle = `rgba(${ri(120,168)},${ri(104,146)},${ri(84,120)},${rr(.15,.5)})`;
    c.beginPath(); c.ellipse(x,y,r,r*rr(.5,1.1),rr(0,TAU),0,TAU); c.fill();
    h.fillStyle = `rgba(${ri(120,170)},${ri(120,170)},${ri(120,170)},0.5)`;
    h.beginPath(); h.ellipse(x,y,r,r,0,0,TAU); h.fill();
  }
  // warts / bumps
  for (let i=0;i<150;i++){
    const x = rr(0,S), y = rr(0,S), r = rr(2,7);
    const g = h.createRadialGradient(x-r*0.3,y-r*0.3,0,x,y,r);
    g.addColorStop(0,'rgba(255,255,255,0.95)'); g.addColorStop(1,'rgba(70,70,70,0.6)');
    h.fillStyle=g; h.beginPath(); h.arc(x,y,r,0,TAU); h.fill();
    c.fillStyle = `rgba(${ri(196,232)},${ri(186,222)},${ri(168,204)},${rr(.2,.5)})`;
    c.beginPath(); c.arc(x,y,r*0.9,0,TAU); c.fill();
  }
  // soil splash low on the fruit (v < 0.3)
  for (let i=0;i<520;i++){
    const x = rr(0,S), y = S - rr(0,S*0.34), r = rr(3,20)*((S-y)/S+0.25);
    c.fillStyle = `rgba(${ri(74,110)},${ri(64,96)},${ri(52,80)},${rr(.06,.26)})`;
    c.beginPath(); c.ellipse(x,y,r,r*rr(.4,.9),0,0,TAU); c.fill();
  }
  // ground-contact dirt band very bottom
  const gg = c.createLinearGradient(0,S*0.86,0,S);
  gg.addColorStop(0,'rgba(70,58,46,0)'); gg.addColorStop(1,'rgba(56,46,37,0.55)');
  c.fillStyle = gg; c.fillRect(0,S*0.86,S,S*0.14);
  const gi = c.getImageData(0,0,S,S), gd = gi.data;
  for (let i=0;i<gd.length;i+=4){
    const n = (rnd()-0.5)*16;
    gd[i]=clamp(gd[i]+n,0,255); gd[i+1]=clamp(gd[i+1]+n,0,255); gd[i+2]=clamp(gd[i+2]+n,0,255);
  }
  c.putImageData(gi,0,0);
  TEX.pumpCol = texFrom(col);
  TEX.pumpNrm = texFrom(normalFromHeight(hgt, 1.4), {srgb:false});

  // woody stem striations (grain along V)
  const sc = mkCanvas(256,256), s = sc.getContext('2d');
  const sh = mkCanvas(256,256), shh = sh.getContext('2d');
  s.fillStyle = '#9a9276'; s.fillRect(0,0,256,256);
  shh.fillStyle = '#808080'; shh.fillRect(0,0,256,256);
  for (let i=0;i<150;i++){
    const x = rr(0,256);
    s.strokeStyle = `rgba(${ri(96,150)},${ri(96,142)},${ri(70,108)},${rr(.2,.6)})`;
    s.lineWidth = rr(0.8,3);
    s.beginPath(); s.moveTo(x,0);
    for (let y=0;y<=256;y+=24) s.lineTo(x+fbm(y*0.05,i*3.3,2)*10-5, y);
    s.stroke();
    shh.strokeStyle = rnd()<0.5?'rgba(40,40,40,0.5)':'rgba(230,230,230,0.5)';
    shh.lineWidth = s.lineWidth;
    shh.beginPath(); shh.moveTo(x,0);
    for (let y=0;y<=256;y+=24) shh.lineTo(x+fbm(y*0.05,i*3.3,2)*10-5, y);
    shh.stroke();
  }
  TEX.stemCol = texFrom(sc);
  TEX.stemNrm = texFrom(normalFromHeight(sh, 1.8), {srgb:false});
}

/* ---- drifting fog sheet: billowy noise, seamless-ish ---- */
function buildFogTexture(){
  const S = 512, cv = mkCanvas(S,S), c = cv.getContext('2d');
  const img = c.createImageData(S,S), d = img.data;
  for (let y=0;y<S;y++){
    for (let x=0;x<S;x++){
      // seamless via 4-way blend
      const u = x/S, v = y/S;
      const n1 = fbm(u*6, v*6, 5);
      const n2 = fbm((u-1)*6, v*6, 5);
      const n3 = fbm(u*6, (v-1)*6, 5);
      const n4 = fbm((u-1)*6, (v-1)*6, 5);
      const n = lerp(lerp(n1,n2,u), lerp(n3,n4,u), v);
      let a = smooth((n-0.34)/0.5);
      a = Math.pow(a, 1.35);
      const i = (y*S+x)*4;
      const val = Math.round(a*255);
      d[i]=d[i+1]=d[i+2]=255; d[i+3]=val;
    }
  }
  c.putImageData(img,0,0);
  TEX.fog = texFrom(cv, {srgb:false});
}

/* ---- distant tree-line silhouette (alpha strip) ---- */
function buildTreeTexture(){
  const W = 2048, H = 256, cv = mkCanvas(W,H), c = cv.getContext('2d');
  c.clearRect(0,0,W,H);
  const drawTree = (x, baseY, hgt, wid, tone, bare) => {
    c.strokeStyle = tone;
    // trunk
    c.lineWidth = Math.max(2, wid*0.09);
    c.beginPath(); c.moveTo(x, baseY); c.lineTo(x + rr(-6,6), baseY - hgt*0.45); c.stroke();
    // branches
    const nb = bare ? 7 : 5;
    for (let b=0;b<nb;b++){
      const t = rr(0.3,1);
      const y = baseY - hgt*t;
      const dir = rnd()<0.5?-1:1;
      c.lineWidth = Math.max(1.4, wid*0.05*(1-t*0.5));
      c.beginPath(); c.moveTo(x, y + hgt*0.1);
      c.quadraticCurveTo(x + dir*wid*0.4, y - hgt*0.05, x + dir*wid*rr(0.5,0.95), y - hgt*rr(0.02,0.16));
      c.stroke();
    }
    if (!bare){
      // canopy: clusters of soft blobs
      for (let k=0;k<46;k++){
        const a = rr(-Math.PI,0);
        const rad = rr(0.15,1);
        const px = x + Math.cos(a)*wid*rad*0.55;
        const py = baseY - hgt*0.55 + Math.sin(a)*hgt*0.34*rad;
        const r = rr(wid*0.1, wid*0.3);
        c.globalAlpha = rr(0.5,1);
        c.fillStyle = tone;
        c.beginPath(); c.arc(px,py,r,0,TAU); c.fill();
      }
      c.globalAlpha = 1;
    }
  };
  // ground haze line
  const base = H - 6;
  c.fillStyle = 'rgba(64,72,84,1)'; c.fillRect(0, base-3, W, 9);
  let x = -20;
  while (x < W+20){
    const hgt = rr(70,196), wid = rr(34,86);
    const bare = rnd() < 0.4;
    const tone = `rgb(${ri(56,74)},${ri(62,80)},${ri(72,92)})`;
    drawTree(x, base, hgt, wid, tone, bare);
    x += rr(wid*0.4, wid*0.95);
  }
  TEX.tree = texFrom(cv, {aniso:4});
}

/* ---- feather detail (barb lines, near-black with cool sheen) ---- */
function buildFeatherTextures(){
  const W = 512, H = 512;
  const col = mkCanvas(W,H), c = col.getContext('2d');
  const hgt = mkCanvas(W,H), h = hgt.getContext('2d');
  c.fillStyle = '#14151a'; c.fillRect(0,0,W,H);
  h.fillStyle = '#808080'; h.fillRect(0,0,W,H);
  // rows of coverts: scalloped feather edges along V
  const rows = 9;
  for (let r=0;r<rows;r++){
    const y = (r+0.5)/rows*H;
    const fw = W/7;
    for (let k=-1;k<8;k++){
      const x = k*fw + (r%2)*fw*0.5;
      // feather outline shading
      const g = c.createLinearGradient(x, y-H/rows/2, x, y+H/rows/2);
      g.addColorStop(0,'rgba(46,50,64,0.55)');
      g.addColorStop(0.75,'rgba(20,21,26,0.1)');
      g.addColorStop(1,'rgba(8,8,10,0.5)');
      c.fillStyle = g;
      c.beginPath();
      c.moveTo(x, y - H/rows*0.55);
      c.quadraticCurveTo(x+fw/2, y - H/rows*0.62, x+fw, y - H/rows*0.55);
      c.lineTo(x+fw, y + H/rows*0.2);
      c.quadraticCurveTo(x+fw/2, y + H/rows*0.62, x, y + H/rows*0.2);
      c.closePath(); c.fill();
      // barb lines
      for (let b=0;b<10;b++){
        const bx = x + fw*b/10;
        c.strokeStyle = `rgba(${ri(40,64)},${ri(44,68)},${ri(60,88)},${rr(.15,.4)})`;
        c.lineWidth = 0.9;
        c.beginPath(); c.moveTo(bx, y-H/rows*0.5);
        c.lineTo(bx + rr(-2,2), y+H/rows*0.5);
        c.stroke();
        h.strokeStyle = rnd()<0.5?'rgba(40,40,40,0.5)':'rgba(220,220,220,0.5)';
        h.lineWidth = 1.1;
        h.beginPath(); h.moveTo(bx, y-H/rows*0.5); h.lineTo(bx+1, y+H/rows*0.5); h.stroke();
      }
      // leading edge of each feather
      c.strokeStyle = 'rgba(70,76,96,0.5)'; c.lineWidth = 1.6;
      c.beginPath(); c.moveTo(x, y-H/rows*0.55);
      c.quadraticCurveTo(x+fw/2, y-H/rows*0.64, x+fw, y-H/rows*0.55); c.stroke();
      h.strokeStyle = 'rgba(235,235,235,0.75)'; h.lineWidth = 2.2;
      h.beginPath(); h.moveTo(x, y-H/rows*0.55);
      h.quadraticCurveTo(x+fw/2, y-H/rows*0.64, x+fw, y-H/rows*0.55); h.stroke();
    }
  }
  const gi = c.getImageData(0,0,W,H), gd = gi.data;
  for (let i=0;i<gd.length;i+=4){
    const n = (rnd()-0.5)*10;
    gd[i]=clamp(gd[i]+n,0,255); gd[i+1]=clamp(gd[i+1]+n,0,255); gd[i+2]=clamp(gd[i+2]+n,0,255);
  }
  c.putImageData(gi,0,0);
  TEX.featherCol = texFrom(col);
  TEX.featherNrm = texFrom(normalFromHeight(hgt, 1.6), {srgb:false});
}

/* ---- thin-ice / puddle surface micro-normal ---- */
function buildIceTexture(){
  const S = 256, cv = mkCanvas(S,S), c = cv.getContext('2d');
  c.fillStyle = '#808080'; c.fillRect(0,0,S,S);
  // frozen ripple rings + crack hints
  for (let i=0;i<26;i++){
    const x = rr(0,S), y = rr(0,S), r0 = rr(6,50);
    for (let k=0;k<4;k++){
      c.strokeStyle = `rgba(${k%2?210:70},${k%2?210:70},${k%2?210:70},${rr(.1,.3)})`;
      c.lineWidth = rr(1,2.6);
      c.beginPath(); c.arc(x,y,r0+k*rr(3,8),0,TAU); c.stroke();
    }
  }
  for (let i=0;i<40;i++){
    let x = rr(0,S), y = rr(0,S), a = rr(0,TAU);
    c.strokeStyle = `rgba(${rnd()<0.5?60:215},${rnd()<0.5?60:215},${rnd()<0.5?60:215},0.35)`;
    c.lineWidth = 1.2;
    c.beginPath(); c.moveTo(x,y);
    for (let s=0;s<7;s++){ a += rr(-0.7,0.7); x += Math.cos(a)*rr(6,18); y += Math.sin(a)*rr(6,18); c.lineTo(x,y); }
    c.stroke();
  }
  TEX.ice = texFrom(normalFromHeight(cv, 0.9), {srgb:false, repeat:[1,1]});
}

/* ---- straw / mulch colour variation texture (used flat on patches) ---- */
function buildStrawTextures(){
  const S = 512, cv = mkCanvas(S,S), c = cv.getContext('2d');
  const hgt = mkCanvas(S,S), h = hgt.getContext('2d');
  c.fillStyle = '#7d7247'; c.fillRect(0,0,S,S);
  h.fillStyle = '#707070'; h.fillRect(0,0,S,S);
  for (let i=0;i<1400;i++){
    const x = rr(0,S), y = rr(0,S), a = rr(0,TAU), len = rr(20,90);
    const pale = rnd()<0.55;
    c.strokeStyle = pale
      ? `rgba(${ri(190,226)},${ri(170,204)},${ri(104,140)},${rr(.3,.75)})`
      : `rgba(${ri(120,158)},${ri(104,138)},${ri(62,92)},${rr(.3,.7)})`;
    c.lineWidth = rr(1,3);
    c.beginPath(); c.moveTo(x,y);
    c.quadraticCurveTo(x+Math.cos(a)*len*0.5+rr(-8,8), y+Math.sin(a)*len*0.5+rr(-8,8),
                       x+Math.cos(a)*len, y+Math.sin(a)*len);
    c.stroke();
    h.strokeStyle = pale ? 'rgba(230,230,230,0.6)' : 'rgba(50,50,50,0.6)';
    h.lineWidth = c.lineWidth;
    h.beginPath(); h.moveTo(x,y); h.lineTo(x+Math.cos(a)*len, y+Math.sin(a)*len); h.stroke();
  }

  TEX.strawNrm = texFrom(normalFromHeight(hgt, 1.6), {srgb:false});

/* ============================================================
   SHARED GLSL
   ============================================================ */
const GLSL_NOISE = /* glsl */`
float ghash(vec2 p){ return fract(sin(dot(p, vec2(127.1,311.7)))*43758.5453123); }
float gnoise(vec2 p){
  vec2 i = floor(p), f = fract(p);
  vec2 u = f*f*(3.0-2.0*f);
  return mix(mix(ghash(i), ghash(i+vec2(1.0,0.0)), u.x),
             mix(ghash(i+vec2(0.0,1.0)), ghash(i+vec2(1.0,1.0)), u.x), u.y);
}
float gfbm(vec2 p){
  float s = 0.0, a = 0.5;
  for (int i=0;i<4;i++){ s += a*gnoise(p); p *= 2.03; a *= 0.5; }
  return s;
}`;

/* dawn sky: violet-blue zenith -> apricot horizon, sun disc + halo.
   values are linear HDR (tone mapped later in the composite pass). */
const GLSL_SKY = /* glsl */`
vec3 skyColor(vec3 dir, vec3 sunDir){
  float y = dir.y;
  vec3 zen = vec3(0.235, 0.300, 0.470);
  vec3 mid = vec3(0.500, 0.530, 0.665);
  vec3 hor = vec3(1.050, 0.680, 0.420);
  float t = pow(clamp(y*1.45, 0.0, 1.0), 0.58);
  vec3 col = mix(mid, zen, t);
  float h = pow(clamp(1.0 - y*7.5, 0.0, 1.0), 1.6);
  col = mix(col, hor, h);
  float sd = max(dot(dir, sunDir), 0.0);
  col += vec3(1.05, 0.60, 0.28) * pow(sd, 26.0) * 0.55;
  col += vec3(1.10, 0.78, 0.44) * pow(sd, 48.0) * 1.10;
  col += vec3(1.10, 0.86, 0.55) * pow(sd, 600.0)* 4.5;
  float disc = smoothstep(0.99966, 0.99992, sd);
  col += vec3(1.15, 0.95, 0.68) * disc * 30.0;
  col = mix(col, hor*0.92, clamp(-y*5.0, 0.0, 1.0));
  return col;
}`;

/* dynamic distance fog: cool blue-grey away from the sun,
   warm gold when looking toward it */
const GLSL_DYNFOG = /* glsl */`
#ifdef USE_FOG
  #ifdef FOG_EXP2
    float fogFactor = 1.0 - exp(-uFogD*uFogD*vFogDepth*vFogDepth);
  #else
    float fogFactor = smoothstep(fogNear, fogFar, vFogDepth);
  #endif
  vec3 fogRay = -normalize(vVPos);
  float fogSun = pow(max(dot(fogRay, uSunView), 0.0), 3.5);
  vec3 fogCol = mix(uFogCool, uFogWarm, fogSun);
  gl_FragColor.rgb = mix(gl_FragColor.rgb, fogCol, fogFactor);
#endif`;

/* ============================================================
   GLOBAL ENVIRONMENT UNIFORMS (single shared source)
   ============================================================ */
const U = {
  time:      { value: 0 },
  melt:      { value: 0 },
  sunDir:    { value: new THREE.Vector3(-0.16, 0.055, -0.98).normalize() },
  sunView:   { value: new THREE.Vector3(0, 0, -1) },
  sunColor:  { value: new THREE.Color(1.0, 0.70, 0.40) },
  fogCool:   { value: new THREE.Color(0x8796b0) },
  fogWarm:   { value: new THREE.Color(0xd8a478) },
  fogDensity:{ value: 0.0075 },
  lift:      { value: 0 }   // 0..1 how much the mist has lifted
};
window.__U = U;

/* ============================================================
   MATERIAL PATCHING
   ============================================================ */
function patchMaterial(mat, opt){
  opt = opt || {};
  const key = 'patch|f' + (opt.frost?1:0) + '|w' + (opt.wet?1:0) + '|t' + (opt.trans?1:0) + '|' + (opt.key||'');
  mat.customProgramCacheKey = () => key;
  mat.onBeforeCompile = (shader) => {
    shader.uniforms.uSunView   = U.sunView;
    shader.uniforms.uSunColor  = U.sunColor;
    shader.uniforms.uMelt      = U.melt;
    shader.uniforms.uFogD      = U.fogDensity;
    shader.uniforms.uFogCool   = U.fogCool;
    shader.uniforms.uFogWarm   = U.fogWarm;

    /* ---- vertex ---- */
    let vs = shader.vertexShader;
    let vdecl = '#include <common>\n#ifdef USE_FOG\nvarying vec3 vVPos;\n#endif\n';
    let vbody = '';
    if (opt.frost){ vdecl += 'attribute float aFrost;\nvarying float vFrost;\n'; vbody += 'vFrost = aFrost;\n'; }
    if (opt.wet){ vdecl += 'attribute float aWet;\nvarying float vWet;\n'; vbody += 'vWet = aWet;\n'; }
    vs = vs.replace('#include <common>', vdecl);
    vs = vs.replace('#include <begin_vertex>', '#include <begin_vertex>\n' + vbody);
    vs = vs.replace('#include <fog_vertex>',
      '#include <fog_vertex>\n#ifdef USE_FOG\nvVPos = -mvPosition.xyz;\n#endif');
    shader.vertexShader = vs;

    /* ---- fragment ---- */
    let fs = shader.fragmentShader;
    let fdecl = '#include <common>\n'
      + 'uniform vec3 uSunView;\nuniform vec3 uSunColor;\nuniform float uMelt;\n'
      + 'uniform float uFogD;\nuniform vec3 uFogCool;\nuniform vec3 uFogWarm;\n'
      + '#ifdef USE_FOG\nvarying vec3 vVPos;\n#endif\n';
    if (opt.frost) fdecl += 'varying float vFrost;\n';
    if (opt.wet)   fdecl += 'varying float vWet;\n';
    fs = fs.replace('#include <common>', fdecl);

    if (opt.frost || opt.wet){
      let add = '';
      if (opt.frost){
        add += `
  float sfade = clamp(dot(normal, uSunView)*0.5 + 0.5, 0.0, 1.0);
  float froz = clamp(vFrost, 0.0, 1.0) * (1.0 - 0.70*uMelt*sfade);
  diffuseColor.rgb = mix(diffuseColor.rgb, vec3(0.90, 0.94, 1.04), froz*0.88);
`;
      }
      if (opt.wet){
        add += `
  diffuseColor.rgb *= 1.0 - 0.40*vWet;
`;
      }
      let radd = '';
      if (opt.frost){
        radd += `
  roughnessFactor = mix(roughnessFactor, 0.95, clamp(vFrost,0.0,1.0)*(1.0-uMelt));
  roughnessFactor = mix(roughnessFactor, 0.22, uMelt*clamp(vFrost,0.0,1.0)*sfade);
`;
      }
      if (opt.wet) radd += '\n  roughnessFactor = mix(roughnessFactor, 0.17, vWet);\n';
      /* inject once `normal` exists (after the normal fragments) */
      let pt = '#include <normal_fragment_maps>';
      if (fs.indexOf(pt) < 0) pt = '#include <normal_fragment_begin>';
      if (fs.indexOf(pt) >= 0){
        fs = fs.replace(pt, pt + '\n' + add + radd);
      } else {
        fs = fs.replace('#include <color_fragment>',
          '#include <color_fragment>\n' + add.replace(/dot\(normal,/g, 'dot(vec3(0.0,1.0,0.0),'));
        if (radd) fs = fs.replace('#include <roughnessmap_fragment>',
          '#include <roughnessmap_fragment>\n' + radd);
      }
    }

    if (opt.trans){
      fs = fs.replace('#include <opaque_fragment>', `#include <opaque_fragment>
{
  vec3 Vdir = normalize(vVPos);
  float VdL = max(dot(Vdir, -uSunView), 0.0);
  float backlit = max(-dot(normal, uSunView), 0.0);
  float tr = pow(VdL, 2.6) * backlit;
  gl_FragColor.rgb += uSunColor * tr * ${opt.trans.toFixed(2)};
}`);
    }

    fs = fs.replace('#include <fog_fragment>', GLSL_DYNFOG);
    shader.fragmentShader = fs;
  };
  return mat;
}

/* ============================================================
   GEOMETRY ACCUMULATOR — merges many pieces into one draw call,
   preserving position/normal/uv/color + aFrost/aWet attributes
   ============================================================ */
function GeoAcc(opt){
  opt = opt || {};
  this.wantCol = !!opt.color;
  this.wantFrost = !!opt.frost;
  this.wantWet = !!opt.wet;
  this.pos = []; this.nor = []; this.uv = [];
  this.col = []; this.fr = []; this.wet = []; this.idx = [];
  this.vc = 0;
  this._m3 = new THREE.Matrix3();
}
GeoAcc.prototype.push = function(geom, matrix, o){
  o = o || {};
  const posA = geom.attributes.position;
  if (!posA) return;
  const norA = geom.attributes.normal;
  const uvA  = geom.attributes.uv;
  const colA = geom.attributes.color;
  const frA  = geom.attributes.aFrost;
  const wetA = geom.attributes.aWet;
  const idx  = geom.index ? geom.index.array : null;
  const n = posA.count;
  const hasM = !!matrix;
  if (hasM) this._m3.getNormalMatrix(matrix);
  const base = this.vc;
  const cMul = o.color;               // array [r,g,b] or null
  const cFn  = o.colorFn;             // fn(localVec3, i) -> [r,g,b]
  const fMul = (o.frost === undefined) ? 1 : o.frost;
  const wMul = (o.wet === undefined) ? 1 : o.wet;
  const v = new THREE.Vector3();
  for (let i=0;i<n;i++){
    v.set(posA.getX(i), posA.getY(i), posA.getZ(i));
    if (hasM) v.applyMatrix4(matrix);
    this.pos.push(v.x, v.y, v.z);
    if (norA){
      v.set(norA.getX(i), norA.getY(i), norA.getZ(i));
      if (hasM) v.applyMatrix3(this._m3).normalize();
      this.nor.push(v.x, v.y, v.z);
    } else this.nor.push(0,1,0);
    if (uvA) this.uv.push(uvA.getX(i), uvA.getY(i));
    else this.uv.push(0,0);
    if (this.wantCol){
      let r=1,g=1,b=1;
      if (colA){ r = colA.getX(i); g = colA.getY(i); b = colA.getZ(i); }
      if (cMul){ r*=cMul[0]; g*=cMul[1]; b*=cMul[2]; }
      if (cFn){ const c = cFn(v, i); r*=c[0]; g*=c[1]; b*=c[2]; }
      this.col.push(r,g,b);
    }
    if (this.wantFrost) this.fr.push((frA ? frA.getX(i) : 0) * fMul);
    if (this.wantWet)   this.wet.push((wetA ? wetA.getX(i) : 0) * wMul);
  }
  if (idx){
    for (let i=0;i<idx.length;i++) this.idx.push(base + idx[i]);
  } else {
    for (let i=0;i<n;i++) this.idx.push(base + i);
  }
  this.vc += n;
};
GeoAcc.prototype.build = function(){
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(this.pos, 3));
  g.setAttribute('normal',   new THREE.Float32BufferAttribute(this.nor, 3));
  g.setAttribute('uv',       new THREE.Float32BufferAttribute(this.uv, 2));
  if (this.wantCol && this.col.length) g.setAttribute('color', new THREE.Float32BufferAttribute(this.col, 3));
  if (this.wantFrost && this.fr.length) g.setAttribute('aFrost', new THREE.Float32BufferAttribute(this.fr, 1));
  if (this.wantWet && this.wet.length) g.setAttribute('aWet', new THREE.Float32BufferAttribute(this.wet, 1));
  g.setIndex(this.idx);
  return g;
};

/* ============================================================
   PROCEDURAL GEOMETRY GENERATORS
   ============================================================ */

/* --- ribbed, warty, blemished pumpkin; base sits at y = 0 --- */
function pumpkinGeo(o){
  const segU = o.segU || 40, segV = o.segV || 20;
  const R = o.R, H = o.H, ribs = o.ribs, ribA = o.ribA;
  const flat = o.flat || 2.4, round = o.round || 0.44;
  const dimple = (o.dimple !== undefined ? o.dimple : 0.10) * H;
  const wartAmp = o.warts || 0;
  const pos = [], nor = [], uv = [], col = [], fr = [], idx = [];
  const seed = o.seed || 0;
  const base = o.col, topCol = o.topCol || base, soil = o.soil || [0.42,0.37,0.31];
  const ring = segU + 1;
  for (let j=0;j<=segV;j++){
    const t = -1 + 2*j/segV;                 // -1 bottom .. 1 top
    let prof = Math.pow(Math.max(1e-5, 1 - Math.pow(Math.abs(t), flat)), round);
    // flattened base
    let y;
    if (t < -0.55) y = H*0.225*(1 + (t+0.55)/0.45);
    else y = H*(0.5 + 0.5*t);
    if (t > 0.72) y -= dimple * Math.pow((t-0.72)/0.28, 2);
    for (let i=0;i<=segU;i++){
      const th = i/segU*TAU;
      const ribMod = 1 + ribA*Math.cos(ribs*th)*(0.30 + 0.70*Math.pow(Math.max(0,1-t*t),0.5));
      let rr_ = R*prof*ribMod;
      if (wartAmp > 0){
        const w = fbm(Math.cos(th)*3.1 + seed*7.3, Math.sin(th)*3.1 + t*2.6 + seed*3.1, 3);
        rr_ += Math.pow(clamp((w-0.56)/0.44, 0, 1), 1.4) * wartAmp * R * prof;
      }
      const x = Math.cos(th)*rr_, z = Math.sin(th)*rr_;
      pos.push(x, y, z);
      uv.push(i/segU*2, 0.5 + 0.5*t);
      /* vertex colour: base hue, rib shading, blemishes, soil, top tinge */
      let c = mixRGB(base, topCol, clamp((t-0.15)/0.85, 0, 1));
      const cs = 0.865 + 0.135*(0.5+0.5*Math.cos(ribs*th));
      c = scaleRGB(c, cs);
      const bl = fbm(x*9 + seed*11, z*9 + y*7 + seed*5, 4);
      if (bl > 0.60) c = mixRGB(c, [c[0]*0.72, c[1]*0.70, c[2]*0.66], clamp((bl-0.60)/0.3,0,1)*0.9);
      else if (bl < 0.30 && rnd() < 0.5) c = mixRGB(c, [c[0]*1.1, c[1]*1.06, c[2]*0.9], 0.35);
      const soilT = clamp((-0.25 - t)/0.75, 0, 1) * (0.45 + 0.55*fbm(x*14+seed, z*14, 3));
      c = mixRGB(c, soil, soilT*0.75);
      const ao = 0.80 + 0.20*clamp((t+0.9)/1.1, 0, 1);
      c = scaleRGB(c, ao);
      col.push(c[0], c[1], c[2]);
      /* dusting of frost on the top shoulders */
      let f = clamp((t-0.25)/0.75, 0, 1);
      f *= 0.42*(0.45 + 0.55*fbm(x*20+seed*3, z*20, 3));
      f += 0.10*clamp(Math.cos(ribs*th), 0, 1)*clamp((t-0.0)/1.0, 0, 1);
      fr.push(clamp(f, 0, 1));
    }
  }
  for (let j=0;j<segV;j++){
    for (let i=0;i<segU;i++){
      const a = j*ring+i, b = a+1, cI = a+ring, d = cI+1;
      idx.push(a, cI, b, b, cI, d);
    }
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  g.setAttribute('uv', new THREE.Float32BufferAttribute(uv, 2));
  g.setAttribute('color', new THREE.Float32BufferAttribute(col, 3));
  g.setAttribute('aFrost', new THREE.Float32BufferAttribute(fr, 1));
  g.setIndex(idx);
  g.computeVertexNormals();
  /* stitch the uv seam normal + flatten pole normals */
  const na = g.attributes.normal;
  for (let j=0;j<=segV;j++){
    const i0 = j*ring, i1 = j*ring+segU;
    const nx = (na.getX(i0)+na.getX(i1))*0.5, ny = (na.getY(i0)+na.getY(i1))*0.5, nz = (na.getZ(i0)+na.getZ(i1))*0.5;
    const l = Math.hypot(nx,ny,nz) || 1;
    na.setXYZ(i0, nx/l, ny/l, nz/l); na.setXYZ(i1, nx/l, ny/l, nz/l);
  }
  for (let i=0;i<ring;i++){
    na.setXYZ(i, 0,-1,0);
    na.setXYZ(segV*ring+i, 0, 1, 0);
  }
  na.needsUpdate = true;
  return g;
}

/* --- curly woody stem with ridged cross-section --- */
function stemGeo(o){
  const n = o.n || 11, k = o.k || 7;
  const len = o.len, r0 = o.baseR;
  const leanA = o.lean, leanPh = o.leanPh;
  const curlA = o.curl, curlPh = o.curlPh, turns = o.turns || 1.6;
  const pos = [], uv = [], col = [], idx = [];
  const c0 = o.col0 || [0.42,0.44,0.26], c1 = o.col1 || [0.66,0.60,0.42];
  const pointAt = (s) => [
    Math.cos(leanPh)*leanA*len*s*s + Math.cos(leanPh+1.57)*curlA*Math.sin(s*turns*TAU*0.5+curlPh)*s,
    len*s,
    Math.sin(leanPh)*leanA*len*s*s + Math.sin(leanPh+1.57)*curlA*Math.sin(s*turns*TAU*0.5+curlPh+0.8)*s
  ];
  for (let j=0;j<=n;j++){
    const s = j/n;
    const p = pointAt(s);
    const rad = r0*(1.75 - 1.12*s);
    for (let i=0;i<=k;i++){
      const th = i/k*TAU;
      const lob = 1 + 0.16*Math.cos(5*th + s*2.0) + 0.06*Math.sin(s*22 + th);
      const x = p[0] + Math.cos(th)*rad*lob;
      const z = p[2] + Math.sin(th)*rad*lob;
      pos.push(x, p[1], z);
      uv.push(i/k, s);
      let c = mixRGB(c0, c1, clamp(s*1.3, 0, 1));
      c = scaleRGB(c, 0.86 + 0.14*(0.5+0.5*Math.cos(5*th)));
      if (s < 0.18) c = mixRGB([0.30,0.27,0.20], c, s/0.18);
      col.push(c[0], c[1], c[2]);
    }
  }
  for (let j=0;j<n;j++){
    for (let i=0;i<k;i++){
      const a = j*(k+1)+i, b = a+1, cI = a+k+1, d = cI+1;
      idx.push(a, cI, b, b, cI, d);
    }
  }
  // top cap
  const p = pointAt(1);
  const capI = pos.length/3;
  pos.push(p[0], p[1]+r0*0.2, p[2]); uv.push(0.5,1);
  col.push(c1[0]*0.8, c1[1]*0.8, c1[2]*0.8);
  const top = n*(k+1);
  for (let i=0;i<k;i++) idx.push(top+i, capI, top+i+1);
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  g.setAttribute('uv', new THREE.Float32BufferAttribute(uv, 2));
  g.setAttribute('color', new THREE.Float32BufferAttribute(col, 3));
  g.setIndex(idx);
  g.computeVertexNormals();
  return g;
}

/* --- lobed, curled, wilting vine leaf template (points +Z) --- */
function leafTemplate(o){
  const NS = o.NS || 14, NT = o.NT || 11;
  const L = o.L, W = o.W;
  const droop = o.droop, cup = o.cup, fold = o.fold;
  const wilt = o.wilt, frostAmt = o.frostAmt;
  const lobePh = o.lobePh || 0;
  const seed = o.seed || 1;
  const pos = [], uv = [], col = [], fr = [], idx = [];
  const green0 = o.col0, green1 = o.col1, brown = o.brown || [0.30,0.23,0.13];
  const halfW = (s) => {
    const notch = 0.35 + 0.65*smooth(s/0.14);
    let sh = Math.pow(Math.max(1e-4, Math.sin(Math.PI*Math.pow(clamp(s,0,1), 0.88))), 0.72);
    sh *= 1 + 0.17*Math.sin(s*4.6*Math.PI + lobePh);
    sh *= notch;
    sh *= 0.90 + 0.20*fbm(s*3.4 + seed*5, seed*2.7, 3);
    return W*sh;
  };
  for (let a=0;a<=NS;a++){
    const s = a/NS;
    const hw = halfW(s);
    for (let b=0;b<=NT;b++){
      const t = -1 + 2*b/NT;
      const x = t*hw;
      const z = s*L;
      let y = -droop*s*s*L;
      y += cup*(t*t)*hw*0.55*(1 - s*0.35);
      y += fold*Math.pow(Math.abs(t), 1.7)*hw*0.9;
      y += (wilt>0.4 ? -1:1)*0.045*hw*Math.pow(Math.abs(t), 3.0);
      // midrib + secondary vein relief
      y += 0.012*L*(1-Math.abs(t))*(1-Math.abs(t))*Math.sin(Math.PI*clamp(s*1.05,0,1));
      y += 0.0045*L*Math.cos((s*4.4 + Math.abs(t)*1.7)*Math.PI)*(1-Math.abs(t));
      y += fbm(s*7+seed*3, t*4+seed*9, 3)*0.012*L - 0.006*L;
      pos.push(x, y, z);
      uv.push((t+1)*0.5, s);
      /* colour: healthy green -> browned, curled, dead edges */
      let c = mixRGB(green0, green1, fbm(s*4+seed*2, t*3+seed, 3));
      const edge = clamp((Math.abs(t)-0.35)/0.65, 0, 1)*0.8 + clamp((s-0.55)/0.45, 0, 1)*0.55;
      const patch = clamp((fbm(s*6+seed*11, t*5+seed*7, 4)-0.42)/0.4, 0, 1);
      const brownAmt = clamp(wilt*(edge*0.75 + patch*0.7), 0, 1);
      c = mixRGB(c, brown, brownAmt);
      c = mixRGB(c, [c[0]*1.18, c[1]*1.10, c[2]*0.72], (1-wilt)*patch*0.35);
      /* vein colour */
      const veinT = clamp((1-Math.abs(t))*Math.sin(Math.PI*clamp(s,0,1)), 0, 1);
      c = mixRGB(c, [c[0]*1.15+0.03, c[1]*1.12+0.03, c[2]*1.05], veinT*0.35);
      col.push(c[0], c[1], c[2]);
      /* hoarfrost along edges, tip and veins */
      let f = clamp((Math.abs(t)-0.55)/0.45, 0, 1);
      f = Math.max(f, clamp((s-0.78)/0.22, 0, 1)*0.85);
      f = Math.max(f, veinT*0.42);
      f *= (0.35 + 0.65*fbm(s*11+seed*13, t*9+seed*5, 3));
      fr.push(clamp(f*frostAmt, 0, 1));
    }
  }
  for (let a=0;a<NS;a++){
    for (let b=0;b<NT;b++){
      const i = a*(NT+1)+b;
      idx.push(i, i+NT+1, i+1, i+1, i+NT+1, i+NT+2);
    }
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  g.setAttribute('uv', new THREE.Float32BufferAttribute(uv, 2));
  g.setAttribute('color', new THREE.Float32BufferAttribute(col, 3));
  g.setAttribute('aFrost', new THREE.Float32BufferAttribute(fr, 1));
  g.setIndex(idx);
  g.computeVertexNormals();
  return g;
}

/* --- curling tendril (thin square-section spiral tube) --- */
function tendrilGeo(o){
  const n = o.n || 22, seg = 4;
  const len = o.len, r0 = o.r0 || 0.055, turns = o.turns || 2.6;
  const axis = o.axis.clone().normalize();
  const up = Math.abs(axis.y) > 0.9 ? new THREE.Vector3(1,0,0) : new THREE.Vector3(0,1,0);
  const u = new THREE.Vector3().crossVectors(axis, up).normalize();
  const v = new THREE.Vector3().crossVectors(axis, u).normalize();
  const pos = [], col = [], idx = [];
  const c0 = o.col0 || [0.45,0.47,0.25], c1 = o.col1 || [0.62,0.55,0.34];
  const p0 = o.origin;
  for (let j=0;j<=n;j++){
    const s = j/n;
    const straight = Math.min(1, s/0.35);
    const rad = r0*smooth((s-0.15)/0.85)*(1 - 0.4*s);
    const a = turns*TAU*s;
    const cx = p0.x + axis.x*len*s + (u.x*Math.cos(a) + v.x*Math.sin(a))*rad;
    const cy = p0.y + axis.y*len*s + (u.y*Math.cos(a) + v.y*Math.sin(a))*rad - 0.06*s*s*len;
    const cz = p0.z + axis.z*len*s + (u.z*Math.cos(a) + v.z*Math.sin(a))*rad;
    const tr = 0.0075*(1 - 0.5*s);
    for (let i=0;i<=seg;i++){
      const th = i/seg*TAU;
      const ox = (u.x*Math.cos(th+0) + v.x*Math.sin(th))*tr;
      const oy = (u.y*Math.cos(th+0) + v.y*Math.sin(th))*tr;
      const oz = (u.z*Math.cos(th+0) + v.z*Math.sin(th))*tr;
      pos.push(cx+ox, cy+oy, cz+oz);
      const c = mixRGB(c0, c1, s);
      col.push(c[0], c[1], c[2]);
    }
  }
  for (let j=0;j<n;j++) for (let i=0;i<seg;i++){
    const a = j*(seg+1)+i, b = a+1, cI = a+seg+1, d = cI+1;
    idx.push(a, cI, b, b, cI, d);
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  g.setAttribute('color', new THREE.Float32BufferAttribute(col, 3));
  g.setIndex(idx);
  g.computeVertexNormals();
  return g;
}

/* --- single grass blade (base at origin, grows +Y) --- */
function bladeGeo(o){
  const n = 6, w = o.w, h = o.h, bend = o.bend;
  const pos = [], col = [], fr = [], idx = [];
  for (let j=0;j<=n;j++){
    const s = j/n;
    const hw = w*(1 - Math.pow(s, 1.35))*0.5;
    const y = h*s;
    const z = bend*h*s*s;
    for (let i=0;i<=2;i++){
      const t = i/2 - 0.5;
      pos.push(t*2*hw, y, z + Math.abs(t)*hw*0.3);
      const dry = o.dry;
      let c = mixRGB(o.col0, o.col1, dry*0.8 + s*0.35);
      c = scaleRGB(c, 0.86 + 0.3*(0.5+t));
      col.push(c[0], c[1], c[2]);
      let f = clamp((s-0.62)/0.38, 0, 1)*(0.55 + 0.45*Math.abs(t*2));
      fr.push(f*o.frost);
    }
  }
  for (let j=0;j<n;j++) for (let i=0;i<2;i++){
    const a = j*3+i;
    idx.push(a, a+3, a+1, a+1, a+3, a+4);
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  g.setAttribute('color', new THREE.Float32BufferAttribute(col, 3));
  g.setAttribute('aFrost', new THREE.Float32BufferAttribute(fr, 1));
  g.setIndex(idx);
  g.computeVertexNormals();
  return g;
}

/* --- dry stalk with optional seed head --- */
function stalkGeo(o){
  const g = bladeGeo({w:o.w, h:o.h, bend:o.bend, col0:o.col0, col1:o.col1, dry:1, frost:o.frost});
  if (o.head){
    const head = new THREE.SphereGeometry(1, 6, 5);
    head.scale(o.w*1.4, o.h*0.09, o.w*1.4);
    head.translate(0, o.h*(o.headAt || 0.96), o.bend*o.h*(o.headAt||0.96)*(o.headAt||0.96));
    const colA = new Float32Array(head.attributes.position.count*3);
    for (let i=0;i<head.attributes.position.count;i++){
      const n = 0.78 + 0.4*fbm(i*0.7, o.seed||1, 3);
      colA[i*3] = o.col1[0]*n; colA[i*3+1] = o.col1[1]*n; colA[i*3+2] = o.col1[2]*n;
    }
    head.setAttribute('color', new THREE.BufferAttribute(colA, 3));
    const frA = new Float32Array(head.attributes.position.count);
    frA.fill(o.frost*0.8);
    head.setAttribute('aFrost', new THREE.BufferAttribute(frA, 1));
    // merge head into blade by simple union push
    const merged = new GeoAcc({color:true, frost:true});
    merged.push(g, null); merged.push(head, null);
    return merged.build();
  }
  return g;
}

/* ============================================================
   CAMERA PATH (defined early: world scatter avoids it)
   ============================================================ */
const LOOP = 72;
const CAM_POS = [ v3(-11.5,0.55,14.0), v3(-9.0,1.65,4.0), v3(-18.85,1.50,-4.0), v3(-16.0,0.85,9.0) ];
const CAM_TGT = [ v3(-10.6,0.40,8.0), v3(-8.0,1.05,-14.0), v3(-22.3,1.36,-10.4), v3(-13.0,0.55,13.0) ];
const posCurve = new THREE.CatmullRomCurve3(CAM_POS, true, 'centripetal', 0.5);
const tgtCurve = new THREE.CatmullRomCurve3(CAM_TGT, true, 'centripetal', 0.5);
const PATH = [];
for (let i=0;i<=480;i++){
  const p = posCurve.getPointAt(i/480);
  PATH.push({ x:p.x, y:p.y, z:p.z, need: p.y < 1.35 ? 1.10 : (p.y < 1.7 ? 0.55 : 0.0) });
}
function pathClear(x, z, minD){
  for (let i=0;i<PATH.length;i++){
    const s = PATH[i];
    if (s.need <= 0) continue;
    const d = Math.max(s.need, minD);
    const dx = x - s.x, dz = z - s.z;
    if (dx*dx + dz*dz < d*d) return false;
  }
  return true;
}

/* ============================================================
   FIELD LAYOUT
   ============================================================ */
const ROW_P = 2.4, ROW_X0 = -20;
groundHeight = function(x, z){
  let d = ((x - ROW_X0) % ROW_P + ROW_P) % ROW_P;
  const ridge = 0.5 + 0.5*Math.cos(TAU*d/ROW_P);           // 1 on crest, 0 in furrow
  const fx = 1 - smooth((Math.abs(x)-26)/12);
  const fz = (1 - smooth((-z-58)/16)) * (1 - smooth((z-40)/14));
  const fm = Math.min(fx, fz);
  let h = 0.13*Math.pow(ridge, 0.85)*fx*fz - 0.045*(1-ridge)*fx*fz;
  h += (fbm(x*0.055, z*0.055, 4) - 0.5)*0.30;
  h += (fbm(x*0.30, z*0.30, 3) - 0.5)*0.05*fm;
  return h;
};
const ridgeAt = (x) => {
  let d = ((x - ROW_X0) % ROW_P + ROW_P) % ROW_P;
  return 0.5 + 0.5*Math.cos(TAU*d/ROW_P);
};

/* puddles: thin ice in the low furrows */
const puddles = [];
for (let k=-8;k<=8;k++){
  const x = -18.8 + 2.4*k;
  for (let z=-46; z<=36; z += rr(5.5,9.5)){
    if (fbm(x*0.3, z*0.3, 3) > 0.455) continue;
    if (puddles.some(p => (p.x-x)*(p.x-x) + (p.z-z)*(p.z-z) < 26)) continue;
    puddles.push({ x: x + rr(-0.18,0.18), z: z, r: rr(0.34,0.92), sy: rr(1.35,2.1),
                   rot: rr(0,TAU) });
  }
}
function puddleDepth(x, z){
  let dep = 0;
  for (const p of puddles){
    const dx = x - p.x, dz = (z - p.z)/p.sy;
    const d = Math.hypot(dx, dz);
    if (d < p.r*1.5) dep = Math.max(dep, 0.05*(1 - smooth(clamp((d - p.r*0.4)/(p.r*1.1), 0, 1))));
  }
  return dep;
}
function puddleWet(x, z){
  let w = 0;
  for (const p of puddles){
    const dx = x - p.x, dz = (z - p.z)/p.sy;
    const d = Math.hypot(dx, dz);
    if (d < p.r*2.6) w = Math.max(w, 1 - smooth(clamp((d - p.r*0.6)/(p.r*2.0), 0, 1)));
  }
  return w;
}

/* ---------- ground mesh (warped grid: fine in the field, coarse far away) ---------- */
const warp = (p, half) => half*p*(0.25 + 0.75*p*p);
const NX = 178, NZ = 168, HALF_X = 115, HALF_Z = 155;
(function buildGround(){
  const pos = [], uv = [], col = [], fr = [], wet = [], idx = [];
  for (let j=0;j<=NZ;j++){
    const pz = j/NZ*2 - 1;
    const z = warp(pz, HALF_Z);
    for (let i=0;i<=NX;i++){
      const px = i/NX*2 - 1;
      const x = warp(px, HALF_X);
      const dep = puddleDepth(x, z);
      const h = groundHeight(x, z) - dep;
      pos.push(x, h, z);
      uv.push(x*0.0625, z*0.0625);
      /* colour: drier pale crests, damp dark furrows, patchy field tone */
      const rg = ridgeAt(x);
      const fx = 1 - smooth((Math.abs(x)-26)/12);
      const patch = fbm(x*0.09, z*0.09, 4);
      let c = 0.80 + 0.30*patch;
      c *= 0.74 + 0.34*Math.pow(rg, 1.1)*fx;
      const strawy = smooth((fbm(x*0.16+3.1, z*0.16, 3) - 0.55)/0.3);
      const r = c*(1 + strawy*0.14), g = c*(1 + strawy*0.10), b = c*(0.97 + strawy*0.02);
      col.push(r, g, b);
      /* frost: gathers on the ridges and undisturbed patches */
      let f = smooth((fbm(x*0.34+7.7, z*0.34, 4) - 0.47)/0.28);
      f *= (0.30 + 0.70*Math.pow(rg,1.3)) * fx;
      fr.push(clamp(f*0.85, 0, 1));
      /* wet: furrow bottoms + puddle margins */
      const wt = Math.max((1-rg)*0.42*fx, puddleWet(x,z));
      wet.push(clamp(wt, 0, 1));
    }
  }
  for (let j=0;j<NZ;j++) for (let i=0;i<NX;i++){
    const a = j*(NX+1)+i, b = a+1, cI = a+NX+1, d = cI+1;
    idx.push(a, cI, b, b, cI, d);
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  g.setAttribute('uv', new THREE.Float32BufferAttribute(uv, 2));
  g.setAttribute('color', new THREE.Float32BufferAttribute(col, 3));
  g.setAttribute('aFrost', new THREE.Float32BufferAttribute(fr, 1));
  g.setAttribute('aWet', new THREE.Float32BufferAttribute(wet, 1));
  g.setIndex(idx);
  g.computeVertexNormals();
  const mat = new THREE.MeshStandardMaterial({
    map: TEX.soilCol, normalMap: TEX.soilNrm, roughnessMap: TEX.soilRgh,
    roughness: 1.0, metalness: 0.0, vertexColors: true,
    normalScale: new THREE.Vector2(1.25, 1.25), envMapIntensity: 0.55
  });
  patchMaterial(mat, { frost:true, wet:true, key:'ground' });
  const mesh = new THREE.Mesh(g, mat);
  mesh.receiveShadow = true;
  scene.add(mesh);
})();

/* ---------- puddles: sky reflection + thin ice skin ---------- */
(function buildPuddles(){
  const acc = { pos:[], uv:[], nrm:[], idx:[], base:0 };
  const SEGS = 30;
  for (const p of puddles){
    const h = groundHeight(p.x, p.z);
    for (let ring=0; ring<=1; ring++){
      const rad = ring === 0 ? p.r : p.r*0.999;
      for (let i=0;i<=SEGS;i++){
        const a = i/SEGS*TAU;
        const lx = Math.cos(a)*rad, lz = Math.sin(a)*rad*p.sy;
        const cs = Math.cos(p.rot), sn = Math.sin(p.rot);
        acc.pos.push(p.x + lx*cs - lz*sn, h - 0.020, p.z + lx*sn + lz*cs);
        acc.uv.push(0.5 + Math.cos(a)*0.5*ring, 0.5 + Math.sin(a)*0.5*ring);
        acc.nrm.push(0,1,0);
      }
    }
    const b = acc.base;
    const inner = b, outer = b + SEGS + 1;
    // fan from centre ring (ring0 collapses to centre visually; build two rings properly)
    for (let i=0;i<SEGS;i++){
      acc.idx.push(inner+i, outer+i, inner+i+1, inner+i+1, outer+i, outer+i+1);
    }
    acc.base += (SEGS+1)*2;
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(acc.pos, 3));
  g.setAttribute('normal', new THREE.Float32BufferAttribute(acc.nrm, 3));
  g.setAttribute('uv', new THREE.Float32BufferAttribute(acc.uv, 2));
  g.setIndex(acc.idx);
  const mat = new THREE.ShaderMaterial({
    transparent: true, depthWrite: false,
    uniforms: {
      uSunDir: U.sunDir, uTime: U.time, uFogD: U.fogDensity,
      uFogCool: U.fogCool, uFogWarm: U.fogWarm, uIce: { value: TEX.ice }
    },
    vertexShader: `
      varying vec3 vW; varying vec2 vUv; varying float vFogDepth;
      void main(){
        vUv = uv;
        vec4 wp = modelMatrix * vec4(position, 1.0);
        vW = wp.xyz;
        vec4 mv = viewMatrix * wp;
        vFogDepth = -mv.z;
        gl_Position = projectionMatrix * mv;
      }`,
    fragmentShader: GLSL_NOISE + GLSL_SKY + `
      uniform vec3 uSunDir; uniform float uTime; uniform float uFogD;
      uniform vec3 uFogCool; uniform vec3 uFogWarm; uniform sampler2D uIce;
      varying vec3 vW; varying vec2 vUv; varying float vFogDepth;
      void main(){
        vec3 V = normalize(cameraPosition - vW);
        float r = length(vUv - 0.5)*2.0;
        /* rippled water normal + frozen skin */
        vec3 nIce = texture2D(uIce, vW.xz*0.22).xyz*2.0 - 1.0;
        vec2 ruv = vW.xz*0.6;
        float rip = gnoise(ruv + vec2(uTime*0.03, -uTime*0.021));
        vec3 n = normalize(vec3(nIce.x*0.30 + (rip-0.5)*0.10, 1.0,
                                nIce.z*0.30 + (gnoise(ruv.yx+uTime*0.02)-0.5)*0.10));
        vec3 R = reflect(-V, n);
        R.y = max(R.y, 0.012);
        vec3 sky = skyColor(normalize(R), uSunDir);
        float fres = 0.035 + 0.965*pow(1.0 - max(dot(n, V), 0.0), 4.0);
        vec3 deep = vec3(0.028, 0.034, 0.042);
        vec3 col = mix(deep, sky, fres);
        float spec = pow(max(dot(normalize(V + uSunDir), n), 0.0), 320.0);
        col += vec3(1.3, 0.9, 0.55)*spec*7.0;
        /* thin ice creeping in from the rim */
        float ice = smoothstep(0.52, 0.97, r);
        float frz = gnoise(vW.xz*6.5) * gnoise(vW.zx*13.0 + 4.0);
        vec3 iceCol = vec3(0.62, 0.72, 0.86)*(0.5 + 0.7*frz) + sky*0.35;
        col = mix(col, iceCol, ice*0.72);
        float alpha = mix(0.95, 0.62, ice);
        alpha *= 1.0 - smoothstep(0.93, 1.0, r);
        /* distance fog */
        vec3 fogRay = -V;
        float fogF = 1.0 - exp(-uFogD*uFogD*vFogDepth*vFogDepth);
        vec3 fogCol = mix(uFogCool, uFogWarm, pow(max(dot(fogRay, uSunDir), 0.0), 3.5));
        col = mix(col, fogCol, fogF);
        gl_FragColor = vec4(col, alpha*(1.0 - fogF*0.35));
      }`
  });
  const mesh = new THREE.Mesh(g, mat);
  mesh.renderOrder = 1;
  scene.add(mesh);
})();

function makePumpkinProto(rare){
  const R = rr(0.15, 0.34);
  const roll = rnd();
  let H, flat = rr(2.1,2.7), round = rr(0.38,0.5);
  if (roll < 0.30){ H = R*rr(0.78, 1.02); flat = rr(1.8,2.2); round = rr(0.44,0.56); }   // squat
  else if (roll < 0.72){ H = R*rr(1.05, 1.32); }                                         // classic
  else { H = R*rr(1.38, 1.78); round = rr(0.5,0.62); flat = rr(2.4,3.0); }               // tall
  if (rare) { /* heroes are generous */ }
  const cr = rnd();
  let base, top;
  if (cr < 0.07){ base = [rr(0.80,0.90), rr(0.74,0.82), rr(0.58,0.68)]; top = scaleRGB(base, 1.03); }       // pale cream
  else if (cr < 0.13){ base = [rr(0.34,0.44), rr(0.38,0.47), rr(0.20,0.27)]; top = scaleRGB(base, 0.92); }  // grey-green
  else if (cr < 0.30){ base = [rr(0.66,0.78), rr(0.34,0.44), rr(0.09,0.14)]; top = [rr(0.40,0.50), rr(0.44,0.52), rr(0.20,0.26)]; } // green-tinged
  else { base = [rr(0.72,0.86), rr(0.33,0.45), rr(0.08,0.13)]; top = scaleRGB(base, rr(1.02,1.16)); }        // orange
  const g = pumpkinGeo({
    R, H, ribs: ri(8,14), ribA: rr(0.045,0.105), flat, round,
    warts: rnd() < 0.15 ? rr(0.02,0.05) : 0,
    seed: rr(0,100), col: base, topCol: top, dimple: rr(0.07,0.13),
    segU: 40, segV: 20
  });
  return { geo:g, R, H };
}
function makePumpkinFar(R0){
  const R = R0;
  const roll = rnd();
  const H = roll < 0.35 ? R*rr(0.8,1.05) : R*rr(1.05,1.5);
  const cr = rnd();
  let base, top;
  if (cr < 0.07){ base = [rr(0.80,0.90), rr(0.74,0.82), rr(0.58,0.68)]; top = base; }
  else if (cr < 0.30){ base = [rr(0.66,0.80), rr(0.34,0.45), rr(0.09,0.14)];
    top = [rr(0.40,0.50), rr(0.44,0.52), rr(0.20,0.26)]; }
  else { base = [rr(0.72,0.84), rr(0.34,0.44), rr(0.09,0.13)]; top = scaleRGB(base, 1.1); }
  const g = pumpkinGeo({
    R, H, ribs: ri(8,13), ribA: rr(0.05,0.10), flat: rr(2.0,2.7), round: rr(0.4,0.55),
    warts: rnd() < 0.12 ? 0.035 : 0, seed: rr(0,100), col: base, topCol: top,
    segU: 24, segV: 12
  });
  return { geo:g, R, H };
}
/* reuse a pool of detailed prototypes for near pumpkins */
const PROTO = [];
for (let i=0;i<26;i++) PROTO.push(makePumpkinProto(false));

function placePumpkin(x, z, R, H, geo, force){
  const h = groundHeight(x, z) - puddleDepth(x,z);
  const yaw = rr(0,TAU);
  const tiltX = rr(-0.09,0.09), tiltZ = rr(-0.09,0.09);
  E4.set(tiltX, yaw, tiltZ, 'YXZ');
  Q4.setFromEuler(E4);
  M4.compose(v3(x, h - 0.012, z), Q4, v3(1,1,1));
  pumpkinAcc.push(geo, M4);
  /* curled woody stem on top */
  const sLen = H*rr(0.20,0.40) + 0.03;
  const sg = stemGeo({
    len: sLen, baseR: Math.max(0.014, R*rr(0.10,0.16)),
    lean: rr(0.15,0.7), leanPh: rr(0,TAU), curl: rr(0.02,0.06),
    curlPh: rr(0,TAU), turns: rr(1.1,2.4), k: 6, n: 9,
    col0: [rr(0.36,0.46), rr(0.36,0.46), rr(0.20,0.27)],
    col1: [rr(0.56,0.68), rr(0.50,0.60), rr(0.34,0.44)]
  });
  const topY = H - 0.10*H*1.0;
  M4.compose(v3(x, h - 0.012, z), Q4, v3(1,1,1));
  const M2 = new THREE.Matrix4().makeTranslation(0, topY, 0).multiply(M4);
  stemAcc.push(sg, M2);
  pumpkins.push({ x, z, R, H });
}

/* ============================================================
   TUBE HELPER + VINES + LEAVES + TENDRILS
   ============================================================ */
function tubeGeo(pts, r0, r1, radial, colFn){
  const n = pts.length;
  const pos = [], col = [], idx = [];
  const tan = new THREE.Vector3(), nx = new THREE.Vector3(), bi = new THREE.Vector3();
  const UP = new THREE.Vector3(0,1,0);
  for (let i=0;i<n;i++){
    const a = pts[Math.max(0,i-1)], b = pts[Math.min(n-1,i+1)];
    tan.subVectors(b, a).normalize();
    nx.crossVectors(tan, UP);
    if (nx.lengthSq() < 1e-6) nx.set(1,0,0);
    nx.normalize();
    bi.crossVectors(tan, nx).normalize();
    const s = i/(n-1);
    const r = lerp(r0, r1, s);
    for (let k=0;k<=radial;k++){
      const th = k/radial*TAU;
      const c = Math.cos(th), si = Math.sin(th);
      pos.push(
        pts[i].x + (nx.x*c + bi.x*si)*r,
        pts[i].y + (nx.y*c + bi.y*si)*r,
        pts[i].z + (nx.z*c + bi.z*si)*r);
      const cc = colFn(s, th);
      col.push(cc[0], cc[1], cc[2]);
    }
  }
  const rw = radial+1;
  for (let i=0;i<n-1;i++) for (let k=0;k<radial;k++){
    const a = i*rw+k, b = a+1, cI = a+rw, d = cI+1;
    idx.push(a, cI, b, b, cI, d);
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  g.setAttribute('color', new THREE.Float32BufferAttribute(col, 3));
  g.setIndex(idx);
  g.computeVertexNormals();
  return g;
}

const vineAcc  = new GeoAcc({ color:true, frost:true });
const leafAcc  = new GeoAcc({ color:true, frost:true });
const sparklePts = [];
const _m = new THREE.Matrix4(), _q = new THREE.Quaternion(), _e = new THREE.Euler(), _s = new THREE.Vector3(1,1,1);

function addLeaf(x, y, z, yaw, tilt, size, near, hero){
  const tmpl = hero ? HERO_LEAF : (near ? LEAF_NEAR[ri(0,LEAF_NEAR.length-1)] : LEAF_FAR[ri(0,LEAF_FAR.length-1)]);
  const L = hero ? 1 : size;
  _e.set(tilt.x, yaw, tilt.z, 'YXZ');
  _q.setFromEuler(_e);
  _m.compose(v3(x,y,z), _q, _s.set(L,L,L));
  const tint = [rr(0.86,1.12), rr(0.88,1.10), rr(0.82,1.10)];
  leafAcc.push(tmpl, _m, { color: tint });
  /* sparkle at the frosted tip */
  if (rnd() < (near ? 0.5 : 0.16)){
    const tip = v3(0, 0, tmpl.parameters ? 0.4 : 0.36);
    hero || near ? tip.set(rr(-0.1,0.1), rr(-0.02,0.06), rr(0.28,0.44)) : tip.set(rr(-0.1,0.1), 0, rr(0.2,0.4));
    tip.multiplyScalar(L).applyQuaternion(_q).add(v3(x,y,z));
    sparklePts.push([tip.x, tip.y, tip.z, rnd()]);
  }
  return _m;
}

for (let k=0;k<18;k++){
  const rowX = ROW_X0 + k*ROW_P;
  const nearRow = rowX > -25 && rowX < 5;
  const ph = rr(0,TAU);
  /* main vine meandering along the ridge */
  const pts = [];
  for (let z=-48; z<=40; z += 2.6){
    const x = rowX + Math.sin(z*0.21 + ph)*0.34 + (fbm(rowX*0.7, z*0.13, 3)-0.5)*0.55;
    const y = groundHeight(x, z) + 0.030;
    pts.push(v3(x, y, z));
  }
  vineAcc.push(tubeGeo(pts, 0.030, 0.014, 5, (s, th) => {
    const dry = clamp(fbm(s*7+rowX, th, 3)*1.4 - 0.2, 0, 1);
    const c = mixRGB([0.34,0.40,0.19], [0.55,0.48,0.27], dry);
    return scaleRGB(c, 0.9 + 0.2*Math.cos(th));
  }), null, { frost: 0.55 });

  /* leaves + side branches + tendrils */
  for (let i=2;i<pts.length-1;i++){
    const p = pts[i];
    if (rnd() < (nearRow ? 0.42 : 0.62)) continue;
    const side = rnd() < 0.5 ? -1 : 1;
    const near = pathClear(p.x, p.z, 0) === false ? true : nearRow;   // near-row or near path
    const hero = pathClear(p.x + side*0.9, p.z, 0) && !pathClear(p.x + side*0.55, p.z, 0.0)
      && Math.random() < 0; // hero flag handled below
    const sz = nearRow ? rr(0.75,1.25) : rr(0.7,1.1);
    const yaw = side > 0 ? rr(-1.2,1.2) : Math.PI + rr(-1.2,1.2);
    const tilt = { x: rr(-0.35,0.35), z: rr(-0.3,0.3) };
    const ly = p.y + 0.01 + rr(0.0,0.10);
    addLeaf(p.x + Math.cos(yaw)*0.06, ly, p.z + Math.sin(yaw)*0.06, yaw, tilt, sz, nearRow, false);
    /* branch */
    if (rnd() < 0.42){
      const blen = rr(1.2, 2.8);
      const ang = yaw + rr(-0.9, 0.9);
      const bpts = [ p.clone() ];
      for (let t=1;t<=5;t++){
        const f = t/5;
        const bx = p.x + Math.cos(ang)*blen*f + Math.sin(f*6+ph)*0.16;
        const bz = p.z + Math.sin(ang)*blen*f + Math.cos(f*5+ph)*0.16;
        bpts.push(v3(bx, groundHeight(bx,bz)+0.026, bz));
      }
      vineAcc.push(tubeGeo(bpts, 0.017, 0.008, 5, (s) =>
        mixRGB([0.36,0.41,0.20], [0.56,0.49,0.28], 0.4 + 0.4*s)), null, { frost: 0.5 });
      if (rnd() < 0.6) addLeaf(bpts[3].x, bpts[3].y+0.012, bpts[3].z, ang + rr(-0.6,0.6),
        {x: rr(-0.4,0.4), z: rr(-0.3,0.3)}, rr(0.7,1.1), nearRow, false);
      /* curling tendril at the tip */
      if (rnd() < 0.75){
        const tip = bpts[5];
        vineAcc.push(tendrilGeo({
          origin: tip, axis: v3(Math.cos(ang), rr(0.1,0.5), Math.sin(ang)),
          len: rr(0.20,0.42), r0: rr(0.04,0.08), turns: rr(1.8,3.2), n: 20
        }), null, { frost: 0.4 });
      }
    }
  }
}

/* ============================================================
   WEATHERED SPLIT-RAIL FENCE (leaning posts, frosted rails)
   ============================================================ */
function bakeFrostByNormal(g, fn){
  const p = g.attributes.position, nn = g.attributes.normal;
  const arr = new Float32Array(p.count);
  for (let i=0;i<p.count;i++){
    arr[i] = clamp(fn(nn.getX(i), nn.getY(i), nn.getZ(i), p.getX(i), p.getY(i), p.getZ(i)), 0, 1);
  }
  g.setAttribute('aFrost', new THREE.BufferAttribute(arr, 1));
  return g;
}
const FENCE_X = -22;
const fenceAcc = new GeoAcc({ color:true, frost:true });
const fencePosts = [];
const RAIL_REL = [0.52, 1.02, 1.48];
(function buildFence(){
  const z0 = -42, z1 = 36, step = 3.15;
  const zs = [];
  for (let z=z0; z<=z1; z += step) zs.push(z + rr(-0.12,0.12));
  for (let i=0;i<zs.length;i++){
    const z = zs[i];
    const gx = FENCE_X + rr(-0.06,0.06);
    const h0 = groundHeight(gx, z);
    const H = rr(1.72, 1.90);
    const g = new THREE.BoxGeometry(rr(0.12,0.15), H, rr(0.12,0.15), 1, 5, 1);
    const pa = g.attributes.position;
    for (let vi=0;vi<pa.count;vi++){
      let x = pa.getX(vi), y = pa.getY(vi), zz = pa.getZ(vi);
      const ty = (y + H/2)/H;
      const taper = 1 - 0.26*ty;
      x *= taper; zz *= taper;
      x += (fbm(y*4+i, i*3.1, 3)-0.5)*0.014;
      zz += (fbm(y*4+i+9, i*2.2, 3)-0.5)*0.014;
      pa.setXYZ(vi, x, y, zz);
    }
    g.computeVertexNormals();
    /* grain runs along the post */
    const ua = g.attributes.uv;
    for (let vi=0;vi<ua.count;vi++){
      const u = ua.getX(vi), vv = ua.getY(vi);
      ua.setXY(vi, vv*(H/2.4), u*0.6);
    }
    bakeFrostByNormal(g, (nx,ny,nz) =>
      clamp(ny,0,1)*(0.55 + 0.45*fbm(nx*30+i*7, nz*30, 3))*0.9);
    const tiltX = rr(-0.05,0.05), tiltZ = rr(-0.05,0.05);
    _e.set(tiltX, rr(0,TAU), tiltZ);
    _q.setFromEuler(_e);
    _m.compose(v3(gx, h0 + H/2 - 0.06, z), _q, _s.set(1,1,1));
    const col = [rr(0.82,1.06), rr(0.84,1.04), rr(0.86,1.02)];
    fenceAcc.push(g, _m, { color: col });
    fencePosts.push({ x:gx, z, h0, H, q:_q.clone() });
    /* rails to the next post */
    if (i < zs.length-1){
      const z2 = zs[i+1];
      const len = Math.abs(z2-z) + 0.30;
      for (let r=0;r<RAIL_REL.length;r++){
        if (rnd() < 0.06) continue;   // an occasional missing rail
        const h0b = groundHeight(FENCE_X, (z+z2)/2);
        const rg = new THREE.BoxGeometry(rr(0.115,0.145), rr(0.115,0.145), len, 1, 1, 9);
        const rpos = rg.attributes.position;
        for (let vi=0;vi<rpos.count;vi++){
          const x = rpos.getX(vi), y = rpos.getY(vi), zz = rpos.getZ(vi);
          const f = (zz + len/2)/len;
          const sag = Math.sin(f*Math.PI)*rr(0.012,0.035);
          rpos.setXYZ(vi,
            x + (fbm(zz*3+i, r*7, 3)-0.5)*0.012,
            y - sag + (fbm(zz*3+i+4, r*5, 3)-0.5)*0.010,
            zz);
        }
        rg.computeVertexNormals();
        const rua = rg.attributes.uv;
        for (let vi=0;vi<rua.count;vi++)
          rua.setXY(vi, rua.getX(vi)*(len/2.6), rua.getY(vi)*0.55);
        bakeFrostByNormal(rg, (nx,ny,nz, px,py,pz) =>
          Math.pow(clamp(ny,0,1), 1.4)*(0.5 + 0.5*fbm(pz*22+i*3, px*22+r, 3)));
        const midZ = (z+z2)/2;
        const lean = rr(-0.035,0.035);
        _e.set(rr(-0.03,0.03), lean, rr(-0.04,0.04));
        _q.setFromEuler(_e);
        _m.compose(v3(FENCE_X + rr(-0.03,0.03), h0b + RAIL_REL[r], midZ), _q, _s.set(1,1,1));
        fenceAcc.push(rg, _m, { color: [rr(0.86,1.05), rr(0.86,1.05), rr(0.88,1.04)] });
        /* sparkle line along frosted rail tops */
        if (rnd() < 0.7){
          for (let sp=0; sp<3; sp++){
            sparklePts.push([FENCE_X + rr(-0.05,0.05), h0b + RAIL_REL[r] + 0.07,
                             midZ + rr(-len/2, len/2)*0.9, rnd()]);
          }
        }
      }
    }
  }
  const mat = new THREE.MeshStandardMaterial({
    map: TEX.woodCol, normalMap: TEX.woodNrm, vertexColors: true,
    roughness: 0.92, metalness: 0.0, envMapIntensity: 0.55
  });
  patchMaterial(mat, { frost:true, key:'wood' });
  const mesh = new THREE.Mesh(fenceAcc.build(), mat);
  mesh.castShadow = mesh.receiveShadow = true;
  scene.add(mesh);
})();

/* rail top world height (perches for the crows) */
function railTopAt(z, relIdx){
  let i = 0;
  while (i < fencePosts.length-1 && fencePosts[i+1].z < z) i++;
  const a = fencePosts[i], b = fencePosts[Math.min(i+1, fencePosts.length-1)];
  const t = clamp((z - a.z)/Math.max(0.001, b.z - a.z), 0, 1);
  const h = lerp(a.h0, b.h0, t);
  return h + RAIL_REL[relIdx] + 0.075;
}

(function buildWebs(){
  const webSpots = [
    { x: -11.6, z: 12.4, y: 0.34, yaw: 0.7 },
    { x: -11.4, z:  9.0, y: 0.30, yaw: 2.1 },
    { x: -16.4, z:  7.4, y: 0.32, yaw: 4.0 },
    { x: -18.8, z: -2.6, y: 0.28, yaw: 1.2 },
    { x:  -9.6, z:  4.4, y: 0.36, yaw: 5.2 }
  ];
  const pos = [], col = [];
  const RAD = 9, RINGS = 5;
  for (const w of webSpots){
    const y0 = groundHeight(w.x, w.z);
    const cy = y0 + w.y;
    const cs = Math.cos(w.yaw), sn = Math.sin(w.yaw);
    const R = rr(0.15, 0.24);
    const anchor = (a, r, sag) => [
      w.x + Math.cos(a)*r*cs - Math.sin(a)*r*sn*0.15,
      cy + Math.sin(a)*r - sag,
      w.z + Math.sin(a)*r*cs + Math.cos(a)*r*sn*0.15
    ];
    /* radials */
    const tips = [];
    for (let i=0;i<RAD;i++){
      const a = i/RAD*TAU + rr(-0.06,0.06);
      const t = anchor(a, R, rr(0.02,0.07));
      tips.push([a,t]);
      pos.push(w.x, cy, w.z); col.push(1,1,1);
      pos.push(t[0], t[1], t[2]); col.push(0.95,0.97,1);
    }
    /* spiral capture threads */
    for (let ring=1;ring<=RINGS;ring++){
      const r = R*ring/RINGS;
      for (let i=0;i<RAD;i++){
        const [a0] = tips[i], [a1] = tips[(i+1)%RAD];
        const aa = a1 < a0 ? a1 + TAU : a1;
        const p0 = anchor(a0, r, 0.015 + ring*0.006);
        const p1 = anchor((a0+aa)/2, r*rr(0.94,1.05), 0.02 + ring*0.008);
        const p2 = anchor(aa, r, 0.015 + ring*0.006);
        pos.push(p0[0],p0[1],p0[2]); col.push(0.9,0.93,1);
        pos.push(p1[0],p1[1],p1[2]); col.push(0.9,0.93,1);
        pos.push(p1[0],p1[1],p1[2]); col.push(0.9,0.93,1);
        pos.push(p2[0],p2[1],p2[2]); col.push(0.9,0.93,1);
        if (ring >= RINGS-1 && rnd() < 0.5) sparklePts.push([p1[0], p1[1], p1[2], rnd()]);
      }
    }
    for (let i=0;i<RAD;i++) sparklePts.push([tips[i][1][0], tips[i][1][1], tips[i][1][2], rnd()]);
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  g.setAttribute('color', new THREE.Float32BufferAttribute(col, 3));
  const mat = new THREE.LineBasicMaterial({ vertexColors: true, transparent: true,
    opacity: 0.62, fog: true });
  const lines = new THREE.LineSegments(g, mat);
  lines.renderOrder = 5;
  scene.add(lines);
})();

(function buildSparkles(){
  const n = sparklePts.length;
  const pos = new Float32Array(n*3), seed = new Float32Array(n);
  for (let i=0;i<n;i++){
    const e = sparklePts[i];
    pos[i*3] = e[0]; pos[i*3+1] = e[1];
    pos[i*3+2] = e[2]; seed[i] = e[3];
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  g.setAttribute('aSeed', new THREE.BufferAttribute(seed, 1));
  const mat = new THREE.ShaderMaterial({
    transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
    uniforms: {
      uSunView: U.sunView, uMelt: U.melt, uTime: U.time,
      uPR: { value: Math.min(window.devicePixelRatio || 1, 1.75) }
    },
    vertexShader: `
      attribute float aSeed;
      uniform vec3 uSunView; uniform float uTime; uniform float uPR;
      varying float vS;
      void main(){
        vec4 mv = modelViewMatrix * vec4(position, 1.0);
        float s1 = fract(aSeed*7.13), s2 = fract(aSeed*3.71);
        float th = s1*6.28318, ph = acos(clamp(2.0*s2-1.0, -1.0, 1.0));
        vec3 n = normalize(vec3(sin(ph)*cos(th), abs(cos(ph))*0.75 + 0.25, sin(ph)*sin(th)));
        vec3 vd = normalize(-mv.xyz);
        vec3 hv = normalize(vd + normalize(uSunView));
        float spec = pow(max(dot(n, hv), 0.0), 46.0);
        vS = spec;
        float sz = (1.0 + 5.5*spec)*(110.0/max(1.0, -mv.z))*uPR;
        gl_PointSize = clamp(sz, 1.0, 9.0);
        gl_Position = projectionMatrix * mv;
      }`,
    fragmentShader: `
      varying float vS; uniform float uMelt;
      void main(){
        vec2 p = gl_PointCoord - 0.5;
        float a = smoothstep(0.5, 0.05, length(p)) * vS * 2.4;
        a *= 0.45 + 0.85*uMelt;
        if (a < 0.012) discard;
        gl_FragColor = vec4(vec3(1.0, 0.96, 0.88)*(0.8 + 1.6*vS), a);
      }`
  });
  const pts = new THREE.Points(g, mat);
  pts.renderOrder = 22;
  pts.frustumCulled = false;
  scene.add(pts);
})();

(function buildVapor(){
  const bases = [];

    const x = rr(-26, 6), z = rr(-34, 30);

    if (fbm(x*0.3, z*0.3, 3) < 0.45) continue;
    bases.push([x, groundHeight(x,z) + 0.04, z]);

  for (let i=0;i<n;i++){
    pos[i*3]=bases[i][0]; pos[i*3+1]=bases[i][1]; pos[i*3+2]=bases[i][2];
    seed[i] = rnd();
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  g.setAttribute('aSeed', new THREE.BufferAttribute(seed, 1));
  const mat = new THREE.ShaderMaterial({
    transparent: true, depthWrite: false, blending: THREE.NormalBlending,
    uniforms: {
      uTime: U.time, uLift: U.lift, uMelt: U.melt, uMap: { value: TEX.softDot },
      uPR: { value: Math.min(window.devicePixelRatio || 1, 1.75) }
    },
    vertexShader: `
      attribute float aSeed;
      uniform float uTime; uniform float uLift; uniform float uPR;
      varying float vA;
      void main(){
        float t = fract(aSeed + uTime*0.115);
        vec3 p = position;
        p.y += 1.05*t;
        p.x += (sin(uTime*0.42 + aSeed*40.0)*0.10 + 0.16)*t;
        p.z += (cos(uTime*0.37 + aSeed*31.0)*0.08 - 0.34)*t;
        vec4 mv = modelViewMatrix * vec4(p, 1.0);
        vA = sin(3.14159*t) * 0.19 * (1.0 - uLift*0.45);
        gl_PointSize = (0.30 + 1.05*t)*(300.0/max(1.0, -mv.z))*uPR;
        gl_Position = projectionMatrix * mv;
      }`,
    fragmentShader: `
      uniform sampler2D uMap; uniform float uMelt;
      varying float vA;
      void main(){
        float m = texture2D(uMap, gl_PointCoord).a;
        gl_FragColor = vec4(vec3(0.80, 0.82, 0.88), m*vA*(0.6 + 0.7*uMelt));
      }`
  });
  const pts = new THREE.Points(g, mat);
  pts.renderOrder = 21;
  pts.frustumCulled = false;
  scene.add(pts);
})();

(function buildMist(){
  const defs = [
    { y: 0.20, a: 0.52, sc: 1.00, off: [0.0, 0.0] },
    { y: 0.50, a: 0.42, sc: 1.45, off: [0.37, 0.71] },
    { y: 0.88, a: 0.32, sc: 2.10, off: [0.83, 0.29] },
    { y: 1.34, a: 0.24, sc: 2.90, off: [0.15, 0.55] }
  ];
  const geo = new THREE.PlaneGeometry(230, 250, 1, 1);
  geo.rotateX(-Math.PI/2);
  for (const d of defs){
    const mat = new THREE.ShaderMaterial({
      transparent: true, depthWrite: false, side: THREE.DoubleSide,
      uniforms: {
        uMap: { value: TEX.fog }, uTime: U.time, uAlpha: { value: d.a },
        uLift: U.lift, uSunDir: U.sunDir, uFogD: U.fogDensity,
        uFogCool: U.fogCool, uFogWarm: U.fogWarm,
        uOff: { value: new THREE.Vector2(d.off[0], d.off[1]) },
        uScale: { value: d.sc }
      },
      vertexShader: `
        varying vec3 vW; varying vec2 vUv; varying float vFogDepth;
        void main(){
          vUv = uv;
          vec4 wp = modelMatrix * vec4(position, 1.0);
          vW = wp.xyz;
          vec4 mv = viewMatrix * wp;
          vFogDepth = -mv.z;
          gl_Position = projectionMatrix * mv;
        }`,
      fragmentShader: `
        uniform sampler2D uMap; uniform float uTime; uniform float uAlpha;
        uniform float uLift; uniform vec3 uSunDir; uniform float uFogD;
        uniform vec3 uFogCool; uniform vec3 uFogWarm;
        uniform vec2 uOff; uniform float uScale;
        varying vec3 vW; varying vec2 vUv; varying float vFogDepth;
        void main(){
          vec2 uv1 = vUv*vec2(3.2,3.6)*uScale + uOff + vec2(uTime*0.0065,  uTime*0.0042);
          vec2 uv2 = vUv*vec2(6.8,6.1)*uScale + uOff*1.7 - vec2(uTime*0.0110, uTime*0.0075);
          float n = texture2D(uMap, uv1).a*0.78 + texture2D(uMap, uv2).a*0.5;
          n = smoothstep(0.14, 1.02, n);
          float edge = 1.0 - smoothstep(0.30, 0.47, length(vUv - 0.5));
          float dc = distance(cameraPosition.xz, vW.xz);
          float nearF = smoothstep(0.9, 4.5, dc);
          vec3 V = normalize(vW - cameraPosition);
          float sunAmt = pow(max(dot(V, uSunDir), 0.0), 4.0);
          vec3 col = mix(vec3(0.60,0.65,0.76), vec3(0.98,0.77,0.49), sunAmt*0.88);
          col *= 0.78 + 0.30*n;
          float alpha = n * edge * nearF * uAlpha * (1.0 - uLift*0.52);
          float fogF = 1.0 - exp(-uFogD*uFogD*vFogDepth*vFogDepth);
          vec3 fogCol = mix(uFogCool, uFogWarm, pow(max(dot(V,uSunDir),0.0), 3.5));
          col = mix(col, fogCol, fogF*0.8);
          gl_FragColor = vec4(col, alpha*(1.0 - fogF*0.7));
        }`
    });
    const mesh = new THREE.Mesh(geo, mat);
    mesh.position.set(-5, d.y, -28);
    mesh.renderOrder = 10;
    mesh.userData.baseY = d.y;
    scene.add(mesh);

})();

/* ---- grass and dry stalks, frost-tipped ---------------------------------- */
function rr2(s,a,b){ const t=(Math.sin(s*127.1)*43758.5453)%1; return a + Math.abs(t)*(b-a); }
function bladeGeo(SEG){
  const W=0.030;
  const pos=[], nor=[], uv=[], idx=[];
  for(let i=0;i<=SEG;i++){
    const t=i/SEG, w=W*(1-0.86*Math.pow(t,1.4)), bend=Math.pow(t,1.8);
    pos.push(-w, t - bend*0.34, bend*bend*0.46, w, t - bend*0.34, bend*bend*0.46);
    nor.push(0,0.3,1, 0,0.3,1);
    uv.push(0,t, 1,t);
  }
  for(let i=0;i<SEG;i++){ const a=i*2; idx.push(a,a+2,a+1, a+1,a+2,a+3); }
  const g=new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos,3));
  g.setAttribute('normal', new THREE.Float32BufferAttribute(nor,3));
  g.setAttribute('uv', new THREE.Float32BufferAttribute(uv,2));
  g.setIndex(idx);
  const fe=new Float32Array(pos.length/3);
  for(let i=0;i<fe.length;i++) fe[i]=sstep(0.40,1.0,(i%(SEG+1))/SEG);
  g.setAttribute('aFrost', new THREE.BufferAttribute(fe,1));
  return g;
}
function grassMaterial(tint, trans){
  const m = new THREE.MeshStandardMaterial({
    color: tint, roughness: 0.87, metalness:0.0, side: THREE.DoubleSide, envMapIntensity:0.34
  });
  patchPBR(m, {instanced:true, edgeAttr:'aFrost', sway:'clamp(position.y,0.0,1.0)',
    translit:trans, translitAmt:0.13});
  return m;
}
function buildGrass(){
  const mat = grassMaterial(0x4c5334, '0.20,0.24,0.09');
  const r2 = mulberry32(31337), items=[];
  /* Density keys off the camera route: the lens travels through waist-deep
     frost grass, while the far field only needs enough to break the soil. */
  const GN=176, cell=FIELD.span/(GN-1), GD=new Float32Array(GN*GN);
  const gxAt = i => FIELD.cx - FIELD.span/2 + i*cell;
  { const pts=[]; for(let i=0;i<=120;i++) pts.push(camCurve.getPointAt(i/120));
    for(let j=0;j<GN;j++){ const z=gxAt(j);
      for(let i=0;i<GN;i++){ const x=gxAt(i); let m=1e9;
        for(let k=0;k<pts.length;k++){ const dx=pts[k].x-x, dz=pts[k].z-z, dd=dx*dx+dz*dz; if(dd<m) m=dd; }
        GD[j*GN+i]=Math.sqrt(m); } } }
  for(let j=0;j<GN;j++){ const z0=gxAt(j);
    for(let i=0;i<GN;i++){ const x0=gxAt(i), pd=GD[j*GN+i];
      let dens = 1.2 + 168*Math.exp(-pd/2.7) + 15*Math.exp(-pd/12.0);
      for(const rx of CFG.rowX) if(Math.abs(x0-(rx+rowMeander(z0)))<0.62){ dens*=0.28; break; }
      if(Math.abs(x0-(CFG.fenceX+0.62))<1.7) dens = Math.max(dens, 66);
      const n = Math.round(dens*cell*cell*(0.72+r2()*0.56));
      for(let k=0;k<n;k++) items.push({
        x:x0+(r2()-0.5)*cell*1.6, z:z0+(r2()-0.5)*cell*1.6, y:0,
        yaw:r2()*TAU, h:rr(0.07,0.23), lean:rr(0.72,1.30),
        tilt:rr(-0.5,0.5), frost:rr(0.45,1.0), seed:r2(), dry:r2()});
    } }
  for(const it of items) it.y = groundH(it.x,it.z);
  const g = bladeGeo(5);
  const im = new THREE.InstancedMesh(g, mat, items.length);
  const par = new Float32Array(items.length*4), tin = new Float32Array(items.length*3);
  const M=new THREE.Matrix4(), q=new THREE.Quaternion(), e=new THREE.Euler(), s3=new THREE.Vector3(), vp=new THREE.Vector3();
  items.forEach((it,i)=>{
    e.set(it.tilt, it.yaw, it.lean*0.32); q.setFromEuler(e);
    M.compose(vp.set(it.x, it.y-0.012, it.z), q, s3.set(it.h*rr2(it.seed,0.85,1.35), it.h*it.lean, it.h));
    im.setMatrixAt(i,M);
    par[i*4]=it.frost; par[i*4+1]=it.seed; par[i*4+2]=0; par[i*4+3]=0;
    const dr=it.dry;
    tin[i*3]=lerp(0.86,1.00,dr); tin[i*3+1]=lerp(0.92,0.96,dr); tin[i*3+2]=lerp(0.78,0.70,dr);
  });
  g.setAttribute('aParams', new THREE.InstancedBufferAttribute(par,4));
  g.setAttribute('aTint', new THREE.InstancedBufferAttribute(tin,3));
  im.frustumCulled = false; im.receiveShadow = true; im.castShadow = false;
  scene.add(im);

  const smat = grassMaterial(0x8d8158, '0.26,0.25,0.12');
  const sg = bladeGeo(7);
  const r3 = mulberry32(777), sitems=[];
  for(let t=0;t<560;t++){
    const gi=(r3()*GN)|0, gj=(r3()*GN)|0;
    if(GD[gj*GN+gi] > 10.5 && r3()<0.88) continue;
    const cxx = gxAt(gi)+rr(-0.55,0.55), czz = gxAt(gj)+rr(-0.55,0.55);
    const n = 7+((r3()*22)|0);
    for(let k=0;k<n;k++){
      const x=cxx+rr(-0.8,0.8), z=czz+rr(-0.8,0.8);
      sitems.push({x,z,y:groundH(x,z), yaw:r3()*TAU, h:rr(0.40,1.0), lean:rr(1.0,1.9),
        tilt:rr(-0.3,0.3), frost:rr(0.3,1.0), seed:r3()});
    }
  }
  const sim = new THREE.InstancedMesh(sg, smat, sitems.length);
  const spar=new Float32Array(sitems.length*4), stin=new Float32Array(sitems.length*3);
  sitems.forEach((it,i)=>{
    e.set(it.tilt, it.yaw, it.lean*0.3); q.setFromEuler(e);
    M.compose(vp.set(it.x,it.y-0.012,it.z), q, s3.set(it.h*0.42, it.h, it.h*0.42));
    sim.setMatrixAt(i,M);
    spar[i*4]=it.frost; spar[i*4+1]=it.seed; spar[i*4+2]=0; spar[i*4+3]=0;
    stin[i*3]=1.08; stin[i*3+1]=0.99; stin[i*3+2]=0.72;
  });
  sg.setAttribute('aParams', new THREE.InstancedBufferAttribute(spar,4));
  sg.setAttribute('aTint', new THREE.InstancedBufferAttribute(stin,3));
  sim.frustumCulled=false; sim.receiveShadow=true;
  scene.add(sim);
  return {im,sim};
}

/* ============================================================================
   SPLIT-RAIL FENCE  — weathered silver-grey posts and rails, leaning,
   with real perch slots the crows can land in.
   ========================================================================== */
const PERCHES = [];
function makePostGeo(){
  /* rough-hewn square post, tapered, with chamfered edges */
  const H=1.42, W=0.088;
  const g = new THREE.BoxGeometry(W, H, W, 2, 6, 2);
  const pos = g.attributes.position;
  const r2 = mulberry32(5150);
  const col = new Float32Array(pos.count*3);
  for(let i=0;i<pos.count;i++){
    let x=pos.getX(i), y=pos.getY(i), z=pos.getZ(i);
    const t = (y/H)+0.5;
    const taper = 1 + 0.22*(1-t);
    const bow = Math.sin(t*2.3)*0.010;
    x = x*taper + bow + (r2()-0.5)*0.006;
    z = z*taper - bow + (r2()-0.5)*0.006;
    if(t>0.94){ x*=0.86; z*=0.86; }              // sawn-off, slightly smaller top
    pos.setXYZ(i,x,y,z);
    const v = 0.78 + 0.44*Math.pow(r2(),1.6);
    col[i*3]=v; col[i*3+1]=v*0.99; col[i*3+2]=v*0.96;
  }
  g.setAttribute('color', new THREE.BufferAttribute(col,3));
  g.computeVertexNormals();
  return g;
}
function makeRailGeo(len){
  /* hewn rail: flat section, twisted along its length, sagging, worn */
  const W=0.118, T=0.056, SEG=14;
  const pos=[], nor=[], uv=[], idx=[], col=[];
  const r2 = mulberry32(777+Math.round(len*10));
  const rows=[];
  for(let i=0;i<=SEG;i++){
    const t=i/SEG, x=(t-0.5)*len;
    const tw = Math.sin(t*2.1)*0.06 + (r2()-0.5)*0.02;
    const wt = W*(1 - 0.10*Math.abs(t-0.5)*2 + (r2()-0.5)*0.05);
    const tt = T*(1 - 0.14*Math.abs(t-0.5)*2);
    const sag = -Math.sin(t*Math.PI)*0.014;
    const c=Math.cos(tw), s=Math.sin(tw);
    const corner=(y,z)=>[x, y*c - z*s + sag, y*s + z*c];
    rows.push([ corner( tt*0.5, -wt*0.5), corner( tt*0.5, wt*0.5),
                corner(-tt*0.5,  wt*0.5), corner(-tt*0.5,-wt*0.5) ]);
  }
  const faces=[[0,1],[1,2],[2,3],[3,0]], shade=[1.06,0.80,0.52,0.70];
  faces.forEach((f,fi)=>{
    for(let i=0;i<=SEG;i++) for(const k of f){
      const p=rows[i][k];
      const sh = shade[fi]*(0.84+0.30*r2());
      pos.push(p[0],p[1],p[2]); nor.push(0,1,0); uv.push(i/SEG*3.0, k); col.push(sh,sh*0.99,sh*0.96);
    }
  });
  const per=(SEG+1)*2;
  for(let f=0;f<4;f++) for(let i=0;i<SEG;i++){
    const a=f*per+i*2, b=a+2;
    idx.push(a,a+1,b, b,a+1,b+1);
  }
  const g=new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos,3));
  g.setAttribute('normal', new THREE.Float32BufferAttribute(nor,3));
  g.setAttribute('uv', new THREE.Float32BufferAttribute(uv,2));
  g.setAttribute('color', new THREE.Float32BufferAttribute(col,3));
  g.setIndex(idx);
  g.computeVertexNormals();
  return g;
}
let woodMat = null;
function buildFence(){
  const postG = makePostGeo();
  const railG = makeRailGeo(2.6);
  woodMat = new THREE.MeshStandardMaterial({
    map: TEX.wood, color: 0x8f8574, normalMap: TEX.woodNormal,
    normalScale:new THREE.Vector2(1.15,1.15), roughnessMap: TEX.woodRough,
    roughness: 0.93, metalness: 0.0, vertexColors: true, envMapIntensity: 0.32
  });
  patchPBR(woodMat, {translit:'0.30,0.24,0.16', translitAmt:0.22, frostExpr:'0.85'});

  const r2 = mulberry32(606);
  const z0 = CFG.zMin-1.5, z1 = CFG.zMax+1.5;
  const step = 2.75;
  const n = Math.floor((z1-z0)/step);
  const posts = [];
  for(let i=0;i<=n;i++){
    const z = z0 + i*step + rr(-0.06,0.06);
    const x = CFG.fenceX + Math.sin(z*0.07)*0.10 + rr(-0.05,0.05);
    const y = groundH(x,z);
    const lean = rr(-0.10,0.10), lean2 = rr(-0.075,0.075);
    const sink = rr(0.03,0.10);
    posts.push({x,y,z,lean,lean2,h:1.42-sink*0.5});
  }
  const pm = new THREE.InstancedMesh(postG, woodMat, posts.length);
  const M=new THREE.Matrix4(), q=new THREE.Quaternion(), e=new THREE.Euler(), s=new THREE.Vector3(), vp=new THREE.Vector3();
  const par=new Float32Array(posts.length*4), tin=new Float32Array(posts.length*3);
  posts.forEach((p,i)=>{
    e.set(p.lean, rr(-0.2,0.2), p.lean2); q.setFromEuler(e);
    M.compose(vp.set(p.x, p.y+0.71-0.04, p.z), q, s.set(rr(0.94,1.08), rr(0.92,1.06), rr(0.94,1.08)));
    pm.setMatrixAt(i,M);
    par[i*4]=1.0; par[i*4+1]=r2(); par[i*4+2]=0; par[i*4+3]=0;
    const v = rr(0.80,1.06); tin[i*3]=v; tin[i*3+1]=v*0.99; tin[i*3+2]=v*0.97;
    addCollider(p.x, p.y+0.8, p.z, 0.20);
    /* the top rail is a crow perch: record a slot slightly above the post head */
    PERCHES.push({x:p.x+0.02, y:p.y+1.40, z:p.z+rr(-0.05,0.05), yaw:Math.PI*0.5, post:i});
  });
  postG.setAttribute('aParams', new THREE.InstancedBufferAttribute(par,4));
  postG.setAttribute('aTint', new THREE.InstancedBufferAttribute(tin,3));
  pm.castShadow = pm.receiveShadow = true;
  pm.frustumCulled=false; pm.layers.enable(SOLID_LAYER);
  scene.add(pm);

  /* two rails per bay, let into the posts, each with its own sag and tilt */
  const rails=[];
  for(let i=0;i<n;i++){
    const a=posts[i], b=posts[i+1];
    for(let k=0;k<2;k++){
      const yTop = k===0 ? 1.16 : 0.62;
      const ya = a.y + yTop + rr(-0.02,0.02), yb = b.y + yTop + rr(-0.02,0.02);
      const ax=a.x+0.05, az=a.z, bx=b.x+0.05, bz=b.z;
      const mx=(ax+bx)/2, mz=(az+bz)/2, my=(ya+yb)/2;
      const len = Math.hypot(bx-ax, bz-az);
      const yaw = Math.atan2(-(bz-az), bx-ax);
      rails.push({mx,my,mz,yaw,roll:rr(-0.09,0.09),pitch:Math.atan2(yb-ya,len),len,frost:k===0?1.0:0.72,seed:r2()});
    }
  }
  /* rail geometry is built for a 2.6 m rail: scale each instance along x */
  const rm = new THREE.InstancedMesh(railG, woodMat, rails.length);
  const par2=new Float32Array(rails.length*4), tin2=new Float32Array(rails.length*3);
  rails.forEach((r,i)=>{
    e.set(r.pitch, r.yaw, r.roll); q.setFromEuler(e);
    M.compose(vp.set(r.mx,r.my,r.mz), q, s.set(r.len/2.6, 1, 1));
    rm.setMatrixAt(i,M);
    par2[i*4]=r.frost; par2[i*4+1]=r.seed; par2[i*4+2]=0; par2[i*4+3]=0;
    const v=rr(0.82,1.05); tin2[i*3]=v; tin2[i*3+1]=v*0.99; tin2[i*3+2]=v*0.96;
    addCollider(r.mx, r.my, r.mz, Math.max(0.35, r.len*0.42));
  });
  railG.setAttribute('aParams', new THREE.InstancedBufferAttribute(par2,4));
  railG.setAttribute('aTint', new THREE.InstancedBufferAttribute(tin2,3));
  rm.castShadow = rm.receiveShadow = true;
  rm.frustumCulled=false; rm.layers.enable(SOLID_LAYER);

}

/* ============================================================================
   TREE LINE + SCARECROW + CART
   ========================================================================== */
function buildTreeLine(){
  /* bare late-October oaks: trunk, forks, twigs, a few dark mistletoe masses.
     Read as one ragged dark band against the dawn, not as lollipops. */
  const mat = new THREE.MeshStandardMaterial({
    color: 0x090b0f, roughness: 0.98, metalness: 0.0, envMapIntensity: 0.16
  });
  patchPBR(mat, {frostExpr:'0.0'});
  const r2 = mulberry32(99);
  const geos=[];
  const UP = new THREE.Vector3(0,1,0);
  const _v1=new THREE.Vector3(), _v2=new THREE.Vector3(), _v3=new THREE.Vector3();
  const _mm=new THREE.Matrix4(), _qq=new THREE.Quaternion(), _ee=new THREE.Euler();
  const stick = new THREE.CylinderGeometry(0.5,0.5,1,4,1,true).toNonIndexed();
  /* lumpy foliage clump: subdivided icosahedron with a per-vertex radial jitter
     (duplicated vertices share a jitter via the key map, so faces stay welded) */
  const puff  = new THREE.IcosahedronGeometry(1,1);
  { const pp = puff.attributes.position, pr = mulberry32(4711), seen = new Map();
    for(let i=0;i<pp.count;i++){
      const k = pp.getX(i).toFixed(3)+','+pp.getY(i).toFixed(3)+','+pp.getZ(i).toFixed(3);
      let f = seen.get(k);
      if(f===undefined){ f = 0.74+pr()*0.52; seen.set(k,f); }
      pp.setXYZ(i, pp.getX(i)*f, pp.getY(i)*f*0.86, pp.getZ(i)*f);
    }
    puff.computeVertexNormals();
  }
  const place = (src,ax,ay,az,dx,dy,dz,len,rx,rz)=>{
    const g = src.clone();
    _qq.setFromUnitVectors(UP, _v1.set(dx,dy,dz).normalize());
    _mm.compose(_v2.set(ax+dx*len*0.5, ay+dy*len*0.5, az+dz*len*0.5), _qq, _v3.set(rx*2,len,rz*2));
    g.applyMatrix4(_mm);
    geos.push(g);
    return [ax+dx*len, ay+dy*len, az+dz*len];
  };
  function branch(x,y,z, yaw, pitch, len, rad, depth, rnd){
    const dh = Math.sin(pitch), dy = Math.cos(pitch);
    const dx = Math.cos(yaw)*dh, dz = Math.sin(yaw)*dh;
    const tip = place(stick, x,y,z, dx,dy,dz, len, rad, rad);
    if(depth<=0) return [tip];
    const out=[];
    const n = 2 + (rnd()<0.45?1:0);
    for(let i=0;i<n;i++){
      const a = yaw + (i-(n-1)/2)*1.15 + (rnd()-0.5)*0.9;
      const p = clamp(pitch*0.5 + 0.30 + rnd()*0.55, 0.12, 1.30);
      out.push(...branch(tip[0],tip[1],tip[2], a, p, len*(0.56+rnd()*0.22), rad*0.55, depth-1, rnd));
    }
    return out;
  }
  const ring = (rMin,rMax,count,h0,h1,seedOff)=>{
    for(let i=0;i<count;i++){
      const a = (i/count)*TAU + r2()*0.012;
      const R = rMin + r2()*(rMax-rMin);
      const x = FIELD.cx + Math.cos(a)*R, z = FIELD.cz + Math.sin(a)*R;
      const gy = groundH(x,z)*0.35 - 0.6;
      const h  = h0 + r2()*(h1-h0);
      const rnd = mulberry32(1000+i+seedOff);
      const tips = branch(x, gy, z, rnd()*TAU, 0.02+rnd()*0.06, h*0.36, h*0.052, 3, rnd);
      /* crown mass: one big central clump plus ragged clumps hung on the tips */
      { const g = puff.clone(), s = h*0.20+rnd()*h*0.07;
        _mm.compose(_v2.set(tips[0][0], gy+h*(0.70+rnd()*0.14), tips[0][2]),
                    _qq.setFromEuler(_ee.set(rnd()*3,rnd()*3,rnd()*3)),
                    _v3.set(s*1.15, s*0.80, s*1.15));
        g.applyMatrix4(_mm); geos.push(g); }
      for(const t of tips){
        const n = 1+((rnd()*2)|0);
        for(let k=0;k<n;k++){
          const g = puff.clone();
          const s = h*(0.055+rnd()*0.075);
          _mm.compose(_v2.set(t[0]+(rnd()-0.5)*s*1.9, t[1]+(rnd()-0.25)*s*1.2, t[2]+(rnd()-0.5)*s*1.9),
                      _qq.setFromEuler(_ee.set(rnd()*3,rnd()*3,rnd()*3)),
                      _v3.set(s*1.30, s*0.74, s*1.30));
          g.applyMatrix4(_mm);
          geos.push(g);
        }
      }
    }
  };
  ring(96, 142, 132, 11.0, 21.0, 0);
  ring(134, 196, 84, 14.0, 25.0, 77);
  const merged = mergeGeometries(geos,false);
  if(!merged) return null;
  const m = new THREE.Mesh(merged, mat);
  m.frustumCulled = false;
  m.receiveShadow = false;
  scene.add(m);
  return m;
}

/* ---- frost-rimed spider webs between fence posts and stalks -------------- */
function buildWebs(){
  const S=256, c=cnv(S), x=c.getContext('2d');
  x.clearRect(0,0,S,S);
  const cx2=S*0.5, cy2=S*0.42;
  x.strokeStyle='rgba(238,244,250,0.85)';
  const r2=mulberry32(31);
  const spokes=17;
  for(let i=0;i<spokes;i++){
    const a = i/spokes*TAU + rr(-0.03,0.03);
    x.lineWidth = 1.1;
    x.beginPath(); x.moveTo(cx2,cy2);
    x.lineTo(cx2+Math.cos(a)*S*0.49, cy2+Math.sin(a)*S*0.55); x.stroke();
  }
  for(let ring=1;ring<=13;ring++){
    const rr2 = Math.pow(ring/13,1.25)*S*0.47;
    x.lineWidth = 0.9;
    x.beginPath();
    for(let i=0;i<=spokes;i++){
      const a=i/spokes*TAU;
      const wob = 1 + 0.10*Math.sin(a*3+ring) - 0.05;
      const px=cx2+Math.cos(a)*rr2*wob, py=cy2+Math.sin(a)*rr2*wob*1.12;
      i? x.lineTo(px,py) : x.moveTo(px,py);
    }
    x.stroke();
  }
  /* dew beads: the glitter comes from the texture itself */
  for(let i=0;i<650;i++){
    const a=r2()*TAU, rad=Math.pow(r2(),0.65)*S*0.48;
    const px=cx2+Math.cos(a)*rad, py=cy2+Math.sin(a)*rad*1.12;
    const s2=0.7+r2()*1.9;
    x.fillStyle=`rgba(255,255,255,${0.35+0.6*r2()})`;
    x.beginPath(); x.arc(px,py,s2,0,TAU); x.fill();
  }
  const tex = new THREE.CanvasTexture(c);
  tex.colorSpace = THREE.SRGBColorSpace;
  tex.anisotropy = 4;
  const mat = new THREE.MeshStandardMaterial({
    map:tex, alphaMap:tex, transparent:true, depthWrite:false, side:THREE.DoubleSide,
    roughness:0.35, metalness:0.0, emissive:new THREE.Color(0.55,0.60,0.72), emissiveMap:tex,
    emissiveIntensity:0.42, opacity:0.62, envMapIntensity:1.4
  });
  const grp = new THREE.Group();
  const spots = [];
  if(PERCHES.length){
    for(let i=0;i<PERCHES.length-1;i+=2){
      const a=PERCHES[i], b=PERCHES[i+1];
      spots.push({x:(a.x+b.x)/2, y:(a.y+b.y)/2-0.16, z:(a.z+b.z)/2, s:rr(0.22,0.34), yaw:Math.PI*0.5+rr(-0.3,0.3)});
    }
  }
  for(let i=0;i<26;i++){
    const rx = CFG.rowX[(i*3)%CFG.rowX.length];
    const z = rr(CFG.zMin, CFG.zMax);
    const x2 = rx+rowMeander(z)+rr(-1.2,1.2);
    spots.push({x:x2, y:groundH(x2,z)+rr(0.22,0.5), z, s:rr(0.10,0.20), yaw:rr(0,TAU), tilt:rr(-0.3,0.3)});
  }
  for(const s of spots){
    const pl = new THREE.PlaneGeometry(s.s*2, s.s*2.1, 1,1);
    const m = new THREE.Mesh(pl, mat);
    m.position.set(s.x, s.y, s.z);
    m.rotation.set(s.tilt||rr(-0.18,0.18), s.yaw, rr(-0.25,0.25));
    m.renderOrder = 4;
    grp.add(m);
  }
  scene.add(grp);
  return grp;
}

/* ---- breath-like vapour lifting off the warmed frost --------------------- */
let vapour = null;
function buildVapour(){
  const N = 900;
  const g = new THREE.BufferGeometry();
  const pos = new Float32Array(N*3), seed = new Float32Array(N*3);
  const r2 = mulberry32(6161);
  for(let i=0;i<N;i++){
    const x = FIELD.cx + rr(-24,24), z = FIELD.cz + rr(-26,34);
    pos[i*3]=x; pos[i*3+1]=groundH(x,z); pos[i*3+2]=z;
    seed[i*3]=r2(); seed[i*3+1]=r2(); seed[i*3+2]=r2();
  }
  g.setAttribute('position', new THREE.BufferAttribute(pos,3));
  g.setAttribute('aSeed', new THREE.BufferAttribute(seed,3));
  const mat = new THREE.ShaderMaterial({
    transparent:true, depthWrite:false, blending:THREE.AdditiveBlending,
    uniforms: Object.assign({uSize:{value: 0.0}, uPixel:{value: 900}}, {
      uTime:U.uTime, uSunDir:U.uSunDir, uSunColor:U.uSunColor, uMelt:U.uMelt, uMist:U.uMist
    }),
    vertexShader:`
      attribute vec3 aSeed;
      uniform float uTime, uPixel;
      uniform vec3 uSunDir;
      varying float vA; varying float vS;
      void main(){
        float life = fract(uTime*0.055 + aSeed.x);
        vec3 p = position;
        float rise = life*life*1.25 + life*0.35;
        p.y += rise;
        p.x += sin(uTime*0.35 + aSeed.y*6.2831)*0.30*life + life*0.22;
        p.z += cos(uTime*0.29 + aSeed.z*6.2831)*0.26*life;
        vec4 mv = modelViewMatrix * vec4(p,1.0);
        float sz = (0.16 + aSeed.y*0.42) * (0.4+life*2.2);
        gl_PointSize = sz * uPixel / max(-mv.z, 0.15);
        vA = sin(life*3.1416);
        vS = aSeed.x;
        gl_Position = projectionMatrix * mv;
      }`,
    fragmentShader: G_NOISE + `
      uniform vec3 uSunColor, uSunDir; uniform float uMelt, uMist, uTime;
      varying float vA; varying float vS;
      void main(){
        vec2 d = gl_PointCoord-0.5;
        float r = length(d);
        if(r>0.5) discard;
        float a = smoothstep(0.5,0.02,r);
        a *= a*vA*0.16*uMelt;
        float n = fbm2(gl_PointCoord*3.0 + vS*23.0 + uTime*0.05, 3);
        a *= 0.55+0.85*n;
        vec3 c = mix(vec3(0.42,0.47,0.58), uSunColor*1.6, 0.45);
        gl_FragColor = vec4(c*a, a);
      }`
  });
  vapour = new THREE.Points(g, mat);
  vapour.frustumCulled = false;
  vapour.renderOrder = 6;
  scene.add(vapour);
  return vapour;
}

/* ============================================================================
   CROWS — anatomically built birds (skull + strong beak, feathered tibia,
   arched wings with separate primaries, graduated tail) with a behavioural
   state machine: approach from the tree line, glide, flare and land one after
   another, then shuffle / turn the head / preen / hop / caw.  One bird drops
   into the patch, pecks a pumpkin and goes back up.
   ========================================================================== */
const SND = { ready:false, caw(){}, flap(){}, step(){} };

/* mirror a geometry through the XY plane and repair the winding */
function mirrorZ(g){
  const geo = g.clone();
  geo.scale(1,1,-1);
  const idx = geo.index ? geo.index.array : null;
  if(idx){
    const a = Array.from(idx);
    for(let i=0;i<a.length;i+=3){ const t=a[i]; a[i]=a[i+2]; a[i+2]=t; }
    geo.setIndex(a);
  } else {
    const p = geo.attributes.position.array;
    const n = p.length/3;
    for(let i=0;i<n;i+=3){
      for(let k=0;k<3;k++){
        const a=(n-1-i+k)*3, b=(i+k)*3;
        for(let c=0;c<3;c++){ const t=p[a+c]; p[a+c]=p[b+c]; p[b+c]=t; }
      }
    }
  }
  geo.computeVertexNormals();
  return geo;
}
/* one feather: a shallow-V vane, tapered and curved */
function vaneGeo(len, w0, w1, bend, segs, cup){
  const pos=[], uv=[], idx=[];
  const S=segs;
  for(let i=0;i<=S;i++){
    const t=i/S;
    const w = lerp(w0,w1, t*0.35+Math.pow(t,0.7)*0.65) * (t<0.06? t/0.06:1);
    const y = -bend*t*t;
    const c = (cup||0.14)*w;
    pos.push(-c*0.55, -w*0.5, y);   pos.push(0, 0, y+c);   pos.push(c*0.55, w*0.5, y);
    for(let k=0;k<3;k++) uv.push(t, k*0.5);
  }
  for(let i=0;i<S;i++){
    const a=i*3;
    idx.push(a,a+3,a+1, a+1,a+3,a+4, a+1,a+4,a+2, a+2,a+4,a+5);
  }
  const g=new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos,3));
  g.setAttribute('uv', new THREE.Float32BufferAttribute(uv,2));
  g.setIndex(idx); g.computeVertexNormals();
  return g;
}
/* ellipsoid with a lengthwise taper — the basic flesh-and-feather mass */
function limbGeo(len, rIn, rOut, taperAxis){
  const g = new THREE.SphereGeometry(1, 13, 10);
  const p = g.attributes.position;
  for(let i=0;i<p.count;i++){
    const x=p.getX(i), y=p.getY(i), z=p.getZ(i);
    const t = z*0.5+0.5;
    const rr = lerp(rIn, rOut, t*t);
    p.setXYZ(i, x*rr, y*rr*(1-0.16*t), z*len*0.5 + len*0.5);
  }
  g.computeVertexNormals();
  return g;
}
const CROWG = {};
function buildCrowGeo(){
  /* body: deep-chested, narrowing to the vent */
  const body = new THREE.SphereGeometry(1, 18, 14);
  {
    const p = body.attributes.position;
    for(let i=0;i<p.count;i++){
      const x=p.getX(i), y=p.getY(i), z=p.getZ(i);
      const t = x*0.5+0.5;
      const w = 1 - 0.42*Math.pow(t,1.7);
      p.setXYZ(i, x*0.315, y*0.150*w*(1+0.16*Math.sin(z*2.0)), z*0.145*w*(1+0.10*Math.sin(y*6.0)));
    }
    body.computeVertexNormals();
  }
  CROWG.body = body;
  /* neck + skull */
  CROWG.neck = limbGeo(0.10, 0.072, 0.086, 'x').rotateZ(-Math.PI*0.5-0.30);
  const skull = new THREE.SphereGeometry(1, 16, 12);
  {
    const p=skull.attributes.position;
    for(let i=0;i<p.count;i++){
      const x=p.getX(i),y=p.getY(i),z=p.getZ(i);
      p.setXYZ(i, x*0.086, y*0.079*(1-0.2*Math.max(x,0)), z*0.081);
    }
    skull.computeVertexNormals();
  }
  CROWG.skull = skull;
  /* beak: long, wedge-shaped, slightly hooked culmen, separate mandible */
  const up=[], lo=[];
  {
    const seg=7, L=0.125, W=0.036, H=0.030;
    const bu=[], bl=[], iu=[], il=[];
    for(let i=0;i<=seg;i++){
      const t=i/seg, x=0.070+t*L;
      const w=W*(1-Math.pow(t,1.35))*0.5;
      const hi=H*(1-Math.pow(t,1.6))*(1-0.30*t) * (1+0.35*Math.exp(-Math.pow((t-0.18)/0.22,2)));
      const hook = 0.010*Math.pow(t,5);
      /* upper: ridge on top, sides sloping to a narrow gape line */
      bu.push([x, hi-hook, 0],[x, -0.0020, w],[x, -0.0020, -w],[x, hi*0.45-hook, 0]);
      iu.push(0,1,2, 0,3,1, 0,2,3, 2,1,3);
      /* lower mandible: a shallow trough */
      lo.push([x, -0.0035, w*0.86],[x, -0.0125-0.004*(1-t), 0],[x, -0.0035, -w*0.86]);
      il.push(0,1,2);
    }
    const pack=(pts, tris)=>{
      const pos=[],uv=[],idx=[];
      pts.forEach((p,i)=>{ pos.push(p[0],p[1],p[2]); uv.push(p[0]*9, p[2]*9); });
      tris.forEach(t=>idx.push(t));
      const g=new THREE.BufferGeometry();
      g.setAttribute('position', new THREE.Float32BufferAttribute(pos,3));
      g.setAttribute('uv', new THREE.Float32BufferAttribute(uv,2));
      g.setIndex(idx); g.computeVertexNormals();
      return g;
    };
    const expand=(pts, tris, seg)=>{
      const P=[], T=[];
      for(let i=0;i<seg;i++) for(const t of tris) T.push(t.map(v=>(i+ (v>=4?1:0))*0));
      return [P,T];
    };
    /* stitch the per-section rings into strips */
    const ring=(pts, seg, tris, open)=>{
      const P=[], T=[];
      const n=tris.length/3;
      for(let i=0;i<=seg;i++){
        for(let k=0;k<4;k++){ const p=pts[i*4+k]; P.push(p[0],p[1],p[2]); }
      }
      for(let i=0;i<seg;i++){
        const a=i*4, b=(i+1)*4;
        /* side 1 */ T.push(a+1,b+1,a+2, a+2,b+1,b+2);
        /* side 2 */ T.push(a+3,b+3,a+1, a+1,b+3,b+1);
        /* top     */ T.push(a+0,b+0,a+3, a+3,b+0,b+3);
      }
      for(let k=0;k<4;k++){ /* cap the tip */ }
      const pos=[],uv=[];
      for(let i=0;i<P.length;i+=3){ pos.push(P[i],P[i+1],P[i+2]); uv.push(P[i]*9,P[i+2]*9); }
      const g=new THREE.BufferGeometry();
      g.setAttribute('position', new THREE.Float32BufferAttribute(pos,3));
      g.setAttribute('uv', new THREE.Float32BufferAttribute(uv,2));
      g.setIndex(T); g.computeVertexNormals();
      return g;
    };
    const ring3=(pts, seg)=>{
      const pos=[],uv=[],T=[];
      for(let i=0;i<=seg;i++) for(let k=0;k<3;k++){
        const p=pts[i*3+k]; pos.push(p[0],p[1],p[2]); uv.push(p[0]*9,p[2]*9);
      }
      for(let i=0;i<seg;i++){
        const a=i*3,b=(i+1)*3;
        T.push(a,b,a+1, a+1,b,b+1, a+1,b+1,a+2, a+2,b+1,b+2);
      }
      const g=new THREE.BufferGeometry();
      g.setAttribute('position', new THREE.Float32BufferAttribute(pos,3));
      g.setAttribute('uv', new THREE.Float32BufferAttribute(uv,2));
      g.setIndex(T); g.computeVertexNormals();
      return g;
    };
    CROWG.beakUpper = ring(bu, seg, iu);
    CROWG.beakLower = ring3(lo, seg);
  }
  /* eye */
  CROWG.eye = new THREE.SphereGeometry(0.0165, 10, 8);
  /* wing: arm + forearm + 5 primaries + 4 secondaries */
  const arm = limbGeo(0.100, 0.052, 0.040, 'z');
  const fore = limbGeo(0.115, 0.038, 0.024, 'z');
  CROWG.wArm = arm; CROWG.wFore = fore;
  CROWG.prim = [];
  for(let i=0;i<5;i++){
    const g = vaneGeo(0.150 - i*0.013, 0.016, 0.020, 0.030, 7, 0.16);
    g.rotateX(Math.PI*0.5);
    g.translate(0, 0, 0.075);
    CROWG.prim.push(g);
  }
  CROWG.sec = [];
  for(let i=0;i<4;i++){
    const g = vaneGeo(0.085 - i*0.008, 0.014, 0.017, 0.018, 6, 0.16);
    g.rotateX(Math.PI*0.5);
    g.translate(0, 0, 0.042);
    CROWG.sec.push(g);
  }
  /* tail: 6 graduated rectrices, rounded tip */
  {
    const gs=[];
    for(let i=0;i<6;i++){
      const k = Math.abs(i-2.5)/2.5;
      const g = vaneGeo(0.155-0.030*k*k, 0.020, 0.026, 0.020, 7, 0.15);
      g.rotateX(Math.PI*0.5);
      g.rotateY((i-2.5)*0.075);
      g.translate(0, 0.004*k, 0.078-0.006*k);
      gs.push(g);
    }
    CROWG.tail = mergeGeometries(gs,false);
  }
  /* leg: feathered thigh, bare scaly tarsus, anisodactyl foot with claws */
  {
    const thigh = limbGeo(0.062, 0.036, 0.024, 'y');
    thigh.rotateX(Math.PI*0.5*0+Math.PI); thigh.rotateX(-Math.PI*0.5);
    thigh.translate(0,-0.031,0);
    const tibia=[];
    {
      const seg=5, L=0.088, r0=0.0115, r1=0.0072;
      const pos=[],uv=[],idx=[];
      const R=6;
      for(let i=0;i<=seg;i++){
        const t=i/seg, y=-0.031-t*L, r=lerp(r0,r1,t);
        for(let k=0;k<R;k++){
          const a=k/R*TAU + t*0.6;
          const w = 1 + 0.16*Math.sin(t*22.0);
          pos.push(Math.cos(a)*r*w, y, Math.sin(a)*r/w);
          uv.push(k/R*2, t*2);
        }
      }
      for(let i=0;i<seg;i++) for(let k=0;k<R;k++){
        const a=i*R+k, b=(i+1)*R+k, c=(i+1)*R+(k+1)%R, d=i*R+(k+1)%R;
        idx.push(a,b,d, d,b,c);
      }
      const g=new THREE.BufferGeometry();
      g.setAttribute('position', new THREE.Float32BufferAttribute(pos,3));
      g.setAttribute('uv', new THREE.Float32BufferAttribute(uv,2));
      g.setIndex(idx); g.computeVertexNormals();
      tibia.push(g);
    }
    /* foot: 3 forward toes, 1 back, each with a claw */
    const toes=[[-0.55,0.046],[0.0,0.055],[0.55,0.046],[Math.PI,0.030]];
    for(const [ang,ll] of toes){
      const seg=3, pos=[], uv=[], idx=[];
      for(let i=0;i<=seg;i++){
        const t=i/seg, l=t*ll;
        const y=-0.119 + Math.sin(t*Math.PI*0.5)*0.004 - t*t*0.004;
        const r=lerp(0.0055,0.0026,t);
        const dx=Math.sin(ang)*l, dz=Math.cos(ang)*l;
        for(let k=0;k<4;k++){
          const a=k/4*TAU;
          pos.push(dx+Math.cos(a)*r, y+Math.sin(a)*r*0.7, dz);
          uv.push(k/4, t);
        }
      }
      for(let i=0;i<seg;i++) for(let k=0;k<4;k++){
        const a=i*4+k, b=(i+1)*4+k, c=(i+1)*4+(k+1)%4, d=i*4+(k+1)%4;
        idx.push(a,b,d, d,b,c);
      }
      const g=new THREE.BufferGeometry();
      g.setAttribute('position', new THREE.Float32BufferAttribute(pos,3));
      g.setAttribute('uv', new THREE.Float32BufferAttribute(uv,2));
      g.setIndex(idx); g.computeVertexNormals();
      tibia.push(g);
      const claw = new THREE.ConeGeometry(0.0028, 0.020, 5);
      claw.rotateX(-Math.PI*0.5+0.5);
      claw.translate(Math.sin(ang)*(ll+0.008), -0.122, Math.cos(ang)*(ll+0.008));
      tibia.push(claw);
    }
    const leg = mergeGeometries([thigh, ...tibia], false);
    CROWG.leg = leg;
  }
  /* mirrored copies */
  CROWG.legL = mirrorZ(CROWG.leg);
  CROWG.eyeL = mirrorZ(CROWG.eye);
  CROWG.wingPart = null;
}

const CMAT = {};

      m.rotation.y = side*(0.55 + k*0.10);

          pos:new THREE.Vector3(), dir:new THREE.Vector3(1,0,0), roll:0, prev:new THREE.Vector3()};
}

/* pose helpers ---------------------------------------------------------- */
function poseWing(w, side, flap, sweep, twist, elbow, spread){
  w.sh.rotation.set(side*flap, side*sweep, side*twist);
  w.el.rotation.set(side*elbow, 0, 0);
  for(let k=0;k<5;k++) w.prims[k].rotation.y = side*(0.10 + k*0.20 + spread*(0.18+k*0.14));
  for(let k=0;k<4;k++) w.secs[k].rotation.y = side*(0.55 + k*0.10 + spread*0.22);

const _e = new THREE.Euler(), _q = new THREE.Quaternion(), _v = new THREE.Vector3(), _v2=new THREE.Vector3();
function aimCrow(b, x,y,z, yaw, pitch, roll){

/* behaviour ------------------------------------------------------------- */
const CROW_PERIOD = 38;
function seg(t,a,b){ return clamp((t-a)/(b-a),0,1); }
function smoothstep2(t){ return t*t*(3-2*t); }
function bez3(p0,p1,p2,u,out){
  const iu=1-u;
  out.set(
    iu*iu*p0.x + 2*iu*u*p1.x + u*u*p2.x,
    iu*iu*p0.y + 2*iu*u*p1.y + u*u*p2.y,
    iu*iu*p0.z + 2*iu*u*p1.z + u*u*p2.z);
  return out;
}
const _p0=new THREE.Vector3(), _p1=new THREE.Vector3(), _p2=new THREE.Vector3();

function crowPerchPose(b, T, act, k, dt){
  /* act: {name, t (0..1), dur, ...} */
  const idle = 0.0;
  let headYaw = act.headYaw||0, headPitch = act.headPitch||0;
  let jaw = act.jaw||0, tail = act.tail||0;
  let bodyBob = Math.sin(T*1.35 + b.i)*0.004;
  let wingFold = 1.0 - (act.fluff||0)*0.55;

  if(act.name==='look'){
    const s = smoothstep2(seg(act.t,0,0.14))*(1-smoothstep2(seg(act.t,0.86,1)));
    headYaw = act.yaw*s + Math.sin(T*9.0)*0.012*s;
    headPitch = act.pitch + Math.sin(T*1.1+b.i)*0.02;
  } else if(act.name==='preen'){
    const nib = Math.max(0, Math.sin(act.t*Math.PI*act.reps*2.0));
    headYaw = act.yaw*(0.55+0.45*Math.sin(act.t*Math.PI));
    headPitch = 0.85*nib + 0.25;
    jaw = nib>0.6 ? 0.55 : 0.0;
    tail = act.tailFan*Math.sin(act.t*Math.PI*3.0)*0.5;
  } else if(act.name==='caw'){
    const beat = Math.max(0, Math.sin(act.t*Math.PI*act.reps));
    jaw = beat*0.95;
    headPitch = -0.30*beat + 0.05;
    tail = -0.22*beat;
    bodyBob += 0.010*beat;
    wingFold = 1.0 - 0.10*beat;
  } else if(act.name==='settle'){
    const s = Math.sin(act.t*Math.PI);
    wingFold = 1.0 - 0.42*s;
    bodyBob += 0.012*s;
  } else if(act.name==='stretch'){
    const s = Math.sin(act.t*Math.PI);
    wingFold = 1.0 - 1.35*Math.min(1,s*1.6);
    tail = 0.30*s;
  } else if(act.name==='hop'){
    const h = act.hop;
    bodyBob += h.y;
  }
  poseWing(b.wR, 1, 0.30*wingFold + 0.02*Math.sin(T*1.2+b.i), -2.02*wingFold - 0.05, 0.30*wingFold, -0.10, 1-wingFold);
  poseWing(b.wL,-1, 0.30*wingFold + 0.02*Math.sin(T*1.2+b.i), -2.02*wingFold - 0.05, 0.30*wingFold, -0.10, 1-wingFold);
  b.headG.rotation.set(headPitch, headYaw, (act.headRoll||0));
  b.neckG.rotation.set(headPitch*0.35, headYaw*0.45, 0);
  b.jaw.rotation.x = jaw*0.42;
  b.tailG.rotation.set(tail*0.5, 0, 0);
  b.bird.position.y = bodyBob;
  b.bird.rotation.set(act.bodyPitch||0, act.bodyYaw||0, 0);
  b.bodyG.rotation.x = act.pitch2!==undefined? act.pitch2 : -0.06;
  /* feet grip */
  const grip = (act.stepL||0), grip2=(act.stepR||0);
  b.lR.hip.rotation.set(-0.10 - grip*1.1, 0, 0.05);
  b.lL.hip.rotation.set(-0.10 - grip2*1.1, 0, -0.05);
  b.lR.knee.rotation.set(0.55 + grip*0.9, 0, 0);
  b.lL.knee.rotation.set(0.55 + grip2*0.9, 0, 0);
}

/* scripted, fully time-parameterised behaviour (scrub-safe: no accumulated
   state, so jumping to any instant of the loop gives the right pose) */
function crowActions(b, cyc){
  if(b._cyc === cyc) return b._acts;
  b._cyc = cyc;
  const r2 = mulberry32(cyc*1009 + b.i*7717 + 31);
  const pool = ['look','preen','look','shuffle','caw','settle','preen','hop','look','peer','stretch','preen','look'];
  const acts = []; let t = b.landT + 0.55, acc = 0;
  while(t < b.endT - 1.0){
    const name = pool[(r2()*pool.length)|0];
    const a = {name, start:t, d:0.9, dx:0, dz:0, face:rr(-0.5,0.5)};
    if(name==='look'){
      a.d = rr(1.4,3.4); a.yaw = rr(-1.45,1.45); a.pitch = rr(-0.35,0.30);
      if(r2()<0.3){ a.yaw2 = rr(-1.45,1.45); a.mid = rr(0.35,0.62); }
    } else if(name==='preen'){
      a.d = rr(2.2,4.2); a.yaw = (r2()<0.5?-1:1)*rr(0.55,1.0); a.reps = 3+((r2()*4)|0);
      a.tailFan = r2()<0.5?0.7:0.0;
    } else if(name==='caw'){
      a.d = rr(0.75,1.5); a.reps = 1+((r2()*3)|0); a.yaw = rr(-0.8,0.8);
    } else if(name==='shuffle'){
      a.d = rr(1.1,2.0); a.dx = rr(-0.22,0.22); a.dz = rr(-0.10,0.10); a.steps = 2+((r2()*3)|0);
    } else if(name==='hop'){
      a.d = rr(0.55,0.85); a.dx = rr(-0.34,0.34); a.dz = rr(-0.16,0.16);
    } else if(name==='settle' || name==='stretch'){
      a.d = name==='stretch'? rr(1.6,2.4) : rr(1.2,2.2);
    } else {
      a.d = rr(1.2,2.6); a.pitch = rr(0.5,0.95); a.yaw = rr(-0.6,0.6);
    }
    acc += (a.dx||0); a.ox = acc;
    acts.push(a);
    t += a.d + rr(0.12,0.45);
  }
  b._acts = acts;
  return acts;
}
function activeAct(list, t){
  for(let i=list.length-1;i>=0;i--) if(t >= list[i].start) return list[i];
  return null;
}
function bezier3(p0,p1,p2,u,out){
  const iu=1-u;
  return out.set(
    iu*iu*p0.x + 2*iu*u*p1.x + u*u*p2.x,
    iu*iu*p0.y + 2*iu*u*p1.y + u*u*p2.y,
    iu*iu*p0.z + 2*iu*u*p1.z + u*u*p2.z);
}
const _fp = new THREE.Vector3(), _fd = new THREE.Vector3();
function crowFlight(b, t, dt){
  const A = b.arriveT, L = b.landT;
  if(t < A){
    const u = seg(t,0,A), eu = 1 - Math.pow(1-u, 2.1);
    bezier3(b.home, b.cp1, b.approach, eu, _fp);
    bezier3(b.home, b.cp1, b.approach, Math.min(1,eu+0.02), _fd);
    return {mode:'fly', p:_fp.clone(), look:_fd, spd: 11.5*(1-0.42*smoothstep2(seg(u,0.55,1)))};
  }
  if(t < L){
    const u = seg(t,A,L), s = smoothstep2(u);
    _fp.copy(b.approach).lerp(b.perchPos, s);
    _fp.y = lerp(b.approach.y, b.perchPos.y, Math.pow(u,0.72)) + Math.sin(u*Math.PI)*0.05;
    return {mode:'land', p:_fp.clone(), look:b.perchPos, u};
  }
  if(t < b.endT) return {mode:'perch'};
  if(t < b.endT+1.15){
    const u = seg(t, b.endT, b.endT+1.15), s = smoother(u);
    _fp.copy(b.perchPos);
    _fp.x += -0.5*s; _fp.y += 0.26*Math.sin(u*Math.PI*0.85) + 0.62*s*s; _fp.z += 0.32*s;
    return {mode:'launch', p:_fp.clone(), u, look:b.launchTo};
  }
  {
    const u = seg(t, b.endT+1.15, CROW_PERIOD), s = smoother(u);
    bezier3(b.launchFrom, b.cp2, b.home, s, _fp);
    bezier3(b.launchFrom, b.cp2, b.home, Math.min(1,s+0.02), _fd);
    return {mode:'fly', p:_fp.clone(), look:_fd, spd: 9.5+3.0*(1-s)};
  }
}
/* the bird that drops into the patch and works a pumpkin over */
function crowPeck(b, t){
  const P = b.peckTarget;
  if(t < b.endT) return crowFlight(b, t, 0.016);
  const t1=b.endT+1.5, t2=t1+0.9, t3=t2+2.3, t4=t3+3.1, t5=t4+0.55;
  if(t < t1){
    const u=seg(t,b.endT,t1), s=smoother(u);
    _fp.copy(b.perchPos).lerp(b.groundSpot, s);
    _fp.y = lerp(b.perchPos.y, b.groundSpot.y+0.11, Math.pow(u,0.68)) + Math.sin(u*Math.PI)*0.34;
    return {mode:'land', p:_fp.clone(), look:b.groundSpot, u:0.72+0.28*u};
  }
  if(t < t2){
    _fp.copy(b.groundSpot); _fp.y += 0.11;
    return {mode:'ground', p:_fp.clone(), look:P.c, flap:0.6*Math.max(0,1-(t-t1)/0.6)};
  }
  if(t < t3){
    const u=seg(t,t2,t3), n=4, su=u*n;
    const hop = Math.abs(Math.sin(su*Math.PI))*0.05;
    _fp.copy(b.groundSpot).lerp(P.walkStop, smoother(u));
    _fp.y += hop+0.11;
    return {mode:'ground', p:_fp.clone(), look:P.c, step:Math.sin(su*Math.PI), stepPh:su%1, stand:1-hop*4};
  }
  if(t < t4){
    const u=seg(t,t3,t4);
    const beat = Math.pow(Math.max(0, Math.sin(u*Math.PI*5)), 0.65);
    _fp.copy(P.walkStop); _fp.y += 0.11 + beat*0.014;
    return {mode:'ground', p:_fp.clone(), look:P.c, peck:beat};
  }
  if(t < t5){
    _fp.copy(P.walkStop); _fp.y += 0.11;
    return {mode:'ground', p:_fp.clone(), look:b.cp2, crouch:smoother(seg(t,t4,t5))};
  }
  {
    const u=smoother(seg(t,t5,CROW_PERIOD)), s=u;
    bezier3(P.walkStop, b.cp2, b.home, s, _fp);
    bezier3(P.walkStop, b.cp2, b.home, Math.min(1,s+0.02), _fd);
    return {mode:'fly', p:_fp.clone(), look:_fd, spd:10.5-4.0*u};
  }
}
function i2cam(b){
  return Math.hypot(b.root.position.x-camera.position.x, b.root.position.z-camera.position.z);
}

function buildCrows(){
  buildCrowGeo();
  Object.assign(CMAT, crowMaterials());
  const r2 = mulberry32(4242);
  const near = PERCHES.slice().sort((a,b)=>
    Math.hypot(a.x+3.6, a.z-9.0) - Math.hypot(b.x+3.6, b.z-9.0));
  const chosen = [];
  for(const p of near){
    if(chosen.length>=8) break;
    if(chosen.some(q=>Math.hypot(q.x-p.x,q.z-p.z)<1.85)) continue;
    chosen.push(p);
  }
  let target=null, bestScore=-1e9;
  for(const it of PUMPS){
    const d = Math.hypot(it.x+4.4, it.z-13.5);
    if(it.r<0.115 || it.r>0.23 || d>9.5) continue;
    const s = it.r*3 - d*0.2;
    if(s>bestScore){ bestScore=s; target=it; }
  }
  const n = Math.min(8, Math.max(5, chosen.length));
  for(let i=0;i<n;i++){
    const b = makeCrow(i);
    const perch = chosen[i % chosen.length];
    const r3 = mulberry32(900+i*37);
    b.perchPos = new THREE.Vector3(perch.x+0.01, perch.y+0.132, perch.z);
    b.perchYaw = perch.yaw + rr(-0.45,0.45);
    b.arriveT = 4.6 + i*0.50;            /* glide from the tree line in       */
    b.landT = b.arriveT + 2.5 + i*0.35;  /* they come in one after another    */
    b.endT = b.landT + 13 + r3()*6;
    b.offT = 0;
    b.start = 17.6 + i*0.30;             /* landings land in the fence view */
    const az = rr(0.05,0.95)*Math.PI*0.85 + Math.PI*0.55;
    const R = 48 + r3()*20;
    b.home = new THREE.Vector3(FIELD.cx+Math.cos(az)*R, 5.2+r3()*3.6, FIELD.cz+Math.sin(az)*R*0.8);
    b.approach = new THREE.Vector3(b.perchPos.x+2.8+r3()*1.7, b.perchPos.y+1.30+r3()*0.55, b.perchPos.z+(r3()-0.5)*4.2);
    b.cp1 = new THREE.Vector3(lerp(b.home.x,b.approach.x,0.45)+rr(-5,5), Math.max(b.home.y,b.approach.y)+1.5+r3()*2.0, lerp(b.home.z,b.approach.z,0.45)+rr(-5,5));
    b.launchTo = new THREE.Vector3(b.perchPos.x+2.6, b.perchPos.y+2.2, b.perchPos.z+2.0);
    b.launchFrom = new THREE.Vector3(b.perchPos.x-0.55, b.perchPos.y+0.40, b.perchPos.z+0.30);
    b.cp2 = new THREE.Vector3(lerp(b.launchFrom.x,b.home.x,0.4)+rr(-4,4), b.home.y+2.2+r3()*2.0, lerp(b.launchFrom.z,b.home.z,0.4)+rr(-4,4));
    b.peck = (i===2 && target);
    if(b.peck){
      const th = Math.atan2(target.x-b.perchPos.x, target.z-b.perchPos.z);
      b.groundSpot = new THREE.Vector3(target.x+Math.sin(th+2.3)*0.66, 0, target.z+Math.cos(th+2.3)*0.66);
      b.groundSpot.y = groundH(b.groundSpot.x, b.groundSpot.z);
      b.peckT0 = b.landT + 5.0;
      b.endT = b.peckT0;
      const dir = new THREE.Vector3(target.x-b.groundSpot.x, 0, target.z-b.groundSpot.z).normalize();
      b.peckTarget = {
        c: new THREE.Vector3(target.x, target.y + (PV[target.vi]?PV[target.vi].hh*target.scl*0.62:0.13), target.z),
        walkStop: new THREE.Vector3(target.x-dir.x*0.42, 0, target.z-dir.z*0.42)
      };
      b.peckTarget.walkStop.y = groundH(b.peckTarget.walkStop.x, b.peckTarget.walkStop.z);
      b.launchFrom.copy(b.peckTarget.walkStop).add(new THREE.Vector3(0,0.42,0));
    }
    CROWS.push(b);
    addCollider(perch.x, perch.y+0.2, perch.z, 0.0);
  }

  let lastCaw = -9;
  animators.push((T, dt, f)=>{
    for(const b of CROWS){
      const tt = ((T - b.start) % CROW_PERIOD + CROW_PERIOD) % CROW_PERIOD;
      const cy = Math.floor((T - b.start)/CROW_PERIOD);
      const st = b.peck ? crowPeck(b, tt) : crowFlight(b, tt, dt);
      if(!st){ b.root.visible=false; continue; }
      b.root.visible = true;
      if(st.mode==='fly'){
        const p = st.p, dir = _v.copy(st.look).sub(p).normalize();
        const yaw = Math.atan2(-dir.z, dir.x);
        const pitch = Math.asin(clamp(-dir.y,-1,1))*0.7;
        const fl = Math.sin(T*st.spd + b.i*2.0);
        const bank = clamp((yaw-(b._yaw!==undefined?b._yaw:yaw))*-2.4, -0.75, 0.75);
        b._yaw = yaw;
        aimCrow(b, p.x, p.y, p.z, yaw, pitch, bank);
        poseWing(b.wR, 1, 0.60+fl*0.30, -0.22-0.10*fl, 0.08-0.22*fl, -0.10-0.26*fl, 0.92);
        poseWing(b.wL,-1, 0.60+fl*0.30, -0.22-0.10*fl, 0.08-0.22*fl, -0.10-0.26*fl, 0.92);
        b.tailG.rotation.set(0.08+0.09*Math.sin(T*2.1+b.i), bank*0.4, 0);
        b.headG.rotation.set(-pitch*0.45, 0, 0);
        b.neckG.rotation.set(-pitch*0.3, 0, 0);
        b.jaw.rotation.x = 0.05;
        b.lR.hip.rotation.set(0.40,0,0.05); b.lL.hip.rotation.set(0.40,0,-0.05);
        b.lR.knee.rotation.set(0.85,0,0);   b.lL.knee.rotation.set(0.85,0,0);
        b.bird.rotation.set(0,0,0); b.bird.position.y = 0;
      } else if(st.mode==='land'){
        const p = st.p;
        const dir = _v.copy(st.look).sub(p); dir.y=0;
        if(dir.lengthSq()<1e-6) dir.set(1,0,0);
        dir.normalize();
        const yaw = Math.atan2(-dir.z, dir.x);
        const u = st.u!==undefined? st.u : 1;
        const flare = Math.sin(clamp(u,0,1)*Math.PI);
        aimCrow(b, p.x, p.y, p.z, yaw, 0.30*flare+0.12, 0);
        const fl = Math.sin(T*27.0)*(0.6-0.4*u);
        poseWing(b.wR, 1, 0.72+fl*0.45, -0.40-0.28*flare, -0.34, -0.52-0.28*fl, 1.0);
        poseWing(b.wL,-1, 0.72+fl*0.45, -0.40-0.28*flare, -0.34, -0.52-0.28*fl, 1.0);
        b.tailG.rotation.set(-0.50*flare-0.12, 0, 0);
        b.headG.rotation.set(-0.22, 0.08, 0);
        b.neckG.rotation.set(-0.14,0,0);
        b.jaw.rotation.x = 0.10;
        const reach = 0.6*flare;
        b.lR.hip.rotation.set(-0.50-reach,0,0.06); b.lL.hip.rotation.set(-0.50-reach,0,-0.06);
        b.lR.knee.rotation.set(1.0-0.55*flare,0,0); b.lL.knee.rotation.set(1.0-0.55*flare,0,0);
        b.bird.rotation.set(0,0,0); b.bird.position.y=0;
      } else if(st.mode==='launch'){
        const p = st.p, u = st.u;
        const dir = _v.copy(st.look).sub(p); dir.y=Math.max(0.18,dir.y); dir.normalize();
        const yaw = Math.atan2(-dir.z, dir.x);
        aimCrow(b, p.x, p.y, p.z, yaw, 0.40-0.32*u, 0);
        const fl = Math.sin(T*25.0);
        poseWing(b.wR, 1, 0.55+fl*0.58, -0.52, -0.20, -0.38, 0.85);
        poseWing(b.wL,-1, 0.55+fl*0.58, -0.52, -0.20, -0.38, 0.85);
        b.tailG.rotation.set(-0.28,0,0);
        b.headG.rotation.set(-0.28,0,0);
        b.lR.hip.rotation.set(-0.66,0,0.05); b.lL.hip.rotation.set(-0.66,0,-0.05);
        b.lR.knee.rotation.set(1.05,0,0);    b.lL.knee.rotation.set(1.05,0,0);
        b.bird.rotation.set(0,0,0); b.bird.position.y=0;
      } else if(st.mode==='ground'){
        const p = st.p;
        const dir = _v.copy(st.look).sub(p); dir.y=0;
        if(dir.lengthSq()<1e-6) dir.set(1,0,0);
        dir.normalize();
        const yaw = Math.atan2(-dir.z, dir.x);
        const stand = st.stand!==undefined? st.stand : 1;
        const bob = st.step!==undefined? Math.abs(Math.sin(st.stepPh*Math.PI))*0.010 : 0;
        const stab = st.peck||0;
        aimCrow(b, p.x, p.y+bob, p.z, yaw, 0.05 + stab*0.55 - (st.crouch||0)*0.20, 0);
        if(st.flap!==undefined && st.flap>0.03){
          const fl = Math.sin(T*26.0)*st.flap;
          poseWing(b.wR, 1, 0.58+fl*0.5, -0.48, -0.30, -0.48, 1.0);
          poseWing(b.wL,-1, 0.58+fl*0.5, -0.48, -0.30, -0.48, 1.0);
          b.tailG.rotation.set(-0.32,0,0);
        } else {
          poseWing(b.wR, 1, 0.24, -2.00, 0.24, -0.10, 0.03);
          poseWing(b.wL,-1, 0.24, -2.00, 0.24, -0.10, 0.03);
          b.tailG.rotation.set(0.08+stab*0.40,0,0);
        }
        b.headG.rotation.set(-0.08 + stab*1.05 + (st.crouch||0)*0.22, Math.sin(T*0.7+b.i)*0.12, 0);
        b.neckG.rotation.set(-0.04 + stab*0.40, 0, 0);
        b.jaw.rotation.x = (stab>0.55?0.55:0.0) + (st.flap?0.1:0);
        const s2 = st.step!==undefined? Math.sin(st.stepPh*Math.PI*2)*0.5 : 0;
        b.lR.hip.rotation.set(-0.40 + s2*0.55, 0, 0.05); b.lL.hip.rotation.set(-0.40 - s2*0.55, 0, -0.05);
        b.lR.knee.rotation.set(0.80 - s2*0.45, 0, 0);    b.lL.knee.rotation.set(0.80 + s2*0.45, 0, 0);
        b.bird.rotation.set(0,0,0); b.bird.position.y=0;
      } else {
        const perT = tt;
        const list = crowActions(b, cy);
        const a = activeAct(list, perT);
        const act = {t:0.5, headYaw:0};
        let ox=0, oz=0, faceYaw=b.perchYaw, hopY=0;
        if(a){
          const at = clamp((perT - a.start)/a.d, 0, 1);
          act.name=a.name; act.t=at;
          act.yaw=a.yaw||0; act.pitch=a.pitch||0; act.reps=a.reps||3; act.tailFan=a.tailFan||0;
          if(a.yaw2!==undefined && at>a.mid) act.yaw = a.yaw2;
          if(a.name==='shuffle' || a.name==='hop'){
            const k2 = smoother(at);
            ox = a.ox - a.dx*(1-k2); oz = (a.dz||0)*k2;
            faceYaw = b.perchYaw + (a.dx>0?0.12:-0.12);
            if(a.name==='shuffle'){
              act.stepL = Math.max(0, Math.sin(at*Math.PI*(a.steps||2)*2.0));
              act.stepR = Math.max(0, Math.sin(at*Math.PI*(a.steps||2)*2.0 + Math.PI));
              act.bodyPitch = 0.05*Math.sin(at*Math.PI);
            } else {
              const h = Math.sin(at*Math.PI);
              hopY = 0.06*h;
              act.fluff = 0.35*h; act.stepL = h*0.6; act.stepR = h*0.6;
            }
          }
          if(a.name==='caw' && at<0.10 && T-lastCaw>0.30 && i2cam(b)<30){ lastCaw=T; SND.caw(b.perchPos, a.d); }
        } else {
          act.name='idle';
          act.headYaw = Math.sin(Math.floor(perT*0.7)*1.7+b.i)*0.55;
          act.headPitch = Math.sin(Math.floor(perT*0.5)*2.3+b.i)*0.10;
        }
        aimCrow(b, b.perchPos.x+ox, b.perchPos.y+hopY, b.perchPos.z+oz, faceYaw, 0, 0);
        if(hopY>0) act.hop = {y:hopY};
        crowPerchPose(b, T, act, cy, dt);
      }
    }
  });
  return CROWS;
}


/* ============================================================================
   AMBIENCE — cold air moving through dry stalks, far-off caws, wing thump.
   Nothing is loaded; every sound is synthesised on click.
   ========================================================================== */
let AUDIO = null;
function buildAudio(){
  const AC = window.AudioContext || window.webkitAudioContext;
  if(!AC) return null;
  const ctx = new AC();
  const master = ctx.createGain(); master.gain.value = 0.0001;
  const comp = ctx.createDynamicsCompressor();
  comp.threshold.value=-16; comp.ratio.value=5; comp.attack.value=0.015; comp.release.value=0.3;
  master.connect(comp); comp.connect(ctx.destination);

  /* one long noise bed, reused by every layer */
  const N = Math.floor(ctx.sampleRate*4.5);
  const buf = ctx.createBuffer(2, N, ctx.sampleRate);
  for(let ch=0; ch<2; ch++){
    const d = buf.getChannelData(ch);
    let lp=0, prev=0, hp=0;
    for(let i=0;i<N;i++){
      const w = Math.random()*2-1;
      lp += (w-lp)*0.021;
      hp = (hp + w - prev)*0.86; prev = w;
      d[i] = lp*0.8 + hp*0.12;
    }
  }
  const bed = (rate, type, f, q, g0, panv)=>{
    const s = ctx.createBufferSource(); s.buffer=buf; s.loop=true; s.playbackRate.value=rate;
    const bq = ctx.createBiquadFilter(); bq.type=type; bq.frequency.value=f; bq.Q.value=q;
    const gn = ctx.createGain(); gn.gain.value=g0;
    const pn = ctx.createStereoPanner(); pn.pan.value=panv||0;
    s.connect(bq); bq.connect(gn); gn.connect(pn); pn.connect(master);
    s.start(0);
    return {gn, pn, bq, s};
  };
  const low  = bed(0.72,'lowpass',  300, 0.6, 0.30, -0.25);
  const mid  = bed(1.05,'bandpass', 880, 0.75, 0.09, 0.30);
  const hi   = bed(1.28,'highpass',3400, 0.5, 0.030, 0.0);

  function gustLoop(){
    const now = ctx.currentTime;
    for(let k=0;k<4;k++){
      const at = now + 1.5 + k*3.7 + Math.random()*2.0;
      const amp = 0.3+Math.random()*0.7;
      low.gn.gain.setTargetAtTime(0.16+amp*0.34, at, 1.15);
      mid.gn.gain.setTargetAtTime(0.04+amp*0.16, at+0.3, 1.0);
      hi.gn.gain.setTargetAtTime(0.008+amp*0.055, at+0.45, 0.8);
      low.bq.frequency.setTargetAtTime(230+amp*260, at, 1.2);
      low.pn.pan.setTargetAtTime(Math.random()*1.3-0.65, at, 1.8);
      mid.pn.pan.setTargetAtTime(Math.random()*1.3-0.65, at, 1.6);
    }
    setTimeout(gustLoop, 14000);
  }
  gustLoop();

  /* a crow call: 1-3 harsh notes, rasped with a sub-audio LFO on the pitch */
  function caw(pos, howmany){
    const now = ctx.currentTime;
    const dist = pos? pos.distanceTo(camera.position) : 40;
    const g = ctx.createGain();
    g.gain.value = clamp(9.5/(dist+7), 0.02, 0.85) * (dist>60? 0.35:1);
    const pn = ctx.createStereoPanner();
    if(pos){
      const dx = pos.x-camera.position.x, dz = pos.z-camera.position.z;
      const fwd = _cd;
      const right = new THREE.Vector3().crossVectors(fwd, new THREE.Vector3(0,1,0)).normalize();
      pn.pan.value = clamp(right.dot(new THREE.Vector3(dx,0,dz))/Math.max(5,dist), -0.95, 0.95);
    }
    const lp = ctx.createBiquadFilter(); lp.type='lowpass';
    lp.frequency.value = clamp(9000 - dist*60, 900, 9000);
    g.connect(pn); pn.connect(master); lp.connect(g);
    const notes = howmany || (1+((Math.random()*3)|0));
    for(let n=0;n<notes;n++){
      const at = now + n*(0.185+Math.random()*0.09);
      const dur = 0.12+Math.random()*0.10;
      const osc = ctx.createOscillator(); osc.type='sawtooth';
      const f0 = 300+Math.random()*200;
      osc.frequency.setValueAtTime(f0*1.3, at);
      osc.frequency.exponentialRampToValueAtTime(f0*0.6, at+dur);
      const rasp = ctx.createOscillator(); rasp.type='square';
      rasp.frequency.value = 55+Math.random()*55;
      const rg = ctx.createGain(); rg.gain.value = 320;
      rasp.connect(rg); rg.connect(osc.frequency);
      const bp = ctx.createBiquadFilter(); bp.type='bandpass'; bp.Q.value=1.4;
      bp.frequency.setValueAtTime(1600, at);
      bp.frequency.exponentialRampToValueAtTime(560, at+dur);
      const ng = ctx.createGain();
      ng.gain.setValueAtTime(0.0001, at);
      ng.gain.exponentialRampToValueAtTime(0.6, at+0.016);
      ng.gain.exponentialRampToValueAtTime(0.20, at+dur*0.55);
      ng.gain.exponentialRampToValueAtTime(0.0001, at+dur*1.15);
      osc.connect(bp); bp.connect(ng); ng.connect(lp);
      osc.start(at); osc.stop(at+dur*1.25);
      rasp.start(at); rasp.stop(at+dur*1.25);
    }
  }
  /* the far field talks back, but never on top of a close call */
  let lastAny = 0;
  (function far(){
    setTimeout(()=>{
      if(ctx.state==='running'){
        const a = Math.random()*TAU, R = 42+Math.random()*46;
        const p = new THREE.Vector3(FIELD.cx+Math.cos(a)*R, 3.5+Math.random()*6, FIELD.cz+Math.sin(a)*R);
        if(ctx.currentTime-lastAny > 1.1 && p.distanceTo(camera.position) > 30){
          lastAny = ctx.currentTime; caw(p, 1+((Math.random()*2)|0));
        }
      }
      far();
    }, (4.5+Math.random()*15)*1000);
  })();

  SND.ready = true;
  SND.caw = (p)=>{ if(ctx.state!=='running') return; lastAny=ctx.currentTime; caw(p, 2); };
  master.gain.setValueAtTime(0.0001, ctx.currentTime);
  master.gain.exponentialRampToValueAtTime(0.5, ctx.currentTime+3.2);
  return {ctx, master};
}
function wireSound(){
  const hint = document.getElementById('hint');
  let on = false;
  const start = ()=>{
    if(on) return; on = true;
    try{
      AUDIO = buildAudio();
      if(AUDIO) AUDIO.ctx.resume();
      hint.classList.add('off');
    }catch(e){ /* silence is acceptable */ }
  };
  hint.addEventListener('pointerdown', start);
  addEventListener('keydown', start);
  addEventListener('pointerdown', start);
}

boot();
</script>

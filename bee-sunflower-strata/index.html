<script type="importmap">

<script type="module">
import * as THREE from 'three';

/* ============================================================
   THE FORAGER
   Units: 1 world unit = 1 cm.  Macro scale: bee ~1.6 cm, head ~16 cm across.
   ============================================================ */

const clamp=(v,a,b)=>v<a?a:(v>b?b:v);
const lerp=(a,b,t)=>a+(b-a)*t;
const smooth=t=>t*t*(3-2*t);
const smoother=t=>t*t*t*(t*(t*6-15)+10);
function mulberry(seed){let a=seed>>>0;return function(){a=(a+0x6D2B79F5)>>>0;let t=a;t=Math.imul(t^(t>>>15),t|1);t^=t+Math.imul(t^(t>>>7),t|61);return((t^(t>>>14))>>>0)/4294967296;};}
const R=mulberry(20240817);
const rr=(a,b)=>a+(b-a)*R();
function h2(x,y){const s=Math.sin(x*127.1+y*311.7)*43758.5453;return s-Math.floor(s);}
function vn(x,y){const xi=Math.floor(x),yi=Math.floor(y),xf=x-xi,yf=y-yi;
  const u=xf*xf*(3-2*xf),v=yf*yf*(3-2*yf);
  const a=h2(xi,yi),b=h2(xi+1,yi),c=h2(xi,yi+1),d=h2(xi+1,yi+1);
  return a+(b-a)*u+(c-a)*v+(a-b-c+d)*u*v;}
function fbm(x,y,oct=4){let s=0,a=0.5,f=1,n=0;for(let i=0;i<oct;i++){s+=a*vn(x*f,y*f);n+=a;f*=2.03;a*=0.5;}return s/n;}
function ridge(x,y,oct=3){let s=0,a=0.5,f=1,n=0;for(let i=0;i<oct;i++){s+=a*(1-Math.abs(vn(x*f,y*f)*2-1));n+=a;f*=2.1;a*=0.5;}return s/n;}
function grad3(stops,t){ // stops: [[pos,[r,g,b]],...]
  for(let i=0;i<stops.length-1;i++){
    const a=stops[i],b=stops[i+1];
    if(t<=b[0]){const k=clamp((t-a[0])/Math.max(1e-6,b[0]-a[0]),0,1);
      return [lerp(a[1][0],b[1][0],k),lerp(a[1][1],b[1][1],k),lerp(a[1][2],b[1][2],k)];}
  }
  return stops[stops.length-1][1];
}

/* ---------------- renderer ---------------- */
const canvas=document.getElementById('c');
const renderer=new THREE.WebGLRenderer({canvas,antialias:false,powerPreference:'high-performance',stencil:false});
renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,1.7));
renderer.outputColorSpace=THREE.SRGBColorSpace;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.05;
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
const MAXANISO=renderer.capabilities.getMaxAnisotropy();

const scene=new THREE.Scene();
const camera=new THREE.PerspectiveCamera(26,1,0.05,6000);
camera.position.set(6,3,14);

/* ---------------- procedural textures ---------------- */
function makeCanvas(w,h){const c=document.createElement('canvas');c.width=w;c.height=h;return c;}
function toTex(cv,{srgb=true,rx=1,ry=1}={}){
  const t=new THREE.CanvasTexture(cv);
  t.colorSpace=srgb?THREE.SRGBColorSpace:THREE.NoColorSpace;
  t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(rx,ry);t.anisotropy=MAXANISO;
  t.needsUpdate=true;return t;
}
function heightToNormal(hcv,strength=2.0){
  const w=hcv.width,h=hcv.height;
  const src=hcv.getContext('2d').getImageData(0,0,w,h).data;
  const out=makeCanvas(w,h),g=out.getContext('2d'),img=g.createImageData(w,h),d=img.data;
  const H=(x,y)=>src[((((y%h)+h)%h)*w+(((x%w)+w)%w))*4]/255;
  for(let y=0;y<h;y++)for(let x=0;x<w;x++){
    const dx=(H(x+1,y)-H(x-1,y))*strength, dy=(H(x,y+1)-H(x,y-1))*strength;
    let nx=-dx,ny=-dy,nz=1;const l=Math.hypot(nx,ny,nz);
    const i=(y*w+x)*4;
    d[i]=(nx/l*0.5+0.5)*255;d[i+1]=(ny/l*0.5+0.5)*255;d[i+2]=(nz/l*0.5+0.5)*255;d[i+3]=255;
  }
  g.putImageData(img,0,0);return out;
}

/* petal: u along length (base->tip), v across */
function petalCanvas(){
  const W=512,H=192,cv=makeCanvas(W,H),g=cv.getContext('2d');
  const img=g.createImageData(W,H),d=img.data;
  const stops=[[0.0,[0.34,0.22,0.04]],[0.10,[0.62,0.40,0.035]],[0.35,[0.74,0.48,0.035]],[0.72,[0.80,0.55,0.06]],[1.0,[0.74,0.55,0.12]]];
  for(let y=0;y<H;y++)for(let x=0;x<W;x++){
    const t=x/(W-1),s=y/(H-1);
    let c=grad3(stops,t);
    const n=fbm(t*6.5+2.3,s*4.1+0.7,4), n2=fbm(t*26,s*13,3);
    c=[c[0]*(0.90+0.20*n),c[1]*(0.90+0.18*n),c[2]*(0.86+0.28*n)];
    // longitudinal veins, converging at the base
    let vein=0;
    for(let k=0;k<7;k++){
      const spread=(k-3)/3.0;
      const vp=0.5+spread*0.46*Math.pow(t,0.62)*(1+0.06*Math.sin(t*9+k));
      const dd=Math.abs(s-vp);
      vein+=Math.exp(-(dd*dd)/(2*0.0032*0.0032))*0.55;
      vein+=Math.exp(-(dd*dd)/(2*0.011*0.011))*0.12;
    }
    vein=clamp(vein,0,1);
    const edge=Math.min(1,Math.min(s,1-s)/0.10);
    const lum=0.90+0.10*edge;
    let r=c[0]*lum-vein*0.16+n2*0.03, gg=c[1]*lum-vein*0.15+n2*0.02, b=c[2]*lum-vein*0.10+n2*0.02;
    // faint brown freckles toward the base
    const fr=Math.pow(clamp(1-t/0.42,0,1),1.6);
    const sp=fbm(t*60+11,s*40+5,2);
    if(sp>0.62){const k=(sp-0.62)*2.6*fr;r-=0.16*k;gg-=0.14*k;b-=0.08*k;}
    const i=(y*W+x)*4;
    d[i]=clamp(r,0,1)*255;d[i+1]=clamp(gg,0,1)*255;d[i+2]=clamp(b,0,1)*255;d[i+3]=255;
  }
  g.putImageData(img,0,0);return cv;
}
function petalHeightCanvas(){
  const W=256,H=96,cv=makeCanvas(W,H),g=cv.getContext('2d');
  const img=g.createImageData(W,H),d=img.data;
  for(let y=0;y<H;y++)for(let x=0;x<W;x++){
    const t=x/(W-1),s=y/(H-1);
    let v=fbm(t*18,s*11,4)*0.6+ridge(t*9,s*6,2)*0.25;
    for(let k=0;k<7;k++){const vp=0.5+((k-3)/3)*0.46*Math.pow(t,0.62);const dd=Math.abs(s-vp);v+=Math.exp(-(dd*dd)/(2*0.004*0.004))*0.35;}
    const i=(y*W+x)*4,val=clamp(v,0,1)*255;
    d[i]=val;d[i+1]=val;d[i+2]=val;d[i+3]=255;
  }
  g.putImageData(img,0,0);return cv;
}
/* leaf: mottled green with veins */
function leafCanvas(){
  const W=512,H=512,cv=makeCanvas(W,H),g=cv.getContext('2d');
  const img=g.createImageData(W,H),d=img.data;
  for(let y=0;y<H;y++)for(let x=0;x<W;x++){
    const u=x/W,v=y/H;
    const n=fbm(u*5+1,v*5+2,5), n2=fbm(u*22,v*16,3), n3=fbm(u*70,v*55,2);
    let c=grad3([[0,[0.13,0.24,0.07]],[0.45,[0.22,0.38,0.11]],[0.8,[0.30,0.46,0.15]],[1,[0.36,0.50,0.19]]],n*0.85+n2*0.15);
    // main vein along v, side veins
    let vein=0;
    vein+=Math.exp(-((u-0.5)*(u-0.5))/(2*0.006*0.006))*0.9;
    for(let k=0;k<9;k++){
      const y0=0.08+k*0.105;
      for(const sgn of [-1,1]){
        const dx=(u-0.5)*sgn;
        const line=v-(y0+dx*1.35);
        if(Math.abs(line)<0.05){vein+=Math.exp(-(line*line)/(2*0.0045*0.0045))*0.5;}
      }
    }
    vein=clamp(vein,0,1);
    c=[c[0]+vein*0.10,c[1]+vein*0.13,c[2]+vein*0.05];
    const dust=Math.pow(n3,3)*0.25;
    c=[c[0]+dust*0.5,c[1]+dust*0.55,c[2]+dust*0.35];
    const i=(y*W+x)*4;
    d[i]=clamp(c[0],0,1)*255;d[i+1]=clamp(c[1],0,1)*255;d[i+2]=clamp(c[2],0,1)*255;d[i+3]=255;
  }
  g.putImageData(img,0,0);return cv;
}
/* stem: green with striations, speckles, hair bases */
function stemCanvas(){
  const W=256,H=256,cv=makeCanvas(W,H),g=cv.getContext('2d');
  const img=g.createImageData(W,H),d=img.data;
  for(let y=0;y<H;y++)for(let x=0;x<W;x++){
    const u=x/W,v=y/H;
    const n=fbm(u*3,v*10,4), st=0.5+0.5*Math.sin(u*70+fbm(u*8,v*6,3)*6);
    let c=grad3([[0,[0.14,0.24,0.08]],[0.5,[0.24,0.36,0.12]],[1,[0.33,0.45,0.17]]],n*0.7+st*0.3);
    const sp=fbm(u*40+7,v*30+3,2);
    if(sp>0.66){const k=(sp-0.66)*2.4;c=[c[0]*0.75,c[1]*0.78,c[2]*0.7];}
    const hb=fbm(u*26,v*26,1);
    if(hb>0.80){const k=(hb-0.80)*4;c=[c[0]+0.25*k,c[1]+0.26*k,c[2]+0.16*k];}
    const i=(y*W+x)*4;
    d[i]=c[0]*255;d[i+1]=c[1]*255;d[i+2]=c[2]*255;d[i+3]=255;
  }
  g.putImageData(img,0,0);return cv;
}
function stemHeightCanvas(){
  const W=256,H=256,cv=makeCanvas(W,H),g=cv.getContext('2d');
  const img=g.createImageData(W,H),d=img.data;
  for(let y=0;y<H;y++)for(let x=0;x<W;x++){
    const u=x/W,v=y/H;
    let val=fbm(u*4,v*14,4)*0.5+0.5*(0.5+0.5*Math.sin(u*70+fbm(u*8,v*6,3)*6))*0.25;
    const hb=fbm(u*26,v*26,1); if(hb>0.80)val+=(hb-0.80)*3;
    const i=(y*W+x)*4,val255=clamp(val,0,1)*255;
    d[i]=val255;d[i+1]=val255;d[i+2]=val255;d[i+3]=255;
  }
  g.putImageData(img,0,0);return cv;
}
/* fur / fuzz base colour */
function furCanvas(base,dark,tip,warmth){
  const W=512,H=512,cv=makeCanvas(W,H),g=cv.getContext('2d');
  g.fillStyle=`rgb(${base[0]*255|0},${base[1]*255|0},${base[2]*255|0})`;g.fillRect(0,0,W,H);
  for(let i=0;i<7200;i++){
    const x=R()*W,y=R()*H,len=rr(3,11),ang=rr(-0.5,0.5)+ (R()<0.5?0:Math.PI);
    const t=R();
    const c=t<0.50?dark:(t<0.86?base:tip);
    g.strokeStyle=`rgba(${c[0]*255|0},${c[1]*255|0},${c[2]*255|0},${rr(0.16,0.52)})`;
    g.lineWidth=rr(0.7,1.8);
    g.beginPath();g.moveTo(x,y);g.lineTo(x+Math.cos(ang)*len,y+Math.sin(ang)*len);g.stroke();
  }
  const img=g.getImageData(0,0,W,H),d=img.data;
  for(let y=0;y<H;y++)for(let x=0;x<W;x++){
    const i=(y*W+x)*4,n=fbm(x/W*30,y/H*30,3);
    d[i]=clamp(d[i]/255*(0.82+0.36*n)+warmth*0.02,0,1)*255;
    d[i+1]=clamp(d[i+1]/255*(0.82+0.36*n),0,1)*255;
    d[i+2]=clamp(d[i+2]/255*(0.80+0.40*n),0,1)*255;
  }
  g.putImageData(img,0,0);return cv;
}
/* abdomen bands: u around, v along axis (0 = front) */
function abdomenCanvas(){
  const W=512,H=256,cv=makeCanvas(W,H),g=cv.getContext('2d');
  const bands=[[0.00,0.145,'dark'],[0.145,0.220,'gold'],[0.220,0.390,'dark'],[0.390,0.465,'gold'],
               [0.465,0.630,'dark'],[0.630,0.705,'gold'],[0.705,0.865,'dark'],[0.865,0.940,'gold'],[0.940,1.0,'dark']];
  const img=g.createImageData(W,H),d=img.data;
  const darkC=[0.082,0.056,0.030], goldC=[0.500,0.335,0.105], amberC=[0.575,0.395,0.130];
  for(let y=0;y<H;y++)for(let x=0;x<W;x++){
    const u=x/W,v=y/H;
    let c;
    for(const b of bands){
      if(v>=b[0]&&v<b[1]){
        const k=(v-b[0])/(b[1]-b[0]);
        const edge=Math.min(1,Math.min(k,1-k)/0.45);
        if(b[2]==='dark')c=[lerp(0.10,darkC[0],edge),lerp(0.08,darkC[1],edge),lerp(0.05,darkC[2],edge)];
        else c=[lerp(darkC[0],k<0.5?goldC[0]:amberC[0],edge),lerp(darkC[1],k<0.5?goldC[1]:amberC[1],edge),lerp(darkC[2],k<0.5?goldC[2]:amberC[2],edge)];
        break;
      }
    }
    if(!c)c=darkC;
    const wob=fbm(u*8,v*7,3)*0.03;
    const n=fbm(u*40+3,v*34+9,3);
    const i=(y*W+x)*4;
    d[i]=clamp(c[0]*(0.80+0.42*n)+wob,0,1)*255;
    d[i+1]=clamp(c[1]*(0.80+0.42*n)+wob,0,1)*255;
    d[i+2]=clamp(c[2]*(0.80+0.42*n)+wob*0.6,0,1)*255;
    d[i+3]=255;
  }
  g.putImageData(img,0,0);
  for(let i=0;i<2600;i++){
    const x=R()*W,y=R()*H,len=rr(1.5,5.5),ang=rr(-0.45,0.45)+(R()<0.5?0:Math.PI);
    const warm=R();
    g.strokeStyle=warm<0.55
      ?`rgba(${(0.16+R()*0.10)*255|0},${(0.11+R()*0.07)*255|0},${(0.05+R()*0.04)*255|0},${rr(0.05,0.14)})`
      :`rgba(${(0.46+R()*0.20)*255|0},${(0.32+R()*0.14)*255|0},${(0.11+R()*0.06)*255|0},${rr(0.04,0.11)})`;
    g.lineWidth=rr(0.5,1.1);g.beginPath();g.moveTo(x,y);g.lineTo(x+Math.cos(ang)*len,y+Math.sin(ang)*len);g.stroke();
  }
  return cv;
}
/* compound eye facets -> height map */
function eyeHeightCanvas(){
  const W=256,H=256,cv=makeCanvas(W,H),g=cv.getContext('2d');
  const img=g.createImageData(W,H),d=img.data;
  const cell=7.0;
  for(let y=0;y<H;y++)for(let x=0;x<W;x++){
    const u=x/W*cell*26,v=y/H*cell*13;
    // hexagonal lattice
    const ax=u, ay=v+ (Math.floor(u/cell)&1? cell*0.5:0);
    const cx=Math.round(ax/cell)*cell, cy=Math.round(ay/cell)*cell;
    const dx=(ax-cx)/cell, dy=(ay-cy)/cell;
    let r=Math.hypot(dx,dy);
    let val=0.5+0.5*Math.cos(clamp(r,0,0.55)/0.55*Math.PI);
    val=clamp(val*0.85+fbm(x/W*40,y/H*40,2)*0.15,0,1);
    const i=(y*W+x)*4,vv=val*255;
    d[i]=vv;d[i+1]=vv;d[i+2]=vv;d[i+3]=255;
  }
  g.putImageData(img,0,0);return cv;
}
/* wing veins (r channel = vein darkness) */
function wingCanvas(){
  const W=512,H=256,cv=makeCanvas(W,H),g=cv.getContext('2d');
  g.fillStyle='#000';g.fillRect(0,0,W,H);
  g.strokeStyle='#fff';g.lineCap='round';
  const P=(u,v)=>[u*W,v*H];
  const main=[
    [[0.02,0.50],[0.25,0.34],[0.55,0.24],[0.90,0.22]],
    [[0.02,0.50],[0.28,0.46],[0.60,0.42],[0.94,0.40]],
    [[0.02,0.50],[0.30,0.58],[0.62,0.60],[0.92,0.58]],
    [[0.02,0.50],[0.26,0.70],[0.55,0.78],[0.80,0.82]],
    [[0.02,0.50],[0.20,0.86],[0.42,0.94]],
    [[0.10,0.44],[0.16,0.20],[0.30,0.12]],
    [[0.30,0.12],[0.42,0.20],[0.55,0.24]],
    [[0.35,0.34],[0.40,0.52],[0.44,0.62]],
    [[0.55,0.24],[0.60,0.42]],
    [[0.60,0.42],[0.62,0.60]],
    [[0.62,0.60],[0.55,0.78]],
    [[0.75,0.30],[0.78,0.50],[0.74,0.70]],
    [[0.86,0.30],[0.88,0.50]],
  ];
  for(const path of main){
    g.lineWidth=rr(2.2,3.4);g.beginPath();
    g.moveTo(...P(path[0][0],path[0][1]));
    for(let i=1;i<path.length-1;i++){
      const a=P(path[i][0],path[i][1]),b=P(path[i+1][0],path[i+1][1]);
      const mx=(a[0]+b[0])/2,my=(a[1]+b[1])/2;
      g.quadraticCurveTo(a[0],a[1],mx,my);
    }
    const e=P(path[path.length-1][0],path[path.length-1][1]);
    g.lineTo(e[0],e[1]);g.stroke();
  }
  g.lineWidth=1.1;g.globalAlpha=0.55;
  for(let i=0;i<26;i++){
    const u=rr(0.12,0.9),v0=rr(0.15,0.5),v1=rr(0.55,0.9);
    g.beginPath();g.moveTo(u*W,v0*H);g.lineTo(u*W+rr(-14,14),v1*H);g.stroke();
  }
  g.globalAlpha=1;
  // membrane sheen noise
  const img=g.getImageData(0,0,W,H),d=img.data;
  for(let y=0;y<H;y++)for(let x=0;x<W;x++){
    const i=(y*W+x)*4,n=fbm(x/W*26,y/H*18,3);
    d[i]=clamp(d[i]/255*0.85+n*0.10,0,1)*255;
    d[i+1]=d[i];d[i+2]=d[i];
  }
  g.putImageData(img,0,0);
  return cv;
}
function radialSprite(inner,outer,pw){
  const S=64,cv=makeCanvas(S,S),g=cv.getContext('2d');
  const img=g.createImageData(S,S),d=img.data;
  for(let y=0;y<S;y++)for(let x=0;x<S;x++){
    const r=Math.hypot(x/S-0.5,y/S-0.5)*2;
    let a=Math.pow(clamp(1-r,0,1),pw);
    const i=(y*S+x)*4;
    d[i]=inner[0];d[i+1]=inner[1];d[i+2]=inner[2];d[i+3]=a*255;
  }
  g.putImageData(img,0,0);return cv;
}
function groundCanvas(){
  const W=512,H=512,cv=makeCanvas(W,H),g=cv.getContext('2d');
  const img=g.createImageData(W,H),d=img.data;
  for(let y=0;y<H;y++)for(let x=0;x<W;x++){
    const u=x/W,v=y/H;
    const n=fbm(u*4,v*4,5),n2=fbm(u*18,v*14,3);
    let c=grad3([[0,[0.112,0.138,0.052]],[0.4,[0.238,0.258,0.098]],[0.7,[0.382,0.362,0.148]],[1,[0.492,0.432,0.208]]],n*0.75+n2*0.25);
    const i=(y*W+x)*4;
    d[i]=c[0]*255;d[i+1]=c[1]*255;d[i+2]=c[2]*255;d[i+3]=255;
  }
  g.putImageData(img,0,0);return cv;
}

const TEX={
  petal:toTex(petalCanvas()),
  petalN:toTex(heightToNormal(petalHeightCanvas(),1.6),{srgb:false}),

const SSS_DIR=new THREE.Vector3(-0.62,0.60,-0.50).normalize();
function addSSS(mat,color,strength,gloss){
  mat.onBeforeCompile=(sh)=>{
    sh.uniforms.uSSSC={value:new THREE.Color(color)};
    sh.uniforms.uSSSS={value:strength};
    sh.uniforms.uSSSG={value:gloss};
    sh.uniforms.uSSSD={value:SSS_DIR};
    sh.fragmentShader=sh.fragmentShader
      .replace('#include <common>','#include <common>\nuniform vec3 uSSSC;uniform vec3 uSSSD;uniform float uSSSS;uniform float uSSSG;')
      .replace('#include <lights_fragment_maps>',`#include <lights_fragment_maps>
      {
        vec3 sD = normalize((viewMatrix*vec4(uSSSD,0.0)).xyz);
        vec3 sN = normal;
        float ndl = dot(sN, sD);
        float back = max(-ndl,0.0);
        vec3 sH = normalize(sD + sN*0.40);
        float tr = pow(clamp(dot(geometryViewDir,-sH),0.0,1.0), uSSSG);
        float thick = 0.35 + 0.65*back;
        reflectedLight.indirectDiffuse += uSSSC * (tr*1.25 + back*0.32) * thick * uSSSS;
      }`);
    mat.userData.shader=sh;
  };
  mat.customProgramCacheKey=()=>'sss'+String(strength)+String(gloss)+String(color);
  return mat;
}

/* ---- ray petals: three overlapping rings ---- */
function petalGeometry(len,width,curl,cross,twist,crimp){
  const NU=26,NV=9,pos=[],uv=[],idx=[];
  for(let i=0;i<=NU;i++){
    const t=i/NU;
    const prof=Math.pow(Math.sin(Math.PI*clamp(t*0.995+0.015,0,1)),0.5)*(1-0.16*t);
    const w=width*clamp(prof,0.03,1.5);
    const bend=-curl*t*t;
    const wave=crimp*Math.sin(t*7.0);
    for(let j=0;j<=NV;j++){
      const s=j/NV-0.5;
      let y=s*w;
      let z=bend*len - cross*(y*y)/Math.max(width,0.001) + wave*s*0.10;
      const x=t*len;
      const tw=twist*t*t;
      const yy=y*Math.cos(tw)-z*Math.sin(tw), zz=y*Math.sin(tw)+z*Math.cos(tw);
      pos.push(x,yy,zz);uv.push(t,s+0.5);
    }
  }
  for(let i=0;i<NU;i++)for(let j=0;j<NV;j++){
    const a=i*(NV+1)+j,b=a+NV+1;
    idx.push(a,b,a+1,b,b+1,a+1);
  }
  const g=new THREE.BufferGeometry();
  g.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));
  g.setAttribute('uv',new THREE.Float32BufferAttribute(uv,2));
  g.setIndex(idx);g.computeVertexNormals();
  return g;
}

function leafGeometry(len,wid){
  const NU=22,NV=10,pos=[],uv=[],idx=[];
  for(let i=0;i<=NU;i++){
    const t=i/NU;
    const prof=Math.pow(Math.sin(Math.PI*Math.pow(clamp(t,0,1),0.62)),0.85)*(1-0.10*t);
    const serr=1+0.055*Math.sin(t*40);
    const w=wid*clamp(prof,0.02,1.4)*serr;
    const bend=-0.30*Math.sin(t*Math.PI*0.9)-0.10*t;
    for(let j=0;j<=NV;j++){
      const s=j/NV-0.5;
      const y=s*w;
      const z=bend*len-0.22*(y*y)/Math.max(wid,0.001)+0.10*Math.sin(t*Math.PI)*Math.abs(s)*len*0.1;
      pos.push(t*len,y,z);uv.push(t,s+0.5);
    }
  }
  for(let i=0;i<NU;i++)for(let j=0;j<NV;j++){
    const a=i*(NV+1)+j,b=a+NV+1;idx.push(a,b,a+1,b,b+1,a+1);
  }
  const g=new THREE.BufferGeometry();
  g.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));
  g.setAttribute('uv',new THREE.Float32BufferAttribute(uv,2));
  g.setIndex(idx);g.computeVertexNormals();return g;
}

function fuzzOnEllipsoid(parent,center,radii,count,mat,lmin,lmax,r0){
  if(r0===undefined)r0=0.0028;

  const m=new THREE.Matrix4(),q=new THREE.Quaternion(),p=new THREE.Vector3(),s=new THREE.Vector3();
  const n=new THREE.Vector3(),d=new THREE.Vector3();
  for(let i=0;i<count;i++){
    const z=1-2*R(),ph=R()*Math.PI*2,rx=Math.sqrt(Math.max(0,1-z*z));
    d.set(rx*Math.cos(ph),z,rx*Math.sin(ph));

  /* ---------- helpers ---------- */
  discPoint(x,y){
    const r=Math.hypot(x,y);
    return new THREE.Vector3(x,y,surfaceZ(r)+0.015);
  }
  clampAnnulus(x,y,minR,maxR){
    let r=Math.hypot(x,y);
    if(r<1e-4){x=0.001;y=0;r=0.001;}
    if(r<minR){x*=minR/r;y*=minR/r;r=minR;}
    if(r>maxR){x*=maxR/r;y*=maxR/r;r=maxR;}
    return [x,y,r];
  }
  initLegs(){
    for(const leg of this.legs){
      const hx=this.pos.x+leg.home[0]*Math.cos(this.yaw)-leg.home[1]*Math.sin(this.yaw);
      const hy=this.pos.y+leg.home[0]*Math.sin(this.yaw)+leg.home[1]*Math.cos(this.yaw);
      const [x,y]=this.clampAnnulus(hx,hy,1.2,DISC_R*0.90);
      leg.planted.copy(this.discPoint(x,y));
      leg.next.copy(leg.planted);
    }
  }
  setRootFromDisc(x,y,yaw,extraH=0){
    const [cx,cy,r]=this.clampAnnulus(x,y,0.6,DISC_R*0.93);
    this.pos.set(cx,cy,surfaceZ(r)+0.40+extraH);
    this.up.copy(discNormal(r,new THREE.Vector3()));
    const flat=new THREE.Vector3(Math.cos(yaw),Math.sin(yaw),0);
    this.fwd.copy(flat).addScaledVector(this.up,-flat.dot(this.up)).normalize();
    const Z=new THREE.Vector3().crossVectors(this.fwd,this.up);
    this._m.makeBasis(this.fwd,this.up,Z);
    this._q.setFromRotationMatrix(this._m);
    this.root.position.copy(this.pos);
    this.root.quaternion.copy(this._q);
    this.root.updateMatrix();
    this._inv.copy(this.root.matrix).invert();
    this.rDisc=r;
  }
  setRootFlight(p,yaw,pitch,roll){
    this.pos.copy(p);
    const fwd=new THREE.Vector3(Math.cos(yaw)*Math.cos(pitch),Math.sin(yaw)*Math.cos(pitch),Math.sin(pitch));
    const up0=new THREE.Vector3(0,0,1);
    const Z=new THREE.Vector3().crossVectors(fwd,up0).normalize();
    let up=new THREE.Vector3().crossVectors(Z,fwd).normalize();
    if(roll){up.applyAxisAngle(fwd,roll);Z.crossVectors(fwd,up).normalize();}
    this.fwd.copy(fwd);this.up.copy(up);
    this._m.makeBasis(fwd,up,Z);
    this._q.setFromRotationMatrix(this._m);
    this.root.position.copy(p);
    this.root.quaternion.copy(this._q);
    this.root.updateMatrix();
    this._inv.copy(this.root.matrix).invert();
  }
  /* ---------- gait ---------- */
  updateLegs(dt,speed){
    const walking=this.flight<0.35&&speed>0.04;
    this.stepFreq=lerp(0,3.1,clamp(speed/0.45,0,1));
    if(this.groom>0.2)this.stepFreq=lerp(this.stepFreq,1.6,this.groom);
    this.gaitPhase=(this.gaitPhase+dt*this.stepFreq)%1;
    const stepLen=0.20+0.16*clamp(speed/0.45,0,1);
    const REACH=0.46;
    for(const leg of this.legs){
      const ph=(this.gaitPhase+leg.phase)%1;
      const win=leg.tripod===0?[0.02,0.40]:[0.52,0.90];
      const inSwing=walking&&ph>=win[0]&&ph<win[1];
      const cy0=Math.cos(this.yaw),sy0=Math.sin(this.yaw);
      // this leg's hip and its natural stance point, in head-local XY
      const hpx=this.pos.x+leg.d.hip[0]*cy0-leg.d.hip[1]*sy0;
      const hpy=this.pos.y+leg.d.hip[0]*sy0+leg.d.hip[1]*cy0;
      const bpx=this.pos.x+leg.home[0]*cy0-leg.home[1]*sy0;
      const bpy=this.pos.y+leg.home[0]*sy0+leg.home[1]*cy0;
      if(inSwing&&!leg.swing){
        leg.swing=true;leg.su=0;
        if(leg.override){leg.next.copy(leg.override);}
        else{
          const f=new THREE.Vector3(cy0,sy0,0);
          const s=new THREE.Vector3(-sy0,cy0,0);
          // re-anchor every step to the body's current stance, then reach forward
          let nx=bpx+f.x*stepLen*rr(0.25,0.85)+s.x*rr(-0.07,0.07);
          let ny=bpy+f.y*stepLen*rr(0.25,0.85)+s.y*rr(-0.07,0.07);
          // a foot can never be placed farther from its own hip than the leg can reach
          const bdx=nx-hpx,bdy=ny-hpy,bd=Math.hypot(bdx,bdy);
          if(bd>REACH){nx=hpx+bdx/bd*REACH;ny=hpy+bdy/bd*REACH;}
          const [ax,ay]=this.clampAnnulus(nx,ny,1.0,DISC_R*0.92);
          leg.next.copy(this.discPoint(ax,ay));
        }
      }
      let foot;
      if(leg.override){
        leg.planted.copy(leg.override);leg.next.copy(leg.override);leg.swing=false;
        foot=leg.override;
      }else if(leg.swing){
        leg.su=Math.min(1,leg.su+dt*Math.max(3.5,this.stepFreq*2.4));
        const u=smoother(leg.su);
        foot=new THREE.Vector3().lerpVectors(leg.planted,leg.next,u);
        const r=Math.hypot(foot.x,foot.y);
        foot.z=lerp(surfaceZ(r)+0.015,surfaceZ(r)+0.015+0.075,Math.sin(Math.PI*clamp(leg.su,0,1)));
        if(leg.su>=1){leg.swing=false;leg.planted.copy(leg.next);foot.copy(leg.next);}
      }else{
        foot=leg.planted.clone();
      }
      if(!leg.override){
        const fdx=foot.x-hpx,fdy=foot.y-hpy,fd=Math.hypot(fdx,fdy);
        if(fd>REACH+0.03){
          foot.x=hpx+fdx/fd*(REACH+0.03);foot.y=hpy+fdy/fd*(REACH+0.03);
          foot.z=surfaceZ(Math.hypot(foot.x,foot.y))+0.015;
          leg.planted.copy(foot);
        }
      }
      // IK in head-local space
      const hip=new THREE.Vector3().fromArray(leg.d.hip).applyMatrix4(this.root.matrix);
      const dir=new THREE.Vector3().subVectors(foot,hip);
      let d=dir.length();
      const reach=leg.L1+leg.L2-0.005;
      const target=foot.clone();
      // tarsus direction: forward-down in head space
      const fwdH=new THREE.Vector3(1,0,0).applyMatrix4(this.root.matrix).setLength(1);
      const upH=new THREE.Vector3(0,1,0).applyMatrix4(this.root.matrix).setLength(1);
      const td=fwdH.clone().multiplyScalar(0.55).addScaledVector(upH,-0.75).normalize();
      const ankle=new THREE.Vector3().copy(target).addScaledVector(td,-leg.L3);
      dir.subVectors(ankle,hip);d=dir.length();
      if(d>reach){ankle.copy(hip).addScaledVector(dir.setLength(1),reach);d=reach;}
      if(d<0.05){ankle.copy(hip).addScaledVector(upH,-0.05);}
      const poleH=leg.pole.clone().applyMatrix4(this.root.matrix).transformDirection(this.root.matrix);
      const dn=dir.clone().normalize();
      const poleDir=poleH.clone().addScaledVector(dn,-poleH.dot(dn));
      if(poleDir.lengthSq()<1e-6)poleDir.copy(upH).addScaledVector(dn,-upH.dot(dn));
      poleDir.normalize();
      const cosA=clamp((leg.L1*leg.L1+d*d-leg.L2*leg.L2)/(2*leg.L1*d),-1,1);
      const A=Math.acos(cosA);
      const kneeDir=dn.clone().multiplyScalar(Math.cos(A)).addScaledVector(poleDir,Math.sin(A)).normalize();
      const knee=new THREE.Vector3().copy(hip).addScaledVector(kneeDir,leg.L1);
      // to bee-local
      const hl=hip.applyMatrix4(this._inv),kl=knee.applyMatrix4(this._inv),al=ankle.applyMatrix4(this._inv),fl=target.applyMatrix4(this._inv);
      const place=(mesh,a,b)=>{
        const dv=new THREE.Vector3().subVectors(b,a);
        const len=dv.length();
        if(len<1e-5){mesh.visible=false;return;}
        mesh.visible=true;
        mesh.position.copy(a).addScaledVector(dv,0.5);
        mesh.quaternion.setFromUnitVectors(UPV,dv.normalize());
      };
      const hipStub=hl.clone().addScaledVector(new THREE.Vector3().subVectors(kl,hl).normalize(),leg.L0);
      place(leg.segs[0],hl,hipStub);
      place(leg.segs[1],hipStub,kl);
      place(leg.segs[2],kl,al);
      place(leg.segs[3],al,fl);
      leg.joints[0].position.copy(hl);
      leg.joints[1].position.copy(kl);
      leg.joints[2].position.copy(al);
      leg.claw.position.copy(fl);
      leg.claw.quaternion.setFromUnitVectors(UPV,new THREE.Vector3().subVectors(fl,al).normalize());
      if(leg.basket){
        leg.basket.position.copy(kl).lerp(al,0.55);
        const dv=new THREE.Vector3().subVectors(al,kl).normalize();
        leg.basket.quaternion.setFromUnitVectors(UPV,dv);
        const sc=0.9+0.35*this.pollen;
        leg.basket.scale.set(sc,1,0.5*sc);
      }
      if(leg.pellet){
        const c=kl.clone().lerp(al,0.5);
        leg.pellet.position.copy(c);
        const s=0.018+0.070*this.pollen;
        leg.pellet.scale.set(s*1.15,s*1.35,s*0.72);
        leg.pellet.quaternion.setFromUnitVectors(UPV,new THREE.Vector3().subVectors(al,kl).normalize());
        leg.pellet.visible=this.pollen>0.05;
      }
    }
  }
  /* ---------- body animation ---------- */
  animateExtras(t,dt){
    const flapAmp=1.05;
    const f=26;
    for(const w of this.wings){
      const spreadY=lerp(-2.95,-1.42,this.flight)*w.sgn;
      const flap=this.flight>0.05?Math.sin(t*Math.PI*2*f+w.sgn*0.6)*flapAmp*this.flight:0;
      const settle=this.flight>0.05?Math.sin(t*Math.PI*2*f*0.5)*0.10*this.flight:0;
      w.piv.rotation.y=spreadY+settle*0.2*w.sgn;
      w.piv.rotation.x=-flap*w.sgn*0.98;
      w.piv.rotation.z=lerp(-0.12,0.0,this.flight);
      w.mat.uniforms.uOp.value=0.30*this.flight;
    }
    wingMat.uniforms.uAlpha.value=1.0;
    // antennae twitch
    for(const a of this.ants){
      const tw=Math.sin(t*7.3+a.ph)*0.16+Math.sin(t*13.1+a.ph2)*0.07+Math.sin(t*2.1)*0.05;
      const tw2=Math.sin(t*5.1+a.ph2)*0.12;
      a.grp.rotation.x=tw*0.8+this.groom*0.5*a.sgn;
      a.grp.rotation.y=tw2*0.6*a.sgn;
      a.grp.rotation.z=tw*0.35*a.sgn;
    }
    // proboscis
    const pe=this.probe;
    this.probGrp.rotation.x=lerp(-0.55,0.30,pe);
    this.probExt.rotation.x=lerp(1.25,0.10,pe);
    this.probExt.scale.y=lerp(0.45,1.15,pe);
    // head bob while probing
    const hb=pe*Math.sin(t*9.0)*0.035;
    this.headGrp.rotation.x=hb;
    this.headGrp.rotation.z=Math.sin(t*3.3)*0.02;
    // abdomen breathing / waggle
    const wag=Math.sin(t*2.4)*0.02+this.groom*0.05*Math.sin(t*6.0);
    this.abd.rotation.y=wag;
    this.abd.rotation.z=-Math.PI/2+Math.sin(t*1.7)*0.012;
  }
}

/* ============================================================
   BEHAVIOUR
   ============================================================ */
class Forager{
  constructor(bee,auto=false){
    this.bee=bee;this.auto=auto;
    this.st='probe';this.t=0;this.dur=2.0;
    this.tx=0;this.ty=0;
    this.hover=new THREE.Vector3();this.hoverR=4;
    this.faceCam=false;
    this.speed=0;
    this.pickTarget(rr(0,6.283),rr(2.5,DISC_R*0.82));
    this.bee.pos.set(this.tx,this.ty,surfaceZ(Math.hypot(this.tx,this.ty))+0.40);
    this.bee.initLegs();
  }
  pickTarget(a,r){
    const [x,y]=this.bee.clampAnnulus(Math.cos(a)*r,Math.sin(a)*r,1.6,DISC_R*0.86);
    this.tx=x;this.ty=y;
  }
  stepTarget(a,d){
    const [x,y]=this.bee.clampAnnulus(this.bee.pos.x+Math.cos(a)*d,this.bee.pos.y+Math.sin(a)*d,1.6,DISC_R*0.86);
    this.tx=x;this.ty=y;
  }
  force(kind,data={}){
    if(kind==='goto'){this.pickTarget(data.a??rr(0,6.283),data.r??rr(2,6));}
    else if(kind==='probe'||kind==='groom'||kind==='walk'||kind==='takeoff'||kind==='fly'||kind==='land'){
      if(kind==='walk')this.stepTarget(data.a??rr(0,6.283),data.r??rr(1.0,2.2));
      this.st=kind;this.t=0;
      this.dur=data.dur??({probe:rr(1.6,3.0),groom:rr(2.0,3.6),walk:rr(1.5,3.0),takeoff:0.55,fly:rr(3.5,6.5),land:1.1})[kind];
      if(kind==='fly'){this.setHover(data.a??this.camAz,this.hover);}
      if(kind==='land'){this.pickTarget(data.a??rr(0,6.283),data.r??rr(2.5,6));}
    }
    this.bee.faceCam=false;
  }
  setHover(a,out){
    const r=rr(2.5,5.0);
    this.hoverR=r;
    const p=new THREE.Vector3(Math.cos(a)*r,Math.sin(a)*r,0);
    const n=discNormal(p.length(),new THREE.Vector3());
    out.copy(p).addScaledVector(n,rr(1.3,2.6));
    out.z+=0.0;
  }
  decide(){
    const b=this.bee;
    switch(this.st){
      case 'walk':{
        this.stepTarget(rr(0,6.283),rr(1.0,2.2));
        this.st='probe';this.t=0;this.dur=rr(1.4,3.0);break;}
      case 'probe':
        if(R()<0.22){this.st='groom';this.t=0;this.dur=rr(2.0,3.8);}
        else if(R()<0.10){this.st='walk';this.t=0;this.dur=rr(1.2,2.6);}
        else{this.st='probe';this.t=0;this.dur=rr(1.4,3.0);
          const a=Math.atan2(this.ty,this.tx)+rr(-0.7,0.7);
          this.pickTarget(a,clamp(Math.hypot(this.tx,this.ty)+rr(-1.2,1.2),1.6,DISC_R*0.86));}
        break;
      case 'groom':this.st='probe';this.t=0;this.dur=rr(1.5,2.8);break;
    }
  }
  update(dt,t,camAz){
    const b=this.bee;
    this.t+=dt;
    this.camAz=camAz;
    let speed=0;
    b.faceCam=false;
    if(this.auto&&this.t>this.dur){
      // autonomous cycle
      if(this.st==='fly'&&this.t>this.dur){this.st='land';this.t=0;this.dur=1.2;this.pickTarget(camAz+rr(-1.2,1.2),rr(2.5,6));}
      else if(this.st==='land'){this.st='probe';this.t=0;this.dur=rr(3,7);}

const LOOP=20;

function sampleKeys(keys,t){
  const n=keys.length,T=LOOP;
  t=((t%T)+T)%T;
  let i=0;while(i<n-2&&keys[i+1][0]<=t)i++;
  const k1=keys[i],k2=keys[i+1];
  let k0=keys[(i-1+(n-1))%(n-1)],k3=keys[(i+2)%(n-1)];
  let t0=k0[0],t1=k1[0],t2=k2[0],t3=k3[0];
  if(i===0){t0-=T;}
  if(i+2>=n-1){t3+=T;}
  const tt=t1+clamp((t-t1)/(t2-t1),0,1)*(t2-t1);
  const a=lerp(k0[1],k1[1],(tt-t0)/(t1-t0));
  const b=lerp(k1[1],k2[1],(tt-t1)/(t2-t1));
  const c=lerp(k2[1],k3[1],(tt-t2)/(t3-t2));
  const a2=lerp(a,b,(tt-t0)/(t2-t0));
  const b2=lerp(b,c,(tt-t1)/(t3-t1));
  return lerp(a2,b2,(tt-t1)/(t2-t1));
}

  bee.root.getWorldPosition(beeWorld);
  bee.root.getWorldQuaternion(_q1);
  const close=1-smooth(clamp((dist-2.2)/4.0,0,1));
  _v3.set(0.52,0.06,0).applyQuaternion(_q1).add(beeWorld);
  _v1.copy(beeWorld).lerp(_v3,close);
  _v2.copy(HEAD_POS).lerp(WIDE_TGT,smooth(clamp((dist-26)/44,0,1)));
  _v1.lerp(_v2,tb);
  camTarget.lerp(_v1,1-Math.exp(-6.0*dt));
  const cd=Math.cos(el);
  let azf=az;
  if(close>0.01&&bee.flight<0.3){
    const w=close*(1-clamp(bee.flight*3.4,0,1));
    const c1=SUN_AZ+1.05+0.22*Math.sin(L*0.55),c2=SUN_AZ-1.05-0.22*Math.sin(L*0.55+1.3);
    const want=Math.abs(Math.atan2(Math.sin(c1-az),Math.cos(c1-az)))<Math.abs(Math.atan2(Math.sin(c2-az),Math.cos(c2-az)))?c1:c2;
    if(!faceInit){faceAz=want;faceInit=true;}
    faceAz=angleLerp(faceAz,want,1-Math.exp(-1.1*dt));
    azf=angleLerp(az,faceAz,w);
  }
  _v1.set(cd*Math.cos(azf),Math.sin(el),cd*Math.sin(azf)).multiplyScalar(dist).add(camTarget);
  camPos.lerp(_v1,1-Math.exp(-7.0*dt));
  camera.position.copy(camPos);
  camera.lookAt(camTarget);
  const fd=camera.position.distanceTo(beeWorld);
  focusDist=lerp(focusDist,fd,1-Math.exp(-3.2*dt));
  ctl.faceCam=(dist<5.0&&bee.flight<0.25);
  return dist;
}

/* ============================================================
   FLORA MOTION
   ============================================================ */
const headBaseQ=headGroup.quaternion.clone();
const headOffset=new THREE.Vector3().subVectors(HEAD_POS,neckPivot);
const nodQ=new THREE.Quaternion(),nodE=new THREE.Euler();
const petQ=new THREE.Quaternion(),petE=new THREE.Euler();
function animateFlora(t){
  const gust=0.7+0.3*Math.sin(t*0.19)+0.15*Math.sin(t*0.53+1.1);
  nodE.set(Math.sin(t*0.42)*0.028*gust+Math.sin(t*0.17+1.2)*0.016,
           Math.sin(t*0.31+0.7)*0.024*gust+Math.sin(t*0.23)*0.012,
           Math.sin(t*0.27+0.4)*0.010*gust);
  nodQ.setFromEuler(nodE);
  headGroup.quaternion.copy(headBaseQ).multiply(nodQ);
  headGroup.position.copy(neckPivot).addScaledVector(headOffset,1).applyQuaternion(nodQ);
  for(const p of petals){
    petE.set(Math.sin(t*1.25+p.phase)*p.amp*gust+Math.sin(t*2.7+p.phase*2.1)*p.amp*0.35,
             Math.sin(t*0.92+p.phase*1.7)*p.amp2*gust,
             Math.sin(t*0.61+p.phase)*p.amp2*0.5);
    petQ.setFromEuler(petE);
    p.mesh.quaternion.copy(p.bq).multiply(petQ);
  }
  for(const l of leaves){
    l.grp.rotation.set(Math.sin(t*0.55+l.phase)*l.amp,0,Math.sin(t*0.41+l.phase*1.6)*l.amp*0.7);
  }
}

/* ============================================================
   AUDIO
   ============================================================ */
let AU=null;
function initAudio(){
  if(AU)return;
  const AC=new (window.AudioContext||window.webkitAudioContext)();
  const master=AC.createGain();master.gain.value=0.55;master.connect(AC.destination);
  // buzz
  const bg=AC.createGain();bg.gain.value=0.0;bg.connect(master);
  const lp=AC.createBiquadFilter();lp.type='lowpass';lp.frequency.value=1600;lp.Q.value=0.8;lp.connect(bg);
  const oscs=[];
  for(const [f,t,v] of [[196,'sawtooth',0.5],[247,'sawtooth',0.32],[98,'triangle',0.5],[392,'sine',0.14]]){
    const o=AC.createOscillator();o.type=t;o.frequency.value=f;
    const g=AC.createGain();g.gain.value=v;o.connect(g);g.connect(lp);o.start();oscs.push({o,base:f});
  }
  const lfo=AC.createOscillator();lfo.type='sine';lfo.frequency.value=6.3;
  const lfoG=AC.createGain();lfoG.gain.value=7;lfo.connect(lfoG);
  for(const s of oscs)lfoG.connect(s.o.frequency);
  lfo.start();
  // breeze
  const len=AC.sampleRate*4;
  const buf=AC.createBuffer(1,len,AC.sampleRate);
  const dat=buf.getChannelData(0);let lastN=0;
  for(let i=0;i<len;i++){const w=Math.random()*2-1;lastN=(lastN+0.02*w)/1.02;dat[i]=lastN*3.2;}
  const src=AC.createBufferSource();src.buffer=buf;src.loop=true;
  const bp=AC.createBiquadFilter();bp.type='bandpass';bp.frequency.value=560;bp.Q.value=0.6;
  const bg2=AC.createGain();bg2.gain.value=0.05;
  src.connect(bp);bp.connect(bg2);bg2.connect(master);src.start();
  const blfo=AC.createOscillator();blfo.type='sine';blfo.frequency.value=0.13;
  const blfoG=AC.createGain();blfoG.gain.value=0.035;blfo.connect(blfoG);blfoG.connect(bg2.gain);
  const blfo2=AC.createOscillator();blfo2.type='sine';blfo2.frequency.value=0.07;
  const blfo2G=AC.createGain();blfo2G.gain.value=260;blfo2.connect(blfo2G);blfo2G.connect(bp.frequency);
  blfo.start();blfo2.start();
  AU={AC,master,bg,oscs,nextBird:2.0};
}
function chirp(){
  if(!AU)return;
  const AC=AU.AC,t=AC.currentTime;
  const n=1+((R()*2)|0);
  for(let i=0;i<n;i++){
    const o=AC.createOscillator();o.type='sine';
    const g=AC.createGain();g.gain.value=0;
    const st=t+rr(0,0.6)+i*rr(0.06,0.16);
    const f0=rr(2100,3600);
    o.frequency.setValueAtTime(f0,st);
    o.frequency.exponentialRampToValueAtTime(f0*rr(0.55,0.85),st+rr(0.06,0.16));
    g.gain.setValueAtTime(0,st);
    g.gain.linearRampToValueAtTime(rr(0.010,0.030),st+0.012);
    g.gain.exponentialRampToValueAtTime(0.0001,st+0.18);
    o.connect(g);g.connect(AU.master);o.start(st);o.stop(st+0.25);
  }
}
function updateAudio(dt){
  if(!AU)return;
  const fl=Math.max(bee.flight,bee2.flight);
  const t=AU.AC.currentTime;
  AU.bg.gain.setTargetAtTime(0.004+0.075*fl*fl,t,0.18);
  for(const s of AU.oscs)s.o.frequency.setTargetAtTime(s.base*(1+0.06*fl),t,0.3);
  if(T>AU.nextBird){chirp();AU.nextBird=T+rr(3.5,10);}
}

/* ============================================================
   RESIZE + LOOP
   ============================================================ */
function resize(){
  VW=Math.max(2,innerWidth);VH=Math.max(2,innerHeight);
  renderer.setSize(VW,VH);
  camera.aspect=VW/VH;camera.updateProjectionMatrix();
  rtMain.setSize(VW,VH);rtDOF.setSize(VW,VH);
  rtB1.setSize(Math.max(2,VW>>1),Math.max(2,VH>>1));
  rtB2.setSize(rtB1.width,rtB1.height);
  rtC1.setSize(Math.max(2,VW>>2),Math.max(2,VH>>2));
  rtC2.setSize(rtC1.width,rtC1.height);
  dofMat.uniforms.uTexel.value.set(1/rtDOF.width,1/rtDOF.height);
  dofMat.uniforms.uMax.value=Math.min(40,Math.max(10,VH*0.034));
}
addEventListener('resize',resize);
resize();

const hint=document.getElementById('hint');
let hintTimer=setTimeout(()=>hint.classList.add('off'),13000);
addEventListener('pointerdown',()=>{initAudio();hint.classList.add('off');clearTimeout(hintTimer);},{once:false});

let T=0,last=performance.now(),fpsAvg=60,degraded=false,frozen=false;
const _v4=new THREE.Vector3();let hist=[];
function frame(now){
  requestAnimationFrame(frame);
  let dt=(now-last)/1000;last=now;
  if(!(dt>0)||dt>0.08)dt=1/60;
  const cdt=dt;
  if(frozen)dt=0;
  T+=dt;
  prevL=L;L=(L+dt)%LOOP;
  runCues();
  const dist=updateCamera(cdt);
  animateFlora(T);
  ctl.update(dt,T,camAzInHead());
  ctl2.update(dt,T,camAzInHead()+2.2);
  updatePollen(dt,T);
  updateAudio(dt);
  if(hist.length<400&&(hist.length===0||T-hist[hist.length-1][0]>0.25)){
    bee.root.getWorldPosition(_v4);
    hist.push([+L.toFixed(2),+_v4.x.toFixed(2),+_v4.y.toFixed(2),+_v4.z.toFixed(2),
      +camera.position.x.toFixed(2),+camera.position.y.toFixed(2),+camera.position.z.toFixed(2),
      +focusDist.toFixed(2),ctl.st,bee.flight.toFixed(2)]);
  }
  // dof params
  dofMat.uniforms.uFocus.value=focusDist;
  dofMat.uniforms.uRange.value=clamp(2.6+0.02*focusDist*focusDist,2.6,60);
  renderPost();
  // adaptive quality
  const fps=1/Math.max(cdt,1e-4);
  fpsAvg=lerp(fpsAvg,fps,0.05);
  if(!degraded&&fpsAvg<38&&T>4){
    degraded=true;
    renderer.setPixelRatio(1);resize();
    sun.shadow.mapSize.set(1024,1024);
    if(sun.shadow.map){sun.shadow.map.dispose();sun.shadow.map=null;}
  }
}
requestAnimationFrame(frame);

window.__bee={
  get T(){return T;},get L(){return L;},get fps(){return fpsAvg;},
  get state(){return ctl.st;},get flight(){return bee.flight;},
  get focus(){return focusDist;},get pollen(){return bee.pollen;},
  get cam(){return camera.position.toArray().map(v=>+v.toFixed(2));},
  get beeP(){return bee.root.getWorldPosition(new THREE.Vector3()).toArray().map(v=>+v.toFixed(2));},
  get facing(){bee.root.getWorldQuaternion(_q1);_fwd.set(1,0,0).applyQuaternion(_q1);
    return +((Math.atan2(_fwd.z,_fwd.x)*180/Math.PI+360)%360).toFixed(1);},
  get camAzH(){return +((camAzInHead()*180/Math.PI+360)%360).toFixed(1);},
  get yaw(){return +((bee.yaw*180/Math.PI+360)%360).toFixed(1);},
  get faceAzD(){return +((faceAz*180/Math.PI+360)%360).toFixed(1);},
  jump(v){L=((v%LOOP)+LOOP)%LOOP;prevL=L-1e-6;},
  at(v){L=((v%LOOP)+LOOP)%LOOP;prevL=L-1e-6;frozen=true;},
  freeze(v){frozen=!!v;},
  get frozen(){return frozen;},
  sample(x,y){const b=new Uint16Array(4);try{renderer.readRenderTargetPixels(rtDOF,x,y,1,1,b);}catch(e){return 'err:'+e.message;}    const h=v=>{const s=(v>>15)?-1:1,e=(v>>10)&31,m=v&1023;if(e===0)return s*m/1024*5.96e-8;if(e===31)return s*(m?NaN:Infinity);return s*Math.pow(2,e-15)*(1+m/1024);};
    return [h(b[0]),h(b[1]),h(b[2])];},
  u:{dof:dofMat.uniforms,grade:gradeMat.uniforms},
  m:{floret:floretMat,bud:budMesh,open:openMesh},
  c1:{get st(){return ctl.st;},get t(){return +ctl.t.toFixed(2);},get dur(){return +ctl.dur.toFixed(2);},
     get hover(){return ctl.hover.toArray().map(v=>+v.toFixed(2));},get tgt(){return [+ctl.tx.toFixed(2),+ctl.ty.toFixed(2)];},get auto(){return ctl.auto;}},
  c2:{get st(){return ctl2.st;},get t(){return +ctl2.t.toFixed(2);},get dur(){return +ctl2.dur.toFixed(2);},
     get hover(){return ctl2.hover.toArray().map(v=>+v.toFixed(2));},get tgt(){return [+ctl2.tx.toFixed(2),+ctl2.ty.toFixed(2)];},get auto(){return ctl2.auto;}},
  probe2(){const h=ctl2.hover;const r0=Math.hypot(h.x,h.y);const a0=ctl2.camAz;
    ctl2.setHoverDrift(T);const r1=Math.hypot(h.x,h.y);
    return {r0:+r0.toFixed(2),r1:+r1.toFixed(2),camAz:a0,h:h.toArray().map(v=>+v.toFixed(2))};},
  wg:{mat:wingMat,blur:blurMat,bee:bee,bee2:bee2,
    info(){const a=[];for(const w of bee.wings){const p=w.piv.getWorldPosition(new THREE.Vector3());
      const q=w.piv.getWorldQuaternion(new THREE.Quaternion());const e=new THREE.Euler().setFromQuaternion(q,'XYZ');
      const n=new THREE.Vector3(0,1,0).applyQuaternion(q);
      a.push({p:p.toArray().map(v=>+v.toFixed(3)),e:[e.x,e.y,e.z].map(v=>+v.toFixed(2)),n:n.toArray().map(v=>+v.toFixed(2)),op:w.mat.uniforms.uOp.value});}
      return a;}},
  casters(){const a=[];scene.traverse(o=>{if(o.castShadow)a.push(o);});window.__bee._cst=a;
    return a.map(o=>({t:o.type,g:(o.geometry&&o.geometry.type)||'',p:o.getWorldPosition(new THREE.Vector3()).toArray().map(v=>+v.toFixed(1))}));},
  noCast(i){const o=window.__bee._cst[i];if(!o)return '?';o.castShadow=false;return o.type;},
  allNoCast(){scene.traverse(o=>{o.castShadow=false;});return 1;},
  get hist(){return hist;},
  degraded(){return degraded;}
};

<body>
<div id="hint">♪ click for sound</div>
<script type="module">
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { BokehPass } from 'three/addons/postprocessing/BokehPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';
import * as BGU from 'three/addons/utils/BufferGeometryUtils.js';

/* ============================================================
   THE FORAGER — photoreal macro scene, all geometry in code
   Units: metres.  Bee ≈ 16 mm long, flower head ≈ 24 cm wide.
   ============================================================ */

const rng = mulberry32(20240817);
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;}}
const rand = (a,b)=>a+(b-a)*rng();
const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
const lerp=(a,b,t)=>a+(b-a)*t;
const sstep=(a,b,x)=>{const t=clamp((x-a)/(b-a),0,1);return t*t*(3-2*t);}
// smooth pseudo-noise from summed sines (deterministic, C-infinite)
function sn(t,a=1,b=0){return Math.sin(t*1.0+b)*a;}
function noise1(t){return Math.sin(t*1.7)*0.5+Math.sin(t*3.13+1.7)*0.3+Math.sin(t*7.31+4.2)*0.2;}
function noise2(t){return Math.sin(t*2.31+0.3)*0.45+Math.sin(t*5.17+2.9)*0.35+Math.sin(t*11.7+0.9)*0.2;}

/* ---------- renderer / scene / camera ---------- */
const renderer = new THREE.WebGLRenderer({antialias:false, powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));
renderer.setSize(innerWidth,innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.16;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(30, innerWidth/innerHeight, 0.0035, 900);
camera.position.set(0.3,0.62,0.55);

/* ---------- sky dome + sun + environment ---------- */
const SUN_AZ = -2.28, SUN_EL = 0.30;                       // low warm late-summer sun
const sunDir = new THREE.Vector3(Math.cos(SUN_EL)*Math.cos(SUN_AZ), Math.sin(SUN_EL), Math.cos(SUN_EL)*Math.sin(SUN_AZ)).normalize();
function makeSky(){
  const g = new THREE.SphereGeometry(400,32,20);
  const m = new THREE.ShaderMaterial({
    side:THREE.BackSide, depthWrite:false, fog:false,
    uniforms:{ uSun:{value:sunDir} },
    vertexShader:`varying vec3 vD; void main(){ vD=normalize(position); gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);}`,
    fragmentShader:`
      varying vec3 vD; uniform vec3 uSun;
      void main(){
        float h = clamp(vD.y,-0.2,1.0);
        vec3 zen  = vec3(0.190,0.380,0.680);
        vec3 mid  = vec3(0.470,0.630,0.830);
        vec3 hor  = vec3(0.870,0.830,0.700);
        vec3 col = mix(hor, mid, smoothstep(0.0,0.18,h));
        col = mix(col, zen, smoothstep(0.12,0.75,h));
        float s = max(dot(normalize(vD), uSun),0.0);
        vec3 warm = vec3(1.0,0.82,0.55);
        col += warm*pow(s,6.0)*0.35;                    // broad warm haze around sun
        col += warm*pow(s,60.0)*1.6;                    // inner glow
        col += vec3(1.0,0.97,0.88)*pow(s,3000.0)*26.0;  // sun disc (blooms)
        float g = clamp(-h,0.0,1.0);                    // below horizon fade to warm soil haze
        col = mix(col, vec3(0.42,0.40,0.30), smoothstep(0.0,0.25,g));
        gl_FragColor = vec4(col,1.0);
      }`
  });
  return new THREE.Mesh(g,m);
}
const sky = makeSky(); scene.add(sky);

// PMREM environment from a mini sky scene for PBR reflections
{
  const pm = new THREE.PMREMGenerator(renderer);
  const envScene = new THREE.Scene();
  const esky = new THREE.Mesh(new THREE.SphereGeometry(10,24,16), sky.material.clone());
  esky.material.side = THREE.BackSide;
  envScene.add(esky);
  const gnd = new THREE.Mesh(new THREE.CircleGeometry(9,24), new THREE.MeshBasicMaterial({color:0x4c5a2e, side:THREE.DoubleSide}));
  gnd.rotation.x = -Math.PI/2; gnd.position.y = -0.4; envScene.add(gnd);
  scene.environment = pm.fromScene(envScene,0.0,0.1,20).texture;
  pm.dispose();
}
scene.fog = new THREE.Fog(0xbfc7ab, 2.2, 46);

/* ---------- lights ---------- */
const sun = new THREE.DirectionalLight(0xffe2b0, 3.4);
sun.position.copy(sunDir).multiplyScalar(6);
sun.castShadow = true;
sun.shadow.mapSize.set(2048,2048);
sun.shadow.camera.near = 3; sun.shadow.camera.far = 9;
sun.shadow.camera.left=-0.45; sun.shadow.camera.right=0.45; sun.shadow.camera.top=0.5; sun.shadow.camera.bottom=-0.35;
sun.shadow.bias=-0.00012; sun.shadow.normalBias=0.0006;
sun.target.position.set(0,0.42,0); scene.add(sun, sun.target);
const hemi = new THREE.HemisphereLight(0xbdd7f5, 0x59662f, 0.62); scene.add(hemi);
const bounce = new THREE.DirectionalLight(0x9db8e6, 0.35);
bounce.position.set(-sunDir.x,0.4,-sunDir.z); scene.add(bounce);

/* ---------- canvas-texture helpers (everything drawn in code) ---------- */
function ctex(w,h,fn,srgb=true){
  const c=document.createElement('canvas');c.width=w;c.height=h;
  const x=c.getContext('2d');fn(x,w,h);
  const t=new THREE.CanvasTexture(c);
  if(srgb)t.colorSpace=THREE.SRGBColorSpace;
  t.anisotropy=8;return t;
}
const TAU=Math.PI*2, GOLD=Math.PI*(3-Math.sqrt(5));

/* ---------- translucency injection (backlit petals/leaves) ---------- */
function makeTranslucent(mat, strength, tint){
  mat.onBeforeCompile = sh=>{
    sh.uniforms.uSunDir={value:sunDir}; sh.uniforms.uTrans={value:strength}; sh.uniforms.uTint={value:new THREE.Color(tint)};
    sh.vertexShader = sh.vertexShader
      .replace('#include <common>','#include <common>\nvarying vec3 vWPos;varying vec3 vWNrm;')
      .replace('#include <begin_vertex>','#include <begin_vertex>\nvWPos=(modelMatrix*vec4(transformed,1.0)).xyz;\nvWNrm=normalize(mat3(modelMatrix)*objectNormal);');
    sh.fragmentShader = sh.fragmentShader
      .replace('#include <common>','#include <common>\nvarying vec3 vWPos;varying vec3 vWNrm;uniform vec3 uSunDir;uniform float uTrans;uniform vec3 uTint;')
      .replace('#include <tonemapping_fragment>',`#include <tonemapping_fragment>
        vec3 tV=normalize(cameraPosition-vWPos);
        float tB=pow(max(clamp(dot(tV,-uSunDir),0.0,1.0),1e-4),2.2);
        float tF=pow(max(clamp(dot(-vWNrm,uSunDir),0.0,1.0),1e-4),1.5);
        gl_FragColor.rgb += diffuseColor.rgb*uTint*uTrans*(tB*0.85+tF*0.45)*(0.55+0.45*tB);
      `);
  };
  mat.customProgramCacheKey=()=> 'trans'+strength;
  return mat;
}

/* ================================================================
   FIELD / GROUND / GRASS
   ================================================================ */
{
  const tex = ctex(512,512,(x,w,h)=>{
    x.fillStyle='#57662e';x.fillRect(0,0,w,h);
    for(let i=0;i<2600;i++){
      x.fillStyle=['#4d5c2b','#61703a','#6d7a44','#48542a','#5a6433','#7c7a4a'][ (Math.random()*6)|0 ];
      x.globalAlpha=rand(0.12,0.5);
      x.beginPath();x.arc(rand(0,w),rand(0,h),rand(1,16),0,7);x.fill();
    }
    x.globalAlpha=1;
  });
  tex.wrapS=tex.wrapT=THREE.RepeatWrapping;tex.repeat.set(26,26);
  const g = new THREE.PlaneGeometry(180,180,24,24);
  const p=g.attributes.position;
  for(let i=0;i<p.count;i++){ const dd=Math.hypot(p.getX(i),p.getY(i)); const amp=Math.min(1,dd/4)*0.9+0.1;
    p.setZ(i,( noise1(p.getX(i)*0.35+p.getY(i)*0.2)*0.09+noise1(p.getX(i)*1.7)*0.02)*amp); }
  g.computeVertexNormals();
  const m=new THREE.Mesh(g,new THREE.MeshStandardMaterial({map:tex,roughness:0.95,color:0x9aa372}));
  m.rotation.x=-Math.PI/2;m.position.y=-0.06;m.receiveShadow=true;scene.add(m);
}
const grassTime = {value:0};
{
  // instanced grass blades near the hero flower
  const bg=new THREE.BufferGeometry();
  const seg=4, pos=[],uv=[],idx=[];
  for(let i=0;i<=seg;i++){const t=i/seg,wd=0.004*(1-t)+0.0006,bend=t*t*0.05;
    pos.push(-wd, t*0.16, bend,  wd, t*0.16, bend);
    uv.push(0,t,1,t);}
  for(let i=0;i<seg;i++){const a=i*2;idx.push(a,a+1,a+2,a+1,a+3,a+2);}
  bg.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));
  bg.setAttribute('uv',new THREE.Float32BufferAttribute(uv,2));
  bg.setIndex(idx);bg.computeVertexNormals();
  const gt=ctex(64,64,(x,w,h)=>{const g=x.createLinearGradient(0,h,0,0);g.addColorStop(0,'#3f5a20');g.addColorStop(0.6,'#5c7a2c');g.addColorStop(1,'#93a24a');x.fillStyle=g;x.fillRect(0,0,w,h);});
  const gm=new THREE.MeshStandardMaterial({map:gt,side:THREE.DoubleSide,roughness:0.8});
  gm.onBeforeCompile=sh=>{sh.uniforms.uT=grassTime;
    sh.vertexShader='uniform float uT;\n'+sh.vertexShader.replace('#include <begin_vertex>',
    `#include <begin_vertex>
     #ifdef USE_INSTANCING
     float ph=instanceMatrix[3][0]*3.1+instanceMatrix[3][2]*2.3;
     float sw=pow(clamp(position.y/0.16,0.0,1.0),2.0);
     transformed.x+=sin(uT*1.4+ph)*0.02*sw+sin(uT*0.53+ph*0.5)*0.012*sw;
     #endif`);};
  const N=1400, gi=new THREE.InstancedMesh(bg,gm,N);
  const d=new THREE.Object3D();
  for(let i=0;i<N;i++){
    const a=rand(0,TAU), r=0.35+Math.pow(rng(),0.6)*7.5;
    d.position.set(Math.cos(a)*r,-0.13,Math.sin(a)*r);
    d.rotation.set(rand(-0.12,0.12),rand(0,TAU),rand(-0.14,0.14));
    const s=rand(0.55,1.7);d.scale.set(s,s*rand(0.7,1.5),s);
    d.updateMatrix();gi.setMatrixAt(i,d.matrix);
  }
  gi.castShadow=false;gi.receiveShadow=true;scene.add(gi);
}

// distant sunflower field — merged vertex-coloured impostors, one InstancedMesh
const fieldFlowers=[];
{
  const parts=[];
  const stemG=new THREE.CylinderGeometry(0.008,0.013,0.9,6); stemG.translate(0,0.45,0);
  parts.push(colGeo(stemG,0x53702f));
  // head: tilted slightly up, brown disc with golden rim
  const headG=new THREE.SphereGeometry(0.075,10,6,0,TAU,0,1.1); headG.rotateX(Math.PI/2);headG.scale(1,1,0.4); headG.translate(0,0.95,-0.01);
  parts.push(colGeo(headG,0x4f3418));
  const rimG=new THREE.TorusGeometry(0.075,0.012,5,16); rimG.rotateX(Math.PI/2); rimG.translate(0,0.95,-0.005);
  parts.push(colGeo(rimG,0xcf9a1e));
  for(let i=0;i<18;i++){
    const a=i/18*TAU;
    const pg=new THREE.BoxGeometry(0.085,0.004,0.02);
    pg.rotateZ(-0.16);
    pg.translate(0.115,0,0);
    pg.rotateY(a);
    pg.rotateX(-0.25);
    pg.translate(0,0.95,-0.005);
    parts.push(colGeo(pg,0xdca422));
  }
  const lg=new THREE.BoxGeometry(0.16,0.004,0.07); lg.rotateZ(0.5); lg.rotateY(0.7); lg.translate(0.07,0.4,0);
  parts.push(colGeo(lg,0x4a6a2a));
  const geo=BGU.mergeGeometries(parts);
  const mat=new THREE.MeshStandardMaterial({vertexColors:true,roughness:0.8,side:THREE.DoubleSide});
  const M=42, fi=new THREE.InstancedMesh(geo,mat,M);
  const d=new THREE.Object3D();
  for(let i=0;i<M;i++){
    const a=rand(0,TAU), r=1.6+Math.pow(rng(),0.55)*22;
    const h=rand(0.75,1.35);
    const rec={a,r,h,ph:rand(0,TAU),tilt:rand(0.12,0.4),hSpin:rand(0,TAU),lean:rand(-0.2,0.2)};
    fieldFlowers.push(rec);
  }
  fi.userData.mat=mat; fi.userData.d=d; scene.add(fi); fi.frustumCulled=false;
  fi.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
  fi.userData.fi=fi;
  window._field=fi;
  function updateField(t){
    const d=fi.userData.d;
    for(let i=0;i<M;i++){const f=fieldFlowers[i];
      const sway=Math.sin(t*0.9+f.ph)*0.045+Math.sin(t*0.31+f.ph*1.7)*0.03;
      d.position.set(Math.cos(f.a)*f.r,-0.05,Math.sin(f.a)*f.r);
      d.rotation.set(0,f.a+Math.PI/2+f.hSpin,0);
      d.rotation.order='YXZ';
      d.rotateX(-f.tilt+sway); d.rotateZ(f.lean+Math.sin(t*0.7+f.ph)*0.03);
      d.scale.set(f.h,f.h,f.h);
      d.updateMatrix();fi.setMatrixAt(i,d.matrix);}
    fi.instanceMatrix.needsUpdate=true;
  }
  scene.userData.updateField=updateField;
}
function colGeo(g,hex){const c=new THREE.Color(hex);const n=g.attributes.position.count;const a=new Float32Array(n*3);
  for(let i=0;i<n;i++){a[i*3]=c.r;a[i*3+1]=c.g;a[i*3+2]=c.b;}
  g.setAttribute('color',new THREE.BufferAttribute(a,3));return g;}

/* ================================================================
   THE SUNFLOWER
   ================================================================ */
const flower = new THREE.Group(); scene.add(flower);          // stem base at origin
const stemSeg = [new THREE.Group(),new THREE.Group(),new THREE.Group()];
flower.add(stemSeg[0]); stemSeg[0].add(stemSeg[1]); stemSeg[1].add(stemSeg[2]);
const SEG_H=[0.18,0.17,0.17];
const headBase = new THREE.Group(); stemSeg[2].add(headBase);
// disc normal points up-and-out toward the warm afternoon light / camera side
{
  const el=0.62, az=1.12;
  const n=new THREE.Vector3(Math.cos(el)*Math.cos(az),Math.sin(el),Math.cos(el)*Math.sin(az)).normalize();
  headBase.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0),n);
}
const head = new THREE.Group(); headBase.add(head);         // head local: disc in XZ, up +Y
const HEAD_Y = 0.52;

// ---- stem (hairy, slightly tapered) + leaves + petioles ----
const stemMat = makeTranslucent(new THREE.MeshStandardMaterial({color:0x5c8430,roughness:0.62,side:THREE.DoubleSide}),0.22,0x9fc46a);
function stemCyl(r0,r1,h,grp){
  const g=new THREE.CylinderGeometry(r0,r1,h,14,4,false);
  g.translate(0,h/2,0);
  const m=new THREE.Mesh(g,stemMat);m.castShadow=true;m.receiveShadow=true;grp.add(m);return g;
}
stemSeg[0].position.y=0;
stemCyl(0.0135,0.0115,SEG_H[0],stemSeg[0]); stemSeg[1].position.y=SEG_H[0];
stemCyl(0.0115,0.0098,SEG_H[1],stemSeg[1]); stemSeg[2].position.y=SEG_H[1];
stemCyl(0.0098,0.0075,0.016,stemSeg[2]);

// leaf geometry: parametric ovate leaf with midrib + curled margins
function leafGeo(L,W){
  const nu=14,nv=8,rows=[];
  for(let i=0;i<=nu;i++){
    const u=i/nu, row=[];
    const wid=W*Math.pow(Math.sin(Math.PI*Math.pow(u,0.78)),0.9)+1e-4;
    for(let j=0;j<=nv;j++){
      const v=j/nv*2-1;
      const x=u*L;
      const z=v*wid;
      const cup=-0.16*wid*v*v - Math.sin(Math.PI*u)*0.014;
      const y=cup + Math.sin(Math.PI*u)*0.02*Math.sin(v*2.2) - 0.35*u*u*0.02;
      row.push(new THREE.Vector3(x,y,z));
    }
    rows.push(row);
  }
  const g=new THREE.BufferGeometry();
  const pos=[],uvs=[],idx=[];
  for(let i=0;i<=nu;i++)for(let j=0;j<=nv;j++){const p=rows[i][j];pos.push(p.x,p.y,p.z);uvs.push(i/nu,j/nv*0.5+0.5);}
  for(let i=0;i<nu;i++)for(let j=0;j<nv;j++){const a=i*(nv+1)+j,b=a+1,c=a+nv+1,d=c+1;idx.push(a,c,b,b,c,d);}
  g.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));
  g.setAttribute('uv',new THREE.Float32BufferAttribute(uvs,2));
  g.setIndex(idx);g.computeVertexNormals();
  return g;
}
const leafTex = ctex(512,512,(x,w,h)=>{
  x.fillStyle='#4a7429';x.fillRect(0,0,w,h);
  for(let i=0;i<1400;i++){x.fillStyle=Math.random()<0.5?'#3f6624':'#57822f';x.globalAlpha=rand(0.05,0.18);x.beginPath();x.arc(rand(0,w),rand(0,h),rand(2,14),0,7);x.fill();}
  x.globalAlpha=1;
  x.strokeStyle='#6f9c42';x.lineWidth=7;x.beginPath();x.moveTo(0,h/2);x.lineTo(w,h/2);x.stroke();
  x.lineWidth=2.5;
  for(let i=1;i<=9;i++){const u=i/10;
    x.beginPath();x.moveTo(u*w,h/2);x.quadraticCurveTo((u+0.14)*w,h/2-0.22*h,(u+0.2)*w,h/2-rand(0.25,0.44)*h);x.stroke();
    x.beginPath();x.moveTo(u*w,h/2);x.quadraticCurveTo((u+0.14)*w,h/2+0.22*h,(u+0.2)*w,h/2+rand(0.25,0.44)*h);x.stroke();}
  x.fillStyle='rgba(20,30,10,0.14)';
  for(let i=0;i<400;i++){x.beginPath();x.arc(rand(0,w),rand(0,h),rand(1,4),0,7);x.fill();}
});
const leafTexR = ctex(256,256,(x,w,h)=>{x.fillStyle='#9a9a9a';x.fillRect(0,0,w,h);
  for(let i=0;i<900;i++){x.fillStyle=`rgb(${(120+Math.random()*90)|0},0,0)`;x.beginPath();x.arc(rand(0,w),rand(0,h),rand(1,7),0,7);x.fill();}
  x.strokeStyle='rgba(255,180,180,0.5)';x.lineWidth=6;x.beginPath();x.moveTo(0,h/2);x.lineTo(w,h/2);x.stroke();},false);
const leafMat = makeTranslucent(new THREE.MeshStandardMaterial({map:leafTex,roughnessMap:leafTexR,roughness:0.85,color:0xbcd39a,side:THREE.DoubleSide}),0.55,0x7fae52);
function addLeaf(parent,px,py,pz,rotY,rotZ,s){
  const g=new THREE.Group();g.position.set(px,py,pz);g.rotation.y=rotY;
  const pivot=new THREE.Group();g.add(pivot);
  const pet=new THREE.Mesh(new THREE.CylinderGeometry(0.004,0.0055,0.14,7),stemMat);
  pet.rotation.z=Math.PI/2-0.45;pet.position.set(0.06,0.028,0);pet.castShadow=true;pivot.add(pet);
  const blade=new THREE.Mesh(leafGeo(0.20*s,0.09*s),leafMat);
  blade.position.set(0.13,0.055,0);blade.rotation.z=rotZ;blade.rotation.y=rand(-0.2,0.2);
  blade.castShadow=true;blade.receiveShadow=true;pivot.add(blade);
  parent.add(g);return pivot;
}
const leafPivots=[];
leafPivots.push(addLeaf(stemSeg[0],0,0.08,0.01, 2.7, 0.12, 0.8));
leafPivots.push(addLeaf(stemSeg[0],0,0.15,0.01,-2.35, 0.2, 0.68));
leafPivots.push(addLeaf(stemSeg[1],0,0.03,0,    2.15,-0.35, 0.45));
leafPivots.push(addLeaf(stemSeg[1],0,0.09,0,   -2.6, 0.05, 0.4));

// surface hair sampling for the stem / bee fuzz
function sampleSurface(geo,count,cb){
  const g=geo.index?geo:geo;
  const pos=g.attributes.position, nrm=g.attributes.normal, idx=g.index;
  for(let k=0;k<count;k++){
    const t=(rng()*idx.count)|0, a=idx.getX(t),b=idx.getX(t+1),c=idx.getX(t+2);
    let u=rng(),v=rng(); if(u+v>1){u=1-u;v=1-v;} const w=1-u-v;
    const px=pos.getX(a)*w+pos.getX(b)*u+pos.getX(c)*v, py=pos.getY(a)*w+pos.getY(b)*u+pos.getY(c)*v, pz=pos.getZ(a)*w+pos.getZ(b)*u+pos.getZ(c)*v;

function petalGeo(L,W,curl,twist){
  const nu=10,nv=5,pos=[],uvs=[],idx=[];

    const kk=u<0.45? u/0.45 : (u-0.45)/0.55, sk=kk*kk*(3-2*kk);
    const prof=u<0.45? 0.22+0.78*sk : 1.0-0.85*Math.pow(sk,0.85);   // narrow base → broad mid → blunt rounded tip
    const wid=W*prof+2e-4;
    for(let j=0;j<=nv;j++){const v=j/nv*2-1;
      const x=u*L;
      const z=v*wid;
      const cup=-0.5*wid*v*v*Math.pow(u,0.4);
      const y=cup+Math.sin(u*2.6)*curl*0.01+u*u*curl*0.06-0.1*u*u*0.03;

      pos.push(x,yy,zz);uvs.push(u*0.25+0.38,0.06+0.88*u);

  for(let i=0;i<nu;i++)for(let j=0;j<nv;j++){const a=i*(nv+1)+j,b=a+1,c=a+nv+1,d=c+1;idx.push(a,c,b,b,c,d);}
  const g=new THREE.BufferGeometry();

}

function poseFor(t,beeW,beeQl,headW){

  // shot poses relative to bee or flower
  const pBee=(f,u,r)=>beeW.clone().addScaledVector(F,f).addScaledVector(U,u).addScaledVector(Rt,r);
  const S={};

  S.s0 = {p:headW.clone().add(new THREE.Vector3(Math.cos(beeAz)*0.21,0.075+0.008*Math.sin(t*0.3),Math.sin(beeAz)*0.21)),
          l:beeW.clone().addScaledVector(U,0.0005).add(new THREE.Vector3(0,-0.003,0))};   // low side: legs & walk (outside the petals)
  const outB=beeW.clone().sub(headW); outB.y=0; if(outB.lengthSq()<1e-8)outB.set(1,0,0); outB.normalize();
  S.s1 = {p:beeW.clone().add(new THREE.Vector3(0,0.030,0)).addScaledVector(F,0.030).addScaledVector(outB,0.022),
          l:beeW.clone().addScaledVector(F,0.0045).add(new THREE.Vector3(0,-0.0025,0))};   // face / proboscis
  const _qH=new THREE.Quaternion(); head.getWorldQuaternion(_qH);
  const nd=new THREE.Vector3(0,1,0).applyQuaternion(_qH);   // disc front normal — always clear of plant bulk
  S.s2 = {p:beeW.clone().addScaledVector(nd,0.050).addScaledVector(Rt,0.045).add(new THREE.Vector3(0,0.008,0)),
          l:beeW.clone().addScaledVector(F,-0.004).addScaledVector(U,-0.001)};                       // baskets / grooming 3-4
  const hoverBase=headW.clone().add(new THREE.Vector3(0,0.02,0));

  const outW=beeW.clone().sub(headW); outW.y=0; if(outW.lengthSq()<1e-8)outW.set(0,0,1); outW.normalize();
  S.s4 = {p:beeW.clone().add(outW.multiplyScalar(0.075)).add(new THREE.Vector3(0,0.05,0)),

    {a:10,b:20, k:'s1'},
    {a:20,b:37, k:'s2'},
    {a:37,b:49, k:'s3'},
    {a:49,b:63, k:'s4'},
    {a:63,b:70, k:'s5'},
    {a:70,b:74,k:'s6'},

}

  // body position on dome (or in air)
  let by=domeY(Math.hypot(x,z))+STAND + Math.sin(sim.stepPhase*TAU*2)*0.00018*(1-flyS);
  let bx=x,bz=z;
  if(flyS>0.001){
    head.updateWorldMatrix(true,false);
    head.getWorldPosition(_fb1);                                   // flower head center, world
    const ang=0.6+Math.sin(tl*0.23)*0.9;
    const rad=0.16+0.07*Math.sin(tl*0.17+1);
    _fb2.set(_fb1.x+Math.cos(ang)*rad, _fb1.y+0.05+0.035*Math.sin(tl*0.31)+0.02*Math.sin(tl*0.71), _fb1.z+Math.sin(ang)*rad+0.05);
    const landing=routePos(S_TAKEOFF*NORM_CACHED);
    _fb3.set(landing.x, domeY(Math.hypot(landing.x,landing.z))+STAND, landing.z).applyMatrix4(head.matrixWorld); // landing point, world
    const descend=sstep(T_LAND0,T_LAND1,tl);
    _fb4.set(Math.sin(tl*3.1)*0.006+Math.sin(tl*1.3)*0.008, Math.sin(tl*2.3+1)*0.006, Math.cos(tl*2.7)*0.006);
    _fb2.add(_fb4).lerp(_fb3,descend);                              // world-space air position
    _fb3.copy(_fb2);                                                // remember world pos
    head.worldToLocal(_fb2);                                        // → head-local body pos
    bx=_fb2.x;by=_fb2.y;bz=_fb2.z;
    // face the flower centre while hovering (local atan2 still valid: head centre is local origin)
    const toC=Math.atan2(-bz,-bx);
    sim.yaw=lerpAngle(sim.yaw, toC+Math.sin(tl*0.7)*0.4, 1-Math.exp(-dt*2));
    // flight attitude: world-horizontal plane, gentle wobble → convert to local quat
    _fb4.copy(_fb1).sub(_fb3); _fb4.y+=0.03; _fb4.normalize();
    _fb4.applyAxisAngle(_UP.set(0,1,0), Math.sin(tl*0.9)*0.12);
    const f2=_fb4;
    const x2=_fc1.copy(f2);const y2=_fc2.set(0,1,0).addScaledVector(f2,-f2.y).normalize();
    const z2=_fc3.crossVectors(x2,y2);
    _m.makeBasis(x2,y2,z2);
    _q1.setFromRotationMatrix(_m);
    head.getWorldQuaternion(_q2).invert();
    sim.quat.copy(_q2).multiply(_q1);
  } else if(grooming){
    by+=0.0004*Math.sin(t*1.7);
  }
  sim.body.set(bx,by,bz);
  // step phase from ground speed
  sim.stepPhase=(sim.stepPhase+dt*(2.6*sim.walking+0.0001))%1;
  // proboscis: probing florets
  let probT=0;
  if(probeAct&&flyS<0.3){ probT=1; }
  if(grooming) probT=0.15+0.1*Math.sin(t*3);
  sim.prob=lerp(sim.prob,probT,1-Math.exp(-dt*4));
  sim.antClean=grooming?clamp((tl-(T_GROOM0+1))/1.5,0,1)*clamp((T_GROOM1-tl)/1.5,0,1):0;
  sim.headPitch = sim.prob*0.5 + flyS*(-0.25) + Math.sin(t*2.2)*0.03*(1-flyS);
  sim.headYaw = Math.sin(t*1.3)*0.12*(1-flyS);
  // pollen accumulation
  if(sim===beeSim){
    if(probeAct) bee.pollen=Math.min(1,bee.pollen+dt*0.020);
    if(grooming){ bee.pollen=Math.min(1,bee.pollen+dt*0.045); }
    bee.fuzzPollen = clamp( (bee.pollen-0.1)*1.2,0,1) * (grooming?0.75:1);
    b.fuzzPollen=bee.fuzzPollen;
    // pollen puffs while probing / walking / takeoff / landing
    b.root.getWorldPosition(_beeW);
    if(probeAct&&rng()<dt*3.5) spawnPollen(_beeW.addScaledVector(new THREE.Vector3(0,-0.004,0),1),4,0.006);
    if(sim.walking>0.5&&rng()<dt*2.5) spawnPollen(_beeW.addScaledVector(new THREE.Vector3(0,-0.005,0),1),2,0.005);
    if(Math.abs(flyS - (b._lastFly||0))>0.02&&flyS>0.3) spawnPollen(_beeW,10,0.02);
    b._lastFly=flyS;
  }
}
let NORM_CACHED=1;
{ // share the normalisation used by walkDistAt for landing hover target
  // recompute identical value
  const rem=integralSpeed(LOOP)-integralSpeed(T_LAND1);
  NORM_CACHED=ROUTE_LEN/(S_TAKEOFF+rem);
}
function lerpAngle(a,b,t){return a+angDiff(b,a)*t;}

// second bee: arrives, hovers near rim, briefly lands, leaves
function driveBee2(t,dt){
  const b=bee2,s=bee2Sim;
  const tl=simT%LOOP;
  b.fuzzPollen=0.12+0.10*sstep(65,70,tl);
  const inS=sstep(62.3,62.9,tl)*(1-sstep(72,73,tl));   // visit lands during the wide s5/s6 shots
  b.root.visible=inS>0.01;
  if(!b.root.visible)return;
  const a=-0.5+Math.sin(tl*0.55)*1.0;
  const r=lerp(0.30,R*0.86,sstep(62.9,65,tl)*(1-sstep(69.5,71,tl)));
  const hgt= r>R*1.0? 0.16+0.05*Math.sin(tl*1.9): domeY(r)+STAND;
  const descend=sstep(65,66.5,tl)*(1-sstep(69,70,tl));
  const x=Math.cos(a)*r, z=Math.sin(a)*r;
  s.body.set(x, lerp(hgt+0.05, domeY(Math.hypot(x,Math.min(r,R*1.02)))+STAND, descend), z);
  s.yaw=Math.atan2(-z,-x)+0.4;
  s.flight=1-descend;
  s.walking=descend*0.4;
  s.groom=false;
  s.prob=descend*0.8*sstep(66,67,tl);
  s.headPitch=0.3*descend; s.headYaw=0; s.antClean=0;
  const up=surfNormalAt(clamp(Math.hypot(x,z),0.001,R*1.02),0).clone();
  const up2=surfNormalAt(x,z);
  const f2=new THREE.Vector3(Math.cos(s.yaw),0.08*descend,Math.sin(s.yaw)).normalize();
  const x2=f2.clone();const y2=new THREE.Vector3(0,1,0).addScaledVector(f2,-f2.y).normalize();
  const z2=new THREE.Vector3().crossVectors(x2,y2);
  _m.makeBasis(x2,y2,z2);s.quat.setFromRotationMatrix(_m);
  s.stepPhase=(s.stepPhase+dt*1.5*s.walking)%1;
  updateBee(b,t,dt,s);
}

let last=0;
let animT=0, freeze=false;
window.__freeze=v=>{freeze=v;};
window.__unfreeze=()=>{window.__frozen=false;freeze=false;};
window.__cam=(p,l)=>{camPos.set(...p);camLook.set(...l);camera.position.set(...p);camera.lookAt(new THREE.Vector3(...l));
  bokeh.uniforms['focus'].value=camera.position.distanceTo(_beeW);};
window.__beeW=()=>_beeW.toArray();
window.__beeQ=()=>beeSim.quat.toArray();
let _markMesh=null;
window.__mark=on=>{ if(_markMesh){scene.remove(_markMesh);_markMesh=null;}
  if(on){_markMesh=new THREE.Mesh(new THREE.SphereGeometry(0.004,8,6),new THREE.MeshBasicMaterial({color:0xff0000}));
    _markMesh.position.copy(_beeW);scene.add(_markMesh);} };
window.__ray=()=>{ const rc=new THREE.Raycaster(); rc.setFromCamera(new THREE.Vector2(0,0),camera);
  const hits=rc.intersectObjects(scene.children,true).slice(0,6);
  return hits.map(h=>({o:h.object.name||h.object.type,d:+h.distance.toFixed(3),p:h.point.toArray().map(v=>+v.toFixed(3))})); };
window.__rayAt=(x,y)=>{ const rc=new THREE.Raycaster(); rc.setFromCamera(new THREE.Vector2(x,y),camera);
  const hits=rc.intersectObjects(scene.children,true).slice(0,8);
  return hits.map(h=>{let o=h.object,name='?';
    if(o.isMesh||o.isInstancedMesh){name=(o.geometry&&o.geometry.type)||o.type;}else name=o.type;
    return {n:name,d:+h.distance.toFixed(3),p:h.point.toArray().map(v=>+v.toFixed(3))};}); };
window.__scene=scene; window.__camera=camera;
function animate(){
  requestAnimationFrame(animate);
  let rawDt=clock.getDelta();
  if(window.__lock){const extra=rawDt-0.0166;if(extra>0)rawDt=0.0166;else if(extra<-0.02)rawDt=0.0166;}
  const dt=Math.min(rawDt,0.05)*((freeze||window.__frozen)?0.0001:1);
  animT+=dt;
  const t=animT;
  simT+=dt;
  const tl=simT%LOOP;

  updateFlower(t);
  grassTime.value=t;
  scene.userData.updateField(t);
  sky.position.copy(camera.position);

  driveBee(beeSim,t,dt,bee);
  updateBee(bee,t,dt,beeSim);
  driveBee2(t,dt);

  bee.root.getWorldPosition(_beeW);
  headWorld(_headW);

  // audio
  if(AC){ buzzGain.gain.setTargetAtTime(0.028*beeSim.flight+0.0016,AC.currentTime,0.12);
    if(buzzOsc){const f=205+38*beeSim.flight+8*Math.sin(t*7);buzzOsc.frequency.setTargetAtTime(f,AC.currentTime,0.15);} }

  // camera
  const pose=poseFor(tl,_beeW,beeSim.quat,_headW);
  const k=1-Math.exp(-dt*2.6);
  camPos.lerp(pose.pos,k);
  camLook.lerp(pose.look,1-Math.exp(-dt*3.4));
  // keep camera above disc plane a touch & off the petals
  if(camPos.y<_headW.y-0.16) camPos.y=lerp(camPos.y,_headW.y-0.16,0.2);
  camera.position.copy(camPos);
  camera.lookAt(camLook);
  // DoF focus: distance to the bee (in world units), smoothed
  const fd=camera.position.distanceTo(_beeW);
  bokeh.uniforms['focus'].value=lerp(bokeh.uniforms['focus'].value,fd,1-Math.exp(-dt*4));
  bokeh.uniforms['aperture'].value=lerp(0.02,0.048,sstep(0.45,0.12,fd)); // closer = creamier
  grainPass.uniforms.uT.value=t;

  updatePuff(dt);
  motes.material.opacity=0.35+0.15*Math.sin(t*0.7);

  composer.render();
}
window.__dbg=()=>({cam:camera.position.toArray().map(v=>+v.toFixed(3)),
  look:camLook.toArray().map(v=>+v.toFixed(3)), bee:_beeW.toArray().map(v=>+v.toFixed(3)),
  head:_headW.toArray().map(v=>+v.toFixed(3)), tl:+(simT%LOOP).toFixed(2),
  fd:+bokeh.uniforms['focus'].value.toFixed(3), fly:+beeSim.flight.toFixed(2),
  walk:+beeSim.walking.toFixed(2), groom:beeSim.groom});
window.__setT=v=>{simT=v;};
window.__poseFor=tt=>{const q=new THREE.Quaternion();head.getWorldQuaternion(q);
  const F=new THREE.Vector3(1,0,0).applyQuaternion(q.clone().multiply(beeSim.quat));
  const Rt=new THREE.Vector3(0,0,1).applyQuaternion(q.clone().multiply(beeSim.quat));
  const nd=new THREE.Vector3(0,1,0).applyQuaternion(q);
  return {s2p:beeW0().clone().addScaledVector(nd,0.050).addScaledVector(Rt,0.045).add(new THREE.Vector3(0,0.008,0)).toArray().map(v=>+v.toFixed(3)),
    F:F.toArray().map(v=>+v.toFixed(3)),Rt:Rt.toArray().map(v=>+v.toFixed(3)),nd:nd.toArray().map(v=>+v.toFixed(3)),
    pose:poseFor(simT%LOOP,_beeW,beeSim.quat,_headW).pos.toArray().map(v=>+v.toFixed(3))};
  function beeW0(){return _beeW.clone();}};
window.__goto=v=>{window.__lock=true;freeze=false;window.__frozen=false;simT=v;animT=v;return 'goto '+v;};
window.__snapTo=v=>{
  window.__frozen=true;
  simT=v; animT=v;
  const saveDt=()=>{};
  for(let i=0;i<60;i++){const tt=v+i*0.016;driveBee(beeSim,tt,0.016,bee); updateBee(bee,tt,0.016,beeSim); driveBee2(tt,0.016);}
  bee.root.getWorldPosition(_beeW); headWorld(_headW);
  const p=poseFor(simT%LOOP,_beeW,beeSim.quat,_headW);
  camPos.copy(p.pos); camLook.copy(p.look);
  camera.position.copy(camPos); camera.lookAt(camLook);
  bokeh.uniforms['focus'].value=camera.position.distanceTo(_beeW);
};
window.__raw=on=>{ window._raw=on; };
{ const _r=composer.render.bind(composer);
  composer.render=function(){ if(window._raw){renderer.render(scene,camera);return;} _r(); }; }
animate();

addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
  composer.setSize(innerWidth,innerHeight);
  grainPass.uniforms.uA.value=innerHeight;
});
